<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 400" width="790" height="400" role="img" aria-label="So sánh Sparse Retrieval và Dense Retrieval" font-family="'Times New Roman', Times, serif"><defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44506a"/></marker></defs><rect width="790" height="400" fill="#ffffff"/><text x="20" y="24" text-anchor="start" font-size="14" font-weight="700" font-style="normal" fill="#1b2333">Sparse: BM25 (khớp từ khóa)</text><rect x="20" y="36" width="128" height="64" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="84" y="72.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Câu hỏi</text><polyline points="148,68 173,68" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah3)"/><rect x="173" y="36" width="128" height="64" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="237" y="64.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Tách từ</text><text x="237" y="80.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">bỏ stopword</text><polyline points="301,68 326,68" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah3)"/><rect x="326" y="36" width="128" height="64" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="390" y="64.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Chỉ mục ngược</text><text x="390" y="80.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">284.585 term</text><polyline points="454,68 479,68" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah3)"/><rect x="479" y="36" width="128" height="64" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="543" y="64.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Điểm BM25</text><text x="543" y="80.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">k1 = 0,7; b = 0,2</text><polyline points="607,68 632,68" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah3)"/><rect x="632" y="36" width="128" height="64" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="696" y="64.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Top-k</text><text x="696" y="80.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">passage</text><text x="20" y="122" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">Mạnh: trùng từ khóa, tên riêng, số liệu; nhanh (khoảng 1 ms/câu).</text><text x="20" y="137.5" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">Yếu: từ đồng nghĩa, diễn đạt khác với văn bản; điểm không bị chặn trên.</text><text x="20" y="190" text-anchor="start" font-size="14" font-weight="700" font-style="normal" fill="#1b2333">Dense: DPR (khớp ngữ nghĩa trong không gian vector)</text><rect x="20" y="202" width="128" height="64" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="84" y="238.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Câu hỏi</text><polyline points="148,234 173,234" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah3)"/><rect x="173" y="202" width="128" height="64" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="237" y="230.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Question encoder</text><text x="237" y="246.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">vector 768 chiều</text><polyline points="301,234 326,234" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah3)"/><rect x="326" y="202" width="128" height="64" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="390" y="230.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">FAISS IndexFlatIP</text><text x="390" y="246.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">tích vô hướng</text><polyline points="454,234 479,234" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah3)"/><rect x="479" y="202" width="128" height="64" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="543" y="230.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Top-k</text><text x="543" y="246.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">passage</text><rect x="300" y="296" width="180" height="60" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="390" y="315.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2333">Passage → ctx encoder</text><text x="390" y="330.5" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2333">384 token, dựng sẵn 1 lần</text><text x="390" y="346.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2333">26.864 vector</text><polyline points="390,296 390,266" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah3)"/><text x="396" y="285" text-anchor="start" font-size="11.5" font-style="italic" fill="#44506a">lập chỉ mục</text><text x="500" y="312" text-anchor="start" font-size="12" font-weight="400" font-style="normal" fill="#1b2333">Mạnh: nhận ra cách diễn đạt khác, câu hỏi ngắn.</text><text x="500" y="327.5" text-anchor="start" font-size="12" font-weight="400" font-style="normal" fill="#1b2333">Yếu: cần chỉ mục vector, chậm hơn (khoảng 32 ms/câu);</text><text x="500" y="343" text-anchor="start" font-size="12" font-weight="400" font-style="normal" fill="#1b2333">phụ thuộc dữ liệu huấn luyện của encoder.</text></svg>