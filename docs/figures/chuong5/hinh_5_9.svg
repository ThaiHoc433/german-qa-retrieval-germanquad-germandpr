<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Quy trình Paired Bootstrap" font-family="'Times New Roman', Times, serif"><defs><marker id="ah9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44506a"/></marker></defs><rect width="800" height="330" fill="#ffffff"/><rect x="14" y="30" width="148" height="90" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="88" y="64.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">Điểm từng câu</text><text x="88" y="79.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">s_i(A), s_i(B)</text><text x="88" y="95.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">d_i = s_i(A) − s_i(B)</text><polyline points="162,75 170,75" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah9)"/><rect x="170" y="30" width="148" height="90" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="244" y="64.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">Lấy mẫu có hoàn lại</text><text x="244" y="79.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">n câu hỏi (n = 2.203)</text><text x="244" y="95.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">cùng chỉ số cho A và B</text><polyline points="318,75 326,75" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah9)"/><rect x="326" y="30" width="148" height="90" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="400" y="64.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">Lặp B = 1.000 lần</text><text x="400" y="79.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">d*_b = trung bình d_i</text><text x="400" y="95.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">seed = 42</text><polyline points="474,75 482,75" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah9)"/><rect x="482" y="30" width="148" height="90" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="556" y="64.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">Phân vị 2,5% và 97,5%</text><text x="556" y="79.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">khoảng tin cậy 95%</text><text x="556" y="95.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">của chênh lệch</text><polyline points="630,75 638,75" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah9)"/><rect x="638" y="30" width="148" height="90" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="712" y="64.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">Đọc kết quả</text><text x="712" y="79.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">0 nằm ngoài khoảng: khác</text><text x="712" y="95.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">0 nằm trong: chưa đủ</text><text x="14" y="160" text-anchor="start" font-size="13" font-weight="700" font-style="normal" fill="#1b2333">Ví dụ trên test (n = 2.203), chênh lệch H1 − H0:</text><text x="14" y="182" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">EM theo tham chiếu đầu tiên: −0,0113 [−0,0223; −0,0014]. Khoảng không chứa 0, độ lớn khoảng 1 điểm phần trăm.</text><text x="14" y="202" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">Hit@5: +0,0499 [+0,0399; +0,0595]. Hit@20: 0,0000 (hai cấu hình có cùng pool 20 passage).</text><text x="14" y="238" text-anchor="start" font-size="12.5" font-weight="400" font-style="italic" fill="#1b2333">Ghép cặp: cùng một lần lấy mẫu dùng cho cả hai cấu hình nên độ khó của từng câu hỏi triệt tiêu trong d_i.</text><text x="14" y="258" text-anchor="start" font-size="12.5" font-weight="400" font-style="italic" fill="#1b2333">Khoảng tin cậy chỉ phản ánh dao động do chọn bộ câu hỏi, không phản ánh dao động do seed huấn luyện (chỉ có một seed).</text></svg>