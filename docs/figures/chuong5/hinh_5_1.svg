<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 270" width="790" height="270" role="img" aria-label="Quy trình kiểm soát thực nghiệm B0/B1/H0/H1" font-family="'Times New Roman', Times, serif"><defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44506a"/></marker></defs><rect width="790" height="270" fill="#ffffff"/><rect x="14" y="30" width="112" height="100" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="70" y="69.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">1. Dữ liệu</text><text x="70" y="84.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">train · dev</text><text x="70" y="100.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">dev-unseen · test</text><polyline points="126,80 143.6,80" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="143.6" y="30" width="112" height="100" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="199.6" y="69.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">2. Chọn cấu hình</text><text x="199.6" y="84.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">chỉ trên dev và</text><text x="199.6" y="100.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">tập chọn 2.223 câu</text><polyline points="255.6,80 273.2,80" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="273.2" y="30" width="112" height="100" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="329.2" y="69.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">3. Ghi trước</text><text x="329.2" y="84.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">quy tắc chọn và</text><text x="329.2" y="100.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">giả thuyết HA–HC</text><polyline points="385.2,80 402.79999999999995,80" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="402.79999999999995" y="30" width="112" height="100" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="458.79999999999995" y="69.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">4. Đóng băng</text><text x="458.79999999999995" y="84.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">manifest B0–H1</text><text x="458.79999999999995" y="100.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">SHA-1 của 40 tệp</text><polyline points="514.8,80 532.4,80" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="532.4" y="30" width="112" height="100" rx="6" fill="#fdeceb" stroke="#b3261e" stroke-width="1.4"/><text x="588.4" y="69.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">5. Chạy test</text><text x="588.4" y="84.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">một lần: B1, H0, H1</text><text x="588.4" y="100.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">(B0 dùng lại số cũ)</text><polyline points="644.4,80 662,80" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="662" y="30" width="112" height="100" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="718" y="69.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">6. Báo cáo</text><text x="718" y="84.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">sổ phơi bày test,</text><text x="718" y="100.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">khoảng tin cậy</text><rect x="14" y="160" width="762" height="44" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="395" y="178.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">Reader cố định ở mọi cấu hình: gbert-base (checkpoint epoch 2), top-20 → top-5, max_answer_tokens = 80</text><text x="395" y="194.3" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">Chỉ khâu truy hồi và xếp hạng thay đổi</text><text x="14" y="232" text-anchor="start" font-size="12.5" font-weight="400" font-style="italic" fill="#1b2333">Không có mũi tên quay từ bước 5 về bước 2: kết quả test chỉ để phán định giả thuyết và báo cáo, không dùng để chọn lại cấu hình.</text><text x="14" y="250" text-anchor="start" font-size="12.5" font-weight="400" font-style="italic" fill="#1b2333">Mọi lần chạm vào dữ liệu test do script ghi vào results/test_exposure_ledger.jsonl (10 dòng).</text></svg>