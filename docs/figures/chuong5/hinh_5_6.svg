<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 360" width="790" height="360" role="img" aria-label="Cơ chế windowing cho passage dài" font-family="'Times New Roman', Times, serif"><defs><marker id="ah6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44506a"/></marker></defs><rect width="790" height="360" fill="#ffffff"/><text x="20" y="22" text-anchor="start" font-size="13.5" font-weight="700" font-style="normal" fill="#1b2333">Passage dài hơn giới hạn 512 token của reranker (ví dụ 1.000 token)</text><rect x="20" y="40" width="740" height="30" fill="#e8ecf4" stroke="#44506a" stroke-width="1"/><text x="390" y="59.2" text-anchor="middle" font-size="12" fill="#1b2333">passage: token 0 … 1.000</text><rect x="20" y="90" width="356.68" height="32" fill="#cfe0ff" stroke="#1f5fd1" stroke-width="1"/><text x="198.34" y="110.2" text-anchor="middle" font-size="11.5" fill="#1b2333">cửa sổ 1: câu hỏi + token 0–482</text><rect x="281.96" y="134" width="356.68" height="32" fill="#dfeafe" stroke="#1f5fd1" stroke-width="1"/><text x="460.29999999999995" y="154.2" text-anchor="middle" font-size="11.5" fill="#1b2333">cửa sổ 2: câu hỏi + token 354–836</text><rect x="543.92" y="178" width="216.08000000000004" height="32" fill="#dfeafe" stroke="#1f5fd1" stroke-width="1"/><text x="651.96" y="198.2" text-anchor="middle" font-size="11.5" fill="#1b2333">cửa sổ 3: câu hỏi + token 708–1000</text><rect x="281.96" y="226" width="94.72000000000003" height="8" fill="#f7c9c5" stroke="#b3261e" stroke-width="1"/><text x="384.68" y="234" text-anchor="start" font-size="11.5" font-weight="400" font-style="italic" fill="#1b2333">vùng chồng lấn 128 token giữa hai cửa sổ liền kề</text><rect x="20" y="252" width="360" height="44" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="200" y="270.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">Điểm của passage = max điểm các cửa sổ</text><text x="200" y="286.3" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">chế độ windows (stride 128)</text><rect x="400" y="252" width="360" height="44" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="580" y="270.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2333">Chế độ truncate: chỉ chấm cửa sổ 1</text><text x="580" y="286.3" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1b2333">phần cuối passage bị bỏ</text><text x="20" y="322" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">13,79% số cặp (câu hỏi, passage) dài hơn 512 token; cắt đuôi làm mất đáp án ở 23/2.176 câu (1,06%) có passage đúng trong pool.</text><text x="20" y="340" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">Windows tăng số lần suy luận: trung bình 23,1 cửa sổ cho 20 passage so với 20 ở chế độ truncate.</text></svg>