<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 340" width="790" height="340" role="img" aria-label="Kiến trúc Hybrid Retrieval bằng RRF" font-family="'Times New Roman', Times, serif"><defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44506a"/></marker></defs><rect width="790" height="340" fill="#ffffff"/><rect x="14" y="110" width="100" height="60" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="64" y="144.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Câu hỏi</text><rect x="170" y="26" width="190" height="64" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="265" y="54.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">BM25</text><text x="265" y="70.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">top-100, hạng r_B(d)</text><rect x="170" y="190" width="190" height="64" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="265" y="218.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Dense (FAISS)</text><text x="265" y="234.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">top-100, hạng r_D(d)</text><polyline points="114,140 142,140 142,58 170,58" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah4)"/><polyline points="114,140 142,140 142,222 170,222" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah4)"/><rect x="420" y="100" width="210" height="80" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="525" y="129.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Hợp nhất RRF</text><text x="525" y="144.5" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">score(d) = Σ w / (c + hạng)</text><text x="525" y="160.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">c = 10; w_BM25 = w_dense = 1</text><polyline points="360,58 390,58 390,125 420,125" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah4)"/><polyline points="360,222 390,222 390,155 420,155" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah4)"/><rect x="676" y="110" width="100" height="60" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="726" y="136.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Top-20</text><text x="726" y="152.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">cho reader</text><polyline points="630,140 676,140" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah4)"/><text x="14" y="290" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">Ví dụ: d xếp hạng 1 ở BM25 và hạng 3 ở dense: 1/(10+1) + 1/(10+3) = 0,168.</text><text x="14" y="305.5" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">Passage chỉ có ở một nhánh, hạng 1: 1/(10+1) = 0,091. Passage vắng khỏi nhánh nào thì nhánh đó không cộng điểm.</text><text x="14" y="332" text-anchor="start" font-size="12.5" font-weight="400" font-style="italic" fill="#1b2333">Chỉ dùng thứ hạng, không dùng điểm thô: điểm BM25 và tích vô hướng dense khác thang đo.</text></svg>