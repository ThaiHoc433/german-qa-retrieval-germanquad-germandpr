<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 340" width="790" height="340" role="img" aria-label="So sánh Bi-Encoder và Cross-Encoder" font-family="'Times New Roman', Times, serif"><defs><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44506a"/></marker></defs><rect width="790" height="340" fill="#ffffff"/><text x="20" y="22" text-anchor="start" font-size="14" font-weight="700" font-style="normal" fill="#1b2333">Bi-encoder (dense retriever)</text><rect x="20" y="40" width="100" height="44" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="70" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Câu hỏi</text><rect x="145" y="40" width="110" height="44" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="200" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Encoder Q</text><rect x="280" y="40" width="70" height="44" rx="6" fill="#ffffff" stroke="#44506a" stroke-width="1.4"/><text x="315" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">v_q</text><polyline points="120,62 145,62" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah5)"/><polyline points="255,62 280,62" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah5)"/><rect x="20" y="120" width="100" height="44" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="70" y="146.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Passage</text><rect x="145" y="120" width="110" height="44" rx="6" fill="#e3eeff" stroke="#1f5fd1" stroke-width="1.4"/><text x="200" y="146.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Encoder P</text><rect x="280" y="120" width="70" height="44" rx="6" fill="#ffffff" stroke="#44506a" stroke-width="1.4"/><text x="315" y="146.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">v_p</text><polyline points="120,142 145,142" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah5)"/><polyline points="255,142 280,142" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah5)"/><rect x="175" y="200" width="190" height="44" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="270" y="218.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">v_q · v_p</text><text x="270" y="234.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">tích vô hướng</text><polyline points="315,84 315,120" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah5)"/><polyline points="315,164 315,200" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah5)"/><text x="20" y="268" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">Hai tháp tách rời: vector passage tính trước,</text><text x="20" y="283.5" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">chỉ cần một lượt mã hóa câu hỏi.</text><text x="420" y="22" text-anchor="start" font-size="14" font-weight="700" font-style="normal" fill="#1b2333">Cross-encoder (reranker)</text><rect x="420" y="40" width="350" height="44" rx="6" fill="#f3f5f9" stroke="#44506a" stroke-width="1.4"/><text x="595" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">[CLS] câu hỏi [SEP] passage [SEP]</text><rect x="420" y="120" width="350" height="50" rx="6" fill="#fff4d9" stroke="#a36a00" stroke-width="1.4" stroke-dasharray="6 4"/><text x="595" y="141.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">Một encoder duy nhất</text><text x="595" y="157.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">attention chung giữa câu hỏi và passage</text><rect x="500" y="206" width="190" height="44" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.4"/><text x="595" y="224.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2333">logit liên quan</text><text x="595" y="240.3" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2333">một số thực cho mỗi cặp</text><polyline points="595,84 595,120" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah5)"/><polyline points="595,170 595,206" fill="none" stroke="#44506a" stroke-width="1.5" marker-end="url(#ah5)"/><text x="420" y="268" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">Mỗi cặp (câu hỏi, passage) phải chạy lại: 20 cặp,</text><text x="420" y="283.5" text-anchor="start" font-size="12.5" font-weight="400" font-style="normal" fill="#1b2333">khoảng 23 cửa sổ cho mỗi câu hỏi. Chỉ dùng cho 20 ứng viên.</text></svg>