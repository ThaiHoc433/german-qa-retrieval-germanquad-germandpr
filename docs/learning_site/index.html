<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>German QA Learning Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: sidebar trái (mục lục theo giai đoạn) + cột nội dung đọc ~72ch; ba giai đoạn mang ba màu riêng */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#17201b; --muted:#5a645e; --line:#dfe4e0; --soft:#eef1ee;
  --s1:#1f7a5a; --s1-bg:#e5f3ec; --s2:#a35a00; --s2-bg:#fbefdc; --s3:#2453b8; --s3-bg:#e6eefc;
  --bad:#b3261e; --good:#1b7a33; --code-bg:#f1f3f1; --accent:#1f7a5a;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --surface:#fcfcfb;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif; --f-mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a1f1c; --fg:#e7ece8; --muted:#a2aca6; --line:#2d3531; --soft:#222925;
  --s1:#5cc59a; --s1-bg:#183027; --s2:#f0a64a; --s2-bg:#33260f; --s3:#86a9f5; --s3-bg:#1a2540;
  --bad:#ff8a80; --good:#6fd08a; --code-bg:#161b18; --accent:#5cc59a; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --surface:#1a1a19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a1f1c; --fg:#e7ece8; --muted:#a2aca6; --line:#2d3531; --soft:#222925;
  --s1:#5cc59a; --s1-bg:#183027; --s2:#f0a64a; --s2-bg:#33260f; --s3:#86a9f5; --s3-bg:#1a2540;
  --bad:#ff8a80; --good:#6fd08a; --code-bg:#161b18; --accent:#5cc59a; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --surface:#1a1a19; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15.5px;line-height:1.65;margin:0}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
nav.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:18px 14px 40px max(14px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:16px;line-height:1.3;margin:0 6px 4px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.prog{margin:12px 6px 16px;font-size:12px;color:var(--muted)}
.prog .bar{height:5px;background:var(--soft);border-radius:3px;margin-top:5px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.grp{margin:14px 0 4px;padding:0 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.grp.g1{color:var(--s1)}.grp.g2{color:var(--s2)}.grp.g3{color:var(--s3)}
.side a.it{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:13.5px;line-height:1.35}
.side a.it:hover{background:var(--soft)}
.side a.it.on{background:var(--soft);font-weight:600}
.side a.it .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:28px}
.side a.it.seen .n::after{content:" ✓";color:var(--good)}
.menu-btn{display:none}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:900px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.st1{color:var(--s1)}.st2{color:var(--s2)}.st3{color:var(--s3)}.st0{color:var(--muted)}
h1{font-size:30px;line-height:1.2;margin:6px 0 10px;text-wrap:balance}
h2{font-size:21px;margin:34px 0 10px;text-wrap:balance}
h3{font-size:16.5px;margin:22px 0 6px}
p{margin:8px 0;max-width:72ch}
.lead{font-size:17px;color:var(--muted);max-width:68ch}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.tag.base{border-color:var(--muted);color:var(--muted)}
.tag.new{background:var(--s3-bg);border-color:var(--s3);color:var(--s3)}
.tag.ext{border-style:dashed;border-color:var(--s2);color:var(--s2)}
.tag.p1{background:var(--s1-bg);color:var(--s1);border-color:var(--s1)}
.part{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
.part>.lbl{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.part>.lbl b{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em}
.part>.lbl span{font-weight:700;font-size:15.5px}
.k1 .lbl b{color:var(--s1)}.k2 .lbl b{color:var(--s2)}.k3 .lbl b{color:var(--s3)}
ul,ol{padding-left:22px;margin:6px 0}li{margin:3px 0;max-width:70ch}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;margin:10px 0}
pre code{background:none;padding:0;font-size:inherit}
.src{font-size:12px;color:var(--muted);margin-top:-4px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:13.5px;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right}
tr.hl td{background:var(--soft);font-weight:600}
.files{display:grid;gap:6px;margin:8px 0}
.file{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;font-size:13.5px;padding:7px 10px;background:var(--soft);border-radius:6px}
.file code{background:none;padding:0}
details.deep{margin:10px 0;border:1px dashed var(--line);border-radius:8px;padding:6px 12px}
details.deep summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.note{border-left:3px solid var(--s2);background:var(--s2-bg);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:14.5px}
.warn{border-left:3px solid var(--bad);padding:8px 12px;margin:10px 0;font-size:14.5px;background:var(--soft);border-radius:0 6px 6px 0}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-size:13.5px}
.chain span{background:var(--soft);border:1px solid var(--line);padding:3px 10px;border-radius:6px}
.chain i{font-style:normal;color:var(--muted)}
.conn{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.conn a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:3px 10px;border-radius:999px;background:var(--panel)}
.conn a:hover{border-color:var(--accent)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}
.res div{background:var(--soft);border-radius:8px;padding:10px 12px}
.res b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.res small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:40px;border-top:1px solid var(--line);padding-top:18px}
.navbtns a{flex:1;min-width:0;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--fg);background:var(--panel)}
.navbtns a small{display:block;color:var(--muted);font-size:12px}
.navbtns a.nx{text-align:right}
.navbtns a:hover{border-color:var(--accent)}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.widget{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;background:var(--surface)}
.widget .ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:10px;font-size:13.5px}
.widget input[type=text]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);min-width:0;flex:1 1 240px}
.widget input[type=range]{accent-color:var(--accent)}
.widget select{font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.toy{font-size:12px;color:var(--muted);font-style:italic}
svg.arch{width:100%;height:auto;display:block}
svg .nd rect{fill:var(--soft);stroke:var(--muted);stroke-width:1.2}
svg .nd.new rect{fill:var(--s3-bg);stroke:var(--s3)}
svg .nd.opt rect{stroke-dasharray:5 4}
svg .nd.data rect{fill:var(--panel)}
svg .nd text{fill:var(--fg);font-size:14px;font-weight:600;text-anchor:middle;font-family:var(--f-body)}
svg .nd text.sub{font-size:11.5px;font-weight:400;fill:var(--muted)}
svg .nd.active rect{stroke:var(--s2);stroke-width:3;fill:var(--s2-bg)}
svg .ed{fill:none;stroke:var(--muted);stroke-width:1.4}
svg .ed.new{stroke:var(--s3)}
svg .ed.opt{stroke-dasharray:5 4}
svg .lab{fill:var(--muted);font-size:12px;font-style:italic;font-family:var(--f-body)}
svg .ah{fill:var(--muted)}
.cap{font-size:13.5px;color:var(--muted);min-height:2.6em;margin-top:6px}
.cap b{color:var(--fg)}
.fig3{background:#fff;border-radius:8px;overflow-x:auto;border:1px solid var(--line)}
.fig3 svg{display:block;width:100%;min-width:860px;height:auto}
.kmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
.kcol{border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--panel)}
.kcol h4{margin:0 0 2px;font-size:14px}.kcol p{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.kcol.c1{border-top:4px solid var(--s1)}.kcol.c2{border-top:4px solid var(--s2)}.kcol.c3{border-top:4px solid var(--s3)}
.chip{display:block;font-size:12.5px;padding:4px 8px;border-radius:6px;margin:4px 0;text-decoration:none;color:var(--fg);border:1px solid var(--line);line-height:1.35}
.chip.inh{background:var(--soft);color:var(--muted)}
.chip.nw{background:var(--s3-bg);border-color:var(--s3)}
.chip.c1n{background:var(--s1-bg);border-color:var(--s1)}
.chip.ex{border-style:dashed;border-color:var(--s2);background:var(--s2-bg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;border:1px solid var(--line)}
.wins{position:relative;font-family:var(--f-mono);font-size:11px}
.wrow{display:flex;align-items:center;gap:8px;margin:5px 0}
.wrow .tl{width:64px;color:var(--muted);flex:none}
.wtrack{position:relative;height:18px;flex:1;background:var(--soft);border-radius:4px}
.wseg{position:absolute;top:0;height:100%;border-radius:4px;background:var(--s1);opacity:.8}
.wans{position:absolute;top:-3px;height:24px;border:2px solid var(--bad);border-radius:3px}
.bars{display:grid;gap:6px;margin:10px 0}
.brow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:13px}
.btrack{background:var(--soft);border-radius:4px;height:16px;position:relative}
.btrack i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--c1)}
.chart-box{position:relative;height:300px;margin:10px 0}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.story a{display:block;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.story a b{display:block;font-size:15px;margin:2px 0}
.story a small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block}

.formula{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:10px 0;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:17px;line-height:2;overflow-x:auto;text-align:center}
.formula i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 4px}
.frac>span:last-child{padding:0 4px}
table.vars td.v{white-space:nowrap;font-family:"Cambria Math","Times New Roman",serif;font-size:15px;width:1%}
ol.steps{counter-reset:st;list-style:none;padding-left:0}
ol.steps>li{counter-increment:st;position:relative;padding-left:34px;margin:6px 0}
ol.steps>li::before{content:counter(st);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:700;display:grid;place-items:center}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0}
.pc>div{background:var(--soft);border-radius:8px;padding:10px 14px}
.pc b{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
dl.terms{margin:8px 0;display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:6px 14px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;color:var(--fg)}
.hlc .hk{color:var(--s3);font-weight:600}.hlc .hs{color:var(--s1)}.hlc .hc{color:var(--muted);font-style:italic}.hlc .hn{color:var(--s2)}.hlc .ht{color:var(--c2)}
.modebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px;font-size:13px;color:var(--muted)}
.toc-in{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.toc-in .lnk{font:inherit;font-size:12px;background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);cursor:pointer}
.toc-in .lnk:hover{border-color:var(--accent);color:var(--fg)}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin:26px 0 4px;padding:8px 14px;border-radius:8px}
.phead b{font-size:13px;letter-spacing:.08em}
.phead span{font-size:13px;color:var(--muted)}
.phead.pa{background:var(--s1-bg);color:var(--s1)}
.phead.pb{background:var(--s3-bg);color:var(--s3)}
body.only-theory .partB{display:none}
body.only-project .partA{display:none}
.part{scroll-margin-top:16px}
.exq{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--panel)}
.exq textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--fg);resize:vertical}
details.sol{margin-top:8px}
details.sol summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
details.sol>div{margin-top:6px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 6px 6px 0}
.donebar{margin:20px 0 0}
.tag.lv0{background:var(--s1-bg);color:var(--s1);border-color:var(--s1)}
.tag.lv1{background:var(--s3-bg);color:var(--s3);border-color:var(--s3)}
.tag.lv2{color:var(--muted)}
.side a.it.done .n::after{content:" ✓";color:var(--good)}
.side a.it.seen .n::after{content:" ·";color:var(--muted)}
@media (max-width:860px){dl.terms{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-102%);transition:transform .2s;height:100%;box-shadow:0 0 30px rgba(0,0,0,.2);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  nav.side.open{transform:none}
  .menu-btn{display:inline-block;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-bottom:10px}
  .kmap,.story{grid-template-columns:1fr}
  .file{grid-template-columns:1fr}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="app">
<nav class="side" id="side" aria-label="Mục lục">
  <div class="brand">Hỏi đáp tiếng Đức<small>Giáo trình: lý thuyết trước, project sau</small></div>
  <div class="prog"><span id="progtxt">0 bài đã mở</span><div class="bar"><i id="progbar"></i></div></div>
  <div id="toc"></div>
</nav>
<main>
  <button class="btn menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">☰ Mục lục</button>
  <div class="page" id="page"></div>
</main>
</div>

<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fd1"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a0"/></marker></defs>
<rect x="0" y="0" width="1320" height="846" fill="#ffffff"/>
<rect x="820" y="14" width="22" height="14" rx="3" fill="#f1f3f5" stroke="#8a94a0"/>
<text x="850" y="26" font-size="11" font-weight="400" fill="#5b6673" text-anchor="start">có từ giai đoạn trước / giữ nguyên</text>
<rect x="1050" y="14" width="22" height="14" rx="3" fill="#e6effd" stroke="#1d5fd1"/>
<text x="1080" y="26" font-size="11" font-weight="400" fill="#5b6673" text-anchor="start">thêm hoặc thay mới</text>
<rect x="1200" y="14" width="22" height="14" rx="3" fill="#fff" stroke="#8a94a0" stroke-dasharray="4 3"/>
<text x="1230" y="26" font-size="11" font-weight="400" fill="#5b6673" text-anchor="start">tùy chọn</text>
<text x="20" y="27" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Hệ thống hỏi đáp tiếng Đức: Baseline → Pipeline → Cải tiến</text>
<rect x="8" y="44" width="1304" height="218" rx="10" fill="#f7f8fa" stroke="#e1e5ea"/>
<text x="24" y="74" font-size="12" font-weight="700" fill="#5b6673" text-anchor="start">GĐ 1</text>
<text x="24" y="94" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">BASELINE</text>

    if (m[1]) out.push(`<span class="hc">${esc(m[1])}</span>`);

P({id: "l1-qa", grp: "Chương 1 – Baseline", g: S1, n: "1.1", title: "Bài toán Question Answering trích xuất", level: 0,
pre: `<p>Không cần kiến thức trước. Hai khái niệm dùng trong bài:</p>${terms([["Chuỗi ký tự", "dãy ký tự có thứ tự; mỗi ký tự có một vị trí (chỉ số) bắt đầu từ 0."], ["Ký tự Unicode (code point)", "một mã số cho mỗi ký tự trên thế giới, ví dụ „ß“ là U+00DF. Bài 1.3 nói kỹ hơn."]])}`,
theory: `${H3("Định nghĩa")}<p><b>Question Answering</b> (QA, hỏi đáp tự động) là bài toán: cho một câu hỏi bằng ngôn ngữ tự nhiên, trả về câu trả lời. Có hai trục phân loại quan trọng.</p>
${table(["Trục", "Biến thể", "Ý nghĩa"], [["Có cho sẵn văn bản không?", "<b>miền đóng</b> (closed-domain / reading comprehension)", "đoạn văn chứa đáp án được cho cùng câu hỏi"], ["", "<b>miền mở</b> (open-domain)", "hệ thống phải tự tìm đoạn văn trong một kho lớn"], ["Đáp án được tạo thế nào?", "<b>trích xuất</b> (extractive)", "đáp án là một đoạn con liên tục của văn bản"], ["", "<b>sinh</b> (generative)", "mô hình viết câu trả lời mới, có thể không có trong văn bản"]])}
${H3("Bản chất: vì sao có QA trích xuất")}<p>Người dùng cần câu trả lời <i>kiểm chứng được</i>. Nếu đáp án luôn là một đoạn con của tài liệu gốc, ta có thể chỉ ra chính xác nó nằm ở đâu. Đổi lại, QA trích xuất không trả lời được câu hỏi cần tổng hợp hay suy luận ra điều không viết sẵn.</p>
${H3("Nguyên lý và thành phần")}${terms([["Context", "đoạn văn được dùng để trả lời."], ["Span", "đoạn con liên tục của context; được xác định bởi vị trí bắt đầu và kết thúc."], ["Offset nửa mở [start, end)", "start là chỉ số ký tự đầu của đáp án, end là chỉ số ngay <i>sau</i> ký tự cuối. Độ dài = end − start. Cách này giúp context[start:end] trong Python cho đúng đáp án."], ["Đáp án tham chiếu", "đáp án do người gán nhãn; một câu hỏi có thể có nhiều đáp án tham chiếu đều đúng."]])}
${H3("Công thức")}${F(`Đáp án = context[<i>start</i> : <i>end</i>] &nbsp;&nbsp; với &nbsp; 0 ≤ <i>start</i> &lt; <i>end</i> ≤ |context|`)}
${vars([["<i>start</i>", "chỉ số ký tự đầu tiên của đáp án"], ["<i>end</i>", "chỉ số sau ký tự cuối (không thuộc đáp án)"], ["|context|", "số ký tự của context"]])}
${H3("Một chi tiết hay gây lỗi: đơn vị của offset")}<p>"Ký tự" có thể đếm theo byte (UTF-8), theo code point (Python) hoặc theo đơn vị UTF-16 (JavaScript). Chữ „ß“ là 1 code point nhưng 2 byte UTF-8; emoji „😀“ là 1 code point nhưng 2 đơn vị UTF-16. Hai hệ thống dùng hai cách đếm khác nhau sẽ tô sáng lệch đáp án.</p>
${pc(["Có bằng chứng, dễ kiểm tra", "Đánh giá tự động đơn giản (so chuỗi)", "Mô hình nhỏ cũng làm tốt"], ["Không trả lời được câu cần tổng hợp nhiều nơi", "Ranh giới span mơ hồ (có lấy „vom“ hay không?)", "Miền mở cần thêm bước tìm văn bản"])}`,
practice: `<p><b>Bài toán:</b> context = „Die Universität wurde 1386 gegründet.“, câu hỏi „Wann wurde die Universität gegründet?“. Tìm offset của đáp án „1386“.</p>
${steps(["Đếm ký tự trước đáp án: „Die“ (3) + cách (1) + „Universität“ (11) + cách (1) + „wurde“ (5) + cách (1) = 22.", "Vậy <i>start</i> = 22 (chỉ số bắt đầu từ 0).", "<i>end</i> = start + độ dài „1386“ = 22 + 4 = 26.", "Kiểm tra: context[22:26] = „1386“. ✓"])}
<p><b>Biến thể đơn vị:</b> chuỗi „😀ß“ có 2 code point nhưng 3 đơn vị UTF-16 (emoji chiếm 2). Nếu backend trả offset code point [1, 2) cho „ß“ mà frontend JavaScript cắt theo UTF-16 thì sẽ cắt nhầm vào nửa sau của emoji.</p>`,
project: `<p>Project giải bài toán <b>miền mở, trích xuất</b>: người dùng chỉ đưa câu hỏi tiếng Đức, hệ thống tự tìm trong kho 26.864 đoạn Wikipedia rồi cắt đáp án nguyên văn. Lý do chọn trích xuất: đáp án luôn kèm đoạn bằng chứng và vị trí chính xác, người dùng tự kiểm tra được. Hỏi đáp sinh nằm trong hướng phát triển, chưa làm.</p>`,
impl: `<p>Mọi cấu hình (B0, B1, H0, H1) và API trả về cùng một dạng <code>QAResponse</code>:</p>
${code("py", `class QAResponse:
    """Dạng phản hồi mà pipeline (GĐ5) và API (GĐ8) sẽ trả về."""
    question: str
    answer: str

    passage_text: str

    ...

${files([["src/germanqa/schemas.py · QAResponse", "hợp đồng đầu ra"], ["src/germanqa/data/validate_spans.py · find_all, validate", "kiểm tra đáp án trong dữ liệu khớp offset khai báo"], ["frontend/src/lib/highlight.ts · utf16FromCodePoint", "đổi offset code point (Python) sang UTF-16 (JavaScript)"], ["frontend/src/api/types.ts · answer_start_utf16", "trường offset dành cho trình duyệt"]])}
<p><b>Luồng:</b> câu hỏi → (pipeline) → <code>QAResponse</code> với offset code point → API → frontend đổi sang UTF-16 → tô sáng đáp án trong đoạn.</p>`,
eval: `${pc(["Một hợp đồng đầu ra cho mọi cấu hình nên so sánh và thay thế dễ", "Offset nửa mở + kiểm tra bất biến chặn lỗi lệch vị trí"], ["Chỉ trả một đáp án; không có cơ chế „không có câu trả lời“ ngoài các trạng thái lỗi", "Không trả lời được câu hỏi cần tổng hợp"])}
<p><b>Thay thế:</b> QA sinh (RAG với LLM) cho câu trả lời tự nhiên hơn nhưng khó kiểm chứng. <b>Hướng tiếp:</b> cho phép trả „không biết“ khi điểm thấp (như SQuAD 2.0).</p>`,
ex: [["Cơ bản", "Vì sao offset dùng khoảng nửa mở [start, end) thay vì [start, end]?", "Vì độ dài = end − start, nối hai khoảng liền nhau không bị trùng ký tự, và khớp trực tiếp với phép cắt chuỗi context[start:end] của Python."],
     ["Vận dụng", "Context „Berlin ist die Hauptstadt.“ Đáp án „die Hauptstadt“. Tính start, end.", "„Berlin“ (6) + cách (1) + „ist“ (3) + cách (1) = 11. start = 11, end = 11 + 14 = 25. Kiểm tra context[11:25] = „die Hauptstadt“."],
     ["Project", "Mở src/germanqa/pipeline.py, tìm dòng kiểm tra đáp án khớp văn bản gốc. Điều gì xảy ra nếu bỏ dòng đó?", "Dòng <code>if passage_text[span[\"start\"]:span[\"end\"]] != span[\"text\"]: raise ValueError(...)</code>. Bỏ đi thì một lỗi offset (ví dụ do chuẩn hóa làm đổi độ dài văn bản) sẽ âm thầm trả về vị trí sai, giao diện tô sáng nhầm mà không ai biết."]]});

P({id: "l1-eda", grp: "Chương 1 – Baseline", g: S1, n: "1.2", title: "Phân tích dữ liệu (EDA): GermanQuAD", level: 0,
pre: `${conn([["l1-qa", "1.1 context, span, đáp án tham chiếu"]])}${terms([["Phân phối", "cách các giá trị (ví dụ độ dài) trải ra: nhiều giá trị nhỏ, ít giá trị lớn…"], ["Token", "đơn vị mô hình đọc; một từ có thể thành nhiều token. Bài 1.6 dạy kỹ."]])}`,
theory: `${H3("Định nghĩa")}<p><b>Phân tích dữ liệu khám phá</b> (Exploratory Data Analysis, EDA) là bước đo và nhìn dữ liệu <i>trước khi</i> xây mô hình, để phát hiện các vấn đề sẽ ảnh hưởng tới thiết kế: thiếu, trùng, lệch phân phối, vượt giới hạn mô hình, rò rỉ giữa các tập.</p>
${H3("Bản chất")}<p>Mô hình chỉ tốt bằng dữ liệu của nó. Nhiều lỗi nghiêm trọng (điểm test bị thổi phồng vì trùng lặp, đáp án bị cắt mất vì văn bản quá dài) không thể phát hiện bằng cách nhìn điểm số cuối; phải đo trực tiếp trên dữ liệu.</p>
${H3("Các bước của một EDA cho NLP")}${steps(["<b>Toàn vẹn:</b> đúng phiên bản, đủ số mẫu so với tài liệu mô tả (dataset card), đúng schema.", "<b>Thiếu và trùng:</b> trường rỗng, bản ghi trùng nội dung.", "<b>Độ dài:</b> đo bằng chính tokenizer của mô hình, không bằng số từ.", "<b>Vượt giới hạn:</b> bao nhiêu mẫu dài hơn số token mô hình nhận được.", "<b>Nhãn:</b> mỗi mẫu có mấy đáp án, độ dài đáp án.", "<b>Văn bản:</b> ký tự lạ, mã hóa.", "<b>Quan hệ giữa các tập:</b> trùng lặp, rò rỉ."])}
${H3("Công thức thống kê mô tả")}${F(`trung bình = ${frac("1", "n")} Σ<sub>i</sub> <i>x<sub>i</sub></i> &nbsp;&nbsp;·&nbsp;&nbsp; trung vị = giá trị đứng giữa sau khi sắp xếp &nbsp;&nbsp;·&nbsp;&nbsp; P95 = giá trị mà 95% mẫu nhỏ hơn hoặc bằng`)}
<p>Trung bình nhạy với giá trị cực lớn; trung vị thì không. Với độ dài văn bản (phân phối lệch phải, đuôi dài), cần báo cả trung vị và P95 để thấy phần đuôi, vì phần đuôi quyết định có bao nhiêu mẫu bị cắt.</p>

theory: `${H3("1. Chuẩn hóa Unicode")}<p>Cùng một chữ nhìn thấy có thể có nhiều cách mã hóa. „ä“ có thể là một code point U+00E4 (dạng <b>NFC</b>, ghép sẵn) hoặc hai code point „a“ + U+0308 dấu hai chấm kết hợp (dạng <b>NFD</b>, tách rời). Máy so sánh theo code point nên coi hai dạng là khác nhau. <b>Chuẩn hóa</b> đưa mọi văn bản về một dạng chuẩn trước khi so sánh.</p>
${terms([["NFC", "ghép tối đa; dạng phổ biến trên web."], ["NFD", "tách tối đa."], ["Ký tự zero-width", "ký tự không hiển thị (U+200B, U+200C, U+200D, U+2060, U+FEFF) làm hai chuỗi trông giống mà khác."], ["Chuẩn hóa theo nhiệm vụ", "mỗi nhiệm vụ cần mức chuẩn hóa khác nhau: tìm kiếm từ khóa thường viết thường, còn mô hình phân biệt hoa/thường (cased) thì không."]])}
${H3("2. Khử trùng lặp")}<p>Trùng lặp chính xác được phát hiện bằng hàm băm: hai văn bản có cùng mã băm (sau chuẩn hóa) coi là một. Khử trùng giúp kho không phình và chỉ số không bị đếm đôi.</p>
${H3("3. Rò rỉ dữ liệu và chia tập theo nhóm")}<p><b>Rò rỉ</b> (data leakage) là khi thông tin của tập đánh giá lọt vào tập huấn luyện, làm điểm đánh giá cao hơn thực tế. Trong QA, nếu hai câu hỏi về cùng một đoạn văn nằm ở hai tập, mô hình có thể "nhớ" đoạn đó. Giải pháp: gom các mẫu có liên quan thành <b>nhóm</b> và đưa cả nhóm vào cùng một tập.</p>
${H3("4. Union-Find (Disjoint Set Union)")}<p>Cấu trúc dữ liệu quản lý các nhóm rời nhau với hai phép: <code>find(x)</code> trả về đại diện của nhóm chứa x; <code>union(a, b)</code> gộp hai nhóm. Nối mọi cặp có quan hệ (câu hỏi–đoạn, đoạn–bài viết) thì các thành phần liên thông chính là các nhóm.</p>
${F(`Độ phức tạp ≈ O(α(n)) mỗi phép, với α là hàm Ackermann ngược (thực tế ≤ 4)`, "khi dùng nén đường đi (path compression)")}
${pc(["NFC + bỏ zero-width loại hẳn một lớp lỗi so khớp", "Chia theo nhóm chặn rò rỉ ở mức đoạn và bài viết"], ["Chia theo nhóm làm tỉ lệ dev không đúng chính xác như mong muốn", "Trùng 'gần giống' (chỉ khác vài chữ) không bị bắt bởi băm chính xác"])}`,
practice: `<p><b>Bài toán 1:</b> „Mädchen“ dạng NFC có 7 code point; dạng NFD có 8 (vì „ä“ thành „a“ + dấu). So sánh trực tiếp → khác nhau; sau NFC → giống nhau.</p>
<p><b>Bài toán 2 (Union-Find):</b> câu hỏi q1, q2 cùng đoạn p1; q3 thuộc đoạn p2; p1 và p2 cùng bài viết d1; q4 thuộc đoạn p3 của bài d2.</p>

P({id: "l1-ir", grp: "Chương 1 – Baseline", g: S1, n: "1.4", title: "Truy hồi thông tin và TF-IDF", level: 0,
pre: `${conn([["l1-prep", "1.3 văn bản đã chuẩn hóa"]])}${terms([["Logarit ln", "ln(x) tăng chậm khi x lớn; ln(1) = 0."], ["Vector", "danh sách số; tích vô hướng của hai vector = tổng tích từng cặp phần tử."]])}`,
theory: `${H3("Định nghĩa")}<p><b>Truy hồi thông tin</b> (Information Retrieval, IR): cho một truy vấn và một kho tài liệu (<b>corpus</b>), trả về các tài liệu liên quan nhất, sắp theo mức liên quan. Kết quả thường là <b>top-k</b>: k tài liệu điểm cao nhất.</p>
${H3("Bản chất")}<p>Kho có hàng chục nghìn đến hàng tỷ tài liệu; không thể đưa hết cho một mô hình đắt tiền. IR là bước lọc nhanh để giảm kho xuống vài chục ứng viên.</p>
${H3("Mô hình túi từ và chỉ mục nghịch đảo")}<p><b>Túi từ</b> (bag-of-words) biểu diễn văn bản bằng các từ nó chứa và số lần xuất hiện, bỏ thứ tự. Vector có một chiều cho mỗi từ trong từ điển, nên rất dài và hầu hết bằng 0, gọi là biểu diễn <b>thưa</b> (sparse). <b>Chỉ mục nghịch đảo</b> lưu, với mỗi từ, danh sách tài liệu chứa nó. Khi truy vấn chỉ cần duyệt danh sách của vài từ trong câu hỏi, không cần quét cả kho.</p>
${H3("TF-IDF")}<p>Ý tưởng: một từ quan trọng với tài liệu khi nó xuất hiện <i>nhiều trong tài liệu đó</i> (TF) nhưng <i>ít trong kho</i> (IDF). Từ như „der“ có ở mọi nơi nên gần như vô dụng để phân biệt.</p>
${F(`tf(<i>t</i>, <i>d</i>) = số lần <i>t</i> xuất hiện trong <i>d</i> &nbsp;&nbsp;·&nbsp;&nbsp; idf(<i>t</i>) = ln ${frac("<i>N</i>", "df(<i>t</i>)")} &nbsp;&nbsp;·&nbsp;&nbsp; score(<i>q</i>, <i>d</i>) = Σ<sub><i>t</i> ∈ <i>q</i></sub> tf(<i>t</i>, <i>d</i>) · idf(<i>t</i>)`)}
${vars([["<i>N</i>", "số tài liệu trong kho"], ["df(<i>t</i>)", "số tài liệu chứa từ <i>t</i> (document frequency)"], ["<i>q</i>, <i>d</i>", "truy vấn và tài liệu"]])}
<p>Nguồn gốc của idf: nếu chọn ngẫu nhiên một tài liệu, xác suất nó chứa <i>t</i> là df/N; −ln(df/N) = ln(N/df) là "lượng thông tin" (độ bất ngờ) khi gặp <i>t</i>. Từ càng hiếm, càng nhiều thông tin.</p>
${pc(["Nhanh, không cần huấn luyện, giải thích được", "Mạnh với tên riêng, số, thuật ngữ"], ["Chỉ khớp đúng chữ: không hiểu đồng nghĩa hay cách diễn đạt khác", "TF tăng tuyến tính: lặp từ 10 lần được điểm gấp 10", "Không xét độ dài tài liệu"])}`,

${steps(["N = 3. df(hund) = 2 (D1, D3); df(bellt) = 1 (D1).", "idf(hund) = ln(3/2) = <b>0,405</b>; idf(bellt) = ln(3/1) = <b>1,099</b>.", "D1: tf(hund)=1, tf(bellt)=1 → 0,405 + 1,099 = <b>1,504</b>.", "D3: chỉ có hund → <b>0,405</b>. D2: <b>0</b>.", "Xếp hạng: D1 > D3 > D2. „bellt“ hiếm nên đóng góp nhiều hơn „hund“."])}`,
project: `<p>Project dùng truy hồi thưa làm tầng lọc đầu: kho 26.864 đoạn, reader tốn khoảng 12 ms mỗi đoạn, đọc hết sẽ mất khoảng 5,4 phút mỗi câu hỏi (ước tính). Project không dùng TF-IDF thuần mà dùng biến thể cải tiến BM25 (bài 1.5), sửa đúng hai hạn chế "TF tuyến tính" và "không xét độ dài".</p>`,
impl: `<p>Tách từ là bước đầu của mọi mô hình túi từ. Project dùng một tokenizer riêng cho truy hồi, khác tokenizer của reader:</p>
${code("py", `# \\w trong chuỗi Unicode khớp chữ cái có dấu: ä ö ü ß é... nên không làm mất umlaut
_TOKEN = re.compile(r"\\w+", re.UNICODE)

def tokenize(text, stopwords=None):
    """Chữ thường, tách theo chữ-số; bỏ stopword nếu được yêu cầu."""
    tokens = _TOKEN.findall(text.lower())
    if stopwords:
        tokens = [t for t in tokens if t not in stopwords]
    return tokens`)}

<p><b>Stopword</b> (từ dừng: der, die, wann, wurde…) là biến thể được đo riêng trên dev; cấu hình chọn cuối cùng có bỏ stopword (<code>use_stopwords: true</code>).</p>`,

P({id: "l1-bm25", grp: "Chương 1 – Baseline", g: S1, n: "1.5", title: "BM25 Okapi", level: 0,
pre: `${conn([["l1-ir", "1.4 TF, IDF, chỉ mục nghịch đảo"]])}`,
theory: `${H3("Định nghĩa")}<p><b>BM25</b> (Best Matching 25, hệ Okapi) là hàm chấm điểm túi từ, thường là mốc mạnh nhất của truy hồi thưa. Nó giữ ý tưởng TF × IDF và thêm hai sửa đổi.</p>
${H3("Bản chất: hai lỗi của TF-IDF")}${steps(["<b>TF tuyến tính:</b> lặp một từ 20 lần không làm tài liệu liên quan gấp 20. Cần một hàm <b>bão hòa</b>: tăng nhanh lúc đầu rồi chững lại.", "<b>Tài liệu dài có lợi:</b> văn bản dài chứa nhiều từ hơn chỉ vì dài. Cần <b>chuẩn hóa độ dài</b>."])}
${H3("Công thức")}${F(`score(<i>q</i>, <i>d</i>) = Σ<sub><i>t</i>∈<i>q</i></sub> idf(<i>t</i>) · ${frac("tf(<i>t</i>,<i>d</i>) · (<i>k</i><sub>1</sub> + 1)", "tf(<i>t</i>,<i>d</i>) + <i>k</i><sub>1</sub> · (1 − <i>b</i> + <i>b</i> · |<i>d</i>| / avgdl)")}`)}
${F(`idf(<i>t</i>) = ln ( 1 + ${frac("<i>N</i> − df(<i>t</i>) + 0,5", "df(<i>t</i>) + 0,5")} )`, "dạng idf có cộng 1 để luôn dương (bản Lucene; project dùng đúng dạng này)")}
${vars([["<i>k</i><sub>1</sub>", "độ bão hòa TF; k1 = 0 bỏ hẳn TF, k1 lớn gần với TF tuyến tính. Thường 1,2–2,0"], ["<i>b</i>", "mức chuẩn hóa độ dài ∈ [0, 1]; b = 0 bỏ qua độ dài, b = 1 chuẩn hóa hoàn toàn. Thường 0,75"], ["|<i>d</i>|", "độ dài tài liệu (số token)"], ["avgdl", "độ dài trung bình trong kho"]])}
${H3("Đọc công thức")}<p>Khi |d| = avgdl, mẫu số thành tf + k1, và phân số là tf·(k1+1)/(tf+k1): bằng 1 khi tf = 1 và tiến tới k1+1 khi tf → ∞. Đó là bão hòa. Khi tài liệu dài hơn trung bình, mẫu số tăng, điểm giảm: đó là chuẩn hóa độ dài, mạnh yếu theo b.</p>
${pc(["Hai tham số dễ hiểu, dò lưới nhanh", "Mốc rất mạnh, khó vượt bằng mô hình đơn giản"], ["Vẫn chỉ khớp đúng chữ", "Tham số tối ưu phụ thuộc kho, phải dò lại"])}`,
practice: `<p><b>Cùng kho bài 1.4</b> (D1 3 từ, D2 2 từ, D3 4 từ, avgdl = 3), k1 = 1,2, b = 0,75, truy vấn „hund bellt“.</p>
${steps(["idf(hund) = ln(1 + (3 − 2 + 0,5)/(2 + 0,5)) = ln 1,6 = <b>0,470</b>; idf(bellt) = ln(1 + 2,5/1,5) = <b>0,981</b>.", "D1: |d| = avgdl → mẫu chuẩn hóa = 1,2·(0,25 + 0,75·1) = 1,2. Phân số với tf = 1: 1·2,2/(1+1,2) = 1. Điểm = 0,470 + 0,981 = <b>1,451</b>.", "D3: |d| = 4 → 1,2·(0,25 + 0,75·4/3) = 1,5. Phân số: 2,2/2,5 = 0,88. Điểm = 0,470·0,88 = <b>0,414</b>.", "Bão hòa (k1 = 1,2, tài liệu dài trung bình): tf = 1, 2, 3, 4, 5 cho phân số 1; 1,375; 1,571; 1,692; 1,774 → không bao giờ vượt 2,2."])}
<p>Thử trực tiếp trên kho 4 đoạn tiếng Đức (công thức và stopword giống project):</p>${bm25Widget()}`,
project: `<p>BM25 là retriever của Baseline (và của cấu hình B0 ở chương 2): nhanh, không cần GPU, mạnh với tên riêng và năm tháng vốn rất nhiều trong câu hỏi GermanQuAD. Project tự cài BM25 bằng numpy thay vì dùng thư viện, để kiểm soát chính xác công thức và lưu chỉ mục có dấu vân tay.</p>`,
impl: `${code("py", `def fit(self, doc_ids, token_lists):
    ...
    lengths = np.array([len(t) for t in token_lists], dtype=np.float64)
    avgdl = lengths.mean() if n else 0.0
    ...
    for term, (idx, tfs) in postings.items():
        df = len(idx)
        idf = math.log(1.0 + (n - df + 0.5) / (df + 0.5))
        norm = self.k1 * (1.0 - self.b + self.b * lengths[idx] / avgdl)
        self.weights[term] = (idx, idf * tf * (self.k1 + 1.0) / (tf + norm))`)}
<p>Điểm đóng góp của mỗi (từ, đoạn) được <b>tính sẵn</b> lúc dựng chỉ mục; lúc truy vấn chỉ cộng các mảng → dưới 1 ms mỗi câu.</p>
${table(["Cấu hình", "Giá trị", "Ý nghĩa"], [["grid k1", "0,5 · 0,7 · 0,9 · 1,2 · 1,5", "dò trên dev"], ["grid b", "0,2 · 0,35 · 0,5 · 0,75", ""], ["select_by", "mrr@10", "chỉ số để chọn"], ["Chọn", "k1 = 0,7 · b = 0,2 · use_stopwords: true", "configs/pipeline.yaml"]])}
${files([["src/germanqa/retrieval/bm25.py · BM25.fit, scores, top_k; BM25Retriever.retrieve", "chấm điểm, chỉ trả đoạn điểm > 0"], ["src/germanqa/retrieval/bm25_store.py · compute_fingerprint, load_or_build", "SHA-1 của corpus, tham số, stopword; từ chối nạp nếu lệch"], ["scripts/03_bm25_eval.py, 03b_bm25_analysis.py", "dò lưới, phân tích"]])}
${res([["0,322", "Hit@1 dev"], ["0,638", "Hit@5 dev"], ["0,814", "Hit@20 dev"], ["0,452", "MRR@10 dev"]])}<p class="src">reports/summary_dev.md</p>`,
eval: `<p>b = 0,2 rất thấp so với mặc định 0,75: trong kho này, chuẩn hóa độ dài mạnh gây hại; đoạn đúng thường dài. b = 0,2 nằm sát biên lưới nên giá trị tối ưu có thể còn thấp hơn.</p>
${pc(["Nhanh, ổn định, giải thích được", "Có dấu vân tay nên không dùng nhầm chỉ mục cũ"], ["18,6% câu dev không có đoạn đúng trong top-20", "Không xử lý từ ghép, biến cách"])}<p><b>Thay thế:</b> BM25+ , BM25F (trọng số theo trường tiêu đề/nội dung), mở rộng truy vấn. <b>Hướng tiếp trong project:</b> kết hợp với dense (bài 3.3).</p>`,
ex: [["Cơ bản", "Đặt b = 0 thì công thức BM25 còn phụ thuộc độ dài tài liệu không?", "Không: mẫu số thành tf + k1, không còn |d|/avgdl."],
     ["Vận dụng", "k1 = 1,2, tài liệu dài bằng avgdl, tf = 10. Tính phân số tf·(k1+1)/(tf+k1·1).", "10·2,2/(10+1,2) = 22/11,2 ≈ 1,964, gần trần 2,2."],
     ["Project", "Trong widget bài này, kéo b từ 0,2 lên 1. Đoạn nào tụt hạng và vì sao?", "Các đoạn dài hơn avgdl bị phạt mạnh hơn. Đây là lý do b thấp hợp với kho mà đoạn đúng thường dài (đo thêm ngoài tệp project: đoạn đúng của dev dài trung bình 119,8 token so với 96,6 của cả kho)."]]});

P({id: "l1-bert", grp: "Chương 1 – Baseline", g: S1, n: "1.6", title: "Transformer, BERT/GBERT và tokenizer", level: 0,
pre: `${conn([["l1-eda", "1.2 token, giới hạn độ dài"]])}${terms([["Ma trận", "bảng số; nhân ma trận kết hợp các hàng với các cột."], ["Softmax", "biến một dãy số thực thành xác suất: softmax(z)<sub>i</sub> = e<sup>z<sub>i</sub></sup> / Σ<sub>j</sub> e<sup>z<sub>j</sub></sup>. Số lớn nhất được xác suất lớn nhất, tổng bằng 1."], ["Embedding", "vector số đại diện cho một token."]])}`,
theory: `${H3("1. Tokenizer và WordPiece")}<p>Mô hình không đọc chữ mà đọc <b>token ID</b>. Tokenizer cắt văn bản thành token theo một từ điển cố định. <b>WordPiece</b> cắt từ chưa biết thành các mảnh có trong từ điển bằng cách <b>khớp dài nhất từ trái sang</b>; mảnh không đứng đầu từ có tiền tố <code>##</code>. Nhờ vậy từ điển hữu hạn vẫn biểu diễn được mọi từ, kể cả từ ghép tiếng Đức.</p>
${H3("2. Self-attention")}<p>Nghĩa của một từ phụ thuộc ngữ cảnh. <b>Self-attention</b> cho mỗi token "nhìn" mọi token khác và lấy trung bình có trọng số các biểu diễn của chúng.</p>
${F(`Attention(<i>Q</i>, <i>K</i>, <i>V</i>) = softmax ( ${frac("<i>Q K</i><sup>⊤</sup>", "√<i>d</i>")} ) <i>V</i>`)}
${vars([["<i>Q</i> (query)", "mỗi token hỏi: tôi cần thông tin gì?"], ["<i>K</i> (key)", "mỗi token quảng bá: tôi chứa gì?"], ["<i>V</i> (value)", "nội dung được truyền đi"], ["<i>d</i>", "số chiều vector; chia √d để điểm không quá lớn làm softmax bão hòa"]])}
<p>Mỗi hàng của <i>QK</i><sup>⊤</sup> có n điểm (n = số token), nên chi phí là <b>O(n²)</b>: gấp đôi độ dài thì gấp bốn chi phí. Đó là lý do mô hình có <b>giới hạn độ dài</b> (BERT: 512 token).</p>
${H3("3. BERT, tiền huấn luyện và fine-tuning")}<p><b>BERT</b> là chồng nhiều lớp Transformer encoder (bản base: 12 lớp, vector 768 chiều). Nó được <b>tiền huấn luyện</b> trên văn bản lớn bằng cách đoán từ bị che (masked language model). Sau đó <b>fine-tune</b>: thêm một đầu nhỏ cho nhiệm vụ cụ thể và huấn luyện tiếp toàn bộ trên dữ liệu có nhãn. <b>GBERT</b> là BERT đơn ngữ tiếng Đức của deepset. Mô hình đơn ngữ dành toàn bộ từ điển và dung lượng cho một ngôn ngữ; mô hình đa ngữ cùng cỡ phải chia cho hàng trăm ngôn ngữ ("curse of multilinguality").</p>
${H3("4. Đầu vào cặp câu")}${terms([["[CLS] câu A [SEP] câu B [SEP]", "định dạng hai đoạn; [CLS] là token đầu, thường dùng làm biểu diễn chung."], ["token_type_ids", "0 cho câu A, 1 cho câu B."], ["attention_mask", "1 cho token thật, 0 cho token đệm (padding)."], ["offset_mapping", "với mỗi token, khoảng ký tự (start, end) trong văn bản gốc: cầu nối giữa vị trí token và vị trí ký tự."]])}
${H3("5. Cửa sổ trượt")}<p>Văn bản dài hơn giới hạn được chia thành nhiều <b>cửa sổ</b> chồng lấn nhau <i>s</i> token (stride). Chồng lấn đảm bảo một đáp án nằm gần ranh giới vẫn trọn vẹn trong ít nhất một cửa sổ.</p>
${pc(["Biểu diễn theo ngữ cảnh, mạnh hơn hẳn túi từ", "Tiền huấn luyện một lần, fine-tune nhiều nhiệm vụ"], ["Chi phí O(n²), giới hạn độ dài", "Cần GPU; khó giải thích"])}`,
practice: `<p><b>Bài toán 1 (WordPiece):</b> từ điển giả định có „bundes“, „##verfassungs“, „##gericht“, „##s“, „verfassung“. Tách „bundesverfassungsgericht“.</p>
${steps(["Từ vị trí 0, mảnh dài nhất có trong từ điển: „bundes“.", "Phần còn lại „verfassungsgericht“, tìm mảnh ##: „##verfassungs“ dài hơn „##verfassung“ (không có) → chọn „##verfassungs“.", "Còn „gericht“ → „##gericht“. Kết quả: [bundes, ##verfassungs, ##gericht], 1 từ thành 3 token."])}
<p><b>Bài toán 2 (attention, Q = K = V = X):</b> 3 token, vector 2 chiều: x1 = (1, 0), x2 = (0, 1), x3 = (1, 1). d = 2.</p>
${steps(["Điểm XX<sup>⊤</sup>/√2: hàng x1 = (1, 0, 1)/1,414 = (0,707; 0; 0,707). Hàng x3 = (1, 1, 2)/1,414 = (0,707; 0,707; 1,414).", "Softmax hàng x1 = (0,401; 0,198; 0,401): x1 chú ý nhiều tới chính nó và x3 (cùng chiều thứ nhất).", "Softmax hàng x3 = (0,248; 0,248; 0,503).", "Đầu ra x1 = 0,401·(1,0) + 0,198·(0,1) + 0,401·(1,1) = <b>(0,802; 0,599)</b>: biểu diễn mới của x1 đã pha thông tin từ x3."])}
<p><b>Bài toán 3 (cửa sổ trượt):</b> thử thay đổi độ dài:</p>${windowWidget()}`,
project: `<p>Reader cần hiểu câu hỏi trong ngữ cảnh đoạn văn: đây là việc túi từ không làm được. Project chọn <code>deepset/gbert-base</code> (đơn ngữ tiếng Đức, cỡ base vừa GPU 4 GB). EDA bài 1.2 cho thấy 13,1% câu test cần từ 5 cửa sổ, nên cửa sổ trượt là bắt buộc.</p>`,
impl: `${code("py", `def _encode(examples, tokenizer, max_length, stride):
    return tokenizer([e["question"] for e in examples], [e["context"] for e in examples],
                     truncation="only_second", max_length=max_length, stride=stride,
                     return_overflowing_tokens=True, return_offsets_mapping=True)`)}
${table(["Tham số", "Giá trị", "Ý nghĩa"], [["model_name", "deepset/gbert-base", "backbone tiền huấn luyện, chưa học QA"], ["max_length", "384", "token mỗi cửa sổ (gồm [CLS], câu hỏi, [SEP])"], ["stride", "128", "số token chồng lấn"], ["truncation", "only_second", "chỉ cắt context, không cắt câu hỏi"]], {src: "configs/reader.yaml"})}
${files([["src/germanqa/reader/model_io.py · get_tokenizer, get_model", "nạp đúng tokenizer đi kèm checkpoint"], ["src/germanqa/reader/features.py · _encode", "cắt cửa sổ, offset_mapping"], ["src/germanqa/tokenization.py · load_bert_tokenizer", "WordPiece"]])}
<p><b>Output:</b> mỗi (câu hỏi, context) thành một hoặc nhiều cửa sổ; 10.301 câu train thành 13.263 cửa sổ. Bài 1.7 gắn nhãn cho từng cửa sổ.</p>`,
eval: `${pc(["384 thay vì 512: nhanh hơn, vừa bộ nhớ, vẫn đủ cho 71,4% câu train trong 1 cửa sổ", "offset_mapping cho phép cắt đáp án từ văn bản gốc"], ["Câu hỏi bị cắt ở 64 token khi chạy pipeline (hiếm: câu hỏi dài nhất 36 token)", "Một số đáp án dài hơn cửa sổ không học được"])}<p><b>Thay thế:</b> mô hình hỗ trợ văn bản dài (Longformer), mô hình đa ngữ (XLM-R). <b>Hướng tiếp:</b> LoRA để fine-tune mô hình lớn hơn trên 4 GB.</p>`,
ex: [["Cơ bản", "Vì sao chia cho √d trong attention?", "Tích vô hướng của vector d chiều có độ lớn tăng theo √d; không chia thì điểm rất lớn, softmax gần one-hot, gradient gần 0."],
     ["Vận dụng", "Context 900 token, câu hỏi 16 token, max_length 384, stride 128. Có bao nhiêu cửa sổ?", "Mỗi cửa sổ chứa 384 − 16 − 3 = 365 token context; bước nhảy 365 − 128 = 237. Cửa sổ bắt đầu ở 0, 237, 474, 711 (711 + 365 ≥ 900) → 4 cửa sổ. Kiểm tra bằng widget."],
     ["Project", "Nếu dùng tokenizer khác với tokenizer của checkpoint thì chuyện gì xảy ra?", "Token ID không khớp từ điển mô hình đã học: mô hình nhận chuỗi số vô nghĩa, kết quả sai hoàn toàn dù không báo lỗi. Vì vậy model_io nạp tokenizer từ cùng thư mục checkpoint."]]});

P({id: "l1-reader", grp: "Chương 1 – Baseline", g: S1, n: "1.7", title: "Reader trích xuất và fine-tuning", level: 0,
pre: `${conn([["l1-bert", "1.6 BERT, cặp câu, offset_mapping, cửa sổ"], ["l1-qa", "1.1 span"]])}${terms([["Logit", "điểm thô chưa qua softmax."], ["Gradient", "hướng thay đổi tham số làm mất mát giảm nhanh nhất."]])}`,
theory: `${H3("Định nghĩa")}<p><b>Reader trích xuất</b> là BERT thêm một lớp tuyến tính cho ra hai số ở mỗi vị trí token i: <b>start logit</b> s<sub>i</sub> và <b>end logit</b> e<sub>i</sub>. Đáp án là cặp (i, j) có s<sub>i</sub> + e<sub>j</sub> lớn nhất với i ≤ j.</p>
${H3("Huấn luyện")}${F(`<i>p</i><sup>start</sup> = softmax(<i>s</i>), &nbsp; <i>p</i><sup>end</sup> = softmax(<i>e</i>) &nbsp;&nbsp;·&nbsp;&nbsp; <i>L</i> = ½ [ −ln <i>p</i><sup>start</sup><sub><i>a</i></sub> − ln <i>p</i><sup>end</sup><sub><i>b</i></sub> ]`)}

        return self._empty(question, "no_passages", t0, t_retrieval, self._no_trace(trace))
    ...
    used = ranked[:k_read]
    spans = self.reader.read(reader_question, [{"passage_id": h["passage_id"],
                                                "text": self.passages[h["passage_id"]]} for h in used])`)}
${files([["src/germanqa/pipeline.py · QAPipeline.answer", "luồng 4 bước, đo thời gian"], ["src/germanqa/pipeline.py · build_retriever, build_pipeline", "dựng từ configs, dùng chung CLI và API"], ["configs/pipeline.yaml", "retrieval_top_k 20 · reader_top_k 5 · checkpoint"], ["scripts/GD5/05_ask.py, 05_run_dev.py", ""]])}

P({id: "l2-dense", grp: "Chương 2 – Pipeline", g: S2, n: "2.3", title: "Dense retrieval: embedding, dual encoder, FAISS", level: 1,
pre: `${conn([["l1-bert", "1.6 BERT, [CLS]"], ["l1-ir", "1.4 truy hồi thưa"], ["l2-dpr", "2.2 dữ liệu huấn luyện, nhiễm bẩn"]])}${terms([["Chuẩn (norm) vector", "‖v‖ = √(Σ v<sub>i</sub>²), độ dài của vector."]])}`,
theory: `${H3("Định nghĩa")}<p><b>Truy hồi dày</b> biểu diễn câu hỏi và đoạn bằng vector số thực vài trăm chiều (<b>dense</b>: hầu hết khác 0), sao cho đoạn liên quan có vector gần vector câu hỏi. Tìm kiếm trở thành tìm <b>láng giềng gần nhất</b> trong không gian vector.</p>
${H3("Bản chất")}<p>Túi từ không biết „Hund“ và „Haustier“ liên quan. Mô hình ngôn ngữ đặt các văn bản cùng nghĩa gần nhau dù khác chữ.</p>
${H3("Dual encoder (bi-encoder), DPR")}<p>Hai encoder riêng: <i>E<sub>Q</sub></i> cho câu hỏi, <i>E<sub>P</sub></i> cho đoạn (mỗi cái là một BERT, lấy vector [CLS]). Vector đoạn tính <b>trước một lần</b>; lúc hỏi chỉ mã hóa câu hỏi rồi tìm.</p>
${F(`sim(<i>q</i>, <i>p</i>) = <i>E<sub>Q</sub></i>(<i>q</i>) · <i>E<sub>P</sub></i>(<i>p</i>) &nbsp;&nbsp;(tích vô hướng) &nbsp;&nbsp;·&nbsp;&nbsp; cos(<i>q</i>, <i>p</i>) = ${frac("<i>q</i> · <i>p</i>", "‖<i>q</i>‖ ‖<i>p</i>‖")}`)}
${H3("Huấn luyện tương phản")}${F(`<i>L</i> = −ln ${frac("exp(<i>q</i>·<i>p</i><sup>+</sup>)", "exp(<i>q</i>·<i>p</i><sup>+</sup>) + Σ<sub><i>j</i></sub> exp(<i>q</i>·<i>p</i><sup>−</sup><sub><i>j</i></sub>)")}`)}
<p>Kéo câu hỏi gần đoạn đúng <i>p</i><sup>+</sup>, đẩy xa các đoạn sai <i>p</i><sup>−</sup> (in-batch và hard negative, bài 2.2). Mô hình được huấn luyện với độ đo nào thì phải dùng đúng độ đo đó khi tìm: DPR học bằng tích vô hướng, không chuẩn hóa vector.</p>
${H3("FAISS: tìm chính xác và xấp xỉ")}<p><b>FAISS</b> là thư viện tìm láng giềng gần. <b>Flat index</b> so câu hỏi với <i>mọi</i> vector: chính xác, O(N·d) mỗi truy vấn. Chỉ mục xấp xỉ (ANN: IVF, HNSW, PQ) nhanh hơn nhiều với kho hàng triệu nhưng có thể bỏ sót. Với vài chục nghìn đoạn, Flat là đủ nhanh.</p>
${pc(["Hiểu nghĩa, cách diễn đạt khác", "Tìm nhanh khi vector đã tính sẵn"], ["Phụ thuộc dữ liệu huấn luyện; yếu với tên riêng hiếm", "Phải mã hóa lại cả kho khi đổi mô hình", "Đoạn dài bị cắt ở giới hạn token"])}`,
practice: `<p><b>Bài toán:</b> q = (1, 2, 0); p1 = (2, 1, 0), p2 = (6, 0, 0), p3 = (0, 1, 2).</p>
${steps(["Tích vô hướng: q·p1 = 2 + 2 = <b>4</b>; q·p2 = <b>6</b>; q·p3 = <b>2</b> → thứ tự p2, p1, p3.", "Chuẩn: ‖q‖ = √5 ≈ 2,236; ‖p1‖ = √5; ‖p2‖ = 6; ‖p3‖ = √5.", "Cosine: p1 = 4/5 = <b>0,800</b>; p2 = 6/(2,236·6) = <b>0,447</b>; p3 = 2/5 = <b>0,400</b> → thứ tự p1, p2, p3.", "Hai độ đo cho thứ tự khác nhau vì p2 có độ dài lớn. Dùng sai độ đo với mô hình đã huấn luyện sẽ đổi kết quả."])}
<p><b>Mất mát tương phản:</b> q·p<sup>+</sup> = 4, hai negative 2 và 6: L = −ln(e<sup>4</sup>/(e<sup>4</sup> + e<sup>2</sup> + e<sup>6</sup>)) = <b>2,143</b> (lớn vì một negative điểm cao hơn positive). Nếu negative là 2 và 1: L = <b>0,170</b>.</p>`,
project: `<p>BM25 bỏ sót đoạn đúng ở 18,6% câu dev vì chỉ khớp chữ. Project cắm một retriever dense vào <b>cùng pipeline</b>, thay chỗ BM25, giữ nguyên Select, reader, đầu ra, để so công bằng. Dùng checkpoint có sẵn của deepset (<code>gbert-base-germandpr</code> ctx/question encoder), không tự huấn luyện. B0 vẫn là cấu hình BM25; dense ở chương này là bản đối chiếu.</p>
<div class="widget"><div class="tw">${archSVG("P", "Dense cắm vào khâu Retrieve")}</div></div>`,
impl: `${code("py", `def build_index(vectors):
    import faiss
    index = faiss.IndexFlatIP(vectors.shape[1])
    ...`)}
${table(["Tham số", "Giá trị", "Vì sao"], [["ctx_encoder / question_encoder", "deepset/gbert-base-germandpr-*", "dual encoder đã huấn luyện trên GermanDPR"], ["passage_field", "original_text", "viết thường làm top-1 tụt 0,84 → 0,52 (phép thử định dạng 6.1)"], ["similarity", "dot", "DPR học bằng tích vô hướng, không chuẩn hóa"], ["passage_max_length (bản đầu)", "256", "32,6% đoạn bị cắt"], ["question_max_length", "64", ""]], {src: "configs/dense.yaml, reports/dense_format_probe.json"})}
${table(["Tập · retriever (cùng pipeline)", "Hit@5", "Hit@20", "MRR@10", "EM"], [["Dev 1.176 · BM25", "0,638", "0,814", "0,452", "0,236"], ["Dev 1.176 · Dense 256", "0,816", "0,949", "0,625", "0,338"], ["Dev-unseen 234 · BM25", "0,645", "0,838", "0,494", "0,171"], ["Dev-unseen 234 · Dense 256", "0,752", "0,927", "0,568", "0,201"]], {num: 1, src: "results/eval_dev_dense_20261104T121120Z_57716bd8.json"})}
${files([["src/germanqa/retrieval/dense.py · DPREncoder, build_index, exact_topk, DenseRetriever", ""], ["dense.py · check_manifest_compat", "từ chối artifact lệch cấu hình"], ["scripts/GD6/06b_encode_corpus.py … 06f_format_probe.py", "mã hóa, kiểm tra chỉ mục, thử định dạng"]])}`,
eval: `<p>Trên dev đầy đủ, dense hơn BM25: EM +0,101 [0,078; 0,128]. Trên dev-unseen: EM +0,030 [−0,017; 0,077], khoảng tin cậy chứa 0. Phần lớn lợi thế trên dev có thể đến từ dữ liệu encoder đã thấy. Ở top-5 dev, 337 câu chỉ dense tìm được, 128 câu chỉ BM25 tìm được: hai bên bổ trợ nhau (bài 3.3).</p>
${pc(["Hiểu diễn đạt khác", "Cắm vào pipeline không sửa code"], ["Nhiễm bẩn dev", "Cắt đoạn ở 256 token", "Không tự fine-tune"])}<p><b>Hướng tiếp:</b> tăng độ dài (bài 3.2), kết hợp với BM25 (3.3–3.4), fine-tune với hard negative (chưa làm).</p>`,
ex: [["Cơ bản", "Vì sao vector đoạn được tính trước còn vector câu hỏi tính lúc chạy?", "Kho cố định nên mã hóa một lần; câu hỏi chỉ biết khi người dùng gõ. Đây là ưu điểm tốc độ của bi-encoder so với cross-encoder (bài 3.5)."],
     ["Vận dụng", "q = (1, 1), a = (3, 0), b = (1, 1). Xếp hạng theo dot và theo cosine.", "Dot: a = 3, b = 2 → a trước. Cosine: a = 3/(1,414·3) = 0,707; b = 2/(1,414·1,414) = 1 → b trước."],
     ["Project", "Nếu đổi similarity sang cosine (chuẩn hóa vector) mà không huấn luyện lại, điều gì có thể xảy ra?", "Thứ tự có thể đổi vì vector đoạn có độ dài khác nhau và mô hình học bằng dot. Ghi chú đo thêm (không có trong tệp project): rerank top-100 bằng cosine trên tập chọn không khác biệt đáng kể, nhưng project giữ dot đúng như cách huấn luyện."]]});

P({id: "l2-select", grp: "Chương 2 – Pipeline", g: S2, n: "2.4", title: "Chọn ứng viên và tổng hợp nhiều đoạn", level: 1,
pre: `${conn([["l2-arch", "2.1 Select, Aggregate"], ["l1-reader", "1.7 điểm span, [CLS]"]])}`,
theory: `${H3("Chọn ứng viên (candidate selection)")}<p>Giữa retriever và reader là một bước cắt: chỉ k đoạn đầu được đọc. k lớn tăng khả năng có đoạn đúng (recall) nhưng tốn thời gian và thêm nhiễu cho reader; k nhỏ thì ngược lại. Không có công thức đóng; phải đo đánh đổi trên dev.</p>
${H3("Tổng hợp nhiều đoạn")}<p>Reader đọc mỗi đoạn riêng và trả một span + điểm. Câu trả lời cuối là span có điểm cao nhất (<b>argmax</b>). Vấn đề: điểm này có <b>so sánh được</b> giữa các đoạn không?</p>
${terms([["Chuẩn hóa cục bộ", "softmax trong từng cửa sổ: xác suất chỉ có nghĩa trong cửa sổ đó. Đoạn dễ (mọi token điểm thấp) và đoạn khó không cùng mốc."], ["Chuẩn hóa toàn cục", "softmax trên mọi token của mọi đoạn cùng câu hỏi (Multi-passage BERT, Wang et al., 2019): điểm so sánh được nhưng phải huấn luyện theo cách đó."], ["Trừ điểm 'không có đáp án'", "lấy điểm span trừ điểm [CLS] của chính cửa sổ: xấp xỉ rẻ để đưa các cửa sổ về một mốc."]])}
${H3("Bất biến")}<p>Một <b>bất biến</b> là điều kiện luôn phải đúng; vi phạm nghĩa là có lỗi lập trình. Với QA trích xuất: văn bản tại [start, end) phải đúng bằng đáp án trả về.</p>`,
practice: `<p><b>Bài toán:</b> hai đoạn, điểm span và điểm [CLS] của cửa sổ chứa span.</p>
${table(["Đoạn", "Điểm span (s+e)", "Điểm [CLS]", "minus_cls"], [["P1", "6,0", "5,5", "0,5"], ["P2", "4,0", "0,5", "3,5"]], {num: 1})}
${steps(["Chọn theo điểm thô: P1 (6,0 > 4,0).", "Nhưng ở P1, chính mô hình cũng tin mạnh 'không có đáp án' (CLS 5,5): span chỉ nhỉnh hơn một chút.", "Chọn theo minus_cls: P2 (3,5 > 0,5) vì mô hình tin có đáp án ở P2 hơn hẳn mức nền."])}`,

P({id: "l3-rrf", grp: "Chương 3 – Improvements", g: S3, n: "3.4", title: "Reciprocal Rank Fusion", level: 1,
pre: `${conn([["l3-hybrid", "3.3 vấn đề thang điểm"]])}`,
theory: `${H3("Định nghĩa")}<p><b>RRF</b> (Cormack et al., 2009) hợp nhất nhiều danh sách xếp hạng chỉ bằng thứ hạng.</p>
${F(`RRF(<i>d</i>) = Σ<sub><i>r</i> ∈ <i>R</i></sub> ${frac("<i>w<sub>r</sub></i>", "<i>c</i> + rank<sub><i>r</i></sub>(<i>d</i>)")}`)}

${H3("Vai trò của c")}<p>Tỉ lệ điểm hạng 1 so với hạng 10 là (c + 10)/(c + 1). Với c = 10: 20/11 = <b>1,82</b> lần; với c = 60: 70/61 = <b>1,15</b> lần. c nhỏ ưu tiên mạnh các hạng đầu; c lớn làm phẳng, coi trọng việc được nhiều nhánh cùng nhắc tới.</p>

  ["H0 − B1", "+0,210 [0,192; 0,230]", "+0,041 [0,027; 0,057]", "+0,067 [0,051; 0,084]", "HB: hybrid hơn dense"],
  ["H1 − H0", "+0,050 [0,040; 0,060]", "−0,011 [−0,022; −0,001]", "−0,022 [−0,035; −0,009]", "rerank tăng thứ hạng, EM giảm có ý nghĩa"]], {src: "results/final_test_matrix.json (paired)"})}
<div class="note">Kết luận cấu hình: <b>H0 mặc định</b> (configs/api.yaml: default_retriever hybrid, reranker null). H1 bật khi cần thứ tự đoạn bằng chứng tốt nhất, chấp nhận chậm khoảng 5 lần.</div>`, after: () => {
  if (!window.Chart) { $("#ch1").parentElement.innerHTML = "<p class='src'>Không tải được Chart.js; xem bảng bên dưới.</p>"; $("#ch2").parentElement.remove(); return; }
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const ink = v("--muted"), grid = v("--line");
  Chart.defaults.font.family = v("--f-body"); Chart.defaults.color = ink;
  const base = {responsive: true, maintainAspectRatio: false, plugins: {legend: {position: "top", labels: {boxWidth: 12, color: v("--fg")}}, tooltip: {callbacks: {label: c => `${c.dataset.label}: ${fmt(c.parsed.y ?? c.parsed.x, 3)}`}}}};
  const ds = (l, d, c) => ({label: l, data: d, backgroundColor: c, borderRadius: 4, borderSkipped: "bottom", maxBarThickness: 34});
  window._c1 && window._c1.destroy(); window._c2 && window._c2.destroy();
  window._c1 = new Chart($("#ch1"), {type: "bar", data: {labels: ["B0", "B1", "H0", "H1"], datasets: [ds("Hit@5", [.793, .709, .919, .969], v("--c1")), ds("EM first_ref", [.222, .220, .261, .250], v("--c2")), ds("EM all_refs", [.330, .316, .383, .361], v("--c3"))]},
    options: {...base, scales: {y: {min: 0, max: 1, grid: {color: grid}, ticks: {color: ink}}, x: {grid: {display: false}, ticks: {color: v("--fg")}}}}});
  window._c2 = new Chart($("#ch2"), {type: "bar", data: {labels: ["B0", "B1", "H0", "H1"], datasets: [ds("p50 tổng (ms)", [63.8, 116.1, 141.9, 743.6], v("--c1"))]},
    options: {...base, indexAxis: "y", plugins: {...base.plugins, legend: {display: false}, tooltip: {callbacks: {label: c => `p50: ${fmt(c.parsed.x, 1)} ms`}}}, scales: {x: {grid: {color: grid}, ticks: {color: ink}}, y: {grid: {display: false}, ticks: {color: v("--fg")}}}}});
}});

/* ================= render ================= */
const LEVEL = [["lv0", "nền tảng"], ["lv1", "nâng cao"], ["lv2", "tham khảo"]];
const store = {get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
let seen = new Set(store.get("gqa3-seen", [])), done = new Set(store.get("gqa3-done", []));
let viewMode = store.get("gqa3-mode", "both");

function renderLesson(p) {
  const k = {g1: "k1", g2: "k2", g3: "k3"}[p.g], st = {g1: "st1", g2: "st2", g3: "st3"}[p.g];
  const lv = LEVEL[p.level || 0];
  const sec = (n, title, body, cls = "") => `<section class="part ${k} ${cls}" id="m${n}"><div class="lbl"><b>MỤC ${n}</b><span>${title}</span></div>${body}</section>`;
  const exs = (p.ex || []).map(([lvl, q, a], i) => `<div class="exq"><div class="exh"><span class="tag ${lvl === "Project" ? "new" : lvl === "Vận dụng" ? "ext" : "p1"}">${lvl}</span></div><p>${q}</p>
    <textarea id="ans-${p.id}-${i}" rows="2" placeholder="Viết lời giải của bạn trước khi mở đáp án…" aria-label="Lời giải bài ${i + 1}"></textarea>
    <details class="sol"><summary>Xem lời giải</summary><div>${a}</div></details></div>`).join("");
  return `<div class="eyebrow ${st}">${esc(p.grp)} · Bài ${p.n}</div><h1>${esc(p.title)}</h1>
  <div class="tags"><span class="tag ${lv[0]}">${lv[1]}</span></div>
  <div class="modebar" role="group" aria-label="Chế độ xem"><span>Xem:</span>
    <button class="btn ${viewMode === "both" ? "on" : ""}" data-mode="both">Cả hai phần</button>
    <button class="btn ${viewMode === "theory" ? "on" : ""}" data-mode="theory">Chỉ lý thuyết (A)</button>
    <button class="btn ${viewMode === "project" ? "on" : ""}" data-mode="project">Chỉ project (B)</button></div>
  <nav class="toc-in">${[["m1", "1 Tiên quyết"], ["m2", "2 Lý thuyết"], ["m3", "3 Thực hành"], ["m4", "4 Liên hệ"], ["m5", "5 Triển khai"], ["m6", "6 Đánh giá"], ["m7", "7 Bài tập"]].map(([a, t]) => `<button class="lnk" data-jump="${a}">${t}</button>`).join("")}</nav>
  <div class="partA"><div class="phead pa"><b>PHẦN A · LÝ THUYẾT</b><span>đọc độc lập, không cần project</span></div>
  ${sec(1, "Kiến thức tiên quyết", p.pre)}${sec(2, "Lý thuyết chi tiết", p.theory)}${sec(3, "Ví dụ thực hành độc lập", p.practice)}</div>
  <div class="partB"><div class="phead pb"><b>PHẦN B · ÁP DỤNG VÀO PROJECT</b><span>vì sao và bằng cách nào project dùng kiến thức này</span></div>
  ${sec(4, "Liên hệ với project", p.project)}${sec(5, "Phân tích triển khai", p.impl)}${sec(6, "Đánh giá và mở rộng", p.eval)}</div>
  ${sec(7, "Bài tập tự học", `<p class="src">Tự làm trước, rồi mới mở lời giải. Ghi chú được lưu trên trình duyệt này.</p>${exs}`)}
  <div class="donebar"><button class="btn ${done.has(p.id) ? "on" : ""}" id="doneBtn">${done.has(p.id) ? "✓ Đã học xong bài này" : "Đánh dấu đã học xong"}</button></div>`;
}
function applyMode() {
  document.body.classList.toggle("only-theory", viewMode === "theory");
  document.body.classList.toggle("only-project", viewMode === "project");
}
function toc(cur) {
  let html = "", g = null;
  for (const p of PAGES) {
    if (p.grp !== g) { g = p.grp; html += `<div class="grp ${p.g || ""}">${esc(g)}</div>`; }
    html += `<a class="it ${p.id === cur ? "on" : ""} ${done.has(p.id) ? "done" : seen.has(p.id) ? "seen" : ""}" href="#${p.id}"><span class="n">${p.n}</span><span>${esc(p.title)}</span></a>`;
  }
  $("#toc").innerHTML = html;
  const lessons = PAGES.filter(p => p.theory).length, nd = PAGES.filter(p => p.theory && done.has(p.id)).length;
  $("#progtxt").textContent = `${nd}/${lessons} bài đã học xong`;
  $("#progbar").style.width = (100 * nd / lessons) + "%";
}
function initExtra() {
  // mô phỏng bootstrap
  const bw = $("#bootw");
  if (bw) $("#bgo", bw).onclick = () => {
    const n = +$("#bn", bw).value, pr = +$("#bp", bw).value; let seed = 42;
    const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const x = Array.from({length: n}, () => rnd() < pr ? 1 : 0), m = x.reduce((a, b) => a + b, 0) / n;
    const bs = []; for (let b = 0; b < 1000; b++) { let s = 0; for (let i = 0; i < n; i++) s += x[Math.floor(rnd() * n)]; bs.push(s / n); }
    bs.sort((a, b) => a - b);
    $("#bout", bw).innerHTML = `Mẫu n = ${n}: trung bình <b>${fmt(m, 3)}</b>, CI 95% = [<b>${fmt(bs[24], 3)}</b>; <b>${fmt(bs[974], 3)}</b>], độ rộng ${fmt(bs[974] - bs[24], 3)}.`;
  };
  // mô phỏng lời nguyền người thắng
  const ww = $("#wcw");
  if (ww) $("#wcgo", ww).onclick = () => {
    const K = +$("#wck", ww).value; let seed = 7;
    const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    let tot = 0; for (let r = 0; r < 500; r++) { let best = 0; for (let k = 0; k < K; k++) { let s = 0; for (let i = 0; i < 200; i++) s += rnd() < 0.5 ? 1 : 0; best = Math.max(best, s / 200); } tot += best; }
    $("#wcout", ww).innerHTML = `Chọn cái tốt nhất trong <b>${K}</b> cấu hình: điểm của người thắng trung bình <b>${fmt(tot / 500, 3)}</b> (thật: 0,500). Phồng thêm <b>${fmt(tot / 500 - 0.5, 3)}</b>.`;
  };
}
function show() {
  const id = (location.hash || "#overview").slice(1);
  const i = Math.max(0, PAGES.findIndex(p => p.id === id)), p = PAGES[i];
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  $("#page").innerHTML = (p.render ? p.render() : renderLesson(p)) +
    `<div class="navbtns">${prev ? `<a href="#${prev.id}"><small>← Trước</small>${esc(prev.n + " · " + prev.title)}</a>` : "<span></span>"}${next ? `<a class="nx" href="#${next.id}"><small>Tiếp →</small>${esc(next.n + " · " + next.title)}</a>` : "<span></span>"}</div>`;
  if (p.after) p.after();
  if (!p.render) {
    document.querySelectorAll(".modebar .btn").forEach(b => b.onclick = () => { viewMode = b.dataset.mode; store.set("gqa3-mode", viewMode); applyMode();
      document.querySelectorAll(".modebar .btn").forEach(x => x.classList.toggle("on", x.dataset.mode === viewMode)); });
    document.querySelectorAll(".toc-in .lnk").forEach(b => b.onclick = () => { const t = document.getElementById(b.dataset.jump); if (t) t.scrollIntoView({behavior: "smooth", block: "start"}); });
    document.querySelectorAll(".exq textarea").forEach(t => { t.value = store.get("gqa3-" + t.id, ""); t.oninput = () => store.set("gqa3-" + t.id, t.value); });
    $("#doneBtn").onclick = () => { done.has(p.id) ? done.delete(p.id) : done.add(p.id); store.set("gqa3-done", [...done]);
      $("#doneBtn").classList.toggle("on", done.has(p.id)); $("#doneBtn").textContent = done.has(p.id) ? "✓ Đã học xong bài này" : "Đánh dấu đã học xong"; toc(p.id); };
  }
  initExtra(); applyMode();
  seen.add(p.id); store.set("gqa3-seen", [...seen]);
  toc(p.id); window.scrollTo(0, 0);
  $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
}
window.addEventListener("hashchange", show);
document.addEventListener("keydown", e => {
  if (e.target.closest("input,select,textarea")) return;
  const id = (location.hash || "#overview").slice(1), i = PAGES.findIndex(p => p.id === id);
  if (e.key === "ArrowRight" && PAGES[i + 1]) location.hash = PAGES[i + 1].id;
  if (e.key === "ArrowLeft" && i > 0) location.hash = PAGES[i - 1].id;
});
$("#menuBtn").onclick = () => { const o = $("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(o)); };
show();
</script>
