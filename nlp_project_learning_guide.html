<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giáo trình GermanQA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --side:#eef0f4; --line:#d9dde4; --ink:#1f2933; --muted:#5b6675; --accent:#2457d6; --accent-soft:#e6edff;
  --ok:#1a8a4a; --warn:#b7791f; --bad:#c0392b; --info:#2b6cb0;
  --ed-bg:#10172a; --ed-bg2:#162038; --ed-ink:#d6deeb; --ed-num:#56647e; --ed-line:#243252; --ed-act:#2a3f73; --ed-cov0:#3b82f6; --ed-cov1:#a78bfa;
  --fs:13px; --wSide:290px; --wRight:520px;
  --mono:"Cascadia Mono",Consolas,"JetBrains Mono","Liberation Mono",ui-monospace,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);display:flex;flex-direction:column;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
code,kbd,pre{font-family:var(--mono);font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
a{color:var(--accent)}

/* ---------- top bar ---------- */
#top{min-height:50px;flex:none;display:flex;align-items:center;gap:10px;padding-block:6px;background:var(--bg);border-bottom:1px solid var(--line)}
#top .brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
#top .brand small{font-weight:500;color:var(--muted);margin-left:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:13px;line-height:1.2;white-space:nowrap}
.btn:hover{background:#f1f4fa;border-color:#c3cad6}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#1c47b3}
#nowlabel{font-size:13px;color:var(--muted);max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .grow{flex:1}
#searchwrap{position:relative;width:min(340px,28vw)}
#q{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 10px 6px 28px;font-size:13px;background:#f7f8fa}
#q:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);background:#fff}
#searchwrap:before{content:"⌕";position:absolute;left:9px;top:3px;color:var(--muted);font-size:17px}
#results{position:absolute;top:36px;left:0;right:-60px;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(15,23,42,.18);z-index:50;display:none}
#results .it{padding:7px 12px;border-bottom:1px solid #eef0f3;cursor:pointer;display:block}
#results .it:last-child{border-bottom:0}
#results .it.sel,#results .it:hover{background:var(--accent-soft)}
#results .it b{font-weight:600}
#results .it span{display:block;font-size:12px;color:var(--muted)}
#results .tp{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;background:#e8ebf0;color:#475066;border-radius:4px;padding:0 5px;margin-right:6px}
#results .none{padding:12px;color:var(--muted)}

/* ---------- layout ---------- */
#main{flex:1;min-height:0;display:flex}
#side{width:var(--wSide);flex:none;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:12px 10px 30px}
.gut{width:6px;flex:none;cursor:col-resize;background:transparent;position:relative}
.gut:hover,.gut.drag{background:var(--accent-soft)}
.gut:after{content:"";position:absolute;left:2px;top:0;bottom:0;width:1px;background:var(--line)}
#work{flex:1;min-width:0;display:flex}
#editor{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--ed-bg)}
#right{width:var(--wRight);flex:none;display:flex;flex-direction:column;background:var(--panel);min-width:0}
#doc{flex:1;min-width:0;overflow:auto;background:var(--panel);display:none}
body.docmode #work,body.docmode #g2x{display:none}
body.docmode #doc{display:block}
body.rcollapsed #right,body.rcollapsed #g2{display:none}
body.rwide #right{width:62%}

/* ---------- sidebar ---------- */
.prog{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:12px}
.prog .bar{height:7px;border-radius:5px;background:#e3e7ee;overflow:hidden;margin:6px 0 4px}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6bff,#1a8a4a);width:0;transition:width .3s}
.prog small{color:var(--muted)}
.sec{margin:14px 4px 5px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#6a7486}
.nav{display:flex;align-items:center;gap:7px;width:100%;border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:6px;font-size:13px;color:#2a3342}
.nav:hover{background:#e1e5ee}
.nav.cur{background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(15,23,42,.08);font-weight:600}
.nav .lab{flex:1;min-width:0}
.nav .lab small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.dot{flex:none;width:15px;height:15px;border-radius:50%;border:2px solid #b3bccb;background:#fff;padding:0;position:relative}
.dot.dang{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,#fff 50%)}
.dot.xong{border-color:var(--ok);background:var(--ok)}
.dot.xong:after{content:"✓";position:absolute;inset:-3px 0 0 0;color:#fff;font-size:10px;line-height:15px;text-align:center}
.num{flex:none;width:22px;font:600 11px var(--mono);color:#6a7486}
.fl{padding:3px 8px 3px 14px;font-size:12px;border-radius:5px;display:flex;gap:6px;cursor:pointer;color:#334}
.fl:hover{background:#e1e5ee}
.fl code{font-size:11.5px}
.fl em{font-style:normal;color:var(--muted);font-size:11px;margin-left:auto}
.fgroup{margin:6px 4px 1px;font-size:11px;color:#6a7486;font-weight:600}

/* ---------- editor ---------- */
#etabs{display:flex;gap:2px;padding:6px 8px 0;background:#0b1122;overflow-x:auto;flex:none}
.etab{border:0;background:#161f38;color:#9fb0d0;padding:6px 12px;border-radius:7px 7px 0 0;font:12.5px var(--mono);white-space:nowrap}
.etab:hover{background:#1c2748}
.etab.on{background:var(--ed-bg);color:#fff;box-shadow:inset 0 2px 0 var(--ed-cov0)}
.etab i{font-style:normal;font-size:10px;margin-left:7px;padding:1px 5px;border-radius:4px;background:#25314f;color:#b6c4e2}
.etab i.imp{background:#4b3b11;color:#ffd98a}
#ehead{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--ed-bg2);border-bottom:1px solid var(--ed-line);color:#aab7d4;font-size:12px;flex:none;flex-wrap:wrap}
#ehead .path{font-family:var(--mono);color:#e5ecfb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
#ehead .sp{flex:1}
#ehead .btn{background:#1c2748;color:#d6e0f7;border-color:#2c3b63;padding:3px 9px;font-size:12px}
#ehead .btn:hover{background:#25345f}
#ehead label{display:flex;gap:4px;align-items:center;cursor:pointer}
#code{flex:1;overflow:auto;padding:6px 0 40px;font:var(--fs)/1.55 var(--mono);font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;color:var(--ed-ink);outline:none;tab-size:4}
#code.wrap .cd{white-space:pre-wrap;word-break:break-word}
.ln{display:flex;min-width:max-content}
#code.wrap .ln{min-width:0}
.ln .gn{flex:none;width:46px;text-align:right;padding-right:10px;color:var(--ed-num);user-select:none;-webkit-user-select:none}
.ln .gm{flex:none;width:4px;margin-right:10px}
.ln.c0 .gm{background:var(--ed-cov0);opacity:.35}
.ln.c1 .gm{background:var(--ed-cov1);opacity:.35}
.ln.act{background:var(--ed-act)}
.ln.act .gm{opacity:1}
.ln.act .gn{color:#cfe0ff}
.ln:hover{background:rgba(255,255,255,.04)}
.ln.act:hover{background:var(--ed-act)}
.cd{white-space:pre;padding-right:24px;flex:1}
.t-k{color:#c792ea}.t-s{color:#ecc48d}.t-c{color:#6b7a99;font-style:italic}.t-n{color:#f78c6c}.t-f{color:#82aaff}.t-b{color:#7fdbca}.t-d{color:#ffcb6b}.t-p{color:#89ddff}.t-y{color:#addb67}.t-t{color:#ffcb8b}
#ecap{padding:6px 12px;background:var(--ed-bg2);border-top:1px solid var(--ed-line);color:#93a3c4;font-size:12px;flex:none;display:flex;gap:10px;align-items:center}
#ecap b{color:#dbe6ff;font-weight:600}

/* ---------- right panel ---------- */
#rtabs{display:flex;flex-wrap:wrap;gap:0 2px;padding:4px 8px 0;border-bottom:1px solid var(--line);background:#f7f8fa;flex:none;align-items:flex-end}
.rtab{border:0;background:transparent;padding:7px 11px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.rtab:hover{color:var(--ink)}
.rtab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#rtabs .sp{flex:1}
#rtabs .btn{padding:2px 8px;font-size:12px;margin-bottom:4px}
#rbody{flex:1;overflow:auto;padding:14px 18px 60px}
#rbody h3{margin:20px 0 6px;font-size:15px}
#rbody h4{margin:14px 0 4px;font-size:13.5px}
#rbody>:first-child{margin-top:0}

/* ---------- prose ---------- */
.prose p{margin:8px 0}
.prose ul,.prose ol{margin:6px 0 10px;padding-left:22px}
.prose li{margin:3px 0}
.prose code,.nbody code{background:#eef1f6;border:1px solid #e1e5ec;border-radius:4px;padding:0 4px;font-size:12.3px}
.prose pre.blk{background:var(--ed-bg);color:var(--ed-ink);border-radius:8px;padding:10px 12px;overflow:auto;font-size:12.3px;line-height:1.5;margin:8px 0}
.prose pre.blk code{background:transparent;border:0;padding:0;font-size:inherit}
.math{background:#f6f8ff;border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font:13px/1.6 var(--mono);overflow:auto;white-space:pre-wrap}
.prose table,.tbl{border-collapse:collapse;margin:8px 0;font-size:12.8px;width:100%}
.prose th,.prose td,.tbl th,.tbl td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.prose th,.tbl th{background:#f1f3f7}
.co{border-left:4px solid var(--info);background:#eef5ff;border-radius:0 6px 6px 0;padding:7px 11px;margin:9px 0}
.co.tip{border-color:var(--ok);background:#edf8f1}
.co.warn{border-color:var(--warn);background:#fff7e6}
.co.bug{border-color:var(--bad);background:#fdeeec}
.co b.h{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:1px;opacity:.75}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:8px 0 14px}
.kv dt{font-weight:600;color:#3a4558;font-size:12.5px}
.kv dd{margin:0}

/* ---------- note cards ---------- */
.ncard{border:1px solid var(--line);border-radius:9px;margin:0 0 10px;background:#fff}
.ncard .nh{display:flex;gap:8px;align-items:baseline;padding:8px 11px;cursor:pointer;border-radius:9px}
.ncard .nh:hover{background:#f5f7fb}
.ncard .nn{font:600 11px var(--mono);color:#fff;background:var(--accent);border-radius:10px;padding:1px 7px;flex:none}
.ncard:nth-child(even) .nn{background:#7c5cd6}
.ncard .nt{font-weight:600;flex:1}
.ncard .nr{font:11px var(--mono);color:var(--muted);flex:none}
.ncard .nbody{display:none;padding:2px 14px 12px;border-top:1px solid #eef0f4}
.ncard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ncard.on .nbody{display:block}
.nbody .nact{display:flex;gap:6px;margin:6px 0 2px}
.nbody .nact .btn{font-size:11.5px;padding:2px 8px}
.ctx{background:#fffbe8;border:1px solid #f0e2a6;border-radius:8px;padding:8px 11px;margin:0 0 12px;font-size:13px}
.sel-hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}

/* ---------- doc pages ---------- */
.docin{max-width:1080px;margin:0 auto;padding:26px 34px 80px}
.docin h1{font-size:25px;margin:0 0 4px}
.docin h2{font-size:19px;margin:30px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
.docin h2:first-of-type{border-top:0}
.docin h3{font-size:15.5px;margin:18px 0 4px}
.docin .lead{color:var(--muted);font-size:15px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:10px 0}
.card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcfe}
.card b{display:block;margin-bottom:2px}
.card a,.linkbtn{cursor:pointer;color:var(--accent);text-decoration:underline;background:none;border:0;padding:0;font:inherit}
svg.dg{width:100%;height:auto;display:block;margin:10px 0;background:#fbfcfe;border:1px solid var(--line);border-radius:10px}
svg.dg text{font:12px var(--sans);fill:#1f2933}
svg.dg .bx{fill:#e8efff;stroke:#7b9cf0;stroke-width:1.2}
svg.dg .bx.g{fill:#e6f5ec;stroke:#6cc08f}
svg.dg .bx.o{fill:#fff1dd;stroke:#e5ae5d}
svg.dg .bx.p{fill:#efe9fb;stroke:#a58ee0}
svg.dg .bx.r{fill:#fdecea;stroke:#e08f86}
svg.dg .bx.n{fill:#f1f3f6;stroke:#b7bfcc}
svg.dg .sub{font-size:10.5px;fill:#586274}
svg.dg .ttl{font-weight:700;font-size:13px}
svg.dg line,svg.dg path.ar{stroke:#6b7686;stroke-width:1.4;fill:none}
svg.dg .lbl{font-size:10.5px;fill:#566}
details.mm{margin:6px 0}
details.mm summary{cursor:pointer;color:var(--accent)}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;background:#e8ebf0;color:#445;margin-right:4px}
.tag.gd{background:#e6edff;color:#2457d6}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111a30;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
#toast.on{opacity:1}
@media (max-width:820px){
  body{overflow:auto;height:auto;min-height:100%}
  #top{flex-wrap:wrap}
  #nowlabel,#bwide{display:none}
  #searchwrap{width:100%;order:9}
  #results{right:0}
  #main{flex-direction:column;min-height:0}
  .gut{display:none}
  #side{width:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}
  #work{flex-direction:column}
  #editor{min-height:60vh}
  #right{width:auto;min-height:60vh}
  body.rwide #right{width:auto}
  .docin{padding:18px 4px 60px}
  .kv{grid-template-columns:1fr}
}
#selftest{position:fixed;left:0;top:0;background:#fff;color:#000;z-index:999;display:none;font:11px var(--mono);white-space:pre}
</style>
</head>
<body>
<header id="top">
  <div class="brand">GermanQA<small>giáo trình tương tác</small></div>
  <button class="btn" id="prev" title="Giai đoạn trước ( [ )">◀ Trước</button>
  <button class="btn pri" id="next" title="Giai đoạn kế tiếp ( ] )">Tiếp ▶</button>
  <div id="nowlabel"></div>
  <div class="grow"></div>
  <div id="searchwrap">
    <input id="q" type="search" placeholder="Tìm hàm, class, từ khóa…  ( / )" autocomplete="off" spellcheck="false">
    <div id="results"></div>
  </div>
  <button class="btn" id="bwide" title="Mở rộng phần giải thích">⤢ Rộng</button>
  <button class="btn" id="bhide" title="Thu gọn / hiện phần giải thích">◨ Giải thích</button>
</header>
<div id="main">
  <aside id="side"></aside>
  <div class="gut" id="g1" title="Kéo để đổi độ rộng"></div>
  <div id="work">
    <section id="editor">
      <div id="etabs"></div>
      <div id="ehead"></div>
      <div id="code" tabindex="0"></div>
      <div id="ecap"></div>
    </section>
    <div class="gut" id="g2" title="Kéo để đổi độ rộng"></div>
    <section id="right">
      <div id="rtabs"></div>
      <div id="rbody" class="prose"></div>
    </section>
  </div>
  <section id="doc"><div class="docin prose" id="docin"></div></section>
</div>
<div id="toast"></div>
<pre id="selftest"></pre>
<script id="data" type="application/json">{"stages": [{"id": "s0", "num": 0, "title": "Khung dự án & hợp đồng dữ liệu", "gd": "GĐ0 · nền tảng", "files": [{"path": "pyproject.toml", "name": "pyproject.toml", "kind": "orig", "lang": "text", "source": "[build-system]\nrequires = [\"setuptools>=68\"]\nbuild-backend = \"setuptools.build_meta\"\n\n[project]\nname = \"germanqa\"\nversion = \"0.1.0\"\nrequires-python = \">=3.10\"\n\n[tool.setuptools.packages.find]\nwhere = [\"src\"]", "notes": [{"a": 1, "b": 3, "title": "Công cụ đóng gói", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nói cho <code>pip<\/code> biết dùng <code>setuptools<\/code> để dựng package.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Không có khối này <code>pip install -e .<\/code> không biết cách cài. Một khai báo, mọi môi trường (laptop, Colab, Docker) cài giống nhau.<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Mỗi script phải tự chèn <code>sys.path<\/code>, và <code>from germanqa.x import y<\/code> chỉ chạy khi đứng đúng thư mục.<\/p><\/dd><\/dl>"}, {"a": 5, "b": 8, "title": "Tên, phiên bản, Python tối thiểu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Package tên <code>germanqa<\/code>, phiên bản 0.1.0, cần Python ≥ 3.10.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Code dùng cú pháp và thư viện hiện đại (ví dụ kiểu <code>Optional<\/code>, dataclass <code>frozen<\/code>); đặt mức tối thiểu để lỗi báo sớm.<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Khối <code>[project]<\/code> <strong>không<\/strong> có <code>dependencies<\/code>; thư viện nằm riêng ở <code>requirements.txt<\/code>. Cách này chạy được nhưng <code>pip install -e .<\/code> không kéo thư viện về. Đề xuất cải tiến (không có trong project): khai báo <code>dependencies<\/code> ở đây.<\/p><\/dd><\/dl>"}, {"a": 10, "b": 11, "title": "Bố cục `src/`", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chỉ tìm package trong thư mục <code>src/<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Bố cục <code>src/<\/code> ngăn việc vô tình import code từ thư mục hiện tại thay vì bản đã cài: lỗi đóng gói bị lộ sớm hơn.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>src/germanqa.egg-info/<\/code> trong project là dấu vết của lần cài editable này.<\/p><\/dd><\/dl>"}], "intro": "<p>Khai báo <code>germanqa<\/code> là một package Python nằm trong <code>src/<\/code>. Sau <code>pip install -e .<\/code> mọi file (script, test, notebook, API) đều <code>import germanqa...<\/code> giống nhau.<\/p>"}, {"path": "requirements.txt", "name": "requirements.txt", "kind": "orig", "lang": "text", "source": "datasets        # tải dataset từ Hugging Face Hub\nhuggingface_hub # lấy commit hash (revision) của dataset\npandas\nnumpy\nmatplotlib\ntransformers    # dùng ở Bước 4 để đếm token\npyyaml          # (tuỳ chọn) nếu muốn đưa config ra YAML\npytest          # chạy tests/\ntorch \nfaiss-cpu       # chỉ mục tìm kiếm vector cho dense retriever (GĐ6)\nfastapi\nuvicorn\nhttpx\npsutil", "notes": [{"a": 1, "b": 2, "title": "Dữ liệu từ Hugging Face", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>datasets<\/code> tải GermanQuAD/GermanDPR; <code>huggingface_hub<\/code> lấy mã commit (SHA) của dataset và tải checkpoint.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dùng ở <code>data/download.py<\/code> (GĐ1) và <code>reader/model_io.py<\/code> (GĐ4).<\/p><\/dd><\/dl>"}, {"a": 3, "b": 6, "title": "Phân tích và mô hình", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>pandas<\/code>, <code>matplotlib<\/code> cho EDA; <code>transformers<\/code> + <code>torch<\/code> cho reader, DPR, reranker.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>torch<\/code> chỉ được import khi thật sự dựng mô hình (xem <code>pipeline.build_pipeline<\/code>).<\/p><\/dd><\/dl>"}, {"a": 7, "b": 8, "title": "Cấu hình và test", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>pyyaml<\/code> đọc <code>configs/*.yaml<\/code>; <code>pytest<\/code> chạy <code>tests/<\/code>.<\/p><\/dd><\/dl>"}, {"a": 9, "b": 10, "title": "Deep learning và tìm kiếm vector", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>torch<\/code> cho huấn luyện/suy luận; <code>faiss-cpu<\/code> là chỉ mục vector cho dense retriever (GĐ6).<\/p><\/dd><\/dl>"}, {"a": 11, "b": 14, "title": "Dịch vụ web", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>fastapi<\/code> + <code>uvicorn<\/code> chạy API, <code>httpx<\/code> làm client kiểm thử, <code>psutil<\/code> đo bộ nhớ.<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Không ghim phiên bản (không có <code>==<\/code>). Hai máy cài ở hai thời điểm có thể ra hai bộ thư viện khác nhau. Project bù một phần bằng <code>experiment.environment_info()<\/code> ghi lại phiên bản thực tế vào mỗi file kết quả. Đề xuất cải tiến: sinh <code>requirements.lock<\/code> bằng <code>pip freeze<\/code>. <code>tokenizers<\/code> và <code>anyio<\/code> được kéo theo gián tiếp (qua <code>transformers<\/code>, <code>fastapi<\/code>).<\/p><\/dd><\/dl>"}], "intro": "<p>Danh sách thư viện chạy toàn bộ project. Mỗi dòng có chú thích lý do dùng.<\/p>"}, {"path": "src/germanqa/config.py", "name": "config.py", "kind": "orig", "lang": "python", "source": "from dataclasses import dataclass\nfrom pathlib import Path\n\n# ---------- Đường dẫn: tất cả tính từ gốc dự án, không viết cứng ổ đĩa ----------\nROOT = Path(__file__).resolve().parent.parent.parent\nRAW_DIR = ROOT / \"data\" / \"raw\"\nPROCESSED_DIR = ROOT / \"data\" / \"processed\"\nREPORT_DIR = ROOT / \"reports\"\nCONFIG_DIR = ROOT / \"configs\"\nRESULTS_DIR = ROOT / \"results\"\n\n# ---------- Hằng số thí nghiệm: đổi ở đây thì đổi cho cả dự án ----------\nSEED = 42          # R7: một seed duy nhất cho mọi phép ngẫu nhiên\nDEV_RATIO = 0.10   # R5: tách 10% train làm dev (theo nhóm)\n\n\n@dataclass(frozen=True)\nclass DatasetSpec:\n    repo_id: str\n    expected: dict\n\n\nDATASETS = {\n    \"germanquad\": DatasetSpec(\"deepset/germanquad\", {\"train\": 11518, \"test\": 2204}),\n    \"germandpr\":  DatasetSpec(\"deepset/germandpr\",  {\"train\": 9275,  \"test\": 1025}),\n}", "notes": [{"a": 5, "b": 10, "title": "Đường dẫn tính từ gốc dự án", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>ROOT<\/code> là thư mục gốc, suy ra từ vị trí file: <code>config.py<\/code> nằm ở <code>src/germanqa/<\/code> nên đi lên 3 cấp (<code>parent<\/code> ×3). Các thư mục con còn lại ghép từ <code>ROOT<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Không viết cứng <code>D:\\Project\\...<\/code>. Chạy trên Colab, Docker, máy bạn khác vẫn đúng.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: không có. Ra: các đối tượng <code>Path<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>PROCESSED_DIR<\/code> dùng ở GĐ2–5, <code>RAW_DIR<\/code> ở GĐ1–2, <code>RESULTS_DIR<\/code> ở <code>experiment.save_run<\/code>, <code>CONFIG_DIR<\/code> ở <code>load_config<\/code>.<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Mỗi script tự đoán đường dẫn: đổi máy là hỏng, hoặc ghi kết quả vào sai chỗ.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Dời <code>config.py<\/code> sang thư mục có độ sâu khác thì số lần <code>.parent<\/code> phải đổi theo, nếu không <code>ROOT<\/code> sai mà không báo lỗi.<\/p><\/dd><\/dl>"}, {"a": 13, "b": 14, "title": "Hằng số thí nghiệm dùng chung", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>SEED<\/code> là hạt giống ngẫu nhiên duy nhất; <code>DEV_RATIO<\/code> là tỷ lệ tách dev từ train (10%).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Nguyên tắc R7 của project: chỉ một seed cho mọi phép ngẫu nhiên, để chạy lại cho đúng kết quả cũ. Đổi ở đây là đổi cả dự án.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>SEED<\/code> dùng trong <code>split_train_dev<\/code> (GĐ2), <code>set_seed<\/code> (GĐ0), huấn luyện reader (GĐ4).<\/p><\/dd><\/dl>"}, {"a": 17, "b": 20, "title": "DatasetSpec: mô tả một dataset", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Một bản ghi bất biến (<code>frozen=True<\/code>) gồm <code>repo_id<\/code> trên Hugging Face và <code>expected<\/code> (số mẫu mong đợi mỗi split).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Giữ cấu hình dataset ở dạng có kiểu; <code>frozen<\/code> ngăn ai đó sửa giữa chừng khi chạy.<\/p><\/dd><dt>Cách khác<\/dt><dd><p>Dùng <code>dict<\/code> hoặc <code>NamedTuple<\/code>. <code>dataclass<\/code> cho phép thêm trường và kiểm tra tĩnh dễ hơn.<\/p><\/dd><\/dl>"}, {"a": 23, "b": 26, "title": "Hai dataset và số mẫu kỳ vọng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>GermanQuAD: train 11.518, test 2.204. GermanDPR: train 9.275, test 1.025.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Đây là số liệu đối chiếu ở bước tải (<code>download.count_check<\/code>): tải về mà số mẫu lệch thì phải biết ngay.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Các con số này được kiểm ở <code>reports/step1_count_check.csv<\/code>.<\/p><\/dd><\/dl>"}], "intro": "<p>Một nơi duy nhất giữ đường dẫn và hằng số thí nghiệm. Mọi module khác <code>import<\/code> từ đây, không tự viết đường dẫn.<\/p>"}, {"path": "src/germanqa/schemas.py", "name": "schemas.py", "kind": "orig", "lang": "python", "source": "\"\"\"Hợp đồng dữ liệu của dự án (GĐ0): mọi giai đoạn sau đọc/ghi đúng các dạng này.\n\nQuy ước offset: ký tự, nửa mở [start, end) trên original_text (chuỗi gốc chưa sửa).\n\"\"\"\nfrom dataclasses import dataclass, field, asdict\nfrom typing import List, Optional\n\n\n@dataclass\nclass Passage:\n    passage_id: str            # \"p_\" + 16 ký tự băm nội dung\n    original_text: str         # văn bản gốc, KHÔNG sửa (reader dùng để cắt đáp án)\n    retrieval_text: str        # bản đã làm sạch + chữ thường (BM25/dense dùng)\n    title: Optional[str]\n    document_id: str           # \"d_\" + băm tiêu đề (gom các đoạn cùng bài viết)\n    source: List[dict] = field(default_factory=list)   # provenance\n\n\n@dataclass\nclass Answer:\n    text: str\n    start: Optional[int]       # None nếu không xác định được vị trí (GermanDPR mơ hồ)\n\n\n@dataclass\nclass QAExample:\n    question_id: str           # \"q_\" + 16 ký tự băm câu hỏi đã chuẩn hóa\n    question: str\n    passage_id: str            # đoạn chứa đáp án\n    answers: List[Answer]\n    origin: str                # \"germanquad\" | \"germandpr\"\n\n\n@dataclass\nclass QAResponse:\n    \"\"\"Dạng phản hồi mà pipeline (GĐ5) và API (GĐ8) sẽ trả về.\"\"\"\n    question: str\n    answer: str\n    passage_id: str\n    passage_text: str\n    answer_start: int          # [start, end) trên passage_text gốc\n    answer_end: int\n    retrieval_score: float\n    reader_score: float\n    retrieval_time: float      # giây\n    reader_time: float\n    total_time: float\n    model_version: str\n    corpus_version: str\n    \n    experiment_id: str\n    status: str = \"ok\"         # \"ok\" | \"empty_question\" | \"no_passages\" | \"no_valid_span\" | \"question_truncated\"\n    trace: Optional[dict] = None   # vết từng bước (GĐ5); None khi không bật\n    rerank_time: float = 0.0               # giây (GĐ14); 0 khi không có reranker\n    rerank_score: Optional[float] = None   # logit liên quan của reranker cho đoạn được chọn; None khi không có reranker\n\n    def to_dict(self):\n        return asdict(self)\n\n\ndef to_utf16_offset(text, index):\n    \"\"\"Đổi vị trí ký tự Python (theo mã Unicode) sang vị trí UTF-16 mà JavaScript dùng.\n    Khác nhau khi có ký tự ngoài BMP (ví dụ emoji): Python tính 1, JavaScript tính 2.\"\"\"\n    return len(text[:index].encode(\"utf-16-le\")) // 2", "notes": [{"a": 10, "b": 16, "title": "Passage: một đoạn văn trong corpus", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Một đoạn văn: <code>passage_id<\/code> (băm nội dung), <code>original_text<\/code> (nguyên văn), <code>retrieval_text<\/code> (đã làm sạch + chữ thường), <code>title<\/code>, <code>document_id<\/code>, <code>source<\/code> (lịch sử xuất xứ).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Tách <strong>hai bản văn bản<\/strong>: <code>original_text<\/code> không bao giờ bị sửa vì reader cắt đáp án theo offset trên đúng bản này; <code>retrieval_text<\/code> chỉ để BM25/dense tìm.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Được ghi thành mỗi dòng của <code>data/processed/corpus.jsonl<\/code> (GĐ2).<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Nếu chỉ giữ một bản đã chuẩn hóa thì offset của đáp án (tính trên bản gốc) lệch, đáp án cắt sai.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p><code>passage_id<\/code> là <code>\"p_\"<\/code> + 16 ký tự băm nội dung nên <strong>hai đoạn giống hệt nhau cùng một ID<\/strong>: đây là cách khử trùng lặp.<\/p><\/dd><\/dl>"}, {"a": 20, "b": 22, "title": "Answer: đáp án và vị trí", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Văn bản đáp án và <code>start<\/code> (vị trí ký tự bắt đầu trên <code>original_text<\/code>).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p><code>start<\/code> có thể là <code>None<\/code> vì GermanDPR không có offset và đôi khi đáp án xuất hiện nhiều lần (mơ hồ).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Quy ước offset: ký tự, nửa mở <code>[start, end)<\/code>.<\/p><\/dd><\/dl>"}, {"a": 26, "b": 31, "title": "QAExample: một câu hỏi có nhãn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Câu hỏi, <code>question_id<\/code> (băm câu hỏi đã chuẩn hóa), <code>passage_id<\/code> đoạn chứa đáp án, danh sách <code>answers<\/code>, và <code>origin<\/code> (dataset gốc).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Mỗi dòng của <code>qa_train/dev/test.jsonl<\/code>.<\/p><\/dd><\/dl>"}, {"a": 35, "b": 55, "title": "QAResponse: phản hồi cuối cùng của hệ thống", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mọi thứ mà pipeline (GĐ5) và API (GĐ8) trả về: đáp án, đoạn nguồn, <code>answer_start/end<\/code>, điểm retrieval và reader, thời gian từng bước, phiên bản mô hình/corpus, <code>experiment_id<\/code>, <code>status<\/code>, và <code>trace<\/code> tùy chọn.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Mọi kết quả đều kèm <strong>phiên bản và mã thí nghiệm<\/strong> để truy vết. <code>status<\/code> cho biết vì sao rỗng (<code>empty_question<\/code>, <code>no_passages<\/code>, <code>no_valid_span<\/code>, <code>question_truncated<\/code>) thay vì ném lỗi.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Hai trường cuối <code>rerank_time<\/code>, <code>rerank_score<\/code> được thêm ở GĐ14 <strong>sau cùng và có giá trị mặc định<\/strong> để mã cũ vẫn chạy: nguyên tắc 'chỉ thêm trường, không đổi trường cũ'.<\/p><\/dd><\/dl>"}, {"a": 57, "b": 58, "title": "to_dict: chuyển thành dict", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dùng <code>dataclasses.asdict<\/code> để biến bản ghi thành dict, sẵn sàng đưa ra JSON.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>api/app.py<\/code> gọi <code>r.to_dict()<\/code> rồi bổ sung/loại bớt trường.<\/p><\/dd><\/dl>"}, {"a": 61, "b": 64, "title": "Đổi offset Python sang UTF-16", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Python đếm ký tự theo mã Unicode; JavaScript đếm theo đơn vị UTF-16. Hai cách chỉ lệch khi có ký tự ngoài BMP (ví dụ emoji: Python tính 1, JS tính 2). Hàm mã hóa phần văn bản trước vị trí <code>index<\/code> sang UTF-16 rồi đếm số đơn vị (2 byte mỗi đơn vị).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Frontend tô sáng đáp án bằng <code>String.slice<\/code> của JavaScript; nếu dùng thẳng offset Python, đáp án sau emoji bị tô lệch.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: văn bản + vị trí ký tự Python. Ra: vị trí theo UTF-16.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>API trả thêm <code>answer_start_utf16/answer_end_utf16<\/code>; <code>frontend/src/lib/highlight.ts<\/code> dùng chúng (GĐ15).<\/p><\/dd><\/dl>"}], "intro": "<p>Hợp đồng dữ liệu: các dạng bản ghi mà mọi giai đoạn sau phải đọc/ghi đúng. Viết trước để các giai đoạn không lệch nhau.<\/p>"}, {"path": "src/germanqa/data/io_utils.py", "name": "io_utils.py", "kind": "orig", "lang": "python", "source": "import hashlib\nimport json\nfrom pathlib import Path\n\n\ndef sha1_hex(text):\n    return hashlib.sha1(text.encode(\"utf-8\")).hexdigest()\n\n\ndef file_sha1(path):\n    return hashlib.sha1(Path(path).read_bytes()).hexdigest()\n\n\ndef write_json(path, obj):\n    path = Path(path)\n    path.parent.mkdir(parents=True, exist_ok=True)\n    with open(path, \"w\", encoding=\"utf-8\", newline=\"\\n\") as f:\n        json.dump(obj, f, ensure_ascii=False, indent=2, sort_keys=True)\n\n\ndef read_json(path):\n    with open(path, encoding=\"utf-8\") as f:\n        return json.load(f)\n\n\ndef write_jsonl(path, rows):\n    path = Path(path)\n    path.parent.mkdir(parents=True, exist_ok=True)\n    with open(path, \"w\", encoding=\"utf-8\", newline=\"\\n\") as f:\n        for r in rows:\n            f.write(json.dumps(r, ensure_ascii=False, sort_keys=True) + \"\\n\")\n\n\ndef read_jsonl(path):\n    with open(path, encoding=\"utf-8\") as f:\n        return [json.loads(line) for line in f if line.strip()]", "notes": [{"a": 6, "b": 7, "title": "sha1_hex: băm chuỗi", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>SHA-1 của chuỗi UTF-8, trả về 40 ký tự hex.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Là nền cho ID ổn định (<code>passage_id<\/code>, <code>question_id<\/code>) và kiểm tra dữ liệu có đổi không.<\/p><\/dd><dt>Cách khác<\/dt><dd><p>SHA-256 an toàn hơn về mật mã, nhưng ở đây chỉ cần định danh nội dung, không cần chống tấn công.<\/p><\/dd><\/dl>"}, {"a": 10, "b": 11, "title": "file_sha1: băm cả file", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc toàn bộ byte file rồi băm.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dùng khắp nơi để 'đóng dấu' corpus: <code>split_manifest.json<\/code>, dấu vân tay BM25 (GĐ11), manifest dense (GĐ6), <code>corpus_version<\/code> của pipeline.<\/p><\/dd><\/dl>"}, {"a": 14, "b": 18, "title": "write_json: ghi JSON xác định", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tạo thư mục cha nếu thiếu, ghi UTF-8, <code>newline=\"\\n\"<\/code> (kể cả trên Windows), <code>ensure_ascii=False<\/code> (giữ nguyên ä ö ü ß), <code>sort_keys=True<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p><code>sort_keys<\/code> và <code>newline<\/code> cố định làm hai lần ghi cùng dữ liệu cho <strong>cùng byte<\/strong>, nên SHA-1 file không đổi vô cớ.<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Trên Windows file có <code>\\r\\n<\/code>, đổi máy là đổi SHA-1, manifest báo sai.<\/p><\/dd><\/dl>"}, {"a": 21, "b": 23, "title": "read_json", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc JSON UTF-8.<\/p><\/dd><\/dl>"}, {"a": 26, "b": 31, "title": "write_jsonl: mỗi dòng một đối tượng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ghi từng bản ghi thành một dòng JSON.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>JSONL đọc được từng dòng, thêm dòng dễ, hợp với corpus hàng chục nghìn đoạn.<\/p><\/dd><dt>Cách khác<\/dt><dd><p>Parquet nhanh hơn nhưng khó đọc bằng mắt và khó so sánh diff.<\/p><\/dd><\/dl>"}, {"a": 34, "b": 36, "title": "read_jsonl", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc toàn bộ file JSONL thành danh sách dict, bỏ dòng trống.<\/p><\/dd><\/dl>"}], "intro": "<p>Đọc/ghi JSON, JSONL và tính SHA-1. Ghi <strong>xác định<\/strong> (cùng dữ liệu → cùng byte) để hàm băm so sánh được.<\/p>"}, {"path": "src/germanqa/experiment.py", "name": "experiment.py", "kind": "orig", "lang": "python", "source": "### Thông tin môi trường và experiment_id, dùng để gắn vào mọi kết quả\"\n\"\"\"Công cụ tái lập: seed, mã thí nghiệm, ghi lại môi trường, đọc cấu hình YAML.\"\"\"\nimport hashlib\nimport json\nimport platform\nimport random\nfrom datetime import datetime, timezone\nfrom importlib import metadata\n\nimport numpy as np\nimport yaml\n\nfrom germanqa.config import CONFIG_DIR, RESULTS_DIR\n\n\ndef set_seed(seed):\n    \"\"\"Cố định mọi nguồn ngẫu nhiên đang dùng.\"\"\"\n    random.seed(seed)\n    np.random.seed(seed)\n    try:                       # torch chưa cần ở GĐ0-3, có thì seed luôn\n        import torch\n        torch.manual_seed(seed)\n    except ImportError:\n        pass\n\n\ndef load_config(name=\"baseline\"):\n    \"\"\"Đọc configs/<name>.yaml thành dict.\"\"\"\n    with open(CONFIG_DIR / f\"{name}.yaml\", encoding=\"utf-8\") as f:\n        return yaml.safe_load(f)\n\n\ndef new_experiment_id(tag, config):\n    \"\"\"Mã thí nghiệm = thẻ + thời điểm + 8 ký tự băm của cấu hình.\n    Cùng cấu hình -> cùng đuôi băm; khác cấu hình -> đuôi khác.\"\"\"\n    blob = json.dumps(config, sort_keys=True, default=str)\n    digest = hashlib.sha1(blob.encode(\"utf-8\")).hexdigest()[:8]\n    stamp = datetime.now(timezone.utc).strftime(\"%Y%m%dT%H%M%SZ\")\n    return f\"{tag}_{stamp}_{digest}\"\n\n\ndef environment_info(packages=(\"numpy\", \"pandas\", \"datasets\", \"transformers\", \"PyYAML\")):\n    \"\"\"Phiên bản Python và thư viện, để kết quả truy vết được.\"\"\"\n    versions = {}\n    for p in packages:\n        try:\n            versions[p] = metadata.version(p)\n        except metadata.PackageNotFoundError:\n            versions[p] = None\n    return {\"python\": platform.python_version(), \"platform\": platform.platform(),\n            \"packages\": versions}\n\n\ndef save_run(experiment_id, config, metrics, extra=None):\n    \"\"\"Ghi results/<experiment_id>.json gồm cấu hình, môi trường, số đo.\"\"\"\n    RESULTS_DIR.mkdir(parents=True, exist_ok=True)\n    record = {\"experiment_id\": experiment_id, \"config\": config,\n              \"environment\": environment_info(), \"metrics\": metrics}\n    if extra:\n        record.update(extra)\n    path = RESULTS_DIR / f\"{experiment_id}.json\"\n    with open(path, \"w\", encoding=\"utf-8\", newline=\"\\n\") as f:\n        json.dump(record, f, ensure_ascii=False, indent=2, sort_keys=True)\n    return path", "notes": [{"a": 16, "b": 24, "title": "set_seed: cố định ngẫu nhiên", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đặt seed cho <code>random<\/code>, <code>numpy<\/code> và (nếu có) <code>torch<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cùng seed → cùng kết quả khi chạy lại. <code>try/except ImportError<\/code> để GĐ0–3 chạy được khi chưa cài torch.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Seed không bảo đảm giống hệt trên GPU khác nhau hay khác phiên bản CUDA: chỉ giảm biến động, không xóa hẳn.<\/p><\/dd><\/dl>"}, {"a": 27, "b": 30, "title": "load_config: đọc YAML", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc <code>configs/&lt;name&gt;.yaml<\/code> thành dict.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Tham số (k1, b, top_k, ...) nằm ở YAML, không nằm trong code: đổi tham số không cần sửa mã, và có thể băm cấu hình.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>pipeline.build_pipeline<\/code> gọi <code>load_config(\"pipeline\")<\/code>, <code>load_config(\"reader\")<\/code>, ...<\/p><\/dd><\/dl>"}, {"a": 33, "b": 39, "title": "new_experiment_id: mã thí nghiệm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mã = <code>thẻ<\/code> + thời điểm UTC + 8 ký tự đầu của SHA-1 cấu hình. Ví dụ <code>reader_20261101T213758Z_96717e35<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Đuôi băm nói 'cấu hình có giống không': cùng cấu hình → cùng đuôi; khác → khác. Phần thời gian phân biệt từng lần chạy.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: thẻ (str) + dict cấu hình. Ra: chuỗi mã.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p><code>json.dumps(..., sort_keys=True)<\/code> bắt buộc để thứ tự khóa không làm đổi băm. Chú ý: phải đưa <strong>mọi tham số có ảnh hưởng<\/strong> vào cấu hình được băm (xem GĐ5: hybrid và rerank được thêm vào <code>full_cfg<\/code> chính vì lý do này).<\/p><\/dd><\/dl>"}, {"a": 42, "b": 51, "title": "environment_info: ghi môi trường", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Phiên bản Python, hệ điều hành và vài thư viện chính.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Hai lần chạy cho kết quả khác nhau thì đây là manh mối đầu tiên cần xem.<\/p><\/dd><\/dl>"}, {"a": 54, "b": 64, "title": "save_run: lưu kết quả", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ghi <code>results/&lt;experiment_id&gt;.json<\/code> gồm cấu hình, môi trường, số đo (và trường phụ).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: id, cấu hình, số đo. Ra: đường dẫn file.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Mọi script đánh giá (GĐ3, GĐ4, GĐ7…) kết thúc bằng <code>save_run<\/code>.<\/p><\/dd><\/dl>"}], "intro": "<p>Công cụ tái lập: cố định seed, đọc cấu hình, đặt mã thí nghiệm, ghi lại môi trường và lưu kết quả.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Dựng <strong>khung package<\/strong> và <strong>hợp đồng dữ liệu<\/strong>: đường dẫn, hằng số, các dạng bản ghi (<code>Passage<\/code>, <code>QAExample<\/code>, <code>QAResponse<\/code>), công cụ tái lập (seed, mã thí nghiệm, lưu kết quả).<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Một dự án NLP có hàng chục script. Nếu mỗi script tự quyết định đường dẫn, định dạng dữ liệu và cách ghi kết quả thì sau vài tuần không ai chạy lại được. GĐ0 đóng đinh các quy ước này <strong>trước khi<\/strong> viết thuật toán nào.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p>Chưa có gì: đây là điểm xuất phát. Đầu vào là đề bài (QA trích xuất tiếng Đức) và kế hoạch trong <code>plan/<\/code>.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>Mọi giai đoạn sau <code>import<\/code> <code>config.py<\/code>, <code>schemas.py<\/code>, <code>io_utils.py<\/code>, <code>experiment.py<\/code>. GĐ1 dùng <code>DATASETS<\/code> để tải; GĐ2 dùng <code>SEED<\/code>, <code>DEV_RATIO<\/code>; GĐ5 dùng <code>QAResponse<\/code>; GĐ8 dùng <code>to_utf16_offset<\/code>.<\/p>", "b": "<h4>Ba ý tưởng nền tảng<\/h4>\n<p><strong>1. Tái lập (reproducibility).<\/strong> Một kết quả chỉ đáng tin nếu chạy lại ra đúng số đó. Có bốn nguồn sai khác: dữ liệu đổi, cấu hình đổi, ngẫu nhiên, môi trường. Project xử lý lần lượt: ghim <em>revision<\/em> của dataset (GĐ1), YAML cho cấu hình, một <code>SEED<\/code>, <code>environment_info<\/code> cho môi trường.<\/p>\n<p><strong>2. ID xác định bằng hàm băm (content-addressed ID).<\/strong> <code>passage_id = \"p_\" + SHA1(original_text)[:16]<\/code>. Hai đoạn cùng nội dung → cùng ID → tự động khử trùng lặp, và ID không phụ thuộc thứ tự xử lý. Đổi lại, sửa một ký tự là ra ID khác, nên <code>original_text<\/code> không được phép bị sửa sau khi đã có ID.<\/p>\n<p><strong>3. Offset là một hợp đồng.<\/strong> Đáp án được xác định bởi cặp <code>[start, end)<\/code> **trên <code>original_text<\/code>**, đếm theo ký tự Unicode (code point) của Python. JavaScript lại đếm theo UTF-16.<\/p>\n<div class=\"math\">UTF-16 units(s[:i]) = i + (số ký tự ngoài BMP trong s[:i])<\/div>\n<p>Mỗi ký tự ngoài BMP (như 😀, mã U+1F600) chiếm 2 đơn vị UTF-16 nhưng chỉ 1 code point. Vì vậy <code>to_utf16_offset<\/code> chỉ lệch khi có ký tự như vậy đứng <strong>trước<\/strong> đáp án.<\/p>\n<h4>Vì sao tách <code>original_text<\/code> và <code>retrieval_text<\/code>?<\/h4>\n<table><thead><tr><th><\/th><th><code>original_text<\/code><\/th><th><code>retrieval_text<\/code><\/th><\/tr><\/thead><tbody><tr><td>Sửa gì<\/td><td>Không sửa<\/td><td>NFC, bỏ ký tự vô hình, gộp khoảng trắng, chữ thường<\/td><\/tr><tr><td>Dùng cho<\/td><td>Reader, hiển thị, tô sáng đáp án<\/td><td>BM25 (GĐ3)<\/td><\/tr><tr><td>Vì sao<\/td><td>Offset phải khớp từng ký tự<\/td><td>Truy vấn \"Köln\" phải khớp \"köln\"<\/td><\/tr><\/tbody><\/table>\n<p>Dense retriever (GĐ6) lại dùng <code>original_text<\/code>: chữ thường làm encoder DPR hỏng (đo ở GĐ6: top-1 tụt từ 0,84 xuống 0,52, ghi trong <code>configs/dense.yaml<\/code>).<\/p>\n<h4>Phương pháp thay thế<\/h4>\n<ul><li>ID tăng dần (1, 2, 3…): ngắn gọn nhưng đổi theo thứ tự xử lý, và không khử trùng lặp tự động.<\/li><li>UUID ngẫu nhiên: duy nhất nhưng không tái lập.<\/li><li>Dùng cấu hình bằng Hydra/OmegaConf: mạnh hơn YAML thuần, nhưng thêm phụ thuộc. Project chọn YAML + <code>new_experiment_id<\/code> cho gọn.<\/li><\/ul>", "c": "<h4>Dòng chảy của giai đoạn<\/h4>\n<pre class=\"blk\" data-lang=\"text\"><code>requirements.txt ──pip──▶ môi trường\npyproject.toml   ──pip install -e .──▶ import germanqa.*\n\nconfig.py ─┬─▶ ROOT, RAW_DIR, PROCESSED_DIR, RESULTS_DIR, CONFIG_DIR\n           ├─▶ SEED, DEV_RATIO\n           └─▶ DATASETS (repo_id, số mẫu mong đợi)\n\nschemas.py      : Passage / Answer / QAExample / QAResponse / to_utf16_offset\nio_utils.py     : sha1_hex, file_sha1, read/write json(l)\nexperiment.py   : set_seed, load_config, new_experiment_id, save_run<\/code><\/pre>\n<h4>Cấu trúc dữ liệu<\/h4>\n<ul><li><code>Passage<\/code>: 6 trường (xem <code>schemas.py<\/code>), ghi thành JSONL.<\/li><li><code>QAResponse<\/code>: 17 trường (kể cả <code>trace<\/code>, <code>rerank_time<\/code>, <code>rerank_score<\/code>).<\/li><li>Offset: <code>[start, end)<\/code> ký tự Python trên <code>original_text<\/code>.<\/li><\/ul>\n<h4>Ai gọi ai<\/h4>\n<p><code>experiment.py<\/code> → <code>config.py<\/code> (lấy <code>CONFIG_DIR<\/code>, <code>RESULTS_DIR<\/code>). <code>io_utils.py<\/code> không phụ thuộc module nào khác của project. Mọi module khác → <code>config<\/code>, <code>io_utils<\/code>, <code>experiment<\/code>.<\/p>", "e": "<h4>Cài đặt (đã kiểm trên máy của project: Python 3.13.3, Windows 11, RTX 3050)<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python -m venv venv\nvenv\\Scripts\\activate          # Windows (Linux/macOS: source venv/bin/activate)\n# 1) torch bản CUDA TRƯỚC: \"pip install torch\" trên Windows chỉ cài bản CPU\npip install torch --index-url https://download.pytorch.org/whl/cu126\n# 2) phần còn lại\npip install -r requirements.txt\npip install -e .\npip check                        # phải in: No broken requirements found.\npython -c \"from germanqa.config import ROOT, DATASETS; print(ROOT); print(list(DATASETS))\"<\/code><\/pre>\n<p>Kỳ vọng: in ra thư mục gốc dự án và <code>['germanquad', 'germandpr']<\/code>.<\/p>\n<h4>Phiên bản đã chạy được (tham khảo khi cài máy mới)<\/h4>\n<table><thead><tr><th>Gói<\/th><th>Phiên bản trong venv của project<\/th><\/tr><\/thead><tbody><tr><td>Python<\/td><td>3.13.3<\/td><\/tr><tr><td>torch<\/td><td>2.14.1+cu126<\/td><\/tr><tr><td>transformers<\/td><td>5.19.0<\/td><\/tr><tr><td>datasets<\/td><td>5.0.1 (lúc tải dữ liệu), 5.1.0 (lúc huấn luyện reader)<\/td><\/tr><tr><td>numpy<\/td><td>2.5.4<\/td><\/tr><\/tbody><\/table>\n<p><code>requirements.txt<\/code> không ghim phiên bản, nên máy cài sau có thể nhận bản mới hơn. Cách chắc chắn nhất là xuất danh sách từ venv đang chạy (<code>pip freeze &gt; requirements.lock.txt<\/code>) rồi cài máy mới bằng file đó.<\/p>\n<div class=\"co warn\"><b class=\"h\">Lưu ý<\/b><code>tokenization.py<\/code> ghi nhận transformers 5.17–5.22 có lỗi tokenizer im lặng. Project tránh lỗi bằng cách tự dựng tokenizer và kiểm kích thước từ vựng, nên nếu đổi phiên bản transformers mà tokenizer hỏng thì sẽ báo lỗi ngay.<\/div>\n<h4>Kiểm tra cả hệ thống chạy được<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>pytest -q                        # kiểm ngày 2026-11-11: 360 passed, 1 skipped (~80 giây)\npython scripts/GD5/05_ask.py \"Welche Werte in Kondensatoren steigen bei ihrer Parallelschaltung?\"<\/code><\/pre>\n<p>Câu trên là một câu thật trong dev. Kết quả khi chạy ngày 2026-11-11: <code>sowohl die Gesamtkapazität als auch die Strombelastbarkeit der Schaltung<\/code> (khớp đáp án gốc), tổng khoảng 75–125 ms.<\/p>\n<div class=\"co info\"><b class=\"h\">Ghi chú<\/b>Muốn dùng hệ thống thì không cần chạy lại mọi giai đoạn: project đã có sẵn <code>data/processed/<\/code>, <code>artifacts/bm25<\/code>, <code>artifacts/dense/text384<\/code>, <code>models/reader_…<\/code>, <code>models/rerank_…<\/code>. Chạy lại từ đầu chỉ cần khi bạn tự viết lại để học. Riêng GĐ4 huấn luyện mất khoảng 53 phút trên GPU; trên CPU chậm hơn rất nhiều.<\/div>\n<h4>Thử nhanh từng hàm<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.data.io_utils import sha1_hex\nfrom germanqa.experiment import new_experiment_id\nfrom germanqa.schemas import to_utf16_offset\n\nprint(sha1_hex(\"abc\"))                         # a9993e364706816aba3e25717850c26c9cd0d89d\nprint(new_experiment_id(\"demo\", {\"k1\": 1.5}))  # demo_&lt;thời điểm&gt;_&lt;8 ký tự băm&gt;\nprint(to_utf16_offset(\"a😀b\", 2))              # 3  (😀 chiếm 2 đơn vị UTF-16)<\/code><\/pre>\n<h4>Test nên có<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>assert new_experiment_id(\"x\", {\"a\": 1, \"b\": 2}).split(\"_\")[-1] == new_experiment_id(\"x\", {\"b\": 2, \"a\": 1}).split(\"_\")[-1]\nassert to_utf16_offset(\"abc\", 2) == 2<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li><code>ModuleNotFoundError: germanqa<\/code>: quên <code>pip install -e .<\/code> hoặc chạy bằng Python ngoài venv.<\/li><li><code>ROOT<\/code> trỏ sai thư mục: kiểm tra số lần <code>.parent<\/code> so với độ sâu của <code>config.py<\/code>.<\/li><li>SHA-1 file khác nhau giữa Windows và Linux: ghi file không đặt <code>newline=\"\\n\"<\/code>.<\/li><\/ul>\n<p>Project có sẵn <code>tests/test_phase0.py<\/code> kiểm các hợp đồng của giai đoạn này (<code>pytest tests/test_phase0.py<\/code>).<\/p>", "f": "<ul><li>Offset là <code>[start, end)<\/code> trên <strong>văn bản gốc<\/strong>, đơn vị là code point Python.<\/li><li><code>passage_id<\/code>/<code>question_id<\/code> là <strong>băm nội dung<\/strong>: ổn định, khử trùng lặp tự động.<\/li><li>Mọi kết quả phải mang <strong>mã thí nghiệm + phiên bản<\/strong> để truy vết.<\/li><li>Tham số nằm ở YAML; hằng số dùng chung nằm ở <code>config.py<\/code>; <strong>một<\/strong> seed.<\/li><li>JSON ghi xác định (<code>sort_keys<\/code>, <code>\\n<\/code>) để SHA-1 file có ý nghĩa.<\/li><li>Chỉ <strong>thêm<\/strong> trường vào hợp đồng, đừng đổi nghĩa trường cũ.<\/li><\/ul>", "g": "<ol><li><strong>Tự viết<\/strong> <code>new_experiment_id<\/code> không nhìn lại. Sau đó chứng minh bằng một đoạn code ngắn rằng đổi thứ tự khóa trong dict cấu hình <strong>không<\/strong> đổi đuôi băm.<\/li><li><code>to_utf16_offset(\"😀😀x\", 2)<\/code> bằng bao nhiêu? Giải thích bằng số đơn vị UTF-16, rồi chạy kiểm chứng.<\/li><li>Giả sử bạn thêm trường <code>reranker_name<\/code> vào <code>QAResponse<\/code>. Nên đặt vị trí nào, có giá trị mặc định không, và vì sao? Dựa vào cách project đã thêm <code>rerank_time<\/code>.<\/li><li>Nếu <code>write_json<\/code> bỏ <code>sort_keys=True<\/code>, hai lần ghi cùng một dict có thể cho SHA-1 khác nhau không? Tìm một tình huống cụ thể trong project nơi điều đó gây hại (gợi ý: <code>split_manifest.json<\/code>).<\/li><\/ol>"}, {"id": "s1", "num": 1, "title": "Tải và kiểm kê dữ liệu", "gd": "GĐ1 · dữ liệu thô", "files": [{"path": "src/germanqa/data/download.py", "name": "download.py", "kind": "orig", "lang": "python", "source": "import json\nimport platform\nfrom datetime import datetime, timezone\n\nimport datasets\nimport huggingface_hub\nfrom datasets import load_dataset\nfrom huggingface_hub import HfApi\n\nfrom germanqa.config import DATASETS, RAW_DIR, REPORT_DIR\n\ndef download_dataset(name, revision):\n    \"\"\"Tải đúng phiên bản `revision` và lưu bản gốc.\"\"\"\n    spec = DATASETS[name]\n    ds = load_dataset(spec.repo_id, revision=revision)  # ghim phiên bản\n    RAW_DIR.mkdir(parents=True, exist_ok=True)\n    ds.save_to_disk(str(RAW_DIR / name))\n    return ds\n\ndef get_revision(name):\n    info = HfApi().dataset_info(DATASETS[name].repo_id)\n    return info.sha\n    # dataset trên hub có thể cập nhật. Ghi lại SHA để sau này kiểm tra xem dữ liệu có thay đổi hay không.\n    #  SHA là một chuỗi băm duy nhất đại diện cho trạng thái hiện tại của dữ liệu trên hub.\n\ndef count_check(name, ds): \n    #  \"\"\"Đối chiếu số mẫu thực tế với kỳ vọng. Lệch -> ghi lại, không dừng.\n    rows = []\n    expected = DATASETS[name].expected\n\n    for split, expected_n in expected.items():\n        actual_n = len(ds[split]) if split in ds else None\n\n        if actual_n is None: \n           diff, status = None, \"THIẾU SPLIT\"\n        else: \n            diff = actual_n - expected_n\n            status = \"Ổn\" if diff == 0 else \"Lệch\"\n\n        rows.append({\n            \"dataset\": name, \"split\": split,\n            \"expected\": expected_n, \"actual\": actual_n,\n            \"diff\": diff, \"status\": status\n        })\n    #split có thật nhưng không nằm trong expected, \n    # hoặc split có trong expected nhưng không có trong ds.\n    # vd: validation\n\n    for split in ds: \n        if split not in expected: \n            rows.append({\n                \"dataset\": name, \"split\": split,\n                \"expected\": None, \"actual\": len(ds[split]),\n                \"diff\": None, \"status\": \"Lệch\"\n            })\n    return rows\n\ndef write_manifest(all_info):\n    \"\"\"all_info = {name: {\"revision_sha\": str, \"ds\": DatasetDict}}\"\"\"\n    manifest = {\n        \"download_time\": datetime.now(timezone.utc).isoformat(),\n        \"datasets\": {\n            name: {\n                \"repo_id\": DATASETS[name].repo_id,\n                \"revision_sha\": info[\"revision_sha\"],\n                \"splits\": {s: len(info[\"ds\"][s]) for s in info[\"ds\"]},\n                \"columns\": {\n                    s: {c: str(f) for c, f in info[\"ds\"][s].features.items()}\n                    for s in info[\"ds\"]\n                },\n            }\n            for name, info in all_info.items()\n        },\n        \"library_versions\": {\n            \"datasets\": datasets.__version__,\n            \"huggingface_hub\": huggingface_hub.__version__,\n            \"python\": platform.python_version(),\n        }\n    }\n    REPORT_DIR.mkdir(parents=True, exist_ok=True)\n    out = REPORT_DIR / \"step1_manifest.json\"\n    with open(out, \"w\", encoding=\"utf-8\") as f:\n        json.dump(manifest, f, ensure_ascii=False, indent=2)\n    return out", "notes": [{"a": 12, "b": 18, "title": "download_dataset: tải một phiên bản cố định", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>load_dataset(repo_id, revision=revision)<\/code> tải đúng commit <code>revision<\/code>, rồi <code>save_to_disk<\/code> lưu bản gốc vào <code>data/raw/&lt;tên&gt;<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Dataset trên Hub có thể được cập nhật. Ghim <code>revision<\/code> để hôm nay và 6 tháng sau tải ra cùng dữ liệu.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: tên dataset, revision. Ra: <code>DatasetDict<\/code> (có các split <code>train<\/code>, <code>test<\/code>).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Kết quả được <code>scripts/02_preprocess.py<\/code> (GĐ2) đọc lại bằng <code>load_from_disk<\/code>.<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Không ghim: kết quả thí nghiệm có thể đổi mà code không đổi dòng nào.<\/p><\/dd><\/dl>"}, {"a": 20, "b": 24, "title": "get_revision: lấy SHA commit hiện tại", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Hỏi Hub SHA commit mới nhất của dataset.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Ghi SHA vào manifest để sau này biết 'dữ liệu của tôi là bản nào'.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Hàm trả về SHA <strong>mới nhất tại thời điểm gọi<\/strong>, không phải SHA của dữ liệu đã tải. Phải gọi và lưu <em>cùng lúc<\/em> tải, hoặc truyền chính SHA đó vào <code>download_dataset<\/code>.<\/p><\/dd><\/dl>"}, {"a": 26, "b": 56, "title": "count_check: đối chiếu số mẫu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Với mỗi split trong <code>expected<\/code>: thiếu → <code>THIẾU SPLIT<\/code>; đủ → <code>Ổn<\/code>; lệch → <code>Lệch<\/code>. Split thừa (ví dụ <code>validation<\/code>) cũng đánh dấu <code>Lệch<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Lệch số mẫu nghĩa là tải sai phiên bản hoặc dữ liệu hỏng. Hàm <strong>ghi lại, không dừng<\/strong>, vì quyết định xử lý thuộc về người phân tích.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: danh sách dòng (dataset, split, expected, actual, diff, status), được ghi thành <code>reports/step1_count_check.csv<\/code>.<\/p><\/dd><\/dl>"}, {"a": 58, "b": 84, "title": "write_manifest: hồ sơ của lần tải", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ghi <code>reports/step1_manifest.json<\/code>: thời điểm tải, repo, <code>revision_sha<\/code>, số dòng mỗi split, kiểu dữ liệu từng cột và phiên bản <code>datasets<\/code>, <code>huggingface_hub<\/code>, Python.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Một 'hộ chiếu' cho dữ liệu: người khác (hoặc bạn của sáu tháng sau) đọc là biết dữ liệu đến từ đâu.<\/p><\/dd><\/dl>"}], "intro": "<p>Tải đúng phiên bản dataset, đếm số mẫu so với kỳ vọng, và ghi manifest (revision, schema, phiên bản thư viện).<\/p>"}, {"path": "src/germanqa/data/eda.py", "name": "eda.py", "kind": "orig", "lang": "python", "source": "\n\"\"\"GĐ1: các hàm đo cho phân tích dữ liệu (EDA).\"\"\"\n\n\ndef schema_report(ds):\n    return {\"rows\": len(ds),\n            \"columns\": {c: str(f) for c, f in ds.features.items()}}\n\n\ndef quad_missing(ds):\n    return {\n        \"empty_question\": sum(1 for r in ds if not r[\"question\"].strip()),\n        \"empty_context\": sum(1 for r in ds if not r[\"context\"].strip()),\n        \"missing_id\": sum(1 for r in ds if not r[\"id\"]),\n        \"empty_answer\": sum(1 for r in ds for t in r[\"answers\"][\"text\"] if not t.strip()),\n    }", "notes": [{"a": 5, "b": 7, "title": "schema_report: lược đồ cột", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Số dòng và kiểu dữ liệu từng cột (<code>ds.features<\/code>).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Nhìn thấy cấu trúc <strong>trước khi<\/strong> viết code tiền xử lý: ví dụ <code>answers<\/code> của GermanQuAD là dict <code>{text: [...], answer_start: [...]}<\/code>.<\/p><\/dd><\/dl>"}, {"a": 10, "b": 16, "title": "quad_missing: đếm dữ liệu thiếu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đếm câu hỏi rỗng, context rỗng, thiếu <code>id<\/code>, đáp án rỗng trong GermanQuAD.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Phát hiện bẩn sớm. Kết quả thật của project: không có mẫu nào bị cách ly (<code>quarantine = 0<\/code> trong <code>data_quality_report.json<\/code>).<\/p><\/dd><\/dl>"}], "intro": "<p>Hai hàm đo đầu tiên của phân tích dữ liệu (EDA). Phần phân tích đầy đủ nằm ở notebook <code>Lab_EDA_GermanQuAD_GermanDPR.ipynb<\/code>.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Tải hai dataset <strong>đúng phiên bản<\/strong>, lưu bản thô, kiểm số mẫu và ghi manifest.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Mọi phân tích và mọi con số về sau đều dựa vào dữ liệu này. Nếu không biết nó là phiên bản nào, kết quả không tái lập được và không thể đối chiếu với bài báo.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>config.DATASETS<\/code> (repo, số mẫu mong đợi), <code>REPORT_DIR<\/code>, <code>RAW_DIR<\/code>; <code>io_utils<\/code>.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ2 đọc <code>data/raw/germanquad<\/code> và <code>data/raw/germandpr<\/code> bằng <code>load_from_disk<\/code> để dựng corpus và dữ liệu QA.<\/p>", "b": "<h4>Hai dataset và vai trò khác nhau<\/h4>\n<ul><li><strong>GermanQuAD<\/strong> (Möller, Risch, Pietsch, 2021): câu hỏi + đoạn văn Wikipedia + đáp án là một đoạn trích (span) kèm <code>answer_start<\/code>. Dùng làm <strong>nhãn QA<\/strong> (đáp án) và là nguồn chính của câu hỏi/test.<\/li><li><strong>GermanDPR<\/strong>: cùng nhóm tác giả, thiết kế cho <em>truy hồi<\/em>: mỗi câu hỏi có <code>positive_ctxs<\/code> (đoạn đúng) và <code>hard_negative_ctxs<\/code> (đoạn trông giống đúng nhưng sai). Project dùng GermanDPR chủ yếu để <strong>mở rộng corpus<\/strong> và lấy <strong>hard negative<\/strong>.<\/li><\/ul>\n<p>Số mẫu kỳ vọng ghi trong <code>config.py<\/code>: QuAD 11.518/2.204, DPR 9.275/1.025.<\/p>\n<h4>Vì sao phải 'ghim revision'?<\/h4>\n<p>Dataset trên Hugging Face Hub là một git repo. Tác giả có thể sửa dữ liệu. <code>load_dataset(..., revision=&lt;SHA&gt;)<\/code> tải đúng snapshot. Đây chính là <em>data versioning<\/em> nhẹ nhất.<\/p>\n<h4>Vì sao <code>count_check<\/code> không dừng chương trình?<\/h4>\n<p>Một số lệch là <strong>thông tin<\/strong> chứ không phải lỗi (ví dụ dataset thêm split <code>validation<\/code>). Báo cáo trung thực rồi để người phân tích quyết định, thay vì <code>assert<\/code> làm dừng toàn bộ pipeline.<\/p>\n<h4>Phương pháp thay thế<\/h4>\n<p>DVC hoặc git-lfs để version dữ liệu; kéo thẳng từ Hub mỗi lần chạy (nhanh nhưng không tái lập).<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>config.DATASETS ──▶ get_revision(name)        → sha\n                 └▶ download_dataset(name, sha) → DatasetDict ─▶ data/raw/&lt;name&gt;/\n                           │\n                           ├▶ count_check(name, ds) → rows ─▶ reports/step1_count_check.csv\n                           └▶ write_manifest(all_info) ─────▶ reports/step1_manifest.json<\/code><\/pre>\n<h4>Cấu trúc dữ liệu thô (theo code ở GĐ2)<\/h4>\n<ul><li>GermanQuAD: <code>row[\"id\"]<\/code>, <code>row[\"question\"]<\/code>, <code>row[\"context\"]<\/code>, <code>row[\"answers\"][\"text\"]<\/code> (list), <code>row[\"answers\"][\"answer_start\"]<\/code> (list).<\/li><li>GermanDPR: <code>row[\"question\"]<\/code>, <code>row[\"answers\"]<\/code> (list chuỗi), <code>row[\"positive_ctxs\"][\"title\"/\"text\"]<\/code>, <code>row[\"hard_negative_ctxs\"][\"title\"/\"text\"]<\/code> (mỗi trường là list song song).<\/li><\/ul>", "e": "<h4>Chạy<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/01_download_data.py<\/code><\/pre>\n<p>(Script điều phối của project gọi <code>get_revision<\/code>, <code>download_dataset<\/code>, <code>count_check<\/code>, <code>write_manifest<\/code> cho từng dataset.)<\/p>\n<div class=\"co warn\"><b class=\"h\">Lưu ý<\/b>Script lấy SHA <strong>mới nhất<\/strong> trên Hub (<code>get_revision<\/code>), không dùng SHA đã ghi. Dữ liệu của project được tải với GermanQuAD <code>fff05ceaf2ffbe5b65c7e0c57e678f7b7e1a0581<\/code> và GermanDPR <code>5129d02422a66be600ac89cd3e8531b4f97d347d<\/code> (<code>reports/step1_manifest.json<\/code>, <code>datasets<\/code> 5.0.1). Để máy mới ra đúng dữ liệu này, gọi <code>download_dataset(name, &lt;SHA ở trên&gt;)<\/code>, chạy <code>02_preprocess.py<\/code>, rồi so SHA-1 từng tệp trong <code>data/processed/split_manifest.json<\/code>. Ghi chú cũ trong <code>docs/chat_history.md<\/code> về lỗi <code>datasets<\/code> 4.x với <code>germandpr<\/code> đã lỗi thời: lần tải thật dùng <code>datasets<\/code> 5.0.1 và thành công.<\/div>\n<h4>Kỳ vọng<\/h4>\n<ul><li>Thư mục <code>data/raw/germanquad/{train,test}<\/code> và <code>data/raw/germandpr/{train,test}<\/code> có file <code>.arrow<\/code>.<\/li><li><code>reports/step1_count_check.csv<\/code>: mọi dòng <code>status = Ổn<\/code>.<\/li><li><code>reports/step1_manifest.json<\/code> chứa <code>revision_sha<\/code> của cả hai dataset.<\/li><\/ul>\n<h4>Kiểm tra nhanh<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from datasets import load_from_disk\nds = load_from_disk(\"data/raw/germanquad\")\nprint(ds)                       # DatasetDict({train: 11518 rows, test: 2204 rows})\nr = ds[\"train\"][0]\nprint(r[\"question\"]); print(r[\"answers\"])   # {'text': [...], 'answer_start': [...]}<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Mạng ngắt khi liệt kê repo: tải từng file bằng <code>hf_hub_download<\/code> (cách <code>reader/model_io.py<\/code> làm).<\/li><li>Số mẫu lệch: xem <code>diff<\/code> và <code>status<\/code> trong CSV trước khi làm tiếp.<\/li><\/ul>", "f": "<ul><li>Luôn <strong>ghim revision<\/strong> của dữ liệu và lưu manifest.<\/li><li>Xem schema thật của dữ liệu trước khi viết bất cứ dòng tiền xử lý nào.<\/li><li>QuAD cho nhãn đáp án; DPR cho đoạn văn bổ sung và hard negative.<\/li><li>Số mẫu lệch là thông tin cần ghi lại, không tự ý bỏ qua.<\/li><\/ul>", "g": "<ol><li>Viết một hàm <code>describe_split(ds)<\/code> in số câu hỏi, số đoạn <code>context<\/code> <strong>khác nhau<\/strong> và độ dài context trung bình của GermanQuAD train. Số context khác nhau có nhỏ hơn số câu hỏi không? Vì sao điều đó quan trọng cho GĐ2?<\/li><li>Trong GermanDPR, một câu hỏi trung bình có bao nhiêu <code>hard_negative_ctxs<\/code>? Kiểm bằng code.<\/li><li>Sửa <code>count_check<\/code> để trả thêm tỷ lệ phần trăm lệch. Test bằng một <code>DatasetDict<\/code> giả có thiếu một split.<\/li><\/ol>"}, {"id": "s2", "num": 2, "title": "Chuẩn hóa văn bản và kiểm tra vị trí đáp án", "gd": "GĐ2a · tiền xử lý", "files": [{"path": "src/germanqa/data/text_utils.py", "name": "text_utils.py", "kind": "orig", "lang": "python", "source": "import re\nimport unicodedata\n\nfrom germanqa.data.io_utils import sha1_hex\n\n_WS = re.compile(r\"\\s+\")                              # mọi loại khoảng trắng, kể cả \\xa0\n_ZERO_WIDTH = re.compile(\"[\\u200b\\u200c\\u200d\\u2060\\ufeff]\")   # ký tự vô hình\nTITLE_MAX_CHARS = 80\n\n\ndef normalize_text(text):\n    \"\"\"Chuẩn hóa nhẹ: NFC, gộp khoảng trắng, cắt đầu đuôi. KHÔNG đổi chữ hoa/thường.\"\"\"\n    text = unicodedata.normalize(\"NFC\", text)\n    return _WS.sub(\" \", text).strip()\n\n\ndef make_retrieval_text(original_text):\n    \"\"\"Bản dành cho tìm kiếm. original_text KHÔNG bị sửa.\"\"\"\n    text = _ZERO_WIDTH.sub(\"\", original_text)\n    return normalize_text(text).lower()\n\n\ndef make_dedup_key(original_text):\n    \"\"\"Khóa trùng lặp chính xác, tính trên original_text.\"\"\"\n    return sha1_hex(original_text)\n\n\ndef passage_id_from_key(key):\n    return \"p_\" + key[:16]\n\n\ndef make_question_id(question):\n    \"\"\"Cùng một câu hỏi (khác hoa/thường, khoảng trắng) -> cùng ID.\"\"\"\n    return \"q_\" + sha1_hex(normalize_text(_ZERO_WIDTH.sub(\"\", question)).lower())[:16]\n\n\ndef extract_title(context):\n    \"\"\"GermanQuAD không có cột title, nhưng dòng đầu của context chính là tiêu đề bài.\"\"\"\n    first, sep, _rest = context.partition(\"\\n\")\n    first = first.strip()\n    if sep and 0 < len(first) <= TITLE_MAX_CHARS:\n        return first\n    return None\n\n\ndef clean_title(title):\n    \"\"\"Cột title của GermanDPR đôi khi dính cả đoạn văn (nhiều dòng): chỉ lấy dòng đầu.\"\"\"\n    if not title:\n        return None\n    first = title.split(\"\\n\", 1)[0].strip()\n    return first if 0 < len(first) <= TITLE_MAX_CHARS else None\n\n\ndef make_document_id(title, fallback_key):\n    \"\"\"Có tiêu đề: băm tiêu đề (các đoạn cùng bài ra cùng ID).\n    Không có: lấy khóa của chính đoạn đó, mỗi đoạn tự là một 'bài'.\"\"\"\n    t = normalize_text(title).lower() if title else \"\"\n    if t:\n        return \"d_\" + sha1_hex(t)[:12]\n    return \"d_\" + fallback_key[:12]", "notes": [{"a": 6, "b": 8, "title": "Hằng số và biểu thức chính quy", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>_WS<\/code> khớp mọi chuỗi khoảng trắng (kể cả <code>\\xa0<\/code>); <code>_ZERO_WIDTH<\/code> khớp ký tự vô hình (U+200B…U+FEFF); <code>TITLE_MAX_CHARS = 80<\/code> là ngưỡng độ dài tiêu đề.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Dữ liệu Wikipedia chứa khoảng trắng không ngắt (<code>\\xa0<\/code>) và ký tự độ rộng 0: nhìn bằng mắt giống nhau nhưng khác chuỗi.<\/p><\/dd><\/dl>"}, {"a": 11, "b": 14, "title": "normalize_text: chuẩn hóa nhẹ", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>NFC (hợp nhất dấu: <code>ü<\/code> luôn là một ký tự, không phải <code>u<\/code> + <code>¨<\/code>), gộp mọi khoảng trắng thành một dấu cách, cắt đầu đuôi. <strong>Không<\/strong> đổi hoa/thường.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Hai cách viết cùng một chữ có thể là hai chuỗi byte khác nhau. NFC đưa về một dạng chuẩn.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: str. Ra: str.<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Cùng một câu hỏi nhưng khác khoảng trắng sẽ ra hai <code>question_id<\/code> khác nhau.<\/p><\/dd><\/dl>"}, {"a": 17, "b": 20, "title": "make_retrieval_text: bản dành cho tìm kiếm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Bỏ ký tự vô hình, <code>normalize_text<\/code>, rồi <code>.lower()<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>BM25 phân biệt hoa/thường theo chuỗi, nên phải đưa về chữ thường. <code>original_text<\/code> giữ nguyên để cắt đáp án.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>build_corpus._add<\/code> gọi hàm này; kết quả là trường <code>retrieval_text<\/code> mà <code>BM25Retriever<\/code> dùng (GĐ3).<\/p><\/dd><\/dl>"}, {"a": 23, "b": 25, "title": "make_dedup_key: khóa trùng lặp", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>SHA-1 của <code>original_text<\/code> (không chuẩn hóa).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Trùng lặp <strong>chính xác<\/strong> theo từng byte. Hai đoạn chỉ khác khoảng trắng vẫn là hai đoạn, để tránh gộp nhầm và làm lệch offset.<\/p><\/dd><\/dl>"}, {"a": 28, "b": 29, "title": "passage_id_from_key", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>\"p_\"<\/code> + 16 ký tự đầu của khóa băm.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>16 ký tự hex = 64 bit; với khoảng 27 nghìn đoạn, xác suất va chạm gần như không. <code>build_corpus<\/code> vẫn <code>assert<\/code> không trùng để chắc chắn.<\/p><\/dd><\/dl>"}, {"a": 32, "b": 34, "title": "make_question_id: ID câu hỏi", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Bỏ ký tự vô hình, chuẩn hóa, chữ thường, băm. Cùng câu hỏi (khác hoa/thường, khoảng trắng) → cùng ID.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cho phép phát hiện <strong>cùng một câu hỏi xuất hiện ở train và test<\/strong> (rò rỉ) bằng so sánh ID.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>split.remove_conflicts_with_test<\/code> (GĐ2c) dùng ID này.<\/p><\/dd><\/dl>"}, {"a": 37, "b": 43, "title": "extract_title: tiêu đề cho GermanQuAD", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>GermanQuAD không có cột tiêu đề nhưng dòng đầu của <code>context<\/code> chính là tên bài. Lấy dòng đầu nếu có xuống dòng và độ dài từ 1 đến 80.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cần <code>document_id<\/code> để gom các đoạn cùng bài (chia tập không để hai đoạn cùng bài rơi vào hai phía).<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Heuristic: nếu dòng đầu là một câu dài (&gt;80 ký tự) thì không coi là tiêu đề.<\/p><\/dd><\/dl>"}, {"a": 46, "b": 51, "title": "clean_title: tiêu đề cho GermanDPR", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Cột <code>title<\/code> của GermanDPR đôi khi dính cả đoạn văn (nhiều dòng) nên chỉ lấy dòng đầu.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: tiêu đề hoặc <code>None<\/code>.<\/p><\/dd><\/dl>"}, {"a": 54, "b": 60, "title": "make_document_id: ID bài viết", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Có tiêu đề: băm tiêu đề đã chuẩn hóa (12 ký tự). Không có: dùng khóa của chính đoạn, mỗi đoạn tự là một 'bài'.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Hai đoạn cùng bài → cùng <code>document_id<\/code> → cùng nhóm khi chia train/dev (GĐ2c).<\/p><\/dd><dt>Cách khác<\/dt><dd><p>Dùng URL hoặc ID bài Wikipedia nếu dataset có; ở đây không có nên dùng tiêu đề.<\/p><\/dd><\/dl>"}], "intro": "<p>Các hàm chuẩn hóa văn bản và tạo ID. Mọi ID trong corpus (<code>p_…<\/code>, <code>q_…<\/code>, <code>d_…<\/code>) đều ra từ file này.<\/p>"}, {"path": "src/germanqa/data/validate_spans.py", "name": "validate_spans.py", "kind": "orig", "lang": "python", "source": "\"\"\"Kiểm tra đáp án có nằm đúng chỗ trong context không.\"\"\"\n\n\ndef find_all(context, text):\n    \"\"\"Mọi vị trí mà `text` xuất hiện trong `context` (có thể chồng lấn).\"\"\"\n    positions, i = [], context.find(text)\n    while i != -1:\n        positions.append(i)\n        i = context.find(text, i + 1)\n    return positions\n\n\ndef validate(context, text, start):\n    \"\"\"Trả về (trạng_thái, start_đúng).\n\n    OK                    offset đã đúng\n    FIXED                 offset sai nhưng đáp án chỉ xuất hiện 1 lần -> sửa\n    LOCATED               không có offset (DPR), đáp án xuất hiện 1 lần -> gán vị trí\n    QUARANTINE_EMPTY      đáp án rỗng\n    OK                    offset đã đúng\n    FIXED                 offset sai nhưng đáp án chỉ xuất hiện 1 lần -> sửa\n    LOCATED               không có offset (DPR), đáp án xuất hiện 1 lần -> gán vị trí\n    QUARANTINE_EMPTY      đáp án rỗng\n    QUARANTINE_AMBIGUOUS  xuất hiện nhiều lần, không biết lần nào là đúng\n    QUARANTINE_NOT_FOUND  không thấy trong context\n    \"\"\"\n    if not text:\n        return \"QUARANTINE_EMPTY\", None\n    if start is not None and start >= 0 and context[start:start + len(text)] == text:\n        return \"OK\", start\n    positions = find_all(context, text)\n    if len(positions) == 1:\n        return (\"FIXED\" if start is not None else \"LOCATED\"), positions[0]\n    if len(positions) > 1:\n        return \"QUARANTINE_AMBIGUOUS\", None\n    return \"QUARANTINE_NOT_FOUND\", None", "notes": [{"a": 4, "b": 10, "title": "find_all: mọi vị trí xuất hiện", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tìm tất cả vị trí mà <code>text<\/code> xuất hiện trong <code>context<\/code>, kể cả chồng lấn (bước tiếp theo là <code>i + 1<\/code>).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Để biết đáp án xuất hiện <strong>một lần<\/strong> (xác định được vị trí) hay <strong>nhiều lần<\/strong> (mơ hồ).<\/p><\/dd><\/dl>"}, {"a": 13, "b": 36, "title": "validate: phân loại đáp án", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Trả về cặp (trạng thái, vị trí đúng): <code>OK<\/code> nếu <code>context[start:start+len]<\/code> đúng bằng đáp án; nếu sai nhưng đáp án chỉ xuất hiện một lần → <code>FIXED<\/code> (có start gốc) hoặc <code>LOCATED<\/code> (không có start, kiểu GermanDPR); nhiều lần → <code>QUARANTINE_AMBIGUOUS<\/code>; không thấy → <code>QUARANTINE_NOT_FOUND<\/code>; rỗng → <code>QUARANTINE_EMPTY<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Nhãn sai vị trí sẽ dạy reader sai. Thay vì đoán, mọi trường hợp không chắc chắn bị <strong>cách ly<\/strong> (quarantine) và ghi lại.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: context, text, start (hoặc None). Ra: (status, start đúng hoặc None).<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>build_qa<\/code> gọi <code>validate<\/code> cho từng đáp án (GĐ2b). Kết quả thật: toàn bộ 18.054 đáp án GermanQuAD đều <code>OK<\/code>, nên không có gì phải sửa hay cách ly.<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Docstring lặp nguyên bốn dòng <code>OK/FIXED/LOCATED/QUARANTINE_EMPTY<\/code> (dòng 16–19 và 20–23). Chỉ là lỗi sao chép trong chú thích, không ảnh hưởng chạy; nên xóa một bản.<\/p><\/dd><\/dl>"}], "intro": "<p>Kiểm tra: văn bản đáp án có thật sự nằm tại vị trí <code>start<\/code> trong context không. Đây là hàng rào chất lượng cho nhãn.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Có bộ hàm chuẩn hóa văn bản, sinh ID xác định và kiểm tra vị trí đáp án.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Dữ liệu thô không sạch: khoảng trắng lạ, ký tự vô hình, đáp án có <code>start<\/code> sai. Nếu không xử lý trước, mỗi lỗi nhỏ sẽ thành lỗi lớn ở reader (nhãn sai) hoặc ở đánh giá (rò rỉ do ID khác nhau cho cùng một câu hỏi).<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>io_utils.sha1_hex<\/code> (băm), dữ liệu thô ở <code>data/raw/<\/code> (GĐ1).<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ2b (<code>build_corpus<\/code>, <code>build_qa<\/code>) gọi mọi hàm ở đây; GĐ3 dùng <code>retrieval_text<\/code>; GĐ4 dùng <code>original_text<\/code> và các offset đã được kiểm.<\/p>", "b": "<h4>Chuẩn hóa Unicode: NFC<\/h4>\n<p>Chữ <code>ä<\/code> có hai cách biểu diễn: một code point (U+00E4, dạng NFC) hoặc <code>a<\/code> + dấu <code>¨<\/code> rời (U+0061 U+0308, dạng NFD). Mắt thường thấy giống nhau, nhưng <code>==<\/code> cho kết quả sai. <code>unicodedata.normalize(\"NFC\", s)<\/code> đưa về dạng gộp. Tiếng Đức có ä ö ü ß nên điều này thật sự xảy ra.<\/p>\n<h4>Vì sao KHÔNG chuẩn hóa <code>original_text<\/code>?<\/h4>\n<p>Reader cắt đáp án bằng <code>context[start:end]<\/code>. Nếu bạn gộp khoảng trắng trong context thì mọi vị trí phía sau đều dịch, và <code>start<\/code> của dataset trở nên sai. Nguyên tắc: <strong>một bản gốc bất biến + các bản dẫn xuất cho từng mục đích<\/strong>.<\/p>\n<h4>Kiểm tra nhãn: máy trạng thái ba nhánh<\/h4>\n<div class=\"math\">validate(context, text, start) →  OK | FIXED | LOCATED | QUARANTINE_{EMPTY|AMBIGUOUS|NOT_FOUND}<\/div>\n<p>Nguyên tắc: <strong>chỉ sửa khi chắc chắn<\/strong>. Đáp án xuất hiện đúng một lần thì vị trí duy nhất là hiển nhiên. Xuất hiện nhiều lần (ví dụ \"Berlin\" lặp trong đoạn) mà không có <code>start<\/code> đáng tin → không biết lần nào là đáp án → cách ly, không đoán.<\/p>\n<h4>Phương pháp thay thế<\/h4>\n<ul><li>Sửa offset bằng fuzzy matching (khoảng cách chỉnh sửa): bao phủ nhiều hơn nhưng có thể gán nhãn sai; project ưu tiên nhãn <strong>sạch<\/strong> hơn <strong>nhiều<\/strong>.<\/li><li>Bỏ hẳn mẫu lỗi mà không ghi lại: mất khả năng truy vết (project ghi vào <code>quarantine.jsonl<\/code> và <code>span_fix_log.jsonl<\/code>).<\/li><\/ul>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>original_text ──────────────────────────────▶ (không đổi) reader, hiển thị\n      │\n      ├─ _ZERO_WIDTH.sub → normalize_text → lower ─▶ retrieval_text (BM25)\n      ├─ sha1_hex ─▶ make_dedup_key ─▶ passage_id_from_key ─▶ \"p_…\"\n      └─ dòng đầu → extract_title / clean_title ─▶ make_document_id ─▶ \"d_…\"\n\nquestion ─ normalize_text + lower + sha1 ─▶ make_question_id ─▶ \"q_…\"\n\n(context, answer_text, start) ─▶ validate ─▶ (status, start_đúng)<\/code><\/pre>\n<p>Ví dụ thật từ <code>data/processed/corpus.jsonl<\/code>: <code>original_text<\/code> bắt đầu bằng <code>Flagge_Äquatorialguineas\\n\\n== Geschichte ==\\n…<\/code>, trong khi <code>retrieval_text<\/code> là <code>flagge_äquatorialguineas == geschichte == …<\/code> (xuống dòng gộp thành dấu cách, chữ thường, giữ <code>ä<\/code>).<\/p>", "e": "<h4>Chạy test sẵn có<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>pytest tests/test_text_utils.py tests/test_validate_spans.py -q<\/code><\/pre>\n<h4>Thử bằng tay<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.data.text_utils import normalize_text, make_question_id, make_retrieval_text\nfrom germanqa.data.validate_spans import validate\n\nprint(normalize_text(\"  Köln \\xa0 am   Rhein \"))     # 'Köln am Rhein'\nprint(make_question_id(\"Wer war Adenauer?\") == make_question_id(\"  wer WAR adenauer? \"))   # True\nprint(make_retrieval_text(\"Straße\\u200b  GROSS\"))     # 'straße gross'\nprint(validate(\"Berlin ist die Hauptstadt.\", \"Berlin\", 0))     # ('OK', 0)\nprint(validate(\"Berlin und Berlin\", \"Berlin\", 3))              # ('QUARANTINE_AMBIGUOUS', None)\nprint(validate(\"Köln\", \"Bonn\", None))                          # ('QUARANTINE_NOT_FOUND', None)<\/code><\/pre>\n<h4>Assertion nên có<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>assert validate(\"abc\", \"\", 0)[0] == \"QUARANTINE_EMPTY\"\nassert validate(\"a b\", \"b\", 0) == (\"FIXED\", 2)       # start sai nhưng chỉ có một vị trí\nassert validate(\"a b\", \"b\", None) == (\"LOCATED\", 2)  # DPR: không có start<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Dùng <code>.lower()<\/code> trước <code>normalize_text<\/code> hay sau? Ở đây <code>normalize_text<\/code> rồi <code>.lower()<\/code> trong <code>make_retrieval_text<\/code>; đổi thứ tự có thể đổi kết quả với một số ký tự đặc biệt.<\/li><li>Quên rằng <code>str.find<\/code> trả <code>-1<\/code> khi không thấy: <code>find_all<\/code> xử lý bằng điều kiện <code>!= -1<\/code>.<\/li><\/ul>", "f": "<ul><li><code>original_text<\/code> <strong>bất biến<\/strong>; mọi bản khác là dẫn xuất.<\/li><li>ID băm nội dung → khử trùng lặp và phát hiện rò rỉ.<\/li><li>Chỉ <strong>sửa nhãn khi chắc chắn<\/strong>; còn lại cách ly và ghi log.<\/li><li>NFC + gộp khoảng trắng + bỏ ký tự vô hình trước khi so sánh/băm chuỗi.<\/li><li><code>document_id<\/code> là mầm của việc chia dữ liệu <strong>theo nhóm<\/strong> ở GĐ2c.<\/li><\/ul>", "g": "<ol><li>Tự viết <code>validate<\/code> không nhìn code, rồi so với bản gốc bằng 6 ca thử (đủ 6 trạng thái).<\/li><li>Tại sao <code>make_dedup_key<\/code> băm <code>original_text<\/code> mà không băm <code>retrieval_text<\/code>? Hãy dựng ví dụ hai đoạn khác nhau nhưng có cùng <code>retrieval_text<\/code>, và nói điều gì sai nếu gộp chúng.<\/li><li><code>extract_title<\/code> có thể nhầm một câu ngắn ở dòng đầu thành tiêu đề. Đề xuất một cách giảm nhầm lẫn và đo trên 200 context đầu của GermanQuAD.<\/li><\/ol>"}, {"id": "s3", "num": 3, "title": "Dựng corpus, nhãn QA và qrels", "gd": "GĐ2b · dữ liệu xử lý", "files": [{"path": "src/germanqa/data/build_corpus.py", "name": "build_corpus.py", "kind": "orig", "lang": "python", "source": "from germanqa.data.text_utils import (clean_title, extract_title, make_dedup_key,\n                                 make_document_id, make_retrieval_text,\n                                 passage_id_from_key)\n\n\ndef _add(corpus, text, title, source):\n    \"\"\"Thêm một đoạn vào corpus. Đoạn đã có (cùng nội dung) -> chỉ ghi thêm nguồn.\"\"\"\n    key = make_
