e>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cần bản <strong>fast<\/strong> (Rust) vì chỉ bản fast mới trả <code>offset_mapping<\/code> (token ↔ vị trí ký tự) và các cửa sổ tràn.<\/p><\/dd><\/dl>"}, {"a": 44, "b": 46, "title": "Kiểm tra từ vựng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Số token của tokenizer phải bằng số dòng <code>vocab.txt<\/code>.<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Nếu bỏ, lỗi 'mọi từ thành [UNK]' chỉ lộ ra khi EM thấp bất thường, sau hàng giờ huấn luyện.<\/p><\/dd><\/dl>"}], "intro": "<p>Dựng tokenizer WordPiece của BERT trực tiếp từ <code>vocab.txt<\/code>, có kiểm tra để không âm thầm biến mọi từ thành <code>[UNK]<\/code>.<\/p>"}, {"path": "src/germanqa/reader/features.py", "name": "features.py", "kind": "orig", "lang": "python", "source": "\n\"\"\"Biến (câu hỏi, đoạn văn, đáp án) thành các cửa sổ token có nhãn (GĐ4.2).\"\"\"\nfrom germanqa.data.io_utils import read_json, read_jsonl\n\n\ndef load_examples(data_dir, split):\n    \"\"\"Đọc qa_<split>.jsonl và gắn nguyên văn đoạn đúng (original_text) làm context.\"\"\"\n    corpus = {r[\"passage_id\"]: r[\"original_text\"] for r in read_jsonl(data_dir / \"corpus.jsonl\")}\n    return [{\"id\": r[\"question_id\"], \"question\": r[\"question\"],\n             \"context\": corpus[r[\"passage_id\"]], \"answers\": r[\"answers\"]}\n            for r in read_jsonl(data_dir / f\"qa_{split}.jsonl\")]\n\n\ndef answer_chars(answer):\n    \"\"\"[start, end) của đáp án trên context, bỏ khoảng trắng thừa ở hai đầu.\n    Nhiều đáp án gốc có dấu cách ở cuối (ví dụ 'Web ''World Wide Web'' ').\"\"\"\n    text = answer[\"text\"]\n    lead = len(text) - len(text.lstrip())\n    start = answer[\"start\"] + lead\n    return start, start + len(text.strip())\n\n\ndef _encode(examples, tokenizer, max_length, stride):\n    return tokenizer([e[\"question\"] for e in examples], [e[\"context\"] for e in examples],\n                     truncation=\"only_second\", max_length=max_length, stride=stride,\n                     return_overflowing_tokens=True, return_offsets_mapping=True)\n\n\ndef label_window(offsets, seq_ids, start_char, end_char):\n    \"\"\"Nhãn (start, end) theo chỉ số token trong MỘT cửa sổ.\n    Chỉ gán khi toàn bộ đáp án nằm trong phần context của cửa sổ; ngược lại trả (0, 0) = [CLS].\"\"\"\n    ctx = [i for i, s in enumerate(seq_ids) if s == 1]\n    first, last = ctx[0], ctx[-1]\n    if offsets[first][0] > start_char or offsets[last][1] < end_char:\n        return 0, 0\n    start = next(i for i in ctx if offsets[i][1] > start_char)       # token đầu tiên phủ ký tự bắt đầu\n    end = next(i for i in reversed(ctx) if offsets[i][0] < end_char)  # token cuối cùng phủ ký tự kết thúc\n    return start, end\n\n\ndef prepare_train_features(examples, tokenizer, max_length=384, stride=128, keep_offsets=False):\n    \"\"\"Mỗi ví dụ cho một hoặc nhiều cửa sổ; nhãn lấy đáp án đầu tiên (train chỉ có một).\n    keep_offsets=True giữ thêm offsets để kiểm tra nhãn bằng mắt (không cần khi huấn luyện).\"\"\"\n    enc = _encode(examples, tokenizer, max_length, stride)\n    feats = []\n    for i, ex_idx in enumerate(enc[\"overflow_to_sample_mapping\"]):\n        s_char, e_char = answer_chars(examples[ex_idx][\"answers\"][0])\n        start, end = label_window(enc[\"offset_mapping\"][i], enc.sequence_ids(i), s_char, e_char)\n        feats.append({\"input_ids\": enc[\"input_ids\"][i],\n                      \"token_type_ids\": enc[\"token_type_ids\"][i],\n                      \"start_positions\": start, \"end_positions\": end,\n                      \"example_index\": ex_idx})\n        if keep_offsets:\n            feats[-1][\"offsets\"] = enc[\"offset_mapping\"][i]\n    return feats\n\n\ndef prepare_eval_features(examples, tokenizer, max_length=384, stride=128):\n    \"\"\"Giống train nhưng không có nhãn; giữ offsets của token context (None cho phần còn lại).\"\"\"\n    enc = _encode(examples, tokenizer, max_length, stride)\n    feats = []\n    for i, ex_idx in enumerate(enc[\"overflow_to_sample_mapping\"]):\n        seq_ids = enc.sequence_ids(i)\n        feats.append({\"input_ids\": enc[\"input_ids\"][i],\n                      \"token_type_ids\": enc[\"token_type_ids\"][i],\n                      \"offsets\": [o if s == 1 else None for o, s in zip(enc[\"offset_mapping\"][i], seq_ids)],\n                      \"example_index\": ex_idx})\n    return feats", "notes": [{"a": 6, "b": 11, "title": "load_examples", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc <code>qa_&lt;split&gt;.jsonl<\/code>, gắn **<code>original_text<\/code>** của đoạn đúng làm <code>context<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: <code>[{id, question, context, answers}]<\/code>.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Phải là <code>original_text<\/code>: offset đáp án được tính trên bản này (GĐ2).<\/p><\/dd><\/dl>"}, {"a": 14, "b": 20, "title": "answer_chars: vị trí ký tự đã gọt khoảng trắng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tính <code>[start, end)<\/code> của đáp án sau khi bỏ khoảng trắng thừa ở hai đầu (<code>lead<\/code> = số ký tự trắng đầu).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Nhiều đáp án gốc có dấu cách cuối (docstring dẫn ví dụ <code>'Web ''World Wide Web'' '<\/code>). Không gọt thì nhãn end rơi vào token khoảng trắng không tồn tại.<\/p><\/dd><\/dl>"}, {"a": 23, "b": 26, "title": "_encode: cắt cửa sổ trượt", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mã hóa cặp (câu hỏi, context) với <code>truncation=\"only_second\"<\/code> (chỉ cắt context), <code>max_length=384<\/code>, <code>stride=128<\/code>, trả các cửa sổ tràn và <code>offset_mapping<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>BERT nhận tối đa 512 token; đoạn dài hơn phải chia thành nhiều cửa sổ <strong>chồng lấn<\/strong> 128 token, để đáp án nằm ở ranh giới vẫn trọn vẹn trong ít nhất một cửa sổ.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: <code>input_ids[i]<\/code>, <code>token_type_ids[i]<\/code>, <code>offset_mapping[i]<\/code> (list cặp <code>(char_start, char_end)<\/code>), <code>overflow_to_sample_mapping[i]<\/code> (cửa sổ i thuộc ví dụ nào).<\/p><\/dd><\/dl>"}, {"a": 29, "b": 38, "title": "label_window: nhãn trong một cửa sổ", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>ctx<\/code> = các vị trí token thuộc context (<code>sequence_id == 1<\/code>). Nếu đáp án <strong>không nằm trọn<\/strong> trong context của cửa sổ → nhãn <code>(0, 0)<\/code> = token <code>[CLS]<\/code> ('cửa sổ này không có đáp án'). Ngược lại: <code>start<\/code> = token đầu tiên có <code>end_char &gt; start_char<\/code>; <code>end<\/code> = token cuối cùng có <code>start_char &lt; end_char<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Đây là cầu nối giữa nhãn <strong>ký tự<\/strong> (dataset) và nhãn <strong>token<\/strong> (mô hình).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: offsets, seq_ids, start_char, end_char. Ra: (start_token, end_token).<\/p><\/dd><dt>Cách khác<\/dt><dd><p>Bỏ hẳn cửa sổ không có đáp án khỏi train: ít dữ liệu hơn và mô hình không học được 'cửa sổ này không có đáp án', vốn cần cho <code>minus_cls<\/code> (GĐ4c).<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Lỗi kinh điển: so sánh <code>&gt;=<\/code> thay vì <code>&gt;<\/code> ở điều kiện chọn token, làm lệch một token khi đáp án bắt đầu ngay ranh giới token.<\/p><\/dd><\/dl>"}, {"a": 41, "b": 55, "title": "prepare_train_features", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi cửa sổ thành một feature: <code>input_ids<\/code>, <code>token_type_ids<\/code>, <code>start_positions<\/code>, <code>end_positions<\/code>, <code>example_index<\/code>. Nhãn lấy đáp án <strong>đầu tiên<\/strong> (train chỉ có một). <code>keep_offsets=True<\/code> giữ offsets để kiểm nhãn bằng mắt.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Script <code>scripts/GD4/04b_check_features.py<\/code> dùng để kiểm nhãn trước khi huấn luyện.<\/p><\/dd><\/dl>"}, {"a": 58, "b": 68, "title": "prepare_eval_features", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Giống trên nhưng <strong>không có nhãn<\/strong>; <code>offsets<\/code> của token không thuộc context được đặt <code>None<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Ở bước giải mã (GĐ4c), span nào chạm token <code>None<\/code> (câu hỏi, <code>[CLS]<\/code>, <code>[SEP]<\/code>) bị loại ngay.<\/p><\/dd><\/dl>"}], "intro": "<p>Biến (câu hỏi, đoạn, đáp án) thành các <strong>cửa sổ token<\/strong> có nhãn start/end, đúng định dạng mô hình QA cần.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Có tokenizer WordPiece đáng tin và hàm tạo <strong>cửa sổ token có nhãn<\/strong> cho reader.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Mô hình chỉ hiểu ID token, còn nhãn đáp án là vị trí ký tự. Giai đoạn này nối hai thế giới đó và xử lý đoạn dài hơn giới hạn của BERT.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>qa_*.jsonl<\/code> + <code>corpus.jsonl<\/code> (GĐ2); <code>vocab.txt<\/code> của <code>deepset/gbert-base<\/code>.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ4b huấn luyện trên <code>prepare_train_features<\/code>; GĐ4c giải mã logit bằng <code>offsets<\/code> của <code>prepare_eval_features<\/code>; GĐ5 dùng lại cho mọi đoạn truy hồi được.<\/p>", "b": "<h4>WordPiece<\/h4>\n<p>Từ vựng cố định (~31 nghìn mảnh với GBERT). Một từ chưa có trong từ vựng được tách tham lam từ trái sang phải thành mảnh dài nhất có trong từ vựng, mảnh nối thêm <code>##<\/code>: <code>Bundeskanzlerin<\/code> → <code>Bundes ##kanzler ##in<\/code> (ví dụ minh họa; cách tách thật tùy từ vựng). Không bao giờ hết từ vựng (cùng lắm tách thành ký tự), nên <code>[UNK]<\/code> hiếm khi xuất hiện.<\/p>\n<h4>Định dạng đầu vào của QA trích xuất (kiểu SQuAD)<\/h4>\n<pre class=\"blk\" data-lang=\"text\"><code>[CLS] câu hỏi … [SEP] context … [SEP] [PAD] …\nseg:  0   0 …     0     1 …       1     0<\/code><\/pre>\n<p>Mô hình dự đoán hai phân phối trên các vị trí token: <strong>start<\/strong> và <strong>end<\/strong>. Đáp án là đoạn token <code>[start, end]<\/code>, đổi về ký tự bằng <code>offset_mapping<\/code>.<\/p>\n<h4>Cửa sổ trượt<\/h4>\n<p>Với <code>max_length = 384<\/code>, <code>stride = 128<\/code>, câu hỏi dài q token: mỗi cửa sổ chứa tối đa <code>384 − q − 3<\/code> token context, cửa sổ sau lùi lại 128 token so với điểm kết thúc cửa sổ trước. Số liệu thật (GĐ4, dev): 830 câu cần 1 cửa sổ, 345 câu cần 2, 1 câu cần ≥ 3.<\/p>\n<h4>Nhãn cho cửa sổ không chứa đáp án<\/h4>\n<p>Trỏ về <code>[CLS]<\/code> (vị trí 0). Mô hình học \"điểm của <code>[CLS]<\/code> cao = cửa sổ này không có đáp án\". GĐ4c dùng chính điểm này để so sánh công bằng giữa các cửa sổ/đoạn (<code>score_mode = minus_cls<\/code>).<\/p>\n<h4>Thay thế<\/h4>\n<p>SentencePiece/Unigram (XLM-R, mô hình đa ngôn ngữ); BPE (GPT). GBERT dùng WordPiece nên phải dùng đúng loại của nó.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>qa_train.jsonl + corpus.jsonl ─ load_examples ─▶ [{id, question, context, answers}]\n     │\n     └─ _encode(tokenizer, max_length=384, stride=128)\n            ├─ input_ids[w]           list[int], ≤ 384\n            ├─ token_type_ids[w]      0 = câu hỏi, 1 = context\n            ├─ offset_mapping[w]      [(c0, c1)] mỗi token\n            └─ overflow_to_sample_mapping[w] → chỉ số ví dụ\n     │\n     ├─ train: answer_chars + label_window ─▶ start_positions, end_positions (0,0 nếu không có)\n     └─ eval : offsets (None ngoài context)<\/code><\/pre>\n<p>Một ví dụ dài 600 token context → 2 cửa sổ (chồng 128). Khi huấn luyện chúng là 2 mẫu độc lập.<\/p>", "e": "<h4>Kiểm tra tokenizer<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.reader.model_io import get_tokenizer\ntok = get_tokenizer(\"deepset/gbert-base\")\nenc = tok(\"Wer war Adenauer?\", \"Konrad Adenauer war der erste Bundeskanzler.\", return_offsets_mapping=True)\nprint(tok.convert_ids_to_tokens(enc[\"input_ids\"]))\nprint(enc[\"offset_mapping\"])          # (0,0) cho token đặc biệt\nassert \"[UNK]\" not in tok.convert_ids_to_tokens(enc[\"input_ids\"])<\/code><\/pre>\n<h4>Kiểm nhãn bằng mắt<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/GD4/04b_check_features.py<\/code><\/pre>\n<p>Với một vài feature: giải mã <code>input_ids[start:end+1]<\/code> và so với văn bản đáp án. Phải khớp (sai khác chỉ ở khoảng trắng/<code>##<\/code>).<\/p>\n<h4>Assertion nên có<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>feats = prepare_train_features(ex, tok, 384, 128, keep_offsets=True)\nfor f in feats:\n    s, e = f[\"start_positions\"], f[\"end_positions\"]\n    assert (s, e) == (0, 0) or 0 &lt; s &lt;= e\n    if s:\n        a, b = f[\"offsets\"][s][0], f[\"offsets\"][e][1]\n        ctx = ex[f[\"example_index\"]][\"context\"]\n        ans = ex[f[\"example_index\"]][\"answers\"][0][\"text\"].strip()\n        assert ctx[a:b] == ans<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Dùng tokenizer <strong>chậm<\/strong> (không fast) → không có <code>offset_mapping<\/code>.<\/li><li><code>truncation=True<\/code> thay vì <code>\"only_second\"<\/code> → câu hỏi bị cắt thay cho context.<\/li><li>Quên <code>stride<\/code> → đáp án ở cuối đoạn dài bị mất hẳn.<\/li><\/ul>", "f": "<ul><li>Nhãn ký tự ↔ nhãn token đi qua <code>offset_mapping<\/code>.<\/li><li>Đoạn dài → cửa sổ chồng lấn (<code>max_length=384<\/code>, <code>stride=128<\/code>).<\/li><li>Cửa sổ không chứa đáp án → nhãn <code>[CLS]<\/code> (0,0).<\/li><li>GBERT là <strong>cased<\/strong>: không chữ thường, không bỏ umlaut.<\/li><li>Luôn kiểm tra tokenizer nạp đủ từ vựng.<\/li><\/ul>", "g": "<ol><li>Viết lại <code>label_window<\/code> và kiểm trên 500 ví dụ train rằng mọi nhãn khác (0,0) đều giải mã ra đúng văn bản đáp án (đã gọt khoảng trắng).<\/li><li>Tìm câu dev cần nhiều cửa sổ nhất. Vẽ ra cửa sổ nào chứa đáp án và phần chồng lấn.<\/li><li>Đổi <code>stride<\/code> từ 128 xuống 32: số cửa sổ thay đổi ra sao, và có ví dụ nào đáp án <strong>không còn nằm trọn<\/strong> trong cửa sổ nào nữa không? Giải thích bằng hình học của cửa sổ.<\/li><\/ol>"}, {"id": "s7", "num": 7, "title": "Huấn luyện reader (fine-tune GBERT)", "gd": "GĐ4b · reader", "files": [{"path": "src/germanqa/reader/model_io.py", "name": "model_io.py", "kind": "orig", "lang": "python", "source": "### File này làm ba việc: tìm hoặc tải mô hình, nạp tokenizer qua load_bert_tokenizer, nạp mô hình. Chép đúng nội dung này: ###\n\n\"\"\"Nạp tokenizer và mô hình reader (GĐ4).\"\"\"\nimport json\nfrom pathlib import Path\n\nfrom huggingface_hub import hf_hub_download\nfrom transformers import AutoModelForQuestionAnswering, BertForQuestionAnswering\n\nfrom germanqa.tokenization import load_bert_tokenizer\n\n\ndef _download(repo_id, filenames):\n    \"\"\"Tải từng file riêng lẻ (không gọi API liệt kê repo, vốn hay bị ngắt kết nối).\"\"\"\n    last = None\n    for name in filenames:\n        try:\n            return Path(hf_hub_download(repo_id, name))\n        except Exception as err:          # thử tên file kế tiếp\n            last = err\n    raise last\n\n\ndef resolve_dir(model_name):\n    \"\"\"Trả về thư mục chứa mô hình: đường dẫn cục bộ nếu có, nếu không thì tải từ Hub.\"\"\"\n    local = Path(model_name)\n    if local.is_dir():\n        return local\n    config = _download(model_name, [\"config.json\"])\n    _download(model_name, [\"vocab.txt\"])\n    _download(model_name, [\"model.safetensors\", \"pytorch_model.bin\"])\n    return config.parent\n\n\ndef get_tokenizer(model_name):\n    \"\"\"Tokenizer WordPiece phân biệt chữ hoa/thường, đúng với họ GBERT/GELECTRA.\"\"\"\n    folder = resolve_dir(model_name)\n    return load_bert_tokenizer(folder / \"vocab.txt\")\n\n\ndef get_model(model_name):\n    \"\"\"Backbone tiền huấn luyện cộng đầu start/end (khởi tạo ngẫu nhiên nếu chưa học QA).\n\n    config.json của deepset/gbert-base không có khóa \"model_type\"; transformers 5.x không còn đoán\n    được từ tên thư mục như bản cũ, nên trường hợp đó chỉ định thẳng lớp BERT.\"\"\"\n    folder = resolve_dir(model_name)\n    config = json.loads((folder / \"config.json\").read_text(encoding=\"utf-8\"))\n    if \"model_type\" not in config:\n        return BertForQuestionAnswering.from_pretrained(str(folder))\n    return AutoModelForQuestionAnswering.from_pretrained(str(folder))", "notes": [{"a": 1, "b": 1, "title": "Dòng chú thích lạc", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dòng 1 là chú thích hướng dẫn còn sót lại từ lúc chép code (bắt đầu bằng <code>#<\/code>, nên Python bỏ qua).<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Vô hại nhưng nên xóa: docstring thật của module là dòng 3.<\/p><\/dd><\/dl>"}, {"a": 13, "b": 21, "title": "_download: tải từng file, có phương án dự phòng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Thử lần lượt các tên file (ví dụ <code>model.safetensors<\/code> rồi <code>pytorch_model.bin<\/code>), trả file đầu tiên tải được.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Không gọi API liệt kê repo (hay bị ngắt kết nối); tải thẳng từng file cần thiết.<\/p><\/dd><\/dl>"}, {"a": 24, "b": 32, "title": "resolve_dir: thư mục cục bộ hoặc tải từ Hub", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nếu <code>model_name<\/code> là thư mục có sẵn (ví dụ <code>models/reader_…<\/code>) thì dùng; không thì tải <code>config.json<\/code>, <code>vocab.txt<\/code>, trọng số về cache và trả thư mục cache.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Cùng một hàm phục vụ cả backbone (<code>deepset/gbert-base<\/code>) lẫn checkpoint đã fine-tune.<\/p><\/dd><\/dl>"}, {"a": 35, "b": 38, "title": "get_tokenizer", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nạp tokenizer bằng <code>load_bert_tokenizer<\/code> (GĐ4a).<\/p><\/dd><\/dl>"}, {"a": 41, "b": 50, "title": "get_model: backbone + đầu QA", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nếu <code>config.json<\/code> không có <code>model_type<\/code> (trường hợp <code>deepset/gbert-base<\/code>) thì chỉ định thẳng <code>BertForQuestionAnswering<\/code>; còn lại dùng <code>AutoModelForQuestionAnswering<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Đầu QA là một lớp <code>Linear(768 → 2)<\/code> khởi tạo <strong>ngẫu nhiên<\/strong>: backbone đã học tiếng Đức nhưng chưa học QA. Fine-tune sẽ dạy lớp này (và chỉnh cả backbone).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: mô hình; <code>forward<\/code> trả <code>start_logits<\/code>, <code>end_logits<\/code> shape <code>[B, L]<\/code> và <code>loss<\/code> nếu có nhãn.<\/p><\/dd><\/dl>"}], "intro": "<p>Tìm/tải mô hình, nạp tokenizer, nạp mô hình QA.<\/p>"}, {"path": "src/germanqa/reader/trainer.py", "name": "trainer.py", "kind": "orig", "lang": "python", "source": "\"\"\"Vòng huấn luyện và suy luận cho reader (GĐ4.3).\"\"\"\nimport random\nimport time\n\nimport numpy as np\nimport torch\n\nfrom germanqa.reader.postprocess import best_answers\nfrom germanqa.reader.qa_metrics import evaluate_answers\n\n\ndef collate(batch, pad_id=0):\n    \"\"\"Ghép các cửa sổ thành một lô, đệm (pad) tới độ dài lớn nhất TRONG LÔ.\"\"\"\n    n = max(len(f[\"input_ids\"]) for f in batch)\n    ids = torch.full((len(batch), n), pad_id, dtype=torch.long)\n    types = torch.zeros((len(batch), n), dtype=torch.long)\n    mask = torch.zeros((len(batch), n), dtype=torch.long)\n    for i, f in enumerate(batch):\n        k = len(f[\"input_ids\"])\n        ids[i, :k] = torch.tensor(f[\"input_ids\"])\n        types[i, :k] = torch.tensor(f[\"token_type_ids\"])\n        mask[i, :k] = 1\n    out = {\"input_ids\": ids, \"token_type_ids\": types, \"attention_mask\": mask}\n    if \"start_positions\" in batch[0]:\n        out[\"start_positions\"] = torch.tensor([f[\"start_positions\"] for f in batch])\n        out[\"end_positions\"] = torch.tensor([f[\"end_positions\"] for f in batch])\n    return out\n\n\n@torch.no_grad()\ndef predict_logits(model, feats, batch_size=32, device=\"cuda\", fp16=True):\n    \"\"\"Chạy mô hình trên mọi cửa sổ; trả về (start_logits, end_logits) là danh sách mảng numpy,\n    mỗi mảng có độ dài đúng bằng số token của cửa sổ đó (không dính phần đệm).\"\"\"\n    model.eval()\n    order = sorted(range(len(feats)), key=lambda i: len(feats[i][\"input_ids\"]))   # nhóm theo độ dài\n    starts, ends = [None] * len(feats), [None] * len(feats)\n    for b in range(0, len(order), batch_size):\n        idx = order[b:b + batch_size]\n        batch = {k: v.to(device) for k, v in collate([feats[i] for i in idx]).items()}\n        with torch.autocast(device_type=\"cuda\", dtype=torch.float16, enabled=fp16 and device == \"cuda\"):\n            out = model(**batch)\n        s, e = out.start_logits.float().cpu().numpy(), out.end_logits.float().cpu().numpy()\n        for row, i in enumerate(idx):\n            n = len(feats[i][\"input_ids\"])\n            starts[i], ends[i] = s[row, :n], e[row, :n]\n    return starts, ends\n\n\ndef evaluate(model, examples, feats, n_best, max_answer_tokens, batch_size, device, fp16=True):\n    s, e = predict_logits(model, feats, batch_size, device, fp16)\n    preds = best_answers(examples, feats, s, e, n_best, max_answer_tokens)\n    return evaluate_answers(preds, examples), preds\n\n\ndef train(model, train_feats, dev_examples, dev_feats, cfg, seed, device, log):\n    \"\"\"AdamW + warmup tuyến tính rồi giảm tuyến tính; fp16 autocast + GradScaler;\n    gradient accumulation; giữ checkpoint có EM+F1 dev tốt nhất. Trả về (best_state, history).\"\"\"\n    t = cfg[\"train\"]\n    rng = random.Random(seed)\n    model.to(device)\n    no_decay = (\"bias\", \"LayerNorm.weight\")\n    groups = [\n        {\"params\": [p for n, p in model.named_parameters() if not any(x in n for x in no_decay)],\n         \"weight_decay\": t[\"weight_decay\"]},\n        {\"params\": [p for n, p in model.named_parameters() if any(x in n for x in no_decay)],\n         \"weight_decay\": 0.0},\n    ]\n    opt = torch.optim.AdamW(groups, lr=t[\"lr\"])\n    steps_per_epoch = -(-len(train_feats) // (t[\"batch_size\"] * t[\"grad_accum\"]))\n    total = steps_per_epoch * t[\"epochs\"]\n    warm = int(total * t[\"warmup_ratio\"])\n    sched = torch.optim.lr_scheduler.LambdaLR(\n        opt, lambda s: (s + 1) / max(warm, 1) if s < warm else max(0.0, (total - s) / max(total - warm, 1)))\n    scaler = torch.amp.GradScaler(\"cuda\", enabled=t[\"fp16\"] and device == \"cuda\")\n\n    best, best_state, history, step = -1.0, None, [], 0\n    t0 = time.time()\n    for epoch in range(1, t[\"epochs\"] + 1):\n        model.train()\n        order = list(range(len(train_feats)))\n        rng.shuffle(order)\n        batches = [order[i:i + t[\"batch_size\"]] for i in range(0, len(order), t[\"batch_size\"])]\n        run_loss, n_loss = 0.0, 0\n        for bi, idx in enumerate(batches, start=1):\n            batch = {k: v.to(device) for k, v in collate([train_feats[i] for i in idx]).items()}\n            with torch.autocast(device_type=\"cuda\", dtype=torch.float16, enabled=t[\"fp16\"] and device == \"cuda\"):\n                loss = model(**batch).loss / t[\"grad_accum\"]\n            scaler.scale(loss).backward()\n            run_loss += loss.item() * t[\"grad_accum\"]\n            n_loss += 1\n            if bi % t[\"grad_accum\"] == 0 or bi == len(batches):\n                scaler.unscale_(opt)\n                torch.nn.utils.clip_grad_norm_(model.parameters(), t[\"max_grad_norm\"])\n                scaler.step(opt)\n                scaler.update()\n                opt.zero_grad(set_to_none=True)\n                sched.step()\n                step += 1\n                if step % t[\"log_every\"] == 0:\n                    log(f\"epoch {epoch} step {step}/{total} loss {run_loss / n_loss:.4f} \"\n                        f\"lr {sched.get_last_lr()[0]:.2e} {time.time() - t0:.0f}s\")\n                    run_loss, n_loss = 0.0, 0\n        metrics, _ = evaluate(model, dev_examples, dev_feats, cfg[\"n_best\"], cfg[\"max_answer_tokens\"],\n                              cfg[\"eval_batch_size\"], device, t[\"fp16\"])\n        history.append({\"epoch\": epoch, \"step\": step, \"dev\": metrics, \"seconds\": round(time.time() - t0)})\n        log(f\"== epoch {epoch}: dev EM {metrics['em']:.4f} F1 {metrics['f1']:.4f}\")\n        if metrics[\"em\"] + metrics[\"f1\"] > best:\n            best = metrics[\"em\"] + metrics[\"f1\"]\n            best_state = {k: v.detach().cpu().clone() for k, v in model.state_dict().items()}\n    return best_state, history\n\n\ndef set_all_seeds(seed):\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)", "notes": [{"a": 12, "b": 27, "title": "collate: ghép lô có đệm động", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Độ dài lô = cửa sổ dài nhất <strong>trong lô<\/strong>. Tạo <code>input_ids<\/code> (đệm <code>pad_id=0<\/code>), <code>token_type_ids<\/code>, <code>attention_mask<\/code> (1 = token thật). Có nhãn thì thêm <code>start_positions<\/code>, <code>end_positions<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Đệm động thay vì luôn đệm 384 → ít phép tính thừa.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: tensor <code>long<\/code> shape <code>[B, L_max]<\/code>; nhãn shape <code>[B]<\/code>.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p><code>attention_mask<\/code> phải là 0 ở phần đệm, nếu không mô hình 'nhìn' cả token <code>[PAD]<\/code>.<\/p><\/dd><\/dl>"}, {"a": 30, "b": 46, "title": "predict_logits: suy luận theo lô", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Sắp feature theo độ dài (ít đệm), chạy mô hình theo lô với <code>autocast<\/code> fp16 (chỉ khi CUDA), rồi <strong>cắt bỏ phần đệm<\/strong>: mỗi mảng logit dài đúng số token của cửa sổ đó, trả về theo <strong>thứ tự gốc<\/strong>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: hai list, phần tử i là <code>np.ndarray<\/code> shape <code>(len_i,)<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dùng chung cho đánh giá khi huấn luyện, GĐ4c và <code>Reader<\/code> (GĐ5).<\/p><\/dd><\/dl>"}, {"a": 49, "b": 52, "title": "evaluate", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>logit → <code>best_answers<\/code> (giải mã) → <code>evaluate_answers<\/code> (EM/F1).<\/p><\/dd><\/dl>"}, {"a": 55, "b": 68, "title": "train (1): optimizer AdamW", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chia tham số làm hai nhóm: có weight decay (0,01) và <strong>không<\/strong> có (bias, LayerNorm). AdamW với <code>lr = 3e-5<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Weight decay trên bias/LayerNorm làm hại ổn định; đây là công thức chuẩn khi fine-tune BERT.<\/p><\/dd><\/dl>"}, {"a": 69, "b": 74, "title": "train (2): lịch học (learning-rate schedule)", "html": "<div class=\"math\">bước s &lt; warm:  lr(s) = lr · (s+1)/warm\nbước s ≥ warm:  lr(s) = lr · (total − s)/(total − warm)<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>steps_per_epoch = ceil(số cửa sổ / (8 × 2))<\/code> (chia lấy trần bằng <code>-(-a // b)<\/code>). Warmup 10% tổng số bước rồi giảm tuyến tính về 0. <code>GradScaler<\/code> cho fp16.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Warmup tránh cập nhật quá mạnh khi đầu QA còn ngẫu nhiên; giảm dần giúp hội tụ.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thật: 829 bước/epoch × 3 epoch = 2.487 bước.<\/p><\/dd><\/dl>"}, {"a": 76, "b": 82, "title": "train (3): mỗi epoch xáo dữ liệu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Xáo thứ tự cửa sổ bằng <code>random.Random(seed)<\/code> (tái lập), chia lô 8.<\/p><\/dd><\/dl>"}, {"a": 83, "b": 90, "title": "train (4): forward + backward", "html": "<div class=\"math\">L = ½ · [ CE(start_logits, y_start) + CE(end_logits, y_end) ]<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Forward dưới <code>autocast<\/code> fp16; <code>loss<\/code> (mô hình tự tính, là trung bình cross-entropy của start và end) chia cho <code>grad_accum<\/code>; <code>scaler.scale(loss).backward()<\/code> cộng dồn gradient.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Chia <code>grad_accum = 2<\/code> để gradient cộng dồn của hai lô 8 tương đương một lô 16 (lô hiệu dụng 16) mà GPU 4 GB không phải chứa 16 cửa sổ cùng lúc.<\/p><\/dd><\/dl>"}, {"a": 91, "b": 102, "title": "train (5): bước cập nhật", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi <code>grad_accum<\/code> lô (hoặc lô cuối): <code>unscale_<\/code> → cắt gradient (<code>max_grad_norm = 1.0<\/code>) → <code>scaler.step<\/code> → <code>update<\/code> → xóa gradient → <code>sched.step()<\/code>. Log loss trung bình mỗi 50 bước.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p><code>unscale_<\/code> <strong>trước<\/strong> khi cắt gradient: cắt trên gradient đã nhân hệ số fp16 là cắt sai ngưỡng.<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Nhóm lô cuối epoch có thể chỉ có 1 lô thay vì 2 mà loss vẫn chia 2, nên bước cuối có gradient nhỏ hơn một nửa. Ảnh hưởng không đáng kể (1 bước / 829).<\/p><\/dd><\/dl>"}, {"a": 103, "b": 110, "title": "train (6): chọn checkpoint theo dev", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Cuối mỗi epoch đo EM/F1 trên dev; nếu <code>EM + F1<\/code> tốt nhất thì sao chép <code>state_dict<\/code> sang CPU.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Không lấy epoch cuối một cách mù quáng. Kết quả thật: epoch 2 thắng (EM 0,450 · F1 0,679), epoch 3 hơi giảm (0,446 · 0,673).<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Phải <code>.clone()<\/code> sang CPU; giữ tham chiếu tới tensor GPU sẽ bị epoch sau ghi đè.<\/p><\/dd><\/dl>"}, {"a": 113, "b": 117, "title": "set_all_seeds", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Seed cho <code>random<\/code>, <code>numpy<\/code>, <code>torch<\/code>, và mọi GPU.<\/p><\/dd><\/dl>"}], "intro": "<p>Vòng huấn luyện viết tay: AdamW, warmup tuyến tính, fp16, gradient accumulation, chọn checkpoint theo dev.<\/p>"}, {"path": "scripts/GD4/04c_train_reader.py", "name": "04c_train_reader.py", "kind": "orig", "lang": "python", "source": "\n\"\"\"GĐ4.3: fine-tune reader từ backbone tiền huấn luyện trên QA train; chọn checkpoint theo dev.\"\"\"\nimport argparse\nimport json\nimport shutil\nimport time\n\nimport torch\n\nfrom germanqa.config import PROCESSED_DIR, ROOT, SEED\nfrom germanqa.experiment import load_config, new_experiment_id, save_run, set_seed\nfrom germanqa.reader.features import load_examples, prepare_eval_features, prepare_train_features\nfrom germanqa.reader.model_io import get_model, get_tokenizer, resolve_dir\nfrom germanqa.reader.trainer import set_all_seeds, train\n\n\ndef main(limit):\n    cfg = load_config(\"reader\")[\"reader\"]\n    set_seed(SEED)\n    set_all_seeds(SEED)\n    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    log = lambda m: print(time.strftime(\"%H:%M:%S\"), m, flush=True)\n\n    tok = get_tokenizer(cfg[\"model_name\"])\n    train_ex = load_examples(PROCESSED_DIR, \"train\")[:limit]\n    dev_ex = load_examples(PROCESSED_DIR, \"dev\")[:limit]\n    train_f = prepare_train_features(train_ex, tok, cfg[\"max_length\"], cfg[\"stride\"])\n    dev_f = prepare_eval_features(dev_ex, tok, cfg[\"max_length\"], cfg[\"stride\"])\n    log(f\"train {len(train_ex)} câu -> {len(train_f)} cửa sổ; dev {len(dev_ex)} câu -> {len(dev_f)} cửa sổ; thiết bị {device}\")\n\n    model = get_model(cfg[\"model_name\"])\n    state, history = train(model, train_f, dev_ex, dev_f, cfg, SEED, device, log)\n\n    exp_id = new_experiment_id(\"reader\", cfg)\n    out_dir = ROOT / \"models\" / exp_id\n    model.load_state_dict(state)\n    model.save_pretrained(out_dir)\n    shutil.copy(resolve_dir(cfg[\"model_name\"]) / \"vocab.txt\", out_dir / \"vocab.txt\")   # tokenizer = file từ vựng\n    (out_dir / \"reader_config.json\").write_text(json.dumps(cfg, ensure_ascii=False, indent=2, sort_keys=True),\n                                                encoding=\"utf-8\")\n    path = save_run(exp_id, cfg, {\"history\": history}, extra={\"checkpoint\": str(out_dir)})\n    log(f\"đã lưu checkpoint {out_dir} và kết quả {path}\")\n\n\nif __name__ == \"__main__\":\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--limit\", type=int, default=None, help=\"chỉ dùng N câu đầu (chạy thử)\")\n    main(ap.parse_args().limit)", "notes": [{"a": 17, "b": 22, "title": "Chuẩn bị", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc <code>configs/reader.yaml<\/code>, cố định seed, chọn thiết bị.<\/p><\/dd><\/dl>"}, {"a": 24, "b": 29, "title": "Dữ liệu → feature", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nạp ví dụ train/dev (tùy chọn <code>--limit<\/code> để chạy thử nhanh), tạo feature train (có nhãn) và dev (không nhãn).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thật: khoảng 13,3 nghìn cửa sổ train (829 bước × 16).<\/p><\/dd><\/dl>"}, {"a": 31, "b": 32, "title": "Huấn luyện", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nạp <code>deepset/gbert-base<\/code> + đầu QA mới và chạy <code>train<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thật trên RTX 3050 4 GB: ≈ 3.176 giây (≈ 53 phút) cho 3 epoch.<\/p><\/dd><\/dl>"}, {"a": 34, "b": 42, "title": "Lưu checkpoint", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Thư mục <code>models/&lt;exp_id&gt;/<\/code>: trọng số tốt nhất (<code>save_pretrained<\/code>), <code>vocab.txt<\/code> (tokenizer chính là file từ vựng), <code>reader_config.json<\/code> (cấu hình đã dùng), và <code>results/&lt;exp_id&gt;.json<\/code> (lịch sử).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Checkpoint tự đủ: GĐ5 và API chỉ cần thư mục này để chạy, không cần mạng.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Checkpoint thật: <code>models/reader_20261101T213758Z_96717e35<\/code>.<\/p><\/dd><\/dl>"}, {"a": 45, "b": 48, "title": "CLI", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>--limit N<\/code> dùng N câu đầu để chạy thử vài phút trước khi chạy thật.<\/p><\/dd><\/dl>"}], "intro": "<p>Script huấn luyện: nạp cấu hình → tạo feature → huấn luyện → lưu checkpoint + kết quả.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Fine-tune <code>deepset/gbert-base<\/code> thành mô hình QA trích xuất, chọn checkpoint tốt nhất theo dev, lưu checkpoint tự đủ.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Reader là thành phần <strong>trả lời<\/strong>: retriever chỉ tìm đoạn. Không có reader tốt thì truy hồi hoàn hảo vẫn không ra đáp án.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p>Feature từ GĐ4a, <code>configs/reader.yaml<\/code>, seed (GĐ0).<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ4c giải mã logit thành văn bản và chọn <code>max_answer_tokens<\/code>, <code>score_mode<\/code>; GĐ5 nạp checkpoint vào <code>Reader<\/code>.<\/p>", "b": "<h4>Mô hình QA trích xuất trên BERT<\/h4>\n<p>BERT biến mỗi token thành vector <code>h_i ∈ ℝ^768<\/code>. Đầu QA là một phép chiếu tuyến tính:<\/p>\n<div class=\"math\">[start_logit_i , end_logit_i] = W · h_i + b,   W ∈ ℝ^{2×768}<\/div>\n<p>Softmax trên các vị trí cho phân phối start và end. Hàm mất mát là trung bình cross-entropy của hai phân phối (Devlin et al., 2019, mục SQuAD).<\/p>\n<h4>Fine-tune: các lựa chọn và lý do<\/h4>\n<table><thead><tr><th>Siêu tham số<\/th><th>Giá trị<\/th><th>Lý do<\/th><\/tr><\/thead><tbody><tr><td>lr<\/td><td>3e-5<\/td><td>dải 2e-5–5e-5 là chuẩn cho BERT-base<\/td><\/tr><tr><td>epoch<\/td><td>3<\/td><td>QA hội tụ nhanh; epoch 3 đã bắt đầu giảm trên dev<\/td><\/tr><tr><td>lô hiệu dụng<\/td><td>8 × 2 = 16<\/td><td>GPU 4 GB không chứa 16 cửa sổ 384 token cùng lúc<\/td><\/tr><tr><td>warmup<\/td><td>10%<\/td><td>đầu QA ngẫu nhiên lúc đầu<\/td><\/tr><tr><td>weight decay<\/td><td>0,01 (không cho bias/LayerNorm)<\/td><td>chuẩn AdamW cho Transformer<\/td><\/tr><tr><td>fp16<\/td><td>bật trên CUDA<\/td><td>nhanh hơn, ít VRAM; <code>GradScaler<\/code> tránh tràn số dưới<\/td><\/tr><tr><td>cắt gradient<\/td><td>1,0<\/td><td>chống bùng nổ gradient<\/td><\/tr><\/tbody><\/table>\n<h4>Mixed precision (fp16) và GradScaler<\/h4>\n<p>Gradient fp16 nhỏ dễ thành 0 (underflow). <code>GradScaler<\/code> nhân loss với hệ số lớn trước <code>backward<\/code>, rồi chia lại (<code>unscale_<\/code>) trước khi cắt gradient và cập nhật; bước nào ra <code>inf/NaN<\/code> thì bỏ qua và giảm hệ số.<\/p>\n<h4>Gradient accumulation<\/h4>\n<p>Cộng dồn gradient của <code>k<\/code> lô nhỏ rồi mới cập nhật ≡ một lô lớn gấp <code>k<\/code> (chỉ khác ở các lớp phụ thuộc lô như BatchNorm, mà BERT không có).<\/p>\n<h4>Kết quả thật (dev 1.176 câu, đoạn đúng cho sẵn)<\/h4>\n<table><thead><tr><th>Epoch<\/th><th>EM<\/th><th>F1<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0,405<\/td><td>0,628<\/td><\/tr><tr><td>2<\/td><td><strong>0,450<\/strong><\/td><td><strong>0,679<\/strong><\/td><\/tr><tr><td>3<\/td><td>0,446<\/td><td>0,673<\/td><\/tr><\/tbody><\/table>\n<h4>Thay thế<\/h4>\n<p><code>transformers.Trainer<\/code> (ít code hơn nhưng giấu chi tiết); backbone khác (GELECTRA, XLM-R); LoRA/adapter khi thiếu VRAM.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>reader.yaml ─▶ cfg\ngbert-base  ─▶ get_tokenizer / get_model (BERT + Linear 768→2, khởi tạo ngẫu nhiên)\nqa_train ─ prepare_train_features ─▶ ~13,3k cửa sổ {input_ids, token_type_ids, start, end}\nqa_dev   ─ prepare_eval_features  ─▶ cửa sổ dev (không nhãn)\n\nmỗi epoch:\n  xáo ─▶ lô 8 ─ collate ─▶ ids/types/mask [8, L], nhãn [8]\n        ─ forward (fp16) ─▶ start_logits, end_logits [8, L]; loss\n        ─ backward /2 ─▶ (2 lô) ─ unscale ─ clip 1.0 ─ AdamW ─ scheduler\n  dev: predict_logits ─ best_answers ─ evaluate_answers ─▶ EM, F1 ─ giữ state tốt nhất\n\nsave_pretrained ─▶ models/reader_&lt;ts&gt;_&lt;hash&gt;/ {config.json, model.safetensors, vocab.txt, reader_config.json}<\/code><\/pre>", "e": "<h4>Chạy thử nhỏ rồi chạy thật<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/GD4/04c_train_reader.py --limit 200     # vài phút, kiểm tra không lỗi\npython scripts/GD4/04c_train_reader.py                 # ≈ 53 phút trên RTX 3050 4 GB<\/code><\/pre>\n<h4>Kiểm tra shape trong một lô<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>b = collate(train_feats[:8])\nprint({k: tuple(v.shape) for k, v in b.items()})\n# {'input_ids': (8, L), 'token_type_ids': (8, L), 'attention_mask': (8, L), 'start_positions': (8,), 'end_positions': (8,)}\nout = model(**{k: v.to(device) for k, v in b.items()})\nprint(out.start_logits.shape, out.loss.item())         # (8, L), loss ban đầu ≈ ln(L) ≈ 5,9 với L = 384<\/code><\/pre>\n<p>Loss ban đầu xấp xỉ <code>ln(L)<\/code> (đoán đều trên L vị trí). Nếu lớn hơn nhiều → nhãn sai hoặc lr quá lớn.<\/p>\n<h4>Dấu hiệu bất thường<\/h4>\n<ul><li>Loss không giảm sau vài trăm bước: kiểm <code>attention_mask<\/code>, nhãn, lr.<\/li><li>EM dev ≈ 0 nhưng loss giảm: lỗi ở giải mã/offset (GĐ4c), không phải ở huấn luyện.<\/li><li><code>CUDA out of memory<\/code>: giảm <code>batch_size<\/code>, tăng <code>grad_accum<\/code> tương ứng.<\/li><\/ul>", "f": "<ul><li>Đầu QA = Linear(768 → 2) trên mỗi token; loss = trung bình CE(start), CE(end).<\/li><li>AdamW + warmup + giảm tuyến tính + fp16 + cắt gradient: công thức chuẩn fine-tune BERT.<\/li><li>Gradient accumulation = lô lớn ảo khi thiếu VRAM.<\/li><li>Chọn checkpoint theo <strong>dev<\/strong>, lưu checkpoint <strong>tự đủ<\/strong> (trọng số + vocab + cấu hình).<\/li><li>Loss ban đầu ≈ ln(độ dài chuỗi): phép kiểm tra nhanh.<\/li><\/ul>", "g": "<ol><li>Viết lại vòng <code>train<\/code> <strong>không<\/strong> dùng <code>GradScaler<\/code> và chạy <code>--limit 200<\/code> trên GPU với fp16. Quan sát gì? Giải thích vai trò của scaler.<\/li><li>Vẽ đường lr theo bước cho 2.487 bước với warmup 10%. Tại bước nào lr đạt đỉnh?<\/li><li>Tại sao nhóm tham số không weight decay lọc theo tên <code>LayerNorm.weight<\/code> và <code>bias<\/code>? In ra 5 tên tham số đầu của mỗi nhóm để kiểm.<\/li><li>Giả sử chỉ có 2 GB VRAM. Đề xuất cấu hình <code>batch_size<\/code>/<code>grad_accum<\/code> giữ nguyên lô hiệu dụng 16.<\/li><\/ol>"}, {"id": "s8", "num": 8, "title": "Giải mã đáp án, EM/F1 và lớp Reader", "gd": "GĐ4c · reader suy luận", "files": [{"path": "src/germanqa/reader/postprocess.py", "name": "postprocess.py", "kind": "orig", "lang": "python", "source": "\n\"\"\"Từ logit start/end của các cửa sổ ra một câu trả lời cho mỗi câu hỏi (GĐ4.4).\"\"\"\nfrom collections import defaultdict\n\nimport numpy as np\n\n\ndef best_answers(examples, feats, start_logits, end_logits, n_best=20, max_answer_tokens=30,\n                 score_mode=\"raw\"):\n    \"\"\"Với mỗi ví dụ, thử mọi cặp (start, end) trong top-n_best của từng cửa sổ và giữ cặp tốt nhất.\n\n    Cặp hợp lệ: cả hai nằm trong context, end không trước start, độ dài <= max_answer_tokens.\n    score_mode: \"raw\"       -> điểm = start_logit + end_logit\n                \"minus_cls\" -> trừ điểm [CLS] của cửa sổ đó (điểm 'không có đáp án ở cửa sổ này')\n    Văn bản trả về được CẮT từ context gốc bằng offset, không ghép từ token.\n    \"\"\"\n    windows = defaultdict(list)\n    for fi, f in enumerate(feats):\n        windows[f[\"example_index\"]].append(fi)\n\n    out = {}\n    for ei, ex in enumerate(examples):\n        best = {\"text\": \"\", \"start\": -1, \"end\": -1, \"score\": float(\"-inf\")}\n        for fi in windows[ei]:\n            s_log, e_log, offs = start_logits[fi], end_logits[fi], feats[fi][\"offsets\"]\n            n = len(offs)\n            bias = (s_log[0] + e_log[0]) if score_mode == \"minus_cls\" else 0.0\n            for si in np.argsort(s_log[:n])[::-1][:n_best]:\n                for ej in np.argsort(e_log[:n])[::-1][:n_best]:\n                    if offs[si] is None or offs[ej] is None:\n                        continue\n                    if ej < si or ej - si + 1 > max_answer_tokens:\n                        continue\n                    score = float(s_log[si] + e_log[ej] - bias)\n                    if score > best[\"score\"]:\n                        a, b = offs[si][0], offs[ej][1]\n                        best = {\"text\": ex[\"context\"][a:b], \"start\": a, \"end\": b, \"score\": score}\n        out[ex[\"id\"]] = best\n    return out", "notes": [{"a": 8, "b": 9, "title": "Chữ ký hàm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tham số: <code>n_best<\/code> (số start/end ứng viên mỗi cửa sổ), <code>max_answer_tokens<\/code> (độ dài đáp án tối đa), <code>score_mode<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Giá trị dùng thật: <code>n_best = 20<\/code>, <code>max_answer_tokens = 80<\/code>, <code>score_mode = minus_cls<\/code> (chọn trên dev).<\/p><\/dd><\/dl>"}, {"a": 17, "b": 19, "title": "Gom cửa sổ theo ví dụ", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>windows[ei]<\/code> = danh sách chỉ số cửa sổ của ví dụ <code>ei<\/code>.<\/p><\/dd><\/dl>"}, {"a": 21, "b": 23, "title": "Khởi tạo đáp án rỗng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mặc định: rỗng, <code>start = -1<\/code>, điểm <code>-inf<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Không có cặp hợp lệ thì trả rỗng rõ ràng; pipeline đổi thành <code>status = no_valid_span<\/code>.<\/p><\/dd><\/dl>"}, {"a": 24, "b": 27, "title": "Điểm 'không có đáp án' của cửa sổ", "html": "<div class=\"math\">minus_cls: score(i, j) = s_i + e_j − (s_[CLS] + e_[CLS])<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>bias<\/code> = điểm của cặp <code>[CLS]<\/code>. Ở chế độ <code>minus_cls<\/code>, mọi span bị trừ đi điểm này.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Logit <strong>không<\/strong> so được giữa các cửa sổ/đoạn khác nhau (mỗi cửa sổ có thang riêng). Trừ điểm <code>[CLS]<\/code> biến điểm thành 'tốt hơn khả năng không có đáp án bao nhiêu': so được hơn.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Trên dev: <code>minus_cls<\/code> + 80 token thắng nhẹ <code>raw<\/code> + 80 token (EM 0,4694 so với 0,4651).<\/p><\/dd><\/dl>"}, {"a": 28, "b": 32, "title": "Duyệt cặp ứng viên", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Lấy top-20 vị trí start và top-20 vị trí end (theo logit), xét 400 cặp. Loại cặp chạm token ngoài context (<code>offs is None<\/code>), <code>end &lt; start<\/code>, hoặc dài quá <code>max_answer_tokens<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Ràng buộc cấu trúc mà mô hình không tự biết: start trước end, nằm trong context, độ dài hợp lý.<\/p><\/dd><dt>Cách khác<\/dt><dd><p>Tìm kiếm toàn bộ O(L²) cặp: chính xác hơn nhưng chậm; top-k × top-k là xấp xỉ chuẩn.<\/p><\/dd><\/dl>"}, {"a": 34, "b": 37, "title": "Giữ cặp tốt nhất, cắt văn bản bằng offset", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Điểm = <code>s + e − bias<\/code>. Tốt hơn thì lưu: <code>text = context[a:b]<\/code> với <code>a<\/code> = ký tự đầu của token start, <code>b<\/code> = ký tự cuối của token end.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cắt từ <strong>context gốc<\/strong> chứ không ghép token lại: giữ nguyên khoảng trắng, dấu câu, hoa/thường, và offset khớp tuyệt đối với <code>original_text<\/code>.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Ghép từ token (<code>tokenizer.decode<\/code>) sinh ra khoảng trắng lạ quanh dấu câu và <code>##<\/code>, làm EM giảm và offset không còn đúng.<\/p><\/dd><\/dl>"}, {"a": 38, "b": 39, "title": "Kết quả", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>{id: {text, start, end, score}}<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ví dụ: <code>{'q_…': {'text': 'Konrad Adenauer', 'start': 0, 'end': 15, 'score': 9.7}}<\/code>.<\/p><\/dd><\/dl>"}], "intro": "<p>Từ logit start/end của các cửa sổ ra <strong>một<\/strong> câu trả lời cho mỗi ví dụ. Đáp án được <strong>cắt từ context gốc<\/strong> bằng offset.<\/p>"}, {"path": "src/germanqa/reader/qa_metrics.py", "name": "qa_metrics.py", "kind": "orig", "lang": "python", "source": "\"\"\"EM và F1 cho QA trích xuất (GĐ4). Nhiều đáp án tham chiếu: lấy điểm cao nhất.\"\"\"\nimport re\nimport string\nfrom collections import Counter\n\n_PUNCT = set(string.punctuation) | set(\"„“”‚‘’»«–—…\")\n\n\ndef normalize(text):\n    \"\"\"Chữ thường, bỏ dấu câu, gộp khoảng trắng. KHÔNG bỏ mạo từ (der, die, das là từ thật).\"\"\"\n    text = \"\".join(ch for ch in text.lower() if ch not in _PUNCT)\n    return re.sub(r\"\\s+\", \" \", text).strip()\n\n\ndef exact_match(pred, ref):\n    return 1.0 if normalize(pred) == normalize(ref) else 0.0\n\n\ndef f1_score(pred, ref):\n    p, r = normalize(pred).split(), normalize(ref).split()\n    if not p or not r:\n        return 1.0 if p == r else 0.0\n    common = sum((Counter(p) & Counter(r)).values())\n    if common == 0:\n        return 0.0\n    precision, recall = common / len(p), common / len(r)\n    return 2 * precision * recall / (precision + recall)\n\n\ndef score_answers(predictions, examples):\n    \"\"\"Điểm TỪNG câu: danh sách [(em, f1)] theo đúng thứ tự examples, lấy cao nhất trên các tham chiếu.\n    Bootstrap (GĐ7) cần điểm từng câu, không chỉ trung bình.\"\"\"\n    scores = []\n    for ex in examples:\n        pred = predictions.get(ex[\"id\"], {\"text\": \"\"})[\"text\"]\n        refs = [a[\"text\"] for a in ex[\"answers\"]]\n        scores.append((max(exact_match(pred, r) for r in refs), max(f1_score(pred, r) for r in refs)))\n    return scores\n\n\ndef evaluate_answers(predictions, examples):\n    \"\"\"predictions = {id: {\"text\": ...}}; ví dụ có thể có nhiều đáp án tham chiếu.\"\"\"\n    scores = score_answers(predictions, examples)\n    return {\"queries\": len(examples), \"em\": sum(s[0] for s in scores) / len(scores),\n            \"f1\": sum(s[1] for s in scores) / len(scores)}\n", "notes": [{"a": 6, "b": 6, "title": "Tập dấu câu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dấu câu ASCII + dấu ngoặc kép kiểu Đức <code>„ “ ”<\/code>, <code>‚ ‘ ’<\/code>, <code>» «<\/code>, gạch <code>– —<\/code>, <code>…<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Văn bản tiếng Đức dùng <code>„…“<\/code>; không bỏ chúng thì 'đúng' bị chấm sai.<\/p><\/dd><\/dl>"}, {"a": 9, "b": 12, "title": "normalize", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chữ thường, bỏ dấu câu, gộp khoảng trắng.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Chuẩn SQuAD còn bỏ mạo từ tiếng Anh (a, an, the). Project <strong>không<\/strong> bỏ <code>der/die/das<\/code> vì chúng là từ thật trong đáp án tiếng Đức (ghi trong docstring).<\/p><\/dd><\/dl>"}, {"a": 15, "b": 16, "title": "EM", "html": "<div class=\"math\">EM = 1[ normalize(pred) == normalize(ref) ]<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Khớp hoàn toàn sau chuẩn hóa.<\/p><\/dd><\/dl>"}, {"a": 19, "b": 27, "title": "F1 theo token", "html": "<div class=\"math\">P = |chung| / |pred|,  R = |chung| / |ref|,  F1 = 2PR / (P + R)<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đếm token chung theo <strong>bội số<\/strong> (<code>Counter &amp;<\/code>). Cả hai rỗng → 1; một bên rỗng → 0.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>f1('der erste Bundeskanzler', 'erste Bundeskanzler')<\/code> = 2·(2/3)·1/(2/3+1) = 0,8.<\/p><\/dd><\/dl>"}, {"a": 30, "b": 38, "title": "score_answers: điểm từng câu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Với mỗi ví dụ lấy <strong>max<\/strong> trên các đáp án tham chiếu.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Bootstrap (GĐ3/GĐ7) cần điểm <strong>từng câu<\/strong>, không chỉ trung bình.<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Ví dụ có <code>answers<\/code> rỗng sẽ gây <code>ValueError<\/code> vì <code>max()<\/code> trên dãy rỗng. Trong project không xảy ra (mọi câu dev/test đều có đáp án), nhưng nếu tái dùng hàm cho dữ liệu khác cần kiểm trước.<\/p><\/dd><\/dl>"}, {"a": 41, "b": 45, "title": "evaluate_answers", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Trung bình EM, F1 và số câu.<\/p><\/dd><\/dl>"}], "intro": "<p>EM và F1 kiểu SQuAD, với chuẩn hóa phù hợp tiếng Đức.<\/p>"}, {"path": "src/germanqa/reader/inference.py", "name": "inference.py", "kind": "orig", "lang": "python", "source": "\n\"\"\"Reader dùng khi suy luận (GĐ5.1): nạp checkpoint MỘT lần, đọc nhiều (câu hỏi, đoạn văn).\n\nGĐ4 viết sẵn từng bước (cửa sổ -> logit -> span). Lớp này chỉ ghép các bước đó lại, không đổi phép tính nào.\"\"\"\nimport torch\n\nfrom germanqa.reader.features import prepare_eval_features\nfrom germanqa.reader.model_io import get_model, get_tokenizer\nfrom germanqa.reader.postprocess import best_answers\nfrom germanqa.reader.trainer import predict_logits\n\n\nclass Reader:\n    def __init__(self, checkpoint, max_length=384, stride=128, n_best=20, max_answer_tokens=80,\n                 score_mode=\"minus_cls\", batch_size=32, fp16=True, device=None):\n        self.device = device or (\"cuda\" if torch.cuda.is_available() else \"cpu\")\n        self.tokenizer = get_tokenizer(checkpoint)\n        self.model = get_model(checkpoint).to(self.device).eval()\n        self.max_length, self.stride, self.n_best = max_length, stride, n_best\n        self.max_answer_tokens, self.score_mode = max_answer_tokens, score_mode\n        self.batch_size, self.fp16 = batch_size, fp16\n\n    def logits(self, examples):\n        \"\"\"Cắt cửa sổ và chạy mô hình cho danh sách ví dụ {id, question, context, ...}.\n        Trả về (feats, start_logits, end_logits). Tách riêng để GĐ4 chạy mô hình một lần rồi thử nhiều cách hậu xử lý.\"\"\"\n        feats = prepare_eval_features(examples, self.tokenizer, self.max_length, self.stride)\n        s, e = predict_logits(self.model, feats, self.batch_size, self.device, self.fp16)\n        return feats, s, e\n\n    def decode(self, examples, feats, s, e, max_answer_tokens=None, score_mode=None):\n        return best_answers(examples, feats, s, e, self.n_best,\n                            self.max_answer_tokens if max_answer_tokens is None else max_answer_tokens,\n                            score_mode or self.score_mode)\n\n    def read(self, question, passages):\n        \"\"\"passages = [{\"passage_id\", \"text\"}, ...]. Trả về, theo đúng thứ tự đầu vào, span tốt nhất của TỪNG đoạn:\n        [{\"passage_id\", \"text\", \"start\", \"end\", \"score\"}]; đoạn không có span hợp lệ có start = -1, score = -inf.\"\"\"\n        if not passages:\n            return []\n        examples = [{\"id\": p[\"passage_id\"], \"question\": question, \"context\": p[\"text\"], \"answers\": []}\n                    for p in passages]\n        feats, s, e = self.logits(examples)\n        best = self.decode(examples, feats, s, e)\n        return [{\"passage_id\": p[\"passage_id\"], **best[p[\"passage_id\"]]} for p in passages]", "notes": [{"a": 13, "b": 21, "title": "Khởi tạo", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chọn thiết bị, nạp tokenizer và mô hình từ thư mục checkpoint, lưu các tham số giải mã.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Nạp mô hình tốn vài giây và hàng trăm MB VRAM: làm một lần rồi giữ lại (API GĐ8 dựa vào điều này).<\/p><\/dd><\/dl>"}, {"a": 23, "b": 28, "title": "logits: cắt cửa sổ + chạy mô hình", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tách riêng khỏi giải mã để chạy mô hình <strong>một lần<\/strong> rồi thử nhiều cách hậu xử lý (<code>max_answer_tokens<\/code>, <code>score_mode<\/code>).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dùng ở GĐ4c để dò lưới <code>answer_grid<\/code> mà không chạy lại GPU.<\/p><\/dd><\/dl>"}, {"a": 30, "b": 33, "title": "decode", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Gọi <code>best_answers<\/code> với tham số mặc định của đối tượng hoặc tham số truyền vào.<\/p><\/dd><\/dl>"}, {"a": 35, "b": 44, "title": "read: đọc nhiều đoạn cho một câu hỏi", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi đoạn thành một 'ví dụ' (<code>id = passage_id<\/code>), chạy <code>logits<\/code> + <code>decode<\/code>, trả span tốt nhất <strong>của từng đoạn<\/strong> theo thứ tự đầu vào.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: câu hỏi, <code>[{passage_id, text}]<\/code>. Ra: <code>[{passage_id, text, start, end, score}]<\/code>; đoạn không có span hợp lệ: <code>start = -1<\/code>, <code>score = -inf<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>QAPipeline.answer<\/code> (GĐ5) chọn đoạn có điểm cao nhất trong danh sách này.<\/p><\/dd><\/dl>"}], "intro": "<p>Lớp <code>Reader<\/code> dùng khi suy luận: nạp checkpoint <strong>một lần<\/strong>, đọc nhiều (câu hỏi, đoạn). Chỉ ghép các bước GĐ4a–4c, không đổi phép tính.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Biến logit thành đáp án văn bản, đo EM/F1, chọn <code>max_answer_tokens<\/code> và <code>score_mode<\/code> trên dev, đóng gói thành lớp <code>Reader<\/code>.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Một mô hình tốt vẫn có thể cho kết quả tệ nếu giải mã sai (span ngược, span chứa câu hỏi, span quá dài, so điểm giữa cửa sổ không công bằng).<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p>Checkpoint (GĐ4b), feature/offsets (GĐ4a).<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ5 dùng <code>Reader.read<\/code> trong pipeline; GĐ7 dùng <code>score_answers<\/code> cho bootstrap.<\/p>", "b": "<h4>Từ logit đến span<\/h4>\n<p>Với một cửa sổ có logit <code>s<\/code> (start) và <code>e<\/code> (end), span tốt nhất là<\/p>\n<div class=\"math\">(i*, j*) = argmax_{i ≤ j, j − i + 1 ≤ M, i,j ∈ context}  s_i + e_j<\/div>\n<p>Ràng buộc biến bài toán thành tìm kiếm có điều kiện. Project xấp xỉ bằng top-20 × top-20 cặp.<\/p>\n<h4>So sánh giữa cửa sổ và giữa đoạn: <code>raw<\/code> vs <code>minus_cls<\/code><\/h4>\n<p>Logit là số <strong>không chuẩn hóa<\/strong>: cửa sổ A có mọi logit cao hơn cửa sổ B không có nghĩa span ở A đáng tin hơn. Ý tưởng <code>minus_cls<\/code>: mô hình đã học đặt điểm cao cho <code>[CLS]<\/code> khi cửa sổ không có đáp án; trừ đi điểm này cho ra một độ đo tương đối.<\/p>\n<h4>Kết quả dò lưới trên dev (đoạn đúng cho sẵn, <code>reports/reader_gold_context.json<\/code>)<\/h4>\n<table><thead><tr><th>max_answer_tokens<\/th><th>raw EM<\/th><th>minus_cls EM<\/th><th>minus_cls F1<\/th><\/tr><\/thead><tbody><tr><td>20<\/td><td>0,428<\/td><td>0,430<\/td><td>0,652<\/td><\/tr><tr><td>30<\/td><td>0,450<\/td><td>0,455<\/td><td>0,680<\/td><\/tr><tr><td>50<\/td><td>0,464<\/td><td>0,469<\/td><td>0,691<\/td><\/tr><tr><td>80<\/td><td>0,465<\/td><td><strong>0,469<\/strong><\/td><td><strong>0,699<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>Đáp án GermanQuAD khá dài (thường là cụm, mệnh đề), nên giới hạn 30 token cắt mất nhiều đáp án. Dev theo số cửa sổ: 1 cửa sổ EM 0,490; 2 cửa sổ 0,420. Đoạn dài khó hơn.<\/p>\n<h4>EM và F1<\/h4>\n<p>EM nghiêm (0 hoặc 1); F1 cho điểm một phần khi trùng một số từ. Nhiều đáp án tham chiếu → lấy max (đáp án nào gần nhất).<\/p>\n<h4>Thay thế<\/h4>\n<p>Giải mã bằng xác suất chung <code>softmax(s)_i · softmax(e)_j<\/code>; thêm lớp 'không có đáp án' kiểu SQuAD 2.0; hiệu chỉnh điểm (calibration) để so giữa đoạn.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>Reader(checkpoint)                      # nạp 1 lần\nread(question, [{passage_id, text}×5])\n  └─ examples (id = passage_id, context = text)\n     └─ prepare_eval_features ─▶ cửa sổ (offsets None ngoài context)\n        └─ predict_logits ─▶ s[w], e[w]   (độ dài = số token của cửa sổ w)\n           └─ best_answers:\n               với mỗi đoạn, mỗi cửa sổ: bias = s[0]+e[0]\n                 top-20 i × top-20 j, lọc ràng buộc, score = s_i+e_j−bias\n               ─▶ {passage_id: {text = context[a:b], start=a, end=b, score}}\n  ─▶ [{passage_id, text, start, end, score}] theo thứ tự đầu vào<\/code><\/pre>", "e": "<h4>Đọc thử một đoạn<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.reader.inference import Reader\nr = Reader(\"models/reader_20261101T213758Z_96717e35\")\nctx = \"Konrad Adenauer war von 1949 bis 1963 der erste Bundeskanzler der Bundesrepublik Deutschland.\"\nprint(r.read(\"Wer war der erste Bundeskanzler?\", [{\"passage_id\": \"p1\", \"text\": ctx}]))<\/code><\/pre>\n<p>Kỳ vọng: <code>text<\/code> là một đoạn trích <strong>nguyên văn<\/strong> của <code>ctx<\/code> và <code>ctx[start:end] == text<\/code>.<\/p>\n<h4>Đo EM/F1 với đoạn đúng cho sẵn và dò lưới<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/GD4/04d_eval_reader.py\npytest tests/GD4 -q<\/code><\/pre>\n<h4>Assertion<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.reader.qa_metrics import exact_match, f1_score\nassert exact_match(\"„Konrad Adenauer“\", \"konrad adenauer\") == 1.0\nassert abs(f1_score(\"der erste Bundeskanzler\", \"erste Bundeskanzler\") - 0.8) &lt; 1e-9\nassert f1_score(\"\", \"\") == 1.0 and f1_score(\"a\", \"\") == 0.0<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Đáp án chứa một phần câu hỏi: quên loại token có <code>offsets is None<\/code>.<\/li><li>EM thấp bất thường nhưng F1 khá: thường do <code>max_answer_tokens<\/code> quá nhỏ (đáp án bị cụt).<\/li><li>So sánh điểm <code>raw<\/code> giữa các đoạn rồi kết luận \"đoạn này đúng hơn\": logit không hiệu chỉnh.<\/li><\/ul>", "f": "<ul><li>Đáp án luôn <strong>cắt từ context gốc<\/strong> bằng offset, không ghép token.<\/li><li>Ràng buộc span: trong context, <code>start ≤ end<\/code>, độ dài ≤ M.<\/li><li><code>minus_cls<\/code> làm điểm giữa các cửa sổ/đoạn so được hơn (vẫn chưa phải xác suất).<\/li><li>EM nghiêm, F1 từng phần; nhiều tham chiếu → max.<\/li><li><code>Reader<\/code> nạp một lần, đọc nhiều lần; trả kết quả <strong>từng đoạn<\/strong>.<\/li><\/ul>", "g": "<ol><li>Viết lại <code>best_answers<\/code> bằng vector hóa numpy (ma trận <code>s[:, None] + e[None, :]<\/code> với mặt nạ ràng buộc). Chứng minh kết quả giống bản gốc trên 200 câu dev.<\/li><li>Tìm 10 câu dev mà <code>raw<\/code> và <code>minus_cls<\/code> chọn đáp án khác nhau. Bên nào đúng nhiều hơn? Giải thích bằng giá trị <code>bias<\/code> của các cửa sổ.<\/li><li>Tính EM theo độ dài đáp án (số token): nhóm nào reader yếu nhất? Liên hệ với lựa chọn <code>max_answer_tokens = 80<\/code>.<\/li><\/ol>"}, {"id": "s9", "num": 9, "title": "Pipeline hỏi đáp end-to-end", "gd": "GĐ5 · ghép hệ thống", "files": [{"path": "src/germanqa/pipeline.py", "name": "pipeline.py", "kind": "orig", "lang": "python", "source": "\"\"\"Pipeline hỏi đáp end-to-end (GĐ5): câu hỏi -> truy hồi top-20 -> reader trên top-5 -> một đáp án.\n\nPipeline chỉ biết retriever qua retrieve(question, top_k) -> [{passage_id, score, rank}] và reader qua\nread(question, passages). Thay BM25 bằng dense/hybrid (GĐ12-13) không phải sửa file này.\"\"\"\nimport time\nfrom pathlib import Path\n\nfrom germanqa.config import PROCESSED_DIR, ROOT\nfrom germanqa.data.io_utils import file_sha1, read_jsonl\nfrom germanqa.experiment import load_config, new_experiment_id\nfrom germanqa.schemas import QAResponse\n\nMAX_QUESTION_TOKENS = 64     # câu hỏi dài hơn thì cắt: cửa sổ 384 token cần chừa chỗ cho context + stride\n\n\nclass QAPipeline:\n    def __init__(self, retriever, reader, passages, model_version, corpus_version, experiment_id,\n                 retrieval_top_k=20, reader_top_k=5, reranker=None):\n        self.retriever, self.reader, self.passages = retriever, reader, passages\n        self.reranker = reranker      # GĐ14: None = không xếp lại (giữ đúng hành vi cũ)    # passages: {passage_id: original_text}\n        self.model_version, self.corpus_version, self.experiment_id = model_version, corpus_version, experiment_id\n        self.retrieval_top_k, self.reader_top_k = retrieval_top_k, reader_top_k\n\n    def _cut_question(self, question):\n        \"\"\"Cắt câu hỏi còn tối đa MAX_QUESTION_TOKENS token; trả về (câu hỏi, có bị cắt không).\"\"\"\n        enc = self.reader.tokenizer(question, add_special_tokens=False, return_offsets_mapping=True)\n        offs = enc[\"offset_mapping\"]\n        if len(offs) <= MAX_QUESTION_TOKENS:\n            return question, False\n        return question[:offs[MAX_QUESTION_TOKENS - 1][1]], True\n    @staticmethod\n    def _no_trace(trace):\n        \"\"\"Vết rỗng nhưng ĐÚNG HÌNH DẠNG: người gọi bật trace=True luôn đọc được ['retrieved'] và ['candidates'].\"\"\"\n        return {\"retrieved\": [], \"candidates\": []} if trace else None\n\n    def _empty(self, question, status, t0, t_retrieval=0.0, trace=None):\n        return QAResponse(question=question, answer=\"\", passage_id=\"\", passage_text=\"\", answer_start=0,\n                          answer_end=0, retrieval_score=0.0, reader_score=0.0, retrieval_time=t_retrieval,\n                          reader_time=0.0, total_time=time.perf_counter() - t0, model_version=self.model_version,\n                          corpus_version=self.corpus_version, experiment_id=self.experiment_id,\n                          status=status, trace=trace)\n\n    def answer(self, question, retrieval_top_k=None, reader_top_k=None, trace=False):\n        t0 = time.perf_counter()\n        if not isinstance(question, str):\n            raise TypeError(\"question phải là chuỗi\")\n        k_ret = self.retrieval_top_k if retrieval_top_k is None else retrieval_top_k\n        k_read = self.reader_top_k if reader_top_k is None else reader_top_k\n        if k_ret < 1 or k_read < 1:\n            raise ValueError(\"retrieval_top_k và reader_top_k phải >= 1\")\n        question = question.strip()\n        if not question:\n            return self._empty(question, \"empty_question\", t0, trace=self._no_trace(trace))\n        t = time.perf_counter()\n        hits = self.retriever.retrieve(question, k_ret)\n        t_retrieval = time.perf_counter() - t\n        if not hits:\n            return self._empty(question, \"no_passages\", t0, t_retrieval, self._no_trace(trace))\n        t_rerank, ranked = 0.0, hits\n        if self.reranker is not None:                 # GĐ14: chấm lại đúng các đoạn đã truy hồi, reader nhận k_read đoạn đầu\n            t = time.perf_counter()\n            ranked = [{k: v for k, v in r.items() if k != \"text\"} for r in self.reranker.rerank(\n                question, [{**h, \"text\": self.passages[h[\"passage_id\"]]} for h in hits])]\n            t_rerank = time.perf_counter() - t\n        used = ranked[:k_read]\n        reader_question, cut = self._cut_question(question)\n        t = time.perf_counter()\n        spans = self.reader.read(reader_question, [{\"passage_id\": h[\"passage_id\"], \"text\": self.passages[h[\"passage_id\"]]}\n                                                  for h in used])\n        t_reader = time.perf_counter() - t\n\n        info = None\n        if trace:\n            info = {\"retrieved\": hits,\n                    \"candidates\": [{\"passage_id\": h[\"passage_id\"], \"rank\": h[\"rank\"], \"retrieval_score\": h[\"score\"],\n                                    \"answer\": s[\"text\"], \"start\": s[\"start\"], \"end\": s[\"end\"],\n                                    \"reader_score\": s[\"score\"],\n                                    **({\"rank_before_rerank\": h[\"rank_before\"], \"rerank_score\": h[\"rerank_score\"]}\n                                       if self.reranker is not None else {})} for h, s in zip(used, spans)]}\n            if self.reranker is not None:\n                info[\"reranked\"] = [{\"passage_id\": r[\"passage_id\"], \"rank_before\": r[\"rank_before\"], \"rank\": r[\"rank\"],\n                                     \"rerank_score\": r[\"rerank_score\"]} for r in ranked]\n                info[\"rerank_stats\"] = dict(self.reranker.last_stats)\n        valid = [(s, h) for s, h in zip(spans, used) if s[\"start\"] >= 0]\n        if not valid:\n            return self._empty(question, \"no_valid_span\", t0, t_retrieval, info)\n        span, hit = max(valid, key=lambda sh: sh[0][\"score\"])       # hòa điểm: max giữ phần tử đứng trước = hạng cao hơn\n        passage_text = self.passages[hit[\"passage_id\"]]\n        if passage_text[span[\"start\"]:span[\"end\"]] != span[\"text\"]:     # bất biến của hệ thống; sai là lỗi lập trình\n            raise ValueError(\"đáp án không khớp văn bản gốc tại offset\")\n        return QAResponse(question=question, answer=span[\"text\"], passage_id=hit[\"passage_id\"],\n                          passage_text=passage_text, answer_start=span[\"start\"], answer_end=span[\"end\"],\n                          retrieval_score=hit[\"score\"], reader_score=span[\"score\"],\n                          retrieval_time=t_retrieval, reader_time=t_reader, total_time=time.perf_counter() - t0,\n                          model_version=self.model_version, corpus_version=self.corpus_version,\n                          experiment_id=self.experiment_id, status=\"question_truncated\" if cut else \"ok\", trace=info,\n                          rerank_time=t_rerank, rerank_score=hit.get(\"rerank_score\"))\n\n\ndef build_retriever(kind, corpus, data_dir=PROCESSED_DIR, artifact_dir=None, bm25_store_dir=None):\n    \"\"\"kind: 'bm25' (cấu hình trong pipeline.yaml) hoặc 'dense' (configs/dense.yaml + artifacts đã mã hóa).\"\"\"\n    if kind == \"bm25\":\n        from germanqa.retrieval import bm25_store\n        b = load_config(\"pipeline\")[\"bm25\"]\n        # GĐ11.2: nạp chỉ mục đã lưu nếu dấu vân tay khớp, không thì dựng lại và lưu. Kết quả truy hồi giống hệt.\n        retriever, _ = bm25_store.load_or_build(Path(data_dir) / \"corpus.jsonl\", corpus, b[\"k1\"], b[\"b\"],\n                                                b[\"use_stopwords\"], store_dir=bm25_store_dir)\n        return retriever\n    if kind == \"dense\":\n        from germanqa.retrieval.dense import DenseRetriever, DPREncoder\n        d = load_config(\"dense\")[\"dense\"]\n        art = Path(artifact_dir or d[\"artifact_dir\"])\n        art = art if art.is_absolute() else ROOT / art\n        return DenseRetriever.from_dir(art, DPREncoder(d[\"ctx_encoder\"], d[\"question_encoder\"], fp16=d[\"fp16\"]),\n                                       Path(data_dir) / \"corpus.jsonl\", d[\"question_max_length\"], expected_cfg=d)\n    if kind == \"hybrid\":\n        from germanqa.retrieval.hybrid import HybridRetriever\n        # BM25 và dense dựng MỘT lần rồi bọc lại; cấu hình hybrid lấy từ configs/hybrid.yaml\n        return HybridRetriever.from_config(build_retriever(\"bm25\", corpus, data_dir, bm25_store_dir=bm25_store_dir),\n                                           build_retriever(\"dense\", corpus, data_dir, artifact_dir),\n                                           load_config(\"hybrid\")[\"hybrid\"])\n    raise ValueError(\"retriever phải là 'bm25', 'dense' hoặc 'hybrid'\")\n\n\ndef build_pipeline(checkpoint=None, data_dir=PROCESSED_DIR, retriever=\"bm25\", artifact_dir=None, bm25_store_dir=None,\n                   reranker=None):\n    \"\"\"Dựng pipeline từ configs/pipeline.yaml và configs/reader.yaml. checkpoint=None -> lấy trong pipeline.yaml.\n    retriever='dense' thay BM25 bằng dense retriever; reader và mọi thứ khác giữ nguyên.\"\"\"\n    from germanqa.reader.inference import Reader          # torch chỉ nạp khi thật sự dựng reader\n    cfg = load_config(\"pipeline\")\n    rcfg = load_config(\"reader\")[\"reader\"]\n    ck = Path(checkpoint or cfg[\"pipeline\"][\"checkpoint\"])\n    ck = ck if ck.is_absolute() else ROOT / ck\n    corpus = read_jsonl(Path(data_dir) / \"corpus.jsonl\")\n    retriever_obj = build_retriever(retriever, corpus, data_dir, artifact_dir, bm25_store_dir)\n    reader = Reader(ck, rcfg[\"max_length\"], rcfg[\"stride\"], rcfg[\"n_best\"], cfg[\"reader\"][\"max_answer_tokens\"],\n                    cfg[\"reader\"][\"score_mode\"], rcfg[\"eval_batch_size\"])\n    full_cfg = {**cfg, \"checkpoint_name\": ck.name, **({\"retriever\": retriever} if retriever != \"bm25\" else {})}\n    if retriever == \"hybrid\":      # tham số hybrid phải nằm trong cấu hình được băm, nếu không hai rrf_c cho cùng đuôi mã\n        full_cfg[\"hybrid\"] = load_config(\"hybrid\")[\"hybrid\"]\n    rr = None\n    if reranker:                  # GĐ14: reranker=True lấy configs/rerank.yaml; hoặc truyền sẵn một đối tượng reranker\n        from germanqa.rerank.factory import build_reranker\n        rcfg = load_config(\"rerank\")[\"rerank\"]\n        rr = reranker if hasattr(reranker, \"rerank\") else build_reranker(rcfg)\n        full_cfg[\"rerank\"] = {k: rcfg[k] for k in rcfg}      # đưa vào cấu hình được băm để experiment_id phân biệt H0 và H1\n    return QAPipeline(retriever_obj, reader, {r[\"passage_id\"]: r[\"original_text\"] for r in corpus},\n                      model_version=ck.name, corpus_version=file_sha1(Path(data_dir) / \"corpus.jsonl\")[:12],\n                      experiment_id=new_experiment_id(\"pipeline\", full_cfg),\n                      retrieval_top_k=cfg[\"pipeline\"][\"retrieval_top_k\"], reader_top_k=cfg[\"pipeline\"][\"reader_top_k\"],\n                      reranker=rr)", "notes": [{"a": 13, "b": 13, "title": "Giới hạn độ dài câu hỏi", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Câu hỏi dài hơn 64 token bị cắt.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cửa sổ 384 token phải chừa chỗ cho context và stride; câu hỏi quá dài làm mỗi cửa sổ chứa rất ít context.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Reranker dùng cùng giới hạn (<code>MAX_QUERY_TOKENS = 64<\/code>, GĐ14); API chặn trước ở 500 ký tự (GĐ8).<\/p><\/dd><\/dl>"}, {"a": 16, "b": 22, "title": "Khởi tạo: tiêm phụ thuộc", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nhận sẵn <code>retriever<\/code>, <code>reader<\/code>, <code>passages<\/code> (<code>{passage_id: original_text}<\/code>), phiên bản, <code>experiment_id<\/code>, <code>retrieval_top_k = 20<\/code>, <code>reader_top_k = 5<\/code>, <code>reranker<\/code> (mặc định <code>None<\/code>).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p><strong>Dependency injection<\/strong>: pipeline không tự dựng thành phần nào, nên test được bằng retriever/reader giả, và API chia sẻ một reader cho nhiều pipeline.<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Chú thích <code># passages: {passage_id: original_text}<\/code> bị đặt ở cuối dòng <code>self.reranker = …<\/code> (dòng 20), dễ hiểu nhầm là chú thích cho <code>reranker<\/code>. Nên chuyển lên dòng 19.<\/p><\/dd><\/dl>"}, {"a": 24, "b": 30, "title": "_cut_question: cắt câu hỏi theo token", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tokenize câu hỏi lấy <code>offset_mapping<\/code>; dài quá 64 token thì cắt tại ký tự kết thúc của token thứ 64.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cắt theo token nhưng trả <strong>chuỗi<\/strong> (cắt đúng ranh giới token) để reader tokenize lại cho ra đúng 64 token.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: (câu hỏi đã cắt, có bị cắt không).<\/p><\/dd><\/dl>"}, {"a": 32, "b": 34, "title": "_no_trace: vết rỗng đúng hình dạng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Khi bật <code>trace<\/code> mà trả sớm, vẫn trả <code>{retrieved: [], candidates: []}<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Người gọi (frontend) luôn đọc được hai khóa này, không phải kiểm <code>None<\/code> ở từng chỗ.<\/p><\/dd><\/dl>"}, {"a": 36, "b": 41, "title": "_empty: phản hồi rỗng có trạng thái", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>QAResponse<\/code> với đáp án rỗng và <code>status<\/code> cho biết lý do.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Không ném ngoại lệ cho các tình huống <strong>bình thường<\/strong> (câu hỏi rỗng, không tìm được đoạn). Ngoại lệ dành cho lỗi lập trình.<\/p><\/dd><\/dl>"}, {"a": 43, "b": 53, "title": "answer (1): kiểm tra đầu vào", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Bắt đầu đo giờ; câu hỏi phải là chuỗi; top-k phải ≥ 1; cắt khoảng trắng; rỗng → <code>empty_question<\/code>.<\/p><\/dd><\/dl>"}, {"a": 55, "b": 58, "title": "answer (2): truy hồi top-20", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Gọi retriever, đo thời gian. Không có đoạn nào → <code>no_passages<\/code> (ví dụ câu hỏi toàn stopword với BM25).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>hits<\/code>: <code>[{passage_id, score, rank, …}]<\/code>, tối đa 20.<\/p><\/dd><\/dl>"}, {"a": 59, "b": 64, "title": "answer (3): xếp lại (tùy chọn, GĐ14)", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Có reranker thì gắn <code>text<\/code> vào từng hit, gọi <code>rerank<\/code>, rồi <strong>bỏ<\/strong> trường <code>text<\/code> khỏi kết quả (không đưa văn bản dài vào trace).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p><code>reranker = None<\/code> giữ đúng hành vi cũ: pipeline đã đóng băng không bị đổi khi thêm tính năng.<\/p><\/dd><\/dl>"}, {"a": 65, "b": 70, "title": "answer (4): reader đọc top-5", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Lấy 5 đoạn đầu, cắt câu hỏi, đọc bằng <code>reader.read<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Đọc 20 đoạn tốn gấp 4 lần thời gian reader; 5 là cân bằng giữa trần Hit@5 và độ trễ.<\/p><\/dd><\/dl>"}, {"a": 72, "b": 83, "title": "answer (5): vết (trace)", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>retrieved<\/code> (mọi hit), <code>candidates<\/code> (5 đoạn đã đọc kèm đáp án và điểm của từng đoạn), và khi có reranker: <code>reranked<\/code>, <code>rerank_stats<\/code>, <code>rank_before_rerank<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Giải thích được <strong>vì sao<\/strong> hệ thống chọn đáp án đó. Frontend hiển thị bảng ứng viên từ đây (GĐ9).<\/p><\/dd><\/dl>"}, {"a": 84, "b": 90, "title": "answer (6): chọn đáp án cuối và kiểm bất biến", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Bỏ các đoạn không có span hợp lệ; chọn span có <strong>điểm reader cao nhất<\/strong>; hòa điểm thì <code>max<\/code> giữ phần tử đứng trước (hạng retrieval cao hơn). Kiểm <code>passage_text[start:end] == text<\/code>, sai thì ném lỗi.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Bất biến offset là hợp đồng của GĐ0; vi phạm là lỗi lập trình, phải lộ ra ngay.<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Đề xuất cải tiến (không có trong project): đáp án chỉ được chọn bằng điểm reader, bỏ qua điểm retrieval/rerank. Phân tích dev-unseen của project (<code>results/15_dev_matrix.json<\/code>) cho thấy khi đoạn đúng <strong>có<\/strong> trong top-5, reader chỉ chọn đúng đoạn đó khoảng 65–73% số câu. Kết hợp điểm (ví dụ <code>reader + λ·retrieval<\/code>, λ chọn trên dev) là hướng cần thử, phải đo lại trước khi áp dụng.<\/p><\/dd><\/dl>"}, {"a": 91, "b": 97, "title": "answer (7): phản hồi đầy đủ", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Điền mọi trường của <code>QAResponse<\/code>; <code>status = question_truncated<\/code> nếu câu hỏi bị cắt (vẫn có đáp án).<\/p><\/dd><\/dl>"}, {"a": 100, "b": 108, "title": "build_retriever: nhánh bm25", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc <code>configs/pipeline.yaml → bm25<\/code>, nạp chỉ mục đã lưu nếu dấu vân tay khớp, không thì dựng và lưu (GĐ11).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Cùng cấu hình <code>k1=0.7, b=0.2, stopword<\/code> đã chọn ở GĐ3.<\/p><\/dd><\/dl>"}, {"a": 109, "b": 115, "title": "build_retriever: nhánh dense", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc <code>configs/dense.yaml<\/code>, nạp vector đã mã hóa từ <code>artifact_dir<\/code>, kiểm manifest tương thích, tạo <code>DPREncoder<\/code> (nạp lười).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>GĐ6.<\/p><\/dd><\/dl>"}, {"a": 116, "b": 122, "title": "build_retriever: nhánh hybrid", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dựng BM25 và dense <strong>một lần<\/strong>, bọc bằng <code>HybridRetriever<\/code> với <code>configs/hybrid.yaml<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>GĐ13.<\/p><\/dd><\/dl>"}, {"a": 125, "b": 137, "title": "build_pipeline (1): dựng thành phần", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc cấu hình, đường dẫn checkpoint (tương đối → tính từ <code>ROOT<\/code>), corpus, retriever, <code>Reader<\/code> với <code>max_answer_tokens = 80<\/code>, <code>score_mode = minus_cls<\/code> từ <code>pipeline.yaml<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p><code>import Reader<\/code> nằm <strong>trong<\/strong> hàm: torch chỉ được nạp khi thật sự dựng reader (script chỉ cần BM25 khởi động nhanh hơn).<\/p><\/dd><\/dl>"}, {"a": 138, "b": 140, "title": "build_pipeline (2): cấu hình được băm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Cấu hình đưa vào <code>new_experiment_id<\/code> gồm pipeline.yaml, tên checkpoint, loại retriever, và cả khối hybrid.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Nếu không đưa <code>rrf_c<\/code> vào cấu hình băm, hai cấu hình hybrid khác nhau sẽ có <strong>cùng đuôi mã<\/strong>: kết quả không phân biệt được (chú thích trong code nói rõ điều này).<\/p><\/dd><\/dl>"}, {"a": 141, "b": 146, "title": "build_pipeline (3): reranker tùy chọn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>reranker=True<\/code> → dựng từ <code>configs/rerank.yaml<\/code>; hoặc truyền sẵn một đối tượng có <code>.rerank<\/code>. Cấu hình rerank vào cấu hình băm để phân biệt H0 và H1.<\/p><\/dd><\/dl>"}, {"a": 147, "b": 151, "title": "build_pipeline (4): lắp ráp", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>passages = {passage_id: original_text}<\/code>, <code>corpus_version<\/code> = 12 ký tự SHA-1 của <code>corpus.jsonl<\/code>, top-k từ cấu hình.<\/p><\/dd><\/dl>"}], "intro": "<p>Ghép retriever + (reranker) + reader thành một hàm <code>answer(question)<\/code>. Pipeline chỉ biết retriever qua <code>retrieve(question, top_k)<\/code> và reader qua <code>read(question, passages)<\/code>: đổi BM25 sang dense/hybrid <strong>không<\/strong> phải sửa file này.<\/p>"}, {"path": "scripts/GD5/05_ask.py", "name": "05_ask.py", "kind": "orig", "lang": "python", "source": "\"\"\"GĐ5.5: hỏi một câu. In đáp án, đoạn chứa nó, điểm và thời gian từng bước.\"\"\"\nimport argparse\nimport json\n\nfrom germanqa.pipeline import build_pipeline\n\n\ndef main(question, checkpoint, trace):\n    pipe = build_pipeline(checkpoint)\n    pipe.answer(\"Wer war Konrad Adenauer?\")                    # chạy khởi động: lần đầu luôn chậm hơn (CUDA, bộ nhớ đệm)\n    r = pipe.answer(question, trace=trace)\n    print(f\"Hỏi     : {r.question}\")\n    print(f\"Đáp án  : {r.answer!r}   (trạng thái: {r.status})\")\n    print(f\"Đoạn    : {r.passage_id}  [{r.answer_start}:{r.answer_end}]\")\n    if r.passage_text:\n        a, b = r.answer_start, r.answer_end\n        print(f\"Ngữ cảnh: ...{r.passage_text[max(0, a - 80):a]}[[{r.passage_text[a:b]}]]{r.passage_text[b:b + 80]}...\")\n    print(f\"Điểm    : BM25 {r.retrieval_score:.2f}, reader {r.reader_score:.2f}\")\n    print(f\"Thời gian: truy hồi {r.retrieval_time * 1000:.1f} ms, reader {r.reader_time * 1000:.1f} ms, \"\n          f\"tổng {r.total_time * 1000:.1f} ms\")\n    print(f\"Phiên bản: mô hình {r.model_version}, corpus {r.corpus_version}, thí nghiệm {r.experiment_id}\")\n    if trace:\n        print(json.dumps(r.trace[\"candidates\"], ensure_ascii=False, indent=2))\n\n\nif __name__ == \"__main__\":\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"question\")\n    ap.add_argument(\"--checkpoint\", default=None)\n    ap.add_argument(\"--trace\", action=\"store_true\")\n    a = ap.parse_args()\n    main(a.question, a.checkpoint, a.trace)", "notes": [{"a": 8, "b": 11, "title": "Dựng pipeline và chạy khởi động", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Câu hỏi mồi <code>Wer wa
