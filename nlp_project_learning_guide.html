c nhận vùng tô sáng đúng.<\/li><li>Giải thích vì sao chỉ dùng <code>AbortController<\/code> là chưa đủ để chống response cũ ghi đè (gợi ý: fetch giả trong test, hoặc response đã về trước khi <code>abort<\/code>).<\/li><\/ol>"}], "pages": {"overview": {"title": "Tổng quan project", "nav": "Tổng quan project", "html": "\n<h1>GermanQA: hỏi đáp trích xuất tiếng Đức<\/h1>\n<p class=\"lead\">Giáo trình tương tác để đọc hiểu và tự viết lại project <code>nlp_v1<\/code>. Mọi đoạn code ở cột giữa là <b>code thật<\/b> trích từ project. Mọi con số là số đo có trong các tệp <code>results/<\/code>, <code>reports/<\/code>, <code>data/processed/<\/code>.<\/p>\n<h2>1. Bài toán<\/h2>\n<p><strong>Extractive Question Answering miền mở trên một corpus cố định.<\/strong> Người dùng đặt một câu hỏi tiếng Đức. Hệ thống tìm trong 26.864 đoạn văn Wikipedia những đoạn liên quan, rồi <strong>trích nguyên văn<\/strong> một đoạn ngắn làm câu trả lời, kèm bằng chứng (đoạn nguồn và vị trí ký tự).<\/p>\n<table><thead><tr><th><\/th><th>Mô tả<\/th><\/tr><\/thead><tbody><tr><td>Input<\/td><td>Một câu hỏi tiếng Đức (≤ 500 ký tự), tùy chọn: loại retriever, có xếp lại hay không, top-k<\/td><\/tr><tr><td>Output<\/td><td>Đáp án (chuỗi con của đoạn nguồn), <code>passage_id<\/code>, văn bản đoạn, offset <code>[start, end)<\/code> (code point và UTF-16), điểm truy hồi/reader/rerank, thời gian từng bước, phiên bản mô hình và corpus, mã thí nghiệm, trạng thái, vết (trace)<\/td><\/tr><tr><td>Dữ liệu<\/td><td>GermanQuAD (nhãn QA) + GermanDPR (đoạn bổ sung, hard negative) từ Hugging Face<\/td><\/tr><tr><td>Mục tiêu<\/td><td>Hệ thống hoàn chỉnh (V1): BM25, dense, hybrid, rerank, đánh giá có kiểm soát, API, web<\/td><\/tr><\/tbody><\/table>\n<h2>2. Ứng dụng thực tế<\/h2>\n<p>Tra cứu tài liệu nội bộ, hỗ trợ khách hàng, tìm kiếm tri thức có trích dẫn nguồn: bất cứ nơi nào cần câu trả lời <strong>có bằng chứng kiểm chứng được<\/strong> thay vì văn bản sinh tự do.<\/p>\n<h2>3. Kiến thức cần có<\/h2>\n<p><strong>NLP<\/strong>: tokenization (regex, WordPiece), chuẩn hóa Unicode, mô hình túi từ và BM25, biểu diễn vector dày (dense embedding), Transformer/BERT, QA trích xuất kiểu SQuAD, cross-encoder, metric truy hồi (Hit/MRR) và QA (EM/F1).<\/p>\n<p><strong>ML/DL<\/strong>: fine-tune mô hình tiền huấn luyện, cross-entropy, AdamW, warmup, mixed precision (fp16), gradient accumulation, chia train/dev/test, rò rỉ dữ liệu, bootstrap và khoảng tin cậy.<\/p>\n<p><strong>Kỹ thuật phần mềm<\/strong>: package Python, YAML, hàm băm và tái lập, FAISS, FastAPI (async, thread pool), React/TypeScript.<\/p>\n<h2>4. Kết quả chính (test, n = 2.203, mở một lần)<\/h2>\n<table><thead><tr><th>Hệ thống<\/th><th>Hit@5<\/th><th>EM<\/th><th>F1<\/th><th>p50 tổng<\/th><\/tr><\/thead><tbody><tr><td>B0 – BM25<\/td><td>0,793<\/td><td>0,222<\/td><td>0,397<\/td><td>64 ms<\/td><\/tr><tr><td>B1 – Dense DPR<\/td><td>0,709<\/td><td>0,220<\/td><td>0,379<\/td><td>116 ms<\/td><\/tr><tr><td><strong>H0 – Hybrid RRF<\/strong><\/td><td><strong>0,919<\/strong><\/td><td><strong>0,261<\/strong><\/td><td><strong>0,454<\/strong><\/td><td>142 ms<\/td><\/tr><tr><td>H1 – Hybrid + cross-encoder<\/td><td>0,969<\/td><td>0,250<\/td><td>0,433<\/td><td>744 ms<\/td><\/tr><\/tbody><\/table>\n<p>EM/F1 tính theo đáp án tham chiếu đầu tiên (<code>first_ref<\/code>); tính theo mọi đáp án thì EM lần lượt 0,330 / 0,316 / 0,383 / 0,361. Nguồn: <code>results/final_test_matrix.json<\/code>. Kết luận và phát hiện ở trang <strong>Tổng kết<\/strong>.<\/p>\n<h2>5. Bắt đầu từ đâu?<\/h2>\n<ol><li>Xem <strong>Kiến trúc &amp; luồng dữ liệu<\/strong> để có bức tranh tổng thể.<\/li><li>Đọc <strong>Cấu trúc thư mục<\/strong> để biết file nào làm gì.<\/li><li>Đọc <strong>Cách dùng website<\/strong> (2 phút).<\/li><li>Vào <strong>Giai đoạn 00<\/strong> và đi lần lượt bằng nút <em>Tiếp ▶<\/em>.<\/li><\/ol>"}, "architecture": {"title": "Kiến trúc & luồng dữ liệu", "nav": "Kiến trúc hệ thống", "html": "<h1>Kiến trúc hệ thống<\/h1><p>Hệ thống có hai nửa: <strong>offline<\/strong> (chuẩn bị dữ liệu, chỉ mục và mô hình, chạy một lần) và <strong>online<\/strong> (trả lời từng câu hỏi). Hai nửa nối với nhau qua các <strong>artifact có dấu vân tay<\/strong>: <code>corpus.jsonl<\/code> (SHA-1), <code>artifacts/bm25<\/code> (dấu vân tay BM25), <code>artifacts/dense/text384<\/code> (manifest + SHA-1 corpus + revision encoder), <code>models/reader_…<\/code>.<\/p>\n<h2>Luồng offline<\/h2><svg class=\"dg\" viewBox=\"0 0 920 280\" role=\"img\" aria-label=\"Luồng offline: dữ liệu và artifacts\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#6b7686\"/><\/marker><\/defs><rect class=\"bx n\" x=\"20\" y=\"40\" width=\"150\" height=\"52\" rx=\"8\"/><text x=\"95\" y=\"63\" text-anchor=\"middle\" class=\"ttl\">GermanQuAD<\/text><text x=\"95\" y=\"77\" text-anchor=\"middle\" class=\"sub\">HF · 11.518 / 2.204<\/text><rect class=\"bx n\" x=\"20\" y=\"130\" width=\"150\" height=\"52\" rx=\"8\"/><text x=\"95\" y=\"153\" text-anchor=\"middle\" class=\"ttl\">GermanDPR<\/text><text x=\"95\" y=\"167\" text-anchor=\"middle\" class=\"sub\">HF · 9.275 / 1.025<\/text><rect class=\"bx o\" x=\"220\" y=\"60\" width=\"170\" height=\"104\" rx=\"8\"/><text x=\"305\" y=\"95\" text-anchor=\"middle\" class=\"ttl\">GĐ1–2 tiền xử lý<\/text><text x=\"305\" y=\"109\" text-anchor=\"middle\" class=\"sub\">download → build_corpus<\/text><text x=\"305\" y=\"123\" text-anchor=\"middle\" class=\"sub\">build_qa → validate<\/text><text x=\"305\" y=\"137\" text-anchor=\"middle\" class=\"sub\">remove_conflicts → split<\/text><path class=\"ar\" d=\"M170 66 L220 95\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M170 156 L220 130\" marker-end=\"url(#ah)\"/><rect class=\"bx g\" x=\"440\" y=\"20\" width=\"190\" height=\"46\" rx=\"8\"/><text x=\"535\" y=\"40\" text-anchor=\"middle\" class=\"ttl\">corpus.jsonl<\/text><text x=\"535\" y=\"54\" text-anchor=\"middle\" class=\"sub\">26.864 đoạn (đã khử trùng lặp)<\/text><rect class=\"bx g\" x=\"440\" y=\"78\" width=\"190\" height=\"46\" rx=\"8\"/><text x=\"535\" y=\"98\" text-anchor=\"middle\" class=\"ttl\">qa_{train,dev,test}.jsonl<\/text><text x=\"535\" y=\"112\" text-anchor=\"middle\" class=\"sub\">10.301 / 1.176 / 2.203 câu<\/text><rect class=\"bx g\" x=\"440\" y=\"136\" width=\"190\" height=\"46\" rx=\"8\"/><text x=\"535\" y=\"156\" text-anchor=\"middle\" class=\"ttl\">qrels_*.json · hardneg<\/text><text x=\"535\" y=\"170\" text-anchor=\"middle\" class=\"sub\">đoạn đúng · đoạn nhiễu<\/text><rect class=\"bx n\" x=\"440\" y=\"194\" width=\"190\" height=\"40\" rx=\"8\"/><text x=\"535\" y=\"211\" text-anchor=\"middle\" class=\"ttl\">manifest · báo cáo<\/text><text x=\"535\" y=\"225\" text-anchor=\"middle\" class=\"sub\">SHA-1 từng tệp<\/text><path class=\"ar\" d=\"M390 112 L440 43\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M390 112 L440 101\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M390 112 L440 159\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M390 140 L415 214 L440 214\" marker-end=\"url(#ah)\"/><rect class=\"bx \" x=\"690\" y=\"10\" width=\"210\" height=\"56\" rx=\"8\"/><text x=\"795\" y=\"28\" text-anchor=\"middle\" class=\"ttl\">Chỉ mục BM25<\/text><text x=\"795\" y=\"42\" text-anchor=\"middle\" class=\"sub\">GĐ3/11 · k1 0,7 · b 0,2<\/text><text x=\"795\" y=\"56\" text-anchor=\"middle\" class=\"sub\">artifacts/bm25 + dấu vân tay<\/text><rect class=\"bx p\" x=\"690\" y=\"80\" width=\"210\" height=\"56\" rx=\"8\"/><text x=\"795\" y=\"98\" text-anchor=\"middle\" class=\"ttl\">Vector dense (DPR)<\/text><text x=\"795\" y=\"112\" text-anchor=\"middle\" class=\"sub\">GĐ6/12 · 26.864 × 768<\/text><text x=\"795\" y=\"126\" text-anchor=\"middle\" class=\"sub\">artifacts/dense/text384 + FAISS<\/text><rect class=\"bx r\" x=\"690\" y=\"150\" width=\"210\" height=\"56\" rx=\"8\"/><text x=\"795\" y=\"168\" text-anchor=\"middle\" class=\"ttl\">Reader GBERT fine-tune<\/text><text x=\"795\" y=\"182\" text-anchor=\"middle\" class=\"sub\">GĐ4 · 3 epoch · dev EM 0,469 (*)<\/text><text x=\"795\" y=\"196\" text-anchor=\"middle\" class=\"sub\">models/reader_…96717e35<\/text><rect class=\"bx o\" x=\"690\" y=\"220\" width=\"210\" height=\"46\" rx=\"8\"/><text x=\"795\" y=\"240\" text-anchor=\"middle\" class=\"ttl\">Reranker (tải sẵn)<\/text><text x=\"795\" y=\"254\" text-anchor=\"middle\" class=\"sub\">bge-reranker-v2-m3 · GĐ14<\/text><path class=\"ar\" d=\"M630 43 L690 38\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M630 50 L690 105\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M630 101 L660 101 L660 172 L690 172\" marker-end=\"url(#ah)\"/><text class=\"lbl\" x=\"662\" y=\"140\" text-anchor=\"middle\">train/dev<\/text><\/svg><p>(*) EM 0,469 là reader đọc <strong>đúng đoạn cho sẵn<\/strong> trên dev (giới hạn trên của reader), không phải EM end-to-end.<\/p>\n<h2>Luồng online<\/h2><svg class=\"dg\" viewBox=\"0 0 1050 290\" role=\"img\" aria-label=\"Luồng online: một câu hỏi\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#6b7686\"/><\/marker><\/defs><rect class=\"bx n\" x=\"10\" y=\"120\" width=\"110\" height=\"50\" rx=\"8\"/><text x=\"65\" y=\"142\" text-anchor=\"middle\" class=\"ttl\">Câu hỏi<\/text><text x=\"65\" y=\"156\" text-anchor=\"middle\" class=\"sub\">≤ 500 ký tự<\/text><rect class=\"bx \" x=\"160\" y=\"50\" width=\"150\" height=\"54\" rx=\"8\"/><text x=\"235\" y=\"67\" text-anchor=\"middle\" class=\"ttl\">BM25<\/text><text x=\"235\" y=\"81\" text-anchor=\"middle\" class=\"sub\">tokenize + stopword<\/text><text x=\"235\" y=\"95\" text-anchor=\"middle\" class=\"sub\">top-100 · ~1 ms<\/text><rect class=\"bx p\" x=\"160\" y=\"190\" width=\"150\" height=\"54\" rx=\"8\"/><text x=\"235\" y=\"207\" text-anchor=\"middle\" class=\"ttl\">Dense DPR<\/text><text x=\"235\" y=\"221\" text-anchor=\"middle\" class=\"sub\">question encoder<\/text><text x=\"235\" y=\"235\" text-anchor=\"middle\" class=\"sub\">FAISS IP · top-100<\/text><path class=\"ar\" d=\"M120 135 L160 80\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M120 155 L160 215\" marker-end=\"url(#ah)\"/><rect class=\"bx o\" x=\"350\" y=\"115\" width=\"130\" height=\"60\" rx=\"8\"/><text x=\"415\" y=\"135\" text-anchor=\"middle\" class=\"ttl\">RRF<\/text><text x=\"415\" y=\"149\" text-anchor=\"middle\" class=\"sub\">Σ 1/(10 + hạng)<\/text><text x=\"415\" y=\"163\" text-anchor=\"middle\" class=\"sub\">top-20 (H0)<\/text><path class=\"ar\" d=\"M310 77 L350 135\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M310 217 L350 158\" marker-end=\"url(#ah)\"/><rect class=\"bx o\" x=\"520\" y=\"30\" width=\"150\" height=\"58\" rx=\"8\"/><text x=\"595\" y=\"49\" text-anchor=\"middle\" class=\"ttl\">Cross-encoder<\/text><text x=\"595\" y=\"63\" text-anchor=\"middle\" class=\"sub\">tùy chọn (H1)<\/text><text x=\"595\" y=\"77\" text-anchor=\"middle\" class=\"sub\">xếp lại 20 đoạn<\/text><path class=\"ar\" d=\"M480 135 L500 135 L500 59 L520 59\" marker-end=\"url(#ah)\"/><text class=\"lbl\" x=\"470\" y=\"95\" text-anchor=\"middle\">rerank?<\/text><path class=\"ar\" d=\"M670 59 L700 59 L700 128 L720 128\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M480 150 L720 150\" marker-end=\"url(#ah)\"/><text class=\"lbl\" x=\"600\" y=\"145\" text-anchor=\"middle\">top-5<\/text><rect class=\"bx r\" x=\"720\" y=\"110\" width=\"150\" height=\"70\" rx=\"8\"/><text x=\"795\" y=\"128\" text-anchor=\"middle\" class=\"ttl\">Reader GBERT<\/text><text x=\"795\" y=\"142\" text-anchor=\"middle\" class=\"sub\">cửa sổ 384/128<\/text><text x=\"795\" y=\"156\" text-anchor=\"middle\" class=\"sub\">span tốt nhất / đoạn<\/text><text x=\"795\" y=\"170\" text-anchor=\"middle\" class=\"sub\">chọn điểm cao nhất<\/text><rect class=\"bx g\" x=\"910\" y=\"110\" width=\"130\" height=\"70\" rx=\"8\"/><text x=\"975\" y=\"128\" text-anchor=\"middle\" class=\"ttl\">QAResponse<\/text><text x=\"975\" y=\"142\" text-anchor=\"middle\" class=\"sub\">đáp án + offset<\/text><text x=\"975\" y=\"156\" text-anchor=\"middle\" class=\"sub\">điểm · thời gian<\/text><text x=\"975\" y=\"170\" text-anchor=\"middle\" class=\"sub\">phiên bản · trace<\/text><path class=\"ar\" d=\"M870 145 L910 145\" marker-end=\"url(#ah)\"/><rect class=\"bx n\" x=\"910\" y=\"220\" width=\"130\" height=\"50\" rx=\"8\"/><text x=\"975\" y=\"242\" text-anchor=\"middle\" class=\"ttl\">FastAPI<\/text><text x=\"975\" y=\"256\" text-anchor=\"middle\" class=\"sub\">/api/v1/qa · Runner<\/text><rect class=\"bx n\" x=\"720\" y=\"220\" width=\"150\" height=\"50\" rx=\"8\"/><text x=\"795\" y=\"242\" text-anchor=\"middle\" class=\"ttl\">React<\/text><text x=\"795\" y=\"256\" text-anchor=\"middle\" class=\"sub\">tô sáng UTF-16<\/text><path class=\"ar\" d=\"M975 180 L975 220\" marker-end=\"url(#ah)\"/><path class=\"ar\" d=\"M910 245 L870 245\" marker-end=\"url(#ah)\"/><\/svg><h2>Các module và quan hệ<\/h2>\n<table><thead><tr><th>Lớp<\/th><th>Module<\/th><th>Giao diện chung<\/th><\/tr><\/thead><tbody><tr><td>Dữ liệu<\/td><td><code>data/*<\/code><\/td><td>tệp JSONL/JSON trong <code>data/processed/<\/code><\/td><\/tr><tr><td>Truy hồi<\/td><td><code>BM25Retriever<\/code>, <code>DenseRetriever<\/code>, <code>HybridRetriever<\/code><\/td><td><code>retrieve(question, top_k) → [{passage_id, score, rank, …}]<\/code><\/td><\/tr><tr><td>Xếp lại<\/td><td><code>CrossEncoderReranker<\/code><\/td><td><code>rerank(question, candidates) → candidates + rank_before, rerank_score<\/code><\/td><\/tr><tr><td>Đọc<\/td><td><code>Reader<\/code><\/td><td><code>read(question, [{passage_id, text}]) → [{text, start, end, score}]<\/code><\/td><\/tr><tr><td>Hệ thống<\/td><td><code>QAPipeline<\/code><\/td><td><code>answer(question, …) → QAResponse<\/code><\/td><\/tr><tr><td>Dịch vụ<\/td><td><code>api/app.py<\/code><\/td><td>HTTP <code>/api/v1/qa<\/code>, <code>/api/v1/retrieve<\/code>, <code>/health/*<\/code>, <code>/api/v1/matrix<\/code><\/td><\/tr><\/tbody><\/table>\n<p>Nhờ các giao diện này, <code>pipeline.py<\/code> <strong>không đổi<\/strong> khi thêm dense (GĐ6), hybrid (GĐ13) hay reranker (GĐ14, chỉ thêm tham số tùy chọn).<\/p>\n<h2>Luồng dữ liệu tóm tắt<\/h2>\n<pre class=\"blk\" data-lang=\"text\"><code>Raw HF datasets → chuẩn hóa + ID băm → corpus/qa/qrels → chia nhóm (train/dev/test)\n   → BM25 index / dense vectors / reader fine-tune\nCâu hỏi → BM25 ∥ Dense → RRF top-20 → (cross-encoder) → top-5 → Reader (cửa sổ 384/128)\n   → span tốt nhất mỗi đoạn → chọn điểm cao nhất → QAResponse → FastAPI → React<\/code><\/pre>\n<h2>Sơ đồ Mermaid (để dán vào công cụ hỗ trợ Mermaid)<\/h2><details class=\"mm\"><summary>Xem mã Mermaid<\/summary><pre class=\"blk\"><code>flowchart LR\n  subgraph Offline\n    QuAD[GermanQuAD] --&gt; PRE[GĐ1-2 tiền xử lý]\n    DPR[GermanDPR] --&gt; PRE\n    PRE --&gt; C[corpus.jsonl] &amp; QA[qa_*.jsonl] &amp; QR[qrels / hardneg]\n    C --&gt; BI[BM25 index] &amp; DV[Dense vectors + FAISS]\n    QA --&gt; RT[Fine-tune reader GBERT]\n  end\n  subgraph Online\n    Q[Câu hỏi] --&gt; B[BM25 top-100] &amp; D[Dense top-100]\n    B --&gt; F[RRF top-20]\n    D --&gt; F\n    F --&gt;|tùy chọn| X[Cross-encoder]\n    F --&gt; R[Reader top-5]\n    X --&gt; R\n    R --&gt; A[QAResponse] --&gt; API[FastAPI] --&gt; UI[React]\n  end<\/code><\/pre><\/details>"}, "structure": {"title": "Cấu trúc thư mục", "nav": "Cấu trúc thư mục & file", "html": "<h1>Cấu trúc thư mục<\/h1><p>Bảng dưới liệt kê các file/thư mục quan trọng. Bấm <strong>mở<\/strong> để tới giai đoạn trình bày file đó.<\/p><table class=\"tbl\"><thead><tr><th>File/Folder<\/th><th>Chức năng<\/th><th>Input<\/th><th>Output<\/th><th>Module liên quan<\/th><\/tr><\/thead><tbody><tr><td><code>src/germanqa/config.py<\/code> <button class=\"linkbtn\" data-gostage=\"s0/0\">mở<\/button><\/td><td>Đường dẫn, SEED, DEV_RATIO, DATASETS<\/td><td>—<\/td><td>hằng số<\/td><td>mọi module<\/td><\/tr><tr><td><code>src/germanqa/schemas.py<\/code> <button class=\"linkbtn\" data-gostage=\"s0/0\">mở<\/button><\/td><td>Hợp đồng dữ liệu, QAResponse, offset UTF-16<\/td><td>—<\/td><td>dataclass<\/td><td>pipeline, api<\/td><\/tr><tr><td><code>src/germanqa/experiment.py<\/code> <button class=\"linkbtn\" data-gostage=\"s0/0\">mở<\/button><\/td><td>seed, đọc YAML, experiment_id, lưu kết quả<\/td><td>configs/*.yaml<\/td><td>results/*.json<\/td><td>mọi script<\/td><\/tr><tr><td><code>src/germanqa/data/download.py, eda.py<\/code> <button class=\"linkbtn\" data-gostage=\"s1/0\">mở<\/button><\/td><td>Tải dataset có ghim revision, kiểm số mẫu<\/td><td>Hugging Face Hub<\/td><td>data/raw/, reports/step1_*<\/td><td>02_preprocess<\/td><\/tr><tr><td><code>src/germanqa/data/text_utils.py, validate_spans.py<\/code> <button class=\"linkbtn\" data-gostage=\"s2/0\">mở<\/button><\/td><td>Chuẩn hóa, ID băm, kiểm vị trí đáp án<\/td><td>văn bản thô<\/td><td>chuỗi, ID, trạng thái<\/td><td>build_corpus, build_qa<\/td><\/tr><tr><td><code>src/germanqa/data/build_corpus.py, build_qa.py<\/code> <button class=\"linkbtn\" data-gostage=\"s3/0\">mở<\/button><\/td><td>Corpus khử trùng lặp, dòng QA, qrels, hard negative<\/td><td>data/raw/<\/td><td>dict/list trong bộ nhớ<\/td><td>split, 02_preprocess<\/td><\/tr><tr><td><code>src/germanqa/data/split.py<\/code> <button class=\"linkbtn\" data-gostage=\"s4/0\">mở<\/button><\/td><td>Loại xung đột với test, chia train/dev theo nhóm<\/td><td>dòng QA, qrels, doc_of<\/td><td>train/dev<\/td><td>02_preprocess<\/td><\/tr><tr><td><code>scripts/02_preprocess.py<\/code> <button class=\"linkbtn\" data-gostage=\"s4/0\">mở<\/button><\/td><td>Điều phối GĐ2, ghi tệp + manifest<\/td><td>data/raw/<\/td><td>data/processed/*<\/td><td>mọi giai đoạn sau<\/td><\/tr><tr><td><code>src/germanqa/retrieval/tokenizer.py, bm25.py<\/code> <button class=\"linkbtn\" data-gostage=\"s5/0\">mở<\/button><\/td><td>Tách từ, BM25 Okapi tự cài<\/td><td>retrieval_text<\/td><td>[{passage_id, score, rank}]<\/td><td>pipeline, hybrid, bm25_store<\/td><\/tr><tr><td><code>src/germanqa/evaluation/retrieval_metrics.py, bootstrap.py<\/code> <button class=\"linkbtn\" data-gostage=\"s5/0\">mở<\/button><\/td><td>Hit/Recall/MRR@k, độ trễ, CI bootstrap<\/td><td>run, qrels, điểm từng câu<\/td><td>dict số đo<\/td><td>mọi đánh giá<\/td><\/tr><tr><td><code>src/germanqa/tokenization.py, reader/features.py<\/code> <button class=\"linkbtn\" data-gostage=\"s6/0\">mở<\/button><\/td><td>WordPiece có kiểm từ vựng; cửa sổ + nhãn<\/td><td>vocab.txt; qa + corpus<\/td><td>feature cửa sổ<\/td><td>trainer, inference<\/td><\/tr><tr><td><code>src/germanqa/reader/model_io.py, trainer.py<\/code> <button class=\"linkbtn\" data-gostage=\"s7/0\">mở<\/button><\/td><td>Nạp mô hình; vòng huấn luyện fp16<\/td><td>feature, reader.yaml<\/td><td>models/reader_*<\/td><td>04c_train_reader<\/td><\/tr><tr><td><code>src/germanqa/reader/postprocess.py, qa_metrics.py, inference.py<\/code> <button class=\"linkbtn\" data-gostage=\"s8/0\">mở<\/button><\/td><td>Giải mã span, EM/F1, lớp Reader<\/td><td>logit, offsets<\/td><td>đáp án + offset<\/td><td>pipeline<\/td><\/tr><tr><td><code>src/germanqa/pipeline.py<\/code> <button class=\"linkbtn\" data-gostage=\"s9/0\">mở<\/button><\/td><td>QAPipeline + build_pipeline/build_retriever<\/td><td>retriever, reader, configs<\/td><td>QAResponse<\/td><td>05_ask, api/loader<\/td><\/tr><tr><td><code>src/germanqa/retrieval/dense.py<\/code> <button class=\"linkbtn\" data-gostage=\"s10/0\">mở<\/button><\/td><td>DPR + FAISS, manifest tương thích<\/td><td>original_text<\/td><td>artifacts/dense/*<\/td><td>pipeline, hybrid<\/td><\/tr><tr><td><code>src/germanqa/retrieval/rrf.py, hybrid.py<\/code> <button class=\"linkbtn\" data-gostage=\"s11/0\">mở<\/button><\/td><td>Reciprocal Rank Fusion, HybridRetriever<\/td><td>2 danh sách xếp hạng<\/td><td>top-20 hợp nhất<\/td><td>pipeline, rerank/pool<\/td><\/tr><tr><td><code>src/germanqa/rerank/cross_encoder.py, factory.py<\/code> <button class=\"linkbtn\" data-gostage=\"s12/0\">mở<\/button><\/td><td>Cross-encoder xếp lại, cửa sổ, dấu vân tay<\/td><td>20 ứng viên + văn bản<\/td><td>danh sách xếp lại<\/td><td>pipeline, api/loader<\/td><\/tr><tr><td><code>src/germanqa/experiment_rules.py, retrieval/bm25_store.py, evaluation/{decision,select_set}.py, rerank/exposure.py<\/code> <button class=\"linkbtn\" data-gostage=\"s13/0\">mở<\/button><\/td><td>Sổ phơi bày test, dấu vân tay, quy tắc nhận, tập chưa thấy<\/td><td>kết quả, corpus<\/td><td>ledger, baselines, artifacts/bm25<\/td><td>scripts GĐ11–15<\/td><\/tr><tr><td><code>src/germanqa/api/*<\/code> <button class=\"linkbtn\" data-gostage=\"s14/0\">mở<\/button><\/td><td>FastAPI: settings, loader, runner, app, errors (+ schemas, experiments)<\/td><td>configs/api.yaml, pipeline<\/td><td>HTTP JSON<\/td><td>frontend<\/td><\/tr><tr><td><code>frontend/src/*<\/code> <button class=\"linkbtn\" data-gostage=\"s15/0\">mở<\/button><\/td><td>React + TypeScript: hỏi đáp, ứng viên, bảng số đo<\/td><td>API<\/td><td>giao diện<\/td><td>—<\/td><\/tr><tr><td><code>configs/*.yaml<\/code> <\/td><td>Mọi tham số (baseline, pipeline, reader, dense, hybrid, rerank, evaluation, api)<\/td><td>—<\/td><td>dict cấu hình<\/td><td>mọi module<\/td><\/tr><tr><td><code>data/processed/<\/code> <\/td><td>Dữ liệu đã xử lý (corpus, qa, qrels, manifest)<\/td><td>02_preprocess<\/td><td>JSONL/JSON<\/td><td>mọi giai đoạn<\/td><\/tr><tr><td><code>artifacts/, models/<\/code> <\/td><td>Chỉ mục BM25/dense; checkpoint reader và reranker<\/td><td>scripts GĐ4, GĐ6, GĐ11, GĐ14<\/td><td>tệp nhị phân + manifest<\/td><td>pipeline, api<\/td><\/tr><tr><td><code>results/, reports/, baselines/<\/code> <\/td><td>Kết quả thí nghiệm, phân tích, tệp mốc B0/B1/H0/H1, sổ phơi bày test<\/td><td>scripts<\/td><td>JSON/JSONL/MD<\/td><td>api /experiments, /matrix<\/td><\/tr><tr><td><code>scripts/GD*/<\/code> <\/td><td>Script điều phối từng giai đoạn (chạy thí nghiệm, phân tích)<\/td><td>src + configs<\/td><td>results/, reports/<\/td><td>—<\/td><\/tr><tr><td><code>tests/<\/code> <\/td><td>pytest theo giai đoạn (360 passed, 1 skipped khi kiểm ngày 2026-11-11)<\/td><td>src<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td><code>plan/, docs/<\/code> <\/td><td>Kế hoạch V1/V2, quy tắc tiền xử lý và thí nghiệm, model card reranker<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table><h2>Thứ tự nên đọc source code<\/h2>\n<ol><li><code>config.py<\/code> → <code>schemas.py<\/code> → <code>data/io_utils.py<\/code> → <code>experiment.py<\/code> (quy ước chung).<\/li><li><code>data/text_utils.py<\/code> → <code>validate_spans.py<\/code> → <code>build_corpus.py<\/code> → <code>build_qa.py<\/code> → <code>split.py<\/code> → <code>scripts/02_preprocess.py<\/code>.<\/li><li><code>retrieval/tokenizer.py<\/code> → <code>retrieval/bm25.py<\/code> → <code>evaluation/retrieval_metrics.py<\/code> → <code>scripts/03_bm25_eval.py<\/code>.<\/li><li><code>tokenization.py<\/code> → <code>reader/features.py<\/code> → <code>reader/model_io.py<\/code> → <code>reader/trainer.py<\/code> → <code>reader/postprocess.py<\/code> → <code>reader/qa_metrics.py<\/code> → <code>reader/inference.py<\/code>.<\/li><li><code>pipeline.py<\/code> (đọc kỹ nhất: nơi mọi thứ gặp nhau).<\/li><li><code>retrieval/dense.py<\/code> → <code>retrieval/rrf.py<\/code> → <code>retrieval/hybrid.py<\/code> → <code>rerank/cross_encoder.py<\/code>.<\/li><li><code>experiment_rules.py<\/code>, <code>retrieval/bm25_store.py<\/code>, <code>evaluation/decision.py<\/code> (quy trình).<\/li><li><code>api/settings.py<\/code> → <code>api/runner.py<\/code> → <code>api/loader.py<\/code> → <code>api/app.py<\/code> → <code>frontend/src/…<\/code>.<\/li><\/ol>\n<p>Các file chưa trình bày chi tiết trong hướng dẫn (đọc thêm khi cần): <code>api/schemas.py<\/code>, <code>api/experiments.py<\/code>, <code>evaluation/{manifest,report,errors,run_cache,fusion_select,gd15_*}.py<\/code>, <code>rerank/{analysis,pool,select,hub}.py<\/code>, các script phân tích trong <code>scripts/GD*/<\/code>, component React.<\/p>"}, "roadmap": {"title": "Lộ trình code lại", "nav": "Lộ trình & phụ thuộc", "html": "<h1>Lộ trình code lại<\/h1><p>16 giai đoạn, sắp theo <strong>phụ thuộc<\/strong> (giai đoạn sau chỉ dùng thứ giai đoạn trước đã tạo). Cột \"Ứng với kế hoạch\" nối với số GĐ trong <code>plan/<\/code> của project. Thứ tự của hướng dẫn hơi khác thứ tự kế hoạch: kỷ luật thí nghiệm (GĐ11–12) được đặt sau hybrid/rerank để bạn hiểu <strong>vì sao<\/strong> cần nó; API (GĐ8) đặt cuối vì nó gom mọi thành phần.<\/p><table class=\"tbl\"><thead><tr><th>Giai đoạn (hướng dẫn)<\/th><th>Ứng với kế hoạch<\/th><th>Phụ thuộc<\/th><th>File sẽ viết<\/th><\/tr><\/thead><tbody><tr><td><button class=\"linkbtn\" data-gostage=\"s0/0\">00 · Khung dự án &amp; hợp đồng dữ liệu<\/button><\/td><td>GĐ0 · nền tảng<\/td><td>—<\/td><td><code>pyproject.toml<\/code>, <code>requirements.txt<\/code>, <code>config.py<\/code>, <code>schemas.py<\/code>, <code>io_utils.py<\/code>, <code>experiment.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s1/0\">01 · Tải và kiểm kê dữ liệu<\/button><\/td><td>GĐ1 · dữ liệu thô<\/td><td>0<\/td><td><code>download.py<\/code>, <code>eda.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s2/0\">02 · Chuẩn hóa văn bản và kiểm tra vị trí đáp án<\/button><\/td><td>GĐ2a · tiền xử lý<\/td><td>0, 1<\/td><td><code>text_utils.py<\/code>, <code>validate_spans.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s3/0\">03 · Dựng corpus, nhãn QA và qrels<\/button><\/td><td>GĐ2b · dữ liệu xử lý<\/td><td>2<\/td><td><code>build_corpus.py<\/code>, <code>build_qa.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s4/0\">04 · Chia train/dev/test chống rò rỉ<\/button><\/td><td>GĐ2c · chia dữ liệu<\/td><td>3<\/td><td><code>split.py<\/code>, <code>02_preprocess.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s5/0\">05 · BM25 và metric truy hồi<\/button><\/td><td>GĐ3 · baseline truy hồi<\/td><td>4<\/td><td><code>tokenizer.py<\/code>, <code>bm25.py<\/code>, <code>retrieval_metrics.py<\/code>, <code>bootstrap.py<\/code>, <code>03_bm25_eval.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s6/0\">06 · Tokenizer WordPiece và cửa sổ trượt cho reader<\/button><\/td><td>GĐ4a · đặc trưng reader<\/td><td>4<\/td><td><code>tokenization.py<\/code>, <code>features.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s7/0\">07 · Huấn luyện reader (fine-tune GBERT)<\/button><\/td><td>GĐ4b · reader<\/td><td>6<\/td><td><code>model_io.py<\/code>, <code>trainer.py<\/code>, <code>04c_train_reader.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s8/0\">08 · Giải mã đáp án, EM/F1 và lớp Reader<\/button><\/td><td>GĐ4c · reader suy luận<\/td><td>6, 7<\/td><td><code>postprocess.py<\/code>, <code>qa_metrics.py<\/code>, <code>inference.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s9/0\">09 · Pipeline hỏi đáp end-to-end<\/button><\/td><td>GĐ5 · ghép hệ thống<\/td><td>5, 8<\/td><td><code>pipeline.py<\/code>, <code>05_ask.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s10/0\">10 · Dense retriever: DPR + FAISS<\/button><\/td><td>GĐ6/12 · truy hồi ngữ nghĩa<\/td><td>5, 6<\/td><td><code>dense.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s11/0\">11 · Hybrid retrieval với Reciprocal Rank Fusion<\/button><\/td><td>GĐ13 · hợp nhất<\/td><td>5, 10<\/td><td><code>rrf.py<\/code>, <code>hybrid.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s12/0\">12 · Cross-encoder reranker<\/button><\/td><td>GĐ14 · xếp lại<\/td><td>9, 11<\/td><td><code>cross_encoder.py<\/code>, <code>factory.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s13/0\">13 · Kỷ luật thí nghiệm và tái lập<\/button><\/td><td>GĐ11–12 · quy trình<\/td><td>5, 10, 11<\/td><td><code>experiment_rules.py<\/code>, <code>bm25_store.py<\/code>, <code>decision.py<\/code>, <code>select_set.py<\/code>, <code>exposure.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s14/0\">14 · Dịch vụ FastAPI<\/button><\/td><td>GĐ8/18 · triển khai backend<\/td><td>9, 11, 12<\/td><td><code>settings.py<\/code>, <code>errors.py<\/code>, <code>runner.py<\/code>, <code>loader.py<\/code>, <code>app.py<\/code><\/td><\/tr><tr><td><button class=\"linkbtn\" data-gostage=\"s15/0\">15 · Frontend React: gọi API và tô sáng đáp án<\/button><\/td><td>GĐ9 · giao diện<\/td><td>14<\/td><td><code>highlight.ts<\/code>, <code>client.ts<\/code>, <code>useAsk.ts<\/code><\/td><\/tr><\/tbody><\/table><h2>Đồ thị phụ thuộc<\/h2>\n<pre class=\"blk\" data-lang=\"text\"><code>00 khung ─▶ 01 tải ─▶ 02 chuẩn hóa ─▶ 03 corpus/QA ─▶ 04 chia tập\n                                                     ├─▶ 05 BM25 + metric ──────────┐\n                                                     └─▶ 06 tokenizer/cửa sổ ─▶ 07 train ─▶ 08 giải mã ─┤\n                                                                                     09 pipeline ◀──┘\n05 + 06 ─▶ 10 dense ─▶ 11 hybrid RRF ─▶ 12 cross-encoder\n05, 10, 11 ─▶ 13 kỷ luật thí nghiệm\n09, 11, 12 ─▶ 14 FastAPI ─▶ 15 React<\/code><\/pre>\n<h2>Cách tự code lại<\/h2>\n<p>Tạo một thư mục mới (ví dụ <code>germanqa_rebuild/<\/code>) với cùng bố cục <code>src/germanqa/…<\/code>. Ở mỗi giai đoạn: đọc lý thuyết → <strong>gõ lại<\/strong> từng file theo thứ tự tab → chạy phần \"Chạy &amp; kiểm thử\" → so kết quả với số trong hướng dẫn → làm checkpoint. Có thể dùng dữ liệu đã xử lý của project (<code>data/processed/<\/code>) để so từng byte (SHA-1 trong <code>split_manifest.json<\/code>).<\/p>\n<h2>Chưa có trong project (không trình bày như đã làm)<\/h2>\n<ul><li>GĐ10 Docker/deploy: chưa cài đặt.<\/li><li>GĐ16 fine-tune dense, GĐ17 mining/robustness: chưa làm.<\/li><li>Fine-tune reranker: dự kiến sau khi xong V1 phần B.<\/li><\/ul>"}, "howto": {"title": "Cách dùng website", "nav": "Cách dùng website", "html": "<h1>Cách dùng website để học<\/h1><h2>Bố cục<\/h2>\n<table><thead><tr><th>Khu vực<\/th><th>Nội dung<\/th><\/tr><\/thead><tbody><tr><td>Cột trái<\/td><td>Tiến độ, trang tổng quan, 16 giai đoạn (chấm trạng thái), danh sách file, tổng kết<\/td><\/tr><tr><td>Cột giữa<\/td><td>Trình soạn thảo tối: tab file, đường dẫn, số dòng, tô màu cú pháp, copy<\/td><\/tr><tr><td>Cột phải<\/td><td>Giải thích code (thẻ theo khối dòng) và các tab A–G của giai đoạn<\/td><\/tr><\/tbody><\/table>\n<h2>Tương tác<\/h2>\n<ul><li><strong>Bấm một dòng code<\/strong> → thẻ giải thích tương ứng mở ra bên phải. <strong>Bôi đen nhiều dòng<\/strong> → chọn thẻ khớp nhất.<\/li><li><strong>Bấm tiêu đề thẻ<\/strong> → các dòng được giải thích sáng lên và cuộn tới. Mỗi thẻ ghi <code>file:dòng a–b<\/code>, có nút copy riêng khối đó.<\/li><li><strong>⧉ Copy code<\/strong>: sao chép cả file. <strong>A− / A+<\/strong>: cỡ chữ. <strong>ngắt dòng<\/strong>: bật/tắt ngắt dòng dài.<\/li><li><strong>◀ Trước / Tiếp ▶<\/strong> hoặc phím <code>[<\/code> <code>]<\/code>: chuyển giai đoạn. Phím <code>/<\/code>: tìm kiếm (tên hàm, class, file, từ khóa trong lời giải; không phân biệt dấu tiếng Việt).<\/li><li><strong>Chấm tròn<\/strong> cạnh giai đoạn: bấm để đổi <em>Chưa học → Đang học → Đã hoàn thành<\/em>. Mở một giai đoạn lần đầu tự chuyển sang <em>Đang học<\/em>. Tab <strong>Checkpoint<\/strong> có nút đánh dấu hoàn thành.<\/li><li>Kéo <strong>đường phân cách<\/strong> giữa các cột để đổi độ rộng. <strong>⤢ Rộng<\/strong> mở rộng phần giải thích; <strong>◨ Giải thích<\/strong> ẩn/hiện cột phải.<\/li><li>Địa chỉ trang (<code>#s9-0-3<\/code>) giữ vị trí: giai đoạn, file, ghi chú.<\/li><\/ul>\n<p>Tiến độ, độ rộng cột và cỡ chữ lưu trong trình duyệt của bạn (localStorage). Trình duyệt chặn lưu trữ thì website vẫn chạy, chỉ không nhớ.<\/p>\n<h2>Quy trình học một giai đoạn<\/h2>\n<ol><li><strong>Tổng quan (A)<\/strong>: mục tiêu, vì sao, nhận gì từ trước, đưa gì cho sau.<\/li><li><strong>Lý thuyết (B)<\/strong>: công thức và ý nghĩa từng biến, ví dụ, thay thế.<\/li><li><strong>Luồng xử lý (C)<\/strong>: dữ liệu vào/ra, shape, ai gọi ai.<\/li><li><strong>Giải thích code<\/strong>: đi qua từng thẻ theo thứ tự, từng tab file.<\/li><li><strong>Tự gõ lại<\/strong> các file vào thư mục rebuild của bạn (đừng copy-paste lần đầu).<\/li><li><strong>Chạy &amp; kiểm thử (E)<\/strong>: chạy lệnh, so output kỳ vọng, chạy assertion.<\/li><li><strong>Ghi nhớ (F)<\/strong> rồi <strong>Checkpoint (G)<\/strong>: làm bài tập, sau đó đánh dấu hoàn thành.<\/li><\/ol>\n<h2>Nhãn trên nội dung<\/h2>\n<ul><li>Tab file ghi <strong>code gốc<\/strong>: trích nguyên văn từ project (số dòng khớp file thật).<\/li><li>Hộp <strong>Phát hiện / cải tiến<\/strong>: lỗi nhỏ hoặc đề xuất cải tiến. Đề xuất <strong>không có<\/strong> trong project, phải đo lại trước khi áp dụng.<\/li><li>Hộp <strong>Lưu ý<\/strong>, <strong>Mẹo<\/strong>: cảnh báo và gợi ý.<\/li><\/ul>\n<h2>Kiểm tra tự động của website<\/h2>\n<p>Mở file với đuôi <code>#selftest<\/code> để chạy các kiểm tra giao diện (điều hướng, đồng bộ dòng ↔ ghi chú, tìm kiếm, trạng thái).<\/p>"}, "summary": {"title": "Tổng kết & phát hiện", "nav": "Tổng kết & phát hiện", "html": "<h1>Tổng kết<\/h1><h2>Ma trận cuối trên test (n = 2.203, mở một lần ở GĐ15)<\/h2>\n<table><thead><tr><th><\/th><th>Hit@5<\/th><th>Hit@20<\/th><th>MRR@10<\/th><th>EM first<\/th><th>EM all<\/th><th>F1 first<\/th><th>p50 tổng<\/th><th>p95 tổng<\/th><\/tr><\/thead><tbody><tr><td>B0 BM25<\/td><td>0,793<\/td><td>0,887<\/td><td>0,686<\/td><td>0,222<\/td><td>0,330<\/td><td>0,397<\/td><td>64 ms<\/td><td>105 ms<\/td><\/tr><tr><td>B1 Dense<\/td><td>0,709<\/td><td>0,874<\/td><td>0,516<\/td><td>0,220<\/td><td>0,316<\/td><td>0,379<\/td><td>116 ms<\/td><td>162 ms<\/td><\/tr><tr><td>H0 Hybrid<\/td><td>0,919<\/td><td>0,977<\/td><td>0,777<\/td><td><strong>0,261<\/strong><\/td><td><strong>0,383<\/strong><\/td><td><strong>0,454<\/strong><\/td><td>142 ms<\/td><td>206 ms<\/td><\/tr><tr><td>H1 Hybrid + CE<\/td><td><strong>0,969<\/strong><\/td><td>0,977<\/td><td><strong>0,914<\/strong><\/td><td>0,250<\/td><td>0,361<\/td><td>0,433<\/td><td>744 ms<\/td><td>1.048 ms<\/td><\/tr><\/tbody><\/table>\n<p>So sánh có ghép cặp (paired bootstrap, 1.000 lần):<\/p>\n<ul><li>H0 − B0: EM first +3,9 điểm (CI không chứa 0).<\/li><li>B1 − B0: Hit@5 −8,4 điểm [−10,8; −5,9]: dense <strong>thua<\/strong> BM25 trên test.<\/li><li>H1 − H0: Hit@5 +5,0 điểm [+4,0; +6,0] nhưng EM first −1,1 điểm [−2,2; −0,1].<\/li><\/ul>\n<h2>Năm bài học của project<\/h2>\n<ol><li><strong>Hybrid là lựa chọn tốt nhất về đáp án<\/strong>: RRF lấy được phần bổ sung giữa BM25 và dense mà không cần huấn luyện. API mặc định dùng hybrid.<\/li><li><strong>Đo trên dữ liệu mô hình đã thấy làm phóng đại kết quả<\/strong>: dense thắng BM25 trên dev-unseen nhưng thua trên test, nơi không đoạn đúng nào từng là đoạn dương khi huấn luyện encoder.<\/li><li><strong>Tốt hơn ở một tầng không bảo đảm tốt hơn ở đầu ra<\/strong>: reranker tăng Hit@5 nhưng giảm EM và chậm khoảng 5 lần, nên mặc định tắt.<\/li><li><strong>Nút thắt hiện tại là reader chọn đoạn<\/strong>: khi đoạn đúng đã ở top-5, reader chỉ chọn đúng đoạn đó khoảng 60–73% (dev-unseen). Điểm reader không hiệu chỉnh giữa các đoạn.<\/li><li><strong>Quy trình là một phần của kết quả<\/strong>: chia theo nhóm, tập chưa thấy, đăng ký trước, test một lần có sổ ghi, dấu vân tay artifact.<\/li><\/ol>\n<h2>Phát hiện khi đọc code<\/h2>\n<table><thead><tr><th>Loại<\/th><th>Vị trí<\/th><th>Nội dung<\/th><th>Mức<\/th><\/tr><\/thead><tbody><tr><td>Tài liệu<\/td><td><code>data/validate_spans.py<\/code> dòng 16–23<\/td><td>Docstring lặp 4 dòng trạng thái<\/td><td>thẩm mỹ<\/td><\/tr><tr><td>Tài liệu<\/td><td><code>reader/model_io.py<\/code> dòng 1, <code>experiment.py<\/code> dòng 1<\/td><td>Dòng chú thích <code>### …<\/code> còn sót từ lúc chép code<\/td><td>thẩm mỹ<\/td><\/tr><tr><td>Tài liệu<\/td><td><code>pipeline.py<\/code> dòng 20<\/td><td>Chú thích <code>passages<\/code> đặt sai dòng<\/td><td>thẩm mỹ<\/td><\/tr><tr><td>Hiệu năng<\/td><td><code>retrieval/bm25.py<\/code> <code>top_k<\/code><\/td><td><code>lexsort<\/code> toàn corpus; có thể dùng <code>argpartition<\/code><\/td><td>thấp (độ trễ đã ~1 ms)<\/td><\/tr><tr><td>Tính đúng<\/td><td><code>reader/trainer.py<\/code><\/td><td>Nhóm tích lũy cuối epoch có thể thiếu lô nhưng loss vẫn chia 2<\/td><td>không đáng kể<\/td><\/tr><tr><td>Độ bền<\/td><td><code>reader/qa_metrics.py<\/code> <code>score_answers<\/code><\/td><td><code>max()<\/code> trên danh sách đáp án rỗng gây <code>ValueError<\/code><\/td><td>không xảy ra với dữ liệu hiện tại<\/td><\/tr><tr><td>Tái lập<\/td><td><code>requirements.txt<\/code>, <code>pyproject.toml<\/code><\/td><td>Không ghim phiên bản; <code>[project]<\/code> không khai báo <code>dependencies<\/code><\/td><td>trung bình<\/td><\/tr><tr><td>Thiết kế<\/td><td><code>pipeline.py<\/code> chọn đáp án<\/td><td>Chỉ dùng điểm reader; đề xuất thử kết hợp điểm truy hồi (cần đo trên dev)<\/td><td>hướng cải tiến chính<\/td><\/tr><tr><td>Dữ liệu thừa<\/td><td><code>reader/features.py<\/code><\/td><td><code>read_json<\/code> được import nhưng không dùng<\/td><td>thẩm mỹ<\/td><\/tr><\/tbody><\/table>\n<p>Không phát hiện lỗi làm sai kết quả đã báo cáo. Bộ test của project chạy: <strong>360 passed, 1 skipped<\/strong> (kiểm ngày 2026-11-11 bằng <code>venv<\/code>).<\/p>\n<h2>Việc còn lại theo kế hoạch<\/h2>\n<p>GĐ10 (Docker), GĐ16 (fine-tune dense), GĐ17 (mining/robustness), đo VRAM/độ trễ của dịch vụ khi bật reranker, fine-tune reranker sau phần B. V2 (router chọn ngân sách rerank) là hướng nghiên cứu ứng viên, cần literature review trước.<\/p>"}, "refs": {"title": "Tài liệu tham khảo", "nav": "Tài liệu tham khảo", "html": "<h1>Tài liệu tham khảo<\/h1><p>Danh sách tài liệu gốc cho các kỹ thuật dùng trong project. Thông tin xuất bản được ghi theo hiểu biết của người soạn; hãy kiểm tra lại trên trang của nhà xuất bản hoặc arXiv trước khi trích dẫn trong báo cáo.<\/p>\n<h2>Dữ liệu và mô hình tiếng Đức<\/h2>\n<ul><li>Möller, T., Risch, J., Pietsch, M. (2021). <em>GermanQuAD and GermanDPR: Improving Non-English Question Answering and Passage Retrieval<\/em>. Workshop on Machine Reading for Question Answering (MRQA). arXiv:2104.12741.<\/li><li>Chan, B., Schweter, S., Möller, T. (2020). <em>German's Next Language Model<\/em>. COLING 2020. (họ mô hình GBERT/GELECTRA; project dùng <code>deepset/gbert-base<\/code>.)<\/li><li>Model card trên Hugging Face: <code>deepset/gbert-base<\/code>, <code>deepset/gbert-base-germandpr-ctx_encoder<\/code>, <code>deepset/gbert-base-germandpr-question_encoder<\/code>, <code>BAAI/bge-reranker-v2-m3<\/code> (project ghim commit trong <code>configs/rerank.yaml<\/code>; xem thêm <code>docs/reranker_model_cards.md<\/code>).<\/li><\/ul>\n<h2>Truy hồi<\/h2>\n<ul><li>Robertson, S., Zaragoza, H. (2009). <em>The Probabilistic Relevance Framework: BM25 and Beyond<\/em>. Foundations and Trends in Information Retrieval 3(4).<\/li><li>Karpukhin, V. và cộng sự (2020). <em>Dense Passage Retrieval for Open-Domain Question Answering<\/em>. EMNLP 2020.<\/li><li>Cormack, G. V., Clarke, C. L. A., Büttcher, S. (2009). <em>Reciprocal Rank Fusion Outperforms Condorcet and Individual Rank Learning Methods<\/em>. SIGIR 2009.<\/li><li>Johnson, J., Douze, M., Jégou, H. (2019). <em>Billion-scale similarity search with GPUs<\/em>. IEEE Transactions on Big Data. (FAISS.)<\/li><li>Nogueira, R., Cho, K. (2019). <em>Passage Re-ranking with BERT<\/em>. arXiv:1901.04085. (cross-encoder xếp lại.)<\/li><li>Chen, J. và cộng sự (2024). <em>BGE M3-Embedding: Multi-Lingual, Multi-Functionality, Multi-Granularity Text Embeddings Through Self-Knowledge Distillation<\/em>. arXiv:2402.03216. (họ mô hình BGE-M3; reranker v2-m3 được BAAI phát hành kèm.)<\/li><\/ul>\n<h2>Đọc hiểu và Transformer<\/h2>\n<ul><li>Devlin, J., Chang, M.-W., Lee, K., Toutanova, K. (2019). <em>BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding<\/em>. NAACL 2019.<\/li><li>Rajpurkar, P., Zhang, J., Lopyrev, K., Liang, P. (2016). <em>SQuAD: 100,000+ Questions for Machine Comprehension of Text<\/em>. EMNLP 2016. (định dạng QA trích xuất, EM/F1.)<\/li><li>Wu, Y. và cộng sự (2016). <em>Google's Neural Machine Translation System<\/em>. arXiv:1609.08144. (mô tả WordPiece dùng trong BERT.)<\/li><li>Loshchilov, I., Hutter, F. (2019). <em>Decoupled Weight Decay Regularization<\/em>. ICLR 2019. (AdamW.)<\/li><li>Micikevicius, P. và cộng sự (2018). <em>Mixed Precision Training<\/em>. ICLR 2018. (fp16 + loss scaling.)<\/li><\/ul>\n<h2>Đánh giá<\/h2>\n<ul><li>Efron, B., Tibshirani, R. (1993). <em>An Introduction to the Bootstrap<\/em>. Chapman &amp; Hall.<\/li><li>Tài liệu nội bộ của project: <code>docs/experiment_rules.md<\/code>, <code>docs/preprocessing_rules.md<\/code>, <code>docs/dense_checklist.md<\/code>, <code>plan/01a_v1_phan_a_baseline.md<\/code>, <code>plan/01b_v1_phan_b_cai_tien.md<\/code>.<\/li><\/ul>\n<h2>Thư viện<\/h2>\n<p>Hugging Face <code>datasets<\/code>, <code>transformers<\/code>, <code>tokenizers<\/code>; PyTorch; FAISS; FastAPI, AnyIO, Uvicorn; React, Vite, Vitest.<\/p>"}}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const STAGES = D.stages, PAGES = D.pages;
const STATUS_LABEL = { chua: "Chưa học", dang: "Đang học", xong: "Đã hoàn thành" };
const RTABS = [["code", "Giải thích code"], ["a", "Tổng quan"], ["b", "Lý thuyết"], ["c", "Luồng xử lý"], ["e", "Chạy & kiểm thử"], ["f", "Ghi nhớ"], ["g", "Checkpoint"]];

/* ================= lưu cục bộ (có thể không dùng được) ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem("gqa_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("gqa_" + k, JSON.stringify(v)); } catch (e) { /* bỏ qua */ } }
};
let status = store.get("status", {});
const getStatus = id => status[id] || "chua";
function setStatus(id, v) { status[id] = v; store.set("status", status); renderSide(); renderTopProgress(); if (cur.kind === "stage" && STAGES[cur.i].id === id) renderRightTabs(); }

/* ================= tô màu cú pháp (tự viết, chạy offline) ================= */
const PY_KW = new Set("and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None".split(" "));
const PY_BI = new Set("print len range enumerate zip map filter sorted sum min max abs any all isinstance getattr setattr hasattr int float str list dict set tuple bool bytes open super property staticmethod classmethod type iter next reversed round format repr id hash vars dir callable frozenset object Exception ValueError TypeError RuntimeError KeyError OSError ImportError FileNotFoundError".split(" "));
const TS_KW = new Set("import export from const let var function return if else async await type interface class new throw try catch finally typeof of for in as extends implements default null undefined true false void readonly public private static this switch case break continue".split(" "));
function lineSink() {
  const lines = [[]];
  return {
    push(cls, text) {
      const parts = text.split("\n");
      parts.forEach((seg, i) => {
        if (i > 0) lines.push([]);
        if (seg === "") return;
        const e = esc(seg);
        lines[lines.length - 1].push(cls ? '<span class="' + cls + '">' + e + "</span>" : e);
      });
    },
    done() { return lines.map(a => a.join("")); }
  };
}
function hlPython(src) {
  const sink = lineSink();
  const re = /(#[^\n]*)|([rRbBfFuU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''))|([rRbBfFuU]{0,2}"(?:\\.|[^"\\\n])*"|[rRbBfFuU]{0,2}'(?:\\.|[^'\\\n])*')|(@[A-Za-z_][\w.]*)|(\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?)|([A-Za-z_]\w*)|([ \t]+|\n)|([\s\S])/y;
  let prev = "", m;
  re.lastIndex = 0;
  while (re.lastIndex < src.length && (m = re.exec(src))) {
    if (m[1]) sink.push("t-c", m[1]);
    else if (m[2] || m[3]) sink.push("t-s", m[0]);
    else if (m[4]) sink.push("t-d", m[0]);
    else if (m[5]) sink.push("t-n", m[0]);
    else if (m[6]) {
      const w = m[6];
      if (prev === "def" || prev === "class") sink.push("t-f", w);
      else if (PY_KW.has(w)) sink.push("t-k", w);
      else if (PY_BI.has(w)) sink.push("t-b", w);
      else if (w === "self" || w === "cls") sink.push("t-p", w);
      else sink.push("", w);
      prev = w; continue;
    } else if (m[7]) { sink.push("", m[0]); continue; }
    else sink.push("", m[0]);
    prev = "";
  }
  return sink.done();
}
function hlYaml(src) {
  return src.split("\n").map(line => {
    const ci = line.search(/(^|\s)#/);
    let code = line, com = "";
    if (ci >= 0) { const at = line[ci] === "#" ? ci : ci + 1; code = line.slice(0, at); com = line.slice(at); }
    let out;
    const k = code.match(/^(\s*-?\s*)([^\s:#][^:#]*?)(:)(\s.*|)$/);
    const val = v => esc(v).replace(/(&quot;[^&]*&quot;|"[^"]*"|'[^']*')/g, '<span class="t-s">$1</span>')
      .replace(/\b(true|false|null)\b/g, '<span class="t-k">$1</span>').replace(/(?<![\w.])(-?\d[\d_.e+-]*)(?![\w])/g, '<span class="t-n">$1</span>');
    if (k) out = esc(k[1]) + '<span class="t-y">' + esc(k[2]) + "</span>" + esc(k[3]) + val(k[4]);
    else out = val(code);
    return out + (com ? '<span class="t-c">' + esc(com) + "</span>" : "");
  });
}
function hlTs(src) {
  const sink = lineSink();
  const re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\d[\d_]*\.?\d*)|([A-Za-z_$][\w$]*)|([ \t]+|\n)|([\s\S])/y;
  let m; re.lastIndex = 0; let prev = "";
  while (re.lastIndex < src.length && (m = re.exec(src))) {
    if (m[1] || m[2]) sink.push("t-c", m[0]);
    else if (m[3]) sink.push("t-s", m[0]);
    else if (m[4]) sink.push("t-n", m[0]);
    else if (m[5]) {
      const w = m[5];
      if (prev === "function" || prev === "class") sink.push("t-f", w);
      else if (TS_KW.has(w)) sink.push("t-k", w);
      else if (/^[A-Z]/.test(w)) sink.push("t-t", w);
      else sink.push("", w);
      prev = w; continue;
    } else if (m[6]) { sink.push("", m[0]); continue; }
    else sink.push("", m[0]);
    prev = "";
  }
  return sink.done();
}
function highlight(lang, src) {
  try {
    const out = lang === "python" ? hlPython(src) : lang === "yaml" ? hlYaml(src) : (lang === "ts" || lang === "tsx") ? hlTs(src) : src.split("\n").map(esc);
    return out;
  } catch (e) { return src.split("\n").map(esc); }
}
const hlCache = new Map();
function fileLines(f) {
  if (!hlCache.has(f.id)) hlCache.set(f.id, highlight(f.lang, f.source));
  return hlCache.get(f.id);
}

const ss = id => STAGES.findIndex(s => s.id === id);

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1600); }
async function copyText(text, okMsg) {
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext !== false) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (!ok) {
    try {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0;left:-999px";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
    } catch (e) { ok = false; }
  }
  toast(ok ? (okMsg || "Đã sao chép") : "Không sao chép được – hãy chọn và Ctrl+C");
  return ok;
}

/* ================= điều hướng ================= */
function go(target) {   // target: {kind:'page',id} | {kind:'stage',i,fi,note,rtab}
  if (target.kind === "page") {
    cur = { kind: "page", id: target.id, i: cur.i, fi: 0, note: null, rtab: "code" };
  } else {
    const i = Math.max(0, Math.min(STAGES.length - 1, target.i));
    const st = STAGES[i];
    const fi = Math.max(0, Math.min(st.files.length - 1, target.fi || 0));
    cur = { kind: "stage", i, fi, note: target.note == null ? null : target.note, rtab: target.rtab || (target.note != null ? "code" : cur.kind === "stage" && cur.i === i ? cur.rtab : "code") };
    if (getStatus(st.id) === "chua") { status[st.id] = "dang"; store.set("status", status); }
    if (cur.note == null && st.files[fi].notes.length) cur.note = 0;
  }
  render(true);
  writeHash();
}
function writeHash() {
  let h = cur.kind === "page" ? "#" + cur.id : "#" + STAGES[cur.i].id + "-" + cur.fi + (cur.note != null ? "-" + cur.note : "");
  if (location.hash !== h) { try { history.replaceState(null, "", h); } catch (e) { location.hash = h; } }
}
function readHash() {
  const h = decodeURIComponent((location.hash || "").slice(1));
  if (!h || h === "selftest") return { kind: "page", id: "overview" };
  const [a, b, c] = h.split(/[-\/]/);
  const i = ss(a);
  if (i >= 0) return { kind: "stage", i, fi: +b || 0, note: c != null ? +c : null };
  if (PAGES[a]) return { kind: "page", id: a };
  return { kind: "page", id: "overview" };
}
function stepStage(d) {
  let i = cur.kind === "stage" ? cur.i + d : (d > 0 ? 0 : STAGES.length - 1);
  if (i < 0 || i >= STAGES.length) return;
  go({ kind: "stage", i, fi: 0, rtab: cur.kind === "stage" ? cur.rtab : "code" });
}

}

  $("#next").disabled = cur.kind === "stage" && cur.i === STAGES.length - 1;
}
function renderTopProgress() {
  const done = STAGES.filter(s => getStatus(s.id) === "xong").length, dang = STAGES.filter(s => getStatus(s.id) === "dang").length;

}
function renderSide() {

function renderDoc() {

  $("#doc").scrollTop = 0;
}
function hlBlocks(root) {
  root.querySelectorAll("pre.blk[data-lang]").forEach(pre => {
    const lang = pre.getAttribute("data-lang"); if (!lang || pre.dataset.done) return;
    const code = pre.textContent.replace(/\n$/, "");
    pre.innerHTML = "<code>" + highlight(lang, code).join("\n") + "</code>"; pre.dataset.done = "1";
  });
}

/* ---------- editor ---------- */
function curFile() { return STAGES[cur.i].files[cur.fi]; }
function coverMap(f) {   // dòng -> chỉ số ghi chú nhỏ nhất (hẹp nhất) phủ dòng đó
  if (f._cov) return f._cov;
  const m = new Array(f.nlines + 2).fill(-1), width = new Array(f.nlines + 2).fill(1e9);
  f.notes.forEach((n, k) => { for (let l = n.a; l <= n.b; l++) { if (n.b - n.a < width[l]) { width[l] = n.b - n.a; m[l] = k; } } });
  f._cov = m; return m;
}
function renderEditor(scroll) {
  const st = STAGES[cur.i], f = curFile();
  $("#etabs").innerHTML = st.files.map((x, k) => '<button class="etab' + (k === cur.fi ? " on" : "") + '" data-f="' + k + '" title="' + esc(x.path) + '">' + esc(x.name) +
    "<i" + (x.kind === "improve" ? ' class="imp"' : "") + ">" + (x.kind === "improve" ? "đề xuất" : x.kind === "rewrite" ? "viết lại" : "code gốc") + "</i></button>").join("");
  $("#ehead").innerHTML = '<span class="path">' + esc(f.path) + "</span><span>· " + f.nlines + " dòng · " + f.lang + '</span><span class="sp"></span>' +
    '<label title="Ngắt dòng dài"><input type="checkbox" id="wrapck"' + ($("#code").classList.contains("wrap") ? " checked" : "") + "> ngắt dòng</label>" +
    '<button class="btn" id="fsm" title="Giảm cỡ chữ">A−</button><button class="btn" id="fsp" title="Tăng cỡ chữ">A+</button>' +
    '<button class="btn" id="copyfile">⧉ Copy code</button>';
  const lines = fileLines(f), cov = coverMap(f);
  const act = cur.note != null ? f.notes[cur.note] : null;
  let h = "";
  for (let i = 0; i < lines.length; i++) {
    const l = i + 1, c = cov[l];
    const on = act && l >= act.a && l <= act.b;
    h += '<div class="ln' + (c >= 0 ? " c" + (c % 2) : "") + (on ? " act" : "") + '" data-l="' + l + '"><span class="gn">' + l + '</span><span class="gm"></span><span class="cd">' + (lines[i] || " ") + "</span></div>";
  }
  const box = $("#code"); const keep = box.scrollTop;
  box.innerHTML = h;
  box.scrollTop = scroll ? 0 : keep;
  if (act && scroll) scrollToLine(act.a);
  renderCaption();
}
function renderCaption() {
  const f = curFile(), n = cur.note != null ? f.notes[cur.note] : null;
  $("#ecap").innerHTML = n ? "<span>Đang giải thích:</span><b>" + esc(f.name) + ":" + n.a + (n.b > n.a ? "–" + n.b : "") + "</b><span>· " + esc(n.title) + "</span>"
    : "<span>Bấm vào một dòng hoặc bôi đen một đoạn để xem giải thích bên phải.</span>";
}
function scrollToLine(l, smooth) {
  const box = $("#code"), el = box.querySelector('.ln[data-l="' + l + '"]'); if (!el) return;
  const top = Math.max(0, el.offsetTop - box.clientHeight * 0.25);
  if (smooth && Math.abs(box.scrollTop - top) < box.clientHeight * 2) box.scrollTo({ top, behavior: "smooth" });
  else box.scrollTop = top;
}
function markActive() {
  const f = curFile(), act = cur.note != null ? f.notes[cur.note] : null;
  $("#code").querySelectorAll(".ln.act").forEach(e => e.classList.remove("act"));
  if (act) for (let l = act.a; l <= act.b; l++) { const e = $('#code .ln[data-l="' + l + '"]'); if (e) e.classList.add("act"); }
  renderCaption();
}
function selectNote(k, opts) {
  const f = curFile(); if (k == null || k < 0 || k >= f.notes.length) return;
  cur.note = k; cur.rtab = "code"; markActive(); renderRightTabs(); renderRightBody();
  if (!opts || opts.scroll !== false) scrollToLine(f.notes[k].a, true);
  writeHash();
  const card = $("#rbody .ncard.on"); if (card && (!opts || opts.scroll !== false)) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function lineOf(node) { const e = node && (node.nodeType === 1 ? node : node.parentElement); const r = e && e.closest(".ln"); return r ? +r.dataset.l : null; }

/* ---------- right panel ---------- */
function renderRightTabs() {

function renderRightBody() {
  const st = STAGES[cur.i], f = curFile(), box = $("#rbody"), t = cur.rtab;
  let h = "";
  if (t === "code") {
    h += '<div class="ctx"><b>' + esc(f.path) + "</b> · " + f.notes.length + " ghi chú · " + esc(f.kindLabel) + "<br>" + (f.intro || "") + "</div>";
    h += '<p class="sel-hint">Bấm một thẻ để xem lời giải và làm nổi bật các dòng ở giữa. Bấm một dòng code (hoặc bôi đen vài dòng) để nhảy tới ghi chú tương ứng.</p>';
    f.notes.forEach((n, k) => {
      h += '<div class="ncard' + (k === cur.note ? " on" : "") + '" data-n="' + k + '"><div class="nh"><span class="nn">' + (k + 1) + '</span><span class="nt">' + esc(n.title) + '</span><span class="nr">' + esc(f.name) + ":" + n.a + (n.b > n.a ? "–" + n.b : "") + "</span></div>" + noteBody(n, f) + "</div>";
    });
  } else if (t === "a") h = st.a;

  else if (t === "c") h = st.c;
  else if (t === "e") h = st.e;

  else if (t === "g") h = st.g + '<h3>Hoàn thành giai đoạn</h3><p>Khi đã làm xong checkpoint và tự viết lại được các file của giai đoạn này, đánh dấu để thanh tiến độ cập nhật.</p>' +
    '<p><button class="btn pri" id="markdone">' + (getStatus(st.id) === "xong" ? "Đã hoàn thành – bấm để bỏ đánh dấu" : "✓ Đánh dấu đã hoàn thành") + "</button></p>";
  box.innerHTML = h; hlBlocks(box); box.scrollTop = 0;
  if (t === "code") { const c = box.querySelector(".ncard.on"); if (c) c.scrollIntoView({ block: "nearest" }); }

/* ================= tìm kiếm ================= */
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
const strip = h => h.replace(/<[^>]+>/g, " ").replace(/&[a-z]+;/g, " ");
const INDEX = [];
function buildIndex() {
  STAGES.forEach((s, i) => {
    INDEX.push({ t: "Giai đoạn", label: "Giai đoạn " + s.num + " · " + s.title, sub: s.gd, key: fold(s.title + " " + s.gd + " " + strip(s.a)), go: { kind: "stage", i, fi: 0, rtab: "a" }, w: 1 });
    s.files.forEach((f, fi) => {
      INDEX.push({ t: "File", label: f.path, sub: "Giai đoạn " + s.num, key: fold(f.path), go: { kind: "stage", i, fi }, w: 2 });
      const re = f.lang === "python" ? /^\s*(?:async\s+)?(?:def|class)\s+([A-Za-z_]\w*)/ : /^\s*(?:export\s+)?(?:async\s+)?(?:function|class)\s+([A-Za-z_$][\w$]*)|^\s*export\s+const\s+([A-Za-z_$][\w$]*)/;
      f.source.split("\n").forEach((ln, idx) => {
        const m = ln.match(re); if (!m) return;
        const name = m[1] || m[2], l = idx + 1, k = noteForLines(f, l);
        INDEX.push({ t: /class\s/.test(ln) ? "class" : "hàm", label: name, sub: f.name + ":" + l + " · GĐ " + s.num, key: fold(name), go: { kind: "stage", i, fi, note: k >= 0 ? k : null, line: l }, w: 0 });
      });
      f.notes.forEach((n, k) => INDEX.push({ t: "Ghi chú", label: n.title, sub: f.name + ":" + n.a + "–" + n.b, key: fold(n.title + " " + strip(n.html)), go: { kind: "stage", i, fi, note: k }, w: 3 }));
    });
  });
  Object.keys(PAGES).forEach(id => INDEX.push({ t: "Trang", label: PAGES[id].title, sub: "", key: fold(PAGES[id].title + " " + strip(PAGES[id].html)), go: { kind: "page", id }, w: 4 }));
}
function noteForLines2(f, l) { let best = -1, bw = 1e9; f.notes.forEach((n, k) => { if (l >= n.a && l <= n.b && n.b - n.a < bw) { bw = n.b - n.a; best = k; } }); return best; }
function noteForLines(f, l) { return noteForLines2(f, l); }
let resSel = 0, resList = [];
function doSearch(q) {
  const box = $("#results"); q = fold(q.trim());
  if (!q) { box.style.display = "none"; return; }
  const out = [];
  for (const it of INDEX) {
    const lab = fold(it.label); let score = -1;
    if (lab === q) score = 0; else if (lab.startsWith(q)) score = 1; else if (lab.includes(q)) score = 2; else if (it.key.includes(q)) score = 5;
    if (score >= 0) out.push([score * 10 + it.w, it]);
  }
  out.sort((a, b) => a[0] - b[0]);
  resList = out.slice(0, 40).map(x => x[1]); resSel = 0;
  box.innerHTML = resList.length ? resList.map((it, k) => '<div class="it' + (k === 0 ? " sel" : "") + '" data-k="' + k + '"><span class="tp">' + it.t + "</span><b>" + esc(it.label) + "</b><span>" + esc(it.sub) + "</span></div>").join("") : '<div class="none">Không có kết quả cho “' + esc(q) + "”.</div>";
  box.style.display = "block";
}
function openResult(k) {
  const it = resList[k]; if (!it) return;
  $("#results").style.display = "none"; $("#q").blur();
  const g = it.go;
  if (g.kind === "page") go(g); else { go(g); if (g.line) setTimeout(() => scrollToLine(g.line), 30); }
}

/* ================= tương tác ================= */
document.addEventListener("click", e => {
  const t = e.target;
  let el;
  if ((el = t.closest("[data-dot]"))) { e.stopPropagation(); const id = el.dataset.dot, o = ["chua", "dang", "xong"]; setStatus(id, o[(o.indexOf(getStatus(id)) + 1) % 3]); return; }
  if ((el = t.closest("[data-page]"))) return go({ kind: "page", id: el.dataset.page });
  if ((el = t.closest("[data-stage]"))) return go({ kind: "stage", i: +el.dataset.stage, fi: +(el.dataset.file || 0) });
  if ((el = t.closest("[data-gopage]"))) return go({ kind: "page", id: el.dataset.gopage });
  if ((el = t.closest("[data-gostage]"))) { const [a, b, c] = el.dataset.gostage.split("/"); return go({ kind: "stage", i: ss(a), fi: +(b || 0), note: c != null ? +c : null, rtab: el.dataset.rtab || undefined }); }
  if ((el = t.closest(".etab"))) return go({ kind: "stage", i: cur.i, fi: +el.dataset.f });
  if ((el = t.closest(".rtab"))) { cur.rtab = el.dataset.r; renderRightTabs(); renderRightBody(); return; }
  if ((el = t.closest("[data-copyblock]"))) { e.stopPropagation(); const [a, b] = el.dataset.copyblock.split("-").map(Number); return copyText(curFile().source.split("\n").slice(a - 1, b).join("\n"), "Đã sao chép dòng " + a + "–" + b); }
  if ((el = t.closest(".ncard .nh"))) { const k = +el.parentElement.dataset.n; if (k === cur.note) { cur.note = null; markActive(); renderRightBody(); writeHash(); } else selectNote(k); return; }
  if (t.closest("#copyfile")) return copyText(curFile().source, "Đã sao chép " + curFile().name);
  if (t.closest("#fsm") || t.closest("#fsp")) { const v = Math.max(10, Math.min(22, (store.get("fs", 13)) + (t.closest("#fsp") ? 1 : -1))); store.set("fs", v); document.documentElement.style.setProperty("--fs", v + "px"); return; }
  if (t.closest("#stbtn")) { const id = STAGES[cur.i].id, o = ["chua", "dang", "xong"]; return setStatus(id, o[(o.indexOf(getStatus(id)) + 1) % 3]); }
  if (t.closest("#markdone")) { const id = STAGES[cur.i].id; setStatus(id, getStatus(id) === "xong" ? "dang" : "xong"); return renderRightBody(); }
  if ((el = t.closest("#results .it"))) return openResult(+el.dataset.k);
  if (!t.closest("#searchwrap")) $("#results").style.display = "none";
  if ((el = t.closest("#code .ln")) && !window.getSelection().toString()) {
    const k = noteForLines2(curFile(), +el.dataset.l); if (k >= 0) selectNote(k, { scroll: false });
  }
});
document.addEventListener("change", e => { if (e.target.id === "wrapck") { $("#code").classList.toggle("wrap", e.target.checked); store.set("wrap", e.target.checked); } });
document.addEventListener("mouseup", e => {
  if (!e.target.closest("#code")) return;
  const s = window.getSelection(); if (!s || s.isCollapsed) return;
  const a = lineOf(s.anchorNode), b = lineOf(s.focusNode); if (!a || !b) return;
  const lo = Math.min(a, b), hi = Math.max(a, b), k = noteForLines(curFile(), lo) >= 0 ? (function () { const f = curFile(); let best = -1, bw = 1e9; f.notes.forEach((n, i) => { if (n.b >= lo && n.a <= hi) { const w = Math.abs((n.b - n.a) - (hi - lo)); if (w < bw) { bw = w; best = i; } } }); return best; })() : -1;
  if (k >= 0 && k !== cur.note) selectNote(k, { scroll: false });
});
$("#prev").onclick = () => stepStage(-1);
$("#next").onclick = () => stepStage(1);
$("#bhide").onclick = () => { document.body.classList.toggle("rcollapsed"); document.body.classList.remove("rwide"); store.set("rc", document.body.classList.contains("rcollapsed")); };
$("#bwide").onclick = () => { document.body.classList.remove("rcollapsed"); document.body.classList.toggle("rwide"); $("#bwide").textContent = document.body.classList.contains("rwide") ? "⤡ Thu nhỏ" : "⤢ Rộng"; };
const qEl = $("#q");
qEl.addEventListener("input", () => doSearch(qEl.value));
qEl.addEventListener("keydown", e => {
  const items = $("#results").querySelectorAll(".it");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!items.length) return; items[resSel].classList.remove("sel"); resSel = (resSel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items[resSel].classList.add("sel"); items[resSel].scrollIntoView({ block: "nearest" }); }
  else if (e.key === "Enter") { e.preventDefault(); openResult(resSel); }
  else if (e.key === "Escape") { $("#results").style.display = "none"; qEl.blur(); }
});
qEl.addEventListener("focus", () => { if (qEl.value) doSearch(qEl.value); });
document.addEventListener("keydown", e => {
  if (e.target === qEl || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "/") { e.preventDefault(); qEl.focus(); qEl.select(); }
  else if (e.key === "[") stepStage(-1);
  else if (e.key === "]") stepStage(1);
});
function enableDrag(gutId, varName, side) {
  const g = $(gutId);
  g.addEventListener("pointerdown", ev => {
    ev.preventDefault(); g.setPointerCapture(ev.pointerId); g.classList.add("drag");
    const total = $("#main").getBoundingClientRect(), work = $("#work").getBoundingClientRect();
    const move = e => {
      if (side === "left") { const w = Math.max(190, Math.min(total.width * 0.4, e.clientX - total.left)); document.documentElement.style.setProperty("--wSide", w + "px"); store.set("wSide", w); }
      else { const w = Math.max(280, Math.min(work.width - 260, work.right - e.clientX)); document.body.classList.remove("rwide"); document.documentElement.style.setProperty("--wRight", w + "px"); store.set("wRight", w); }
    };
    const up = () => { g.classList.remove("drag"); g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); };
    g.addEventListener("pointermove", move); g.addEventListener("pointerup", up);
  });
}
enableDrag("#g1", "--wSide", "left"); enableDrag("#g2", "--wRight", "right");
window.addEventListener("hashchange", () => { const t = readHash(); if (t.kind === "page" ? !(cur.kind === "page" && cur.id === t.id) : !(cur.kind === "stage" && cur.i === t.i && cur.fi === t.fi && cur.note === t.note)) go(t); });

/* ================= khởi động ================= */
(function init() {
  const ws = store.get("wSide", null), wr = store.get("wRight", null), fs = store.get("fs", 13);
  if (ws) document.documentElement.style.setProperty("--wSide", ws + "px");
  if (wr) document.documentElement.style.setProperty("--wRight", wr + "px");
  document.documentElement.style.setProperty("--fs", fs + "px");
  if (store.get("rc", false)) document.body.classList.add("rcollapsed");
  if (store.get("wrap", false)) $("#code").classList.add("wrap");
  STAGES.forEach(s => s.files.forEach((f, k) => { f.id = s.id + "_" + k; f.nlines = f.source.split("\n").length; f.kindLabel = f.kind === "improve" ? "Đề xuất cải tiến (không có trong project gốc)" : f.kind === "rewrite" ? "Code viết lại" : "Code gốc – trích nguyên văn từ project"; }));
  buildIndex();
  const t = readHash();
  if (t.kind === "stage") go(t); else { cur = { kind: "page", id: t.id, i: 0, fi: 0, note: null, rtab: "code" }; render(); }
  if (location.hash === "#selftest") runSelfTest();
})();

/* ================= tự kiểm tra (mở file với #selftest) ================= */
function runSelfTest() {
  const out = []; const ok = (c, m) => out.push((c ? "PASS " : "FAIL ") + m);
  try {
    ok(STAGES.length >= 10, "có " + STAGES.length + " giai đoạn");
    let bad = 0, notes = 0, files = 0;
    STAGES.forEach(s => s.files.forEach(f => { files++; const L = f.source.split("\n").length; f.notes.forEach(n => { notes++; if (!(n.a >= 1 && n.b >= n.a && n.b <= L)) bad++; }); }));
    ok(bad === 0, files + " file, " + notes + " ghi chú, dòng hợp lệ (lỗi: " + bad + ")");
    STAGES.forEach(s => { ["a", "b", "c", "e", "f", "g"].forEach(k => ok(s[k] && s[k].length > 200, s.id + "." + k + " có nội dung")); });
    let hlbad = 0; STAGES.forEach(s => s.files.forEach(f => { const h = highlight(f.lang, f.source); if (h.length !== f.source.split("\n").length) hlbad++; })); ok(hlbad === 0, "tô màu giữ đúng số dòng (lỗi: " + hlbad + ")");
    go({ kind: "stage", i: 0, fi: 0 }); ok(cur.kind === "stage" && $("#code").children.length === curFile().nlines, "mở GĐ0: số dòng DOM = số dòng file");
    stepStage(1); ok(cur.i === 1, "Next → GĐ1"); stepStage(-1); ok(cur.i === 0, "Prev → GĐ0");
    ok($("#prev").disabled, "Prev tắt ở GĐ đầu");
    go({ kind: "stage", i: STAGES.length - 1, fi: 0 }); ok($("#next").disabled, "Next tắt ở GĐ cuối");
    go({ kind: "stage", i: 3, fi: 0 }); const f3 = curFile();
    selectNote(1); ok($("#code .ln.act") && $$count("#code .ln.act") === f3.notes[1].b - f3.notes[1].a + 1, "chọn ghi chú tô đúng số dòng");
    const L = f3.notes[0].a; $('#code .ln[data-l="' + L + '"]').click(); ok(cur.note === noteForLines2(f3, L), "bấm dòng chọn đúng ghi chú");
    ok($("#rbody .ncard.on .nbody").textContent.length > 50, "panel phải hiển thị lời giải của ghi chú");
    cur.rtab = "b"; renderRightBody(); ok($("#rbody").textContent.length > 300, "tab Lý thuyết có nội dung");
    doSearch("rrf"); ok(resList.length > 0 && resList.some(r => /rrf/i.test(r.label)), "tìm 'rrf' có kết quả (" + resList.length + ")");
    doSearch("tokenize"); ok(resList.some(r => r.t === "hàm"), "tìm hàm 'tokenize'");
    doSearch("bootstrap"); ok(resList.length > 0, "tìm từ khóa 'bootstrap'");
    openResult(0); ok(cur.kind === "stage" || cur.kind === "page", "mở kết quả tìm kiếm");
    go({ kind: "stage", i: 0, fi: 0 }); setStatus(STAGES[0].id, "xong"); ok(getStatus(STAGES[0].id) === "xong" && $("#progfill").style.width !== "0%", "đổi trạng thái + thanh tiến độ");
    setStatus(STAGES[0].id, "chua");
    Object.keys(PAGES).forEach(id => { go({ kind: "page", id }); ok($("#docin").textContent.length > 200, "trang " + id + " có nội dung"); });
    document.body.classList.add("rcollapsed"); ok(getComputedStyle($("#right")).display === "none", "thu gọn panel phải"); document.body.classList.remove("rcollapsed");
    ok(typeof copyText === "function", "có hàm copy");
  } catch (e) { out.push("FAIL ngoại lệ: " + e.message + "\n" + e.stack); }
  const pre = $("#selftest"); pre.textContent = "SELFTEST\n" + out.join("\n") + "\nSUMMARY fails=" + out.filter(x => x.startsWith("FAIL")).length; pre.style.display = "block";
  go({ kind: "page", id: "overview" });
}
function $$count(s) { return document.querySelectorAll(s).length; }
</script>
