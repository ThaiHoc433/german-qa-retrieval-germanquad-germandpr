(t, sw) for _, t in PROBE_DOCS])\n    return _sha1_json([round(x, 12) for x in bm.scores(tokenize(PROBE_QUERY, sw)).tolist()])\n\n\ndef compute_fingerprint(corpus_sha1, k1, b, use_stopwords):\n    parts = {\"format\": FORMAT_VERSION, \"corpus_sha1\": corpus_sha1, \"k1\": float(k1), \"b\": float(b),\n             \"use_stopwords\": bool(use_stopwords), \"stopwords_sha1\": stopwords_sha1(),\n             \"tokenization_probe_sha1\": tokenization_probe_sha1(use_stopwords),\n             \"scoring_probe_sha1\": scoring_probe_sha1(k1, b, use_stopwords)}\n    return {\"sha1\": _sha1_json(parts), \"parts\": parts}\n\n\ndef save_index(retriever, fingerprint, store_dir):\n    \"\"\"Ghi index.npz (mảng số, không pickle) và meta.json. Trả về đường dẫn thư mục.\"\"\"\n    d = Path(store_dir)\n    d.mkdir(parents=True, exist_ok=True)\n    idx = retriever.index\n    terms = list(idx.weights)\n    if any(\"\\n\" in t for t in terms):\n        raise ValueError(\"từ chứa ký tự xuống dòng: không lưu được theo định dạng này\")\n    lens = np.fromiter((len(idx.weights[t][0]) for t in terms), dtype=np.int64, count=len(terms))\n    offsets = np.zeros(len(terms) + 1, dtype=np.int64)\n    np.cumsum(lens, out=offsets[1:])\n    doc_idx = np.concatenate([idx.weights[t][0] for t in terms]) if terms else np.zeros(0, dtype=np.int64)\n    wts = np.concatenate([idx.weights[t][1] for t in terms]) if terms else np.zeros(0, dtype=np.float64)\n    blob = np.frombuffer(\"\\n\".join(terms).encode(\"utf-8\"), dtype=np.uint8)\n    np.savez(d / \"index.npz\", terms=blob, offsets=offsets, doc_idx=doc_idx.astype(np.int64), weights=wts.astype(np.float64))\n    meta = {\"format\": FORMAT_VERSION, \"fingerprint\": fingerprint, \"k1\": idx.k1, \"b\": idx.b,\n            \"use_stopwords\": retriever.stopwords is not None, \"n_docs\": idx.n, \"n_terms\": len(terms),\n            \"doc_ids\": idx.doc_ids, \"index_npz_sha1\": file_sha1(d / \"index.npz\"),\n            \"saved_at\": time.strftime(\"%Y-%m-%d %H:%M:%S\")}\n    with open(d / \"meta.json\", \"w\", encoding=\"utf-8\", newline=\"\\n\") as f:\n        json.dump(meta, f, ensure_ascii=False)\n    return d\n\n\ndef load_index(store_dir, expected_fingerprint):\n    \"\"\"Nạp chỉ mục. Ném FingerprintMismatch nếu dấu vân tay hoặc SHA-1 tệp không khớp; FileNotFoundError nếu chưa có.\"\"\"\n    d = Path(store_dir)\n    with open(d / \"meta.json\", encoding=\"utf-8\") as f:\n        meta = json.load(f)\n    if meta[\"fingerprint\"][\"sha1\"] != expected_fingerprint[\"sha1\"]:\n        diff = [k for k in expected_fingerprint[\"parts\"]\n                if meta[\"fingerprint\"][\"parts\"].get(k) != expected_fingerprint[\"parts\"][k]]\n        raise FingerprintMismatch(\"chỉ mục đã lưu không khớp dấu vân tay hiện tại; khác ở: \" + \", \".join(diff or [\"?\"]))\n    if file_sha1(d / \"index.npz\") != meta[\"index_npz_sha1\"]:\n        raise FingerprintMismatch(\"index.npz bị đổi hoặc hỏng so với meta.json (SHA-1 không khớp)\")\n    z = np.load(d / \"index.npz\", allow_pickle=False)\n    terms = bytes(z[\"terms\"]).decode(\"utf-8\").split(\"\\n\") if len(z[\"terms\"]) else []\n    off, di, w = z[\"offsets\"], z[\"doc_idx\"], z[\"weights\"]\n    weights = {t: (di[off[i]:off[i + 1]], w[off[i]:off[i + 1]]) for i, t in enumerate(terms)}\n    index = BM25.from_parts(meta[\"k1\"], meta[\"b\"], meta[\"doc_ids\"], weights)\n    return BM25Retriever.from_index(index, meta[\"use_stopwords\"])\n\n\ndef load_or_build(corpus_path, corpus, k1, b, use_stopwords, store_dir=None, strict=False):\n    \"\"\"Trả về (retriever, info). info: {source: 'loaded'|'built', reason, seconds, fingerprint}.\n    strict=True (dành cho dịch vụ/Docker, GĐ10 và GĐ18): lệch dấu vân tay thì ném lỗi thay vì âm thầm dựng lại.\n    store_dir=False: không dùng tệp lưu.\"\"\"\n    t0 = time.perf_counter()\n    fp = compute_fingerprint(file_sha1(corpus_path), k1, b, use_stopwords)\n    if store_dir is False:\n        r = BM25Retriever(corpus, k1=k1, b=b, use_stopwords=use_stopwords)\n        return r, {\"source\": \"built\", \"reason\": \"store_disabled\", \"seconds\": time.perf_counter() - t0, \"fingerprint\": fp[\"sha1\"]}\n    d = Path(store_dir) if store_dir is not None else DEFAULT_DIR\n    reason = \"no_store\"\n    try:\n        r = load_index(d, fp)\n        return r, {\"source\": \"loaded\", \"reason\": \"fingerprint_ok\", \"seconds\": time.perf_counter() - t0, \"fingerprint\": fp[\"sha1\"]}\n    except FileNotFoundError:\n        if strict:\n            raise\n    except FingerprintMismatch as exc:\n        if strict:\n            raise\n        reason = \"fingerprint_mismatch\"\n        log.warning(\"BM25: %s; dựng lại\", exc)\n    r = BM25Retriever(corpus, k1=k1, b=b, use_stopwords=use_stopwords)\n    try:\n        save_index(r, fp, d)\n    except OSError as exc:                  # volume chỉ đọc (Docker) hoặc hết chỗ: vẫn phục vụ được, chỉ không lưu\n        log.warning(\"BM25: không lưu được chỉ mục (%s)\", type(exc).__name__)\n        reason += \"+save_failed\"\n    return r, {\"source\": \"built\", \"reason\": reason, \"seconds\": time.perf_counter() - t0, \"fingerprint\": fp[\"sha1\"]}", "notes": [{"a": 1, "b": 8, "title": "Vấn đề và giải pháp", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dấu vân tay = SHA-1 của <strong>mọi thứ làm đổi kết quả BM25<\/strong>: nội dung corpus, <code>k1<\/code>, <code>b<\/code>, <code>use_stopwords<\/code>, nội dung danh sách stopword, kết quả tách từ của bộ câu mẫu, và điểm BM25 trên một corpus nhỏ cố định.<\/p><\/dd><\/dl>"}, {"a": 24, "b": 25, "title": "Phiên bản định dạng và thư mục", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>artifacts/bm25/<\/code> chứa <code>index.npz<\/code> + <code>meta.json<\/code>.<\/p><\/dd><\/dl>"}, {"a": 28, "b": 33, "title": "Câu mẫu cố định", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Có umlaut, ß, chữ hoa, số, dấu câu, từ dừng.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Ai đó sửa <code>tokenize<\/code> (ví dụ đổi regex) thì kết quả tách các câu này đổi → dấu vân tay đổi → chỉ mục cũ bị từ chối.<\/p><\/dd><\/dl>"}, {"a": 35, "b": 41, "title": "Corpus mẫu để đo công thức", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>4 đoạn nhỏ và một truy vấn.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Bắt được việc sửa <strong>công thức<\/strong> idf/tf/độ dài trong <code>BM25.fit<\/code> mà các tham số vẫn y nguyên.<\/p><\/dd><\/dl>"}, {"a": 44, "b": 45, "title": "FingerprintMismatch", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 48, "b": 49, "title": "_sha1_json", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Băm JSON đã sắp khóa.<\/p><\/dd><\/dl>"}, {"a": 52, "b": 53, "title": "stopwords_sha1", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Băm <strong>nội dung<\/strong> danh sách stopword (đã sắp), không chỉ cờ bật/tắt.<\/p><\/dd><\/dl>"}, {"a": 56, "b": 58, "title": "tokenization_probe_sha1", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 61, "b": 64, "title": "scoring_probe_sha1", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dựng BM25 trên <code>PROBE_DOCS<\/code>, chấm <code>PROBE_QUERY<\/code>, làm tròn 12 chữ số rồi băm.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Làm tròn để sai khác số thực cực nhỏ giữa máy không làm đổi dấu vân tay.<\/p><\/dd><\/dl>"}, {"a": 67, "b": 72, "title": "compute_fingerprint", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Gộp mọi phần thành một dict, băm thành <code>sha1<\/code>, trả kèm <code>parts<\/code> để báo <strong>phần nào<\/strong> lệch.<\/p><\/dd><\/dl>"}, {"a": 75, "b": 87, "title": "save_index (1): làm phẳng chỉ mục", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Danh sách từ; <code>offsets<\/code> (tổng tích lũy độ dài posting, kiểu CSR); nối mọi mảng chỉ số đoạn và mảng điểm thành hai mảng dài.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Lưu bằng mảng số thuần, <strong>không pickle<\/strong>: an toàn (pickle có thể chạy code khi nạp) và ổn định giữa phiên bản Python.<\/p><\/dd><\/dl>"}, {"a": 88, "b": 96, "title": "save_index (2): ghi tệp", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Các từ nối bằng <code>\\n<\/code> thành một khối byte UTF-8; <code>np.savez<\/code>; <code>meta.json<\/code> có dấu vân tay, tham số, <code>doc_ids<\/code>, SHA-1 của <code>index.npz<\/code>.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Từ chứa ký tự xuống dòng sẽ làm hỏng định dạng: hàm kiểm và từ chối trước.<\/p><\/dd><\/dl>"}, {"a": 99, "b": 115, "title": "load_index", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>So dấu vân tay (báo rõ khác ở phần nào), so SHA-1 tệp, nạp <code>allow_pickle=False<\/code>, dựng lại <code>weights<\/code> bằng <code>offsets<\/code>, bọc thành retriever.<\/p><\/dd><\/dl>"}, {"a": 118, "b": 146, "title": "load_or_build", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tính dấu vân tay; nạp được → <code>loaded<\/code>. Không có/lệch: <code>strict=True<\/code> (dịch vụ, Docker) thì ném lỗi; mặc định thì dựng lại, lưu đè, ghi lý do. Không lưu được (ổ chỉ đọc) vẫn phục vụ.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: (retriever, <code>{source, reason, seconds, fingerprint}<\/code>).<\/p><\/dd><\/dl>"}], "intro": "<p>Sửa vấn đề D4: BM25 dựng lại mỗi lần khởi động (16–24 giây) và không có gì chứng minh chỉ mục đang dùng trùng với lần đo B0. Giải pháp: dấu vân tay + chỉ mục lưu ra đĩa.<\/p>"}, {"path": "src/germanqa/evaluation/decision.py", "name": "decision.py", "kind": "orig", "lang": "python", "source": "\"\"\"Quy tắc nhận/bỏ một phương án thay thế, GHI TRƯỚC khi xem kết quả (GĐ12.3).\"\"\"\n\n\ndef adopt_alternative(primary_ci, secondary_ci, margin=0.01):\n    \"\"\"primary_ci, secondary_ci: (chênh lệch, cận dưới, cận trên) của phương án MỚI trừ phương án GỐC.\n    Trả về (nhận_không, lý_do).\"\"\"\n    d1, lo1, _ = primary_ci\n    d2, lo2, _ = secondary_ci\n    if not (d1 > 0 and lo1 > 0):\n        return False, f\"chỉ số chính chưa đủ chắc: chênh {d1:+.4f}, cận dưới {lo1:+.4f} không > 0\"\n    if lo2 < -margin:\n        return False, f\"chỉ số phụ có thể giảm quá {margin}: cận dưới {lo2:+.4f}\"\n    return True, f\"chỉ số chính tăng {d1:+.4f} (cận dưới {lo1:+.4f} > 0); chỉ số phụ cận dưới {lo2:+.4f} ≥ {-margin}\"", "notes": [{"a": 4, "b": 13, "title": "adopt_alternative", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nhận phương án mới chỉ khi: metric chính tăng <strong>và<\/strong> cận dưới CI &gt; 0; metric phụ không có khả năng giảm quá <code>margin<\/code> (cận dưới ≥ −0,01).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Chống 'thử nhiều cấu hình rồi chọn cái đẹp nhất' (garden of forking paths).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Ví dụ thật: dense 512 token <strong>không<\/strong> được nhận (Hit@5 kém 384 khoảng 4,5 điểm); dense 384 được nhận so với 256.<\/p><\/dd><\/dl>"}], "intro": "<p>Quy tắc nhận/bỏ phương án mới, <strong>ghi trước khi xem kết quả<\/strong>.<\/p>"}, {"path": "src/germanqa/evaluation/select_set.py", "name": "select_set.py", "kind": "orig", "lang": "python", "source": "\"\"\"Tập chọn (GĐ12.0): các câu hỏi train + dev mà encoder dense CHƯA thấy lúc huấn luyện.\"\"\"\nfrom germanqa.evaluation.leakage import normalize_question\n\n\ndef build_select_set(qa_by_split, dpr_train_questions):\n    \"\"\"qa_by_split: {'train': [...], 'dev': [...]} với phần tử có 'question_id' và 'question'.\n    dpr_train_questions: các câu hỏi GermanDPR train (chưa chuẩn hóa). Trả về dict có ID đã sắp xếp.\"\"\"\n    seen = {normalize_question(q) for q in dpr_train_questions}\n    out = {}\n    for split in (\"train\", \"dev\"):\n        out[split] = sorted(q[\"question_id\"] for q in qa_by_split[split] if normalize_question(q[\"question\"]) not in seen)\n    out[\"counts\"] = {\"train\": len(out[\"train\"]), \"dev\": len(out[\"dev\"]), \"total\": len(out[\"train\"]) + len(out[\"dev\"])}\n    out[\"note\"] = (\"Chỉ số truy hồi: dùng train+dev. EM/F1: chỉ dev. Không bao giờ đưa các ID này vào huấn luyện (GĐ16). \"\n                   \"Khớp theo chuẩn hóa chữ nên đây là cận trên của số câu chưa thấy.\")\n    return out", "notes": [{"a": 5, "b": 15, "title": "build_select_set", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chuẩn hóa câu hỏi GermanDPR train, giữ câu train/dev <strong>không<\/strong> trùng. Ghi số lượng và ghi chú cách dùng: chỉ số truy hồi dùng train + dev; EM/F1 chỉ dev; không bao giờ đưa vào huấn luyện.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thật: 1.989 câu train-select + 234 câu dev-unseen.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Khớp theo chuẩn hóa chữ nên đây là <strong>cận trên<\/strong> số câu chưa thấy (câu diễn đạt lại vẫn có thể đã thấy).<\/p><\/dd><\/dl>"}], "intro": "<p>Tập chọn: câu hỏi train + dev mà encoder dense <strong>chưa thấy<\/strong> khi huấn luyện.<\/p>"}, {"path": "src/germanqa/rerank/exposure.py", "name": "exposure.py", "kind": "orig", "lang": "python", "source": "\"\"\"Mức 'đã thấy đoạn' (GĐ14): đoạn đúng của một câu hỏi có từng xuất hiện trong GermanDPR train không, và với vai gì.\n\nEncoder dense và gbert-base-germandpr-reranking đã học trên GermanDPR train. Tập chọn chỉ loại các câu hỏi có chữ trùng,\ncòn ĐOẠN đúng thì phần lớn vẫn từng là đoạn dương của câu khác. Test thì không có đoạn đúng nào như vậy.\nNhóm (cho mỗi câu hỏi, xét tất cả đoạn đúng trong qrels):\n  positive : có ít nhất một đoạn đúng từng là đoạn DƯƠNG trong GermanDPR train\n  negative : không có đoạn dương nào, nhưng có đoạn đúng từng xuất hiện với vai khác (đoạn âm)\n  never    : không đoạn đúng nào từng xuất hiện trong GermanDPR train\nDữ liệu lấy từ trường 'source' của corpus.jsonl, không cần dữ liệu thô.\"\"\"\n\nGROUPS = (\"positive\", \"negative\", \"never\")\n\n\ndef passage_role(passage):\n    roles = {x[\"role\"] for x in passage.get(\"source\", []) if x.get(\"dataset\") == \"germandpr\" and x.get(\"split\") == \"train\"}\n    return \"positive\" if \"positive\" in roles else (\"negative\" if roles else \"never\")\n\n\ndef question_group(gold_ids, corpus_by_id):\n    roles = [passage_role(corpus_by_id[p]) for p in gold_ids]\n    return \"positive\" if \"positive\" in roles else (\"negative\" if \"negative\" in roles else \"never\")", "notes": [{"a": 1, "b": 9, "title": "Ba nhóm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>positive<\/code>, <code>negative<\/code>, <code>never<\/code>. Lấy từ trường <code>source<\/code> của corpus (GĐ2b).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Tập chọn chỉ loại câu hỏi trùng chữ; phần lớn <strong>đoạn đúng<\/strong> vẫn từng là đoạn dương của câu khác. Test thì không có đoạn nào như vậy, nên điểm trên tập chọn có thể cao hơn test.<\/p><\/dd><\/dl>"}, {"a": 14, "b": 16, "title": "passage_role", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 19, "b": 21, "title": "question_group", "html": "<dl class=\"kv\"><\/dl>"}], "intro": "<p>Mức 'đã thấy đoạn' của mỗi câu hỏi: đoạn đúng từng là đoạn dương, đoạn âm, hay chưa từng xuất hiện trong GermanDPR train.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Biến các quy tắc thí nghiệm thành code: sổ phơi bày test, rào chắn, mã hệ thống, tệp mốc, dấu vân tay chỉ mục, quy tắc nhận phương án, tập chưa thấy.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Kết quả thí nghiệm chỉ có giá trị nếu quy trình sạch. Mở test nhiều lần, chọn cấu hình theo test, hay dùng chỉ mục không khớp đều làm số liệu mất ý nghĩa mà không có lỗi nào báo.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p>Toàn bộ hệ thống GĐ0–GĐ14.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ15 chạy ma trận cuối B0/B1/H0/H1 trên test <strong>một lần<\/strong>; API (GĐ8/18) dùng <code>strict<\/code> cho chỉ mục và đọc tệp mốc để hiển thị.<\/p>", "b": "<h4>Các mối nguy thường gặp trong đánh giá<\/h4>\n<ol><li><strong>Tối ưu theo test<\/strong>: mỗi lần nhìn test rồi chỉnh là một lần 'học' trên test.<\/li><li><strong>Nhiều phép so sánh<\/strong>: thử 20 cấu hình, một cái thắng do may mắn.<\/li><li><strong>Mô hình có sẵn đã thấy dữ liệu đánh giá<\/strong> (DPR, reranker).<\/li><li><strong>Artifact lệch<\/strong>: chỉ mục, corpus, mô hình không khớp nhau.<\/li><\/ol>\n<h4>Biện pháp trong project<\/h4>\n<table><thead><tr><th>Nguy cơ<\/th><th>Biện pháp<\/th><th>Code<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>test một lần, sổ chỉ thêm, rào chắn có cờ<\/td><td><code>experiment_rules.py<\/code><\/td><\/tr><tr><td>2<\/td><td>đăng ký trước quy tắc chọn, đếm số cấu hình đã thử<\/td><td><code>results/13_prereg.json<\/code>, <code>decision.py<\/code><\/td><\/tr><tr><td>3<\/td><td>tập chọn chưa thấy, nhóm phơi bày đoạn<\/td><td><code>select_set.py<\/code>, <code>exposure.py<\/code><\/td><\/tr><tr><td>4<\/td><td>dấu vân tay, SHA-1 corpus, manifest<\/td><td><code>bm25_store.py<\/code>, <code>dense.py<\/code><\/td><\/tr><\/tbody><\/table>\n<h4>Đăng ký trước (pre-registration)<\/h4>\n<p>Trước khi chạy thử, ghi ra file (kèm SHA-1 dữ liệu đầu vào): tập dùng để chọn, metric chính, quy tắc nhận. Sau đó kết quả có thể <strong>ngược<\/strong> với mong đợi (như GĐ15: giả thuyết 'reranker không làm EM giảm' không được ủng hộ) và vẫn phải báo cáo trung thực.<\/p>\n<h4>Dấu vân tay chức năng<\/h4>\n<p>Băm <strong>hành vi<\/strong> (kết quả tách từ và chấm điểm trên dữ liệu mẫu), không chỉ băm tham số: bắt được thay đổi code mà tham số không đổi.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>script chạm test ── require_test_access(confirm?) ──(không)─▶ dừng, không ghi sổ\n                                                    └(có)──▶ append_ledger ─▶ chạy\ncấu hình hiệu lực ─ config_sha1 ─▶ baseline_id \"H0_xxxxxxxx\" ─ write_once ─▶ baselines/H0.json\n\nkhởi động ─ compute_fingerprint(corpus SHA-1, k1, b, stopwords, probe tách từ, probe điểm)\n          ─ load_index ─(khớp)▶ dùng  ─(lệch)▶ strict? lỗi : dựng lại + lưu\n\nphương án mới vs gốc ─ paired_bootstrap ─▶ (diff, lo, hi) ─ adopt_alternative ─▶ nhận / không<\/code><\/pre>", "e": "<h4>Test<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>pytest tests/GD11 tests/GD12 tests/GD15 -q<\/code><\/pre>\n<h4>Thử rào chắn (không ghi vào sổ thật)<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>import tempfile, os\nfrom germanqa.experiment_rules import require_test_access, TestAccessError, read_ledger\np = os.path.join(tempfile.mkdtemp(), \"ledger.jsonl\")\ntry:\n    require_test_access(\"demo.py\", \"thử\", confirm=False, ledger_path=p)\nexcept TestAccessError as e:\n    print(\"bị chặn:\", e)\nrequire_test_access(\"demo.py\", \"thử\", confirm=True, codes=[\"H0\"], ledger_path=p)\nprint(read_ledger(p))<\/code><\/pre>\n<h4>Thử dấu vân tay BM25<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.retrieval.bm25_store import compute_fingerprint\na = compute_fingerprint(\"x\", 0.7, 0.2, True); b = compute_fingerprint(\"x\", 0.7, 0.25, True)\nprint(a[\"sha1\"] != b[\"sha1\"], [k for k in a[\"parts\"] if a[\"parts\"][k] != b[\"parts\"][k]])   # True ['b', 'scoring_probe_sha1']<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Sửa tay sổ phơi bày hoặc tệp mốc: mất tính kiểm chứng.<\/li><li>Dùng <code>strict=False<\/code> trong dịch vụ: dịch vụ tự dựng lại chỉ mục khác lần đo mà không ai biết.<\/li><\/ul>", "f": "<ul><li>Test: một lần, có cờ xác nhận, có sổ ghi chỉ thêm.<\/li><li>Quy tắc chọn ghi <strong>trước<\/strong> khi xem kết quả; nhận phương án mới khi cận dưới CI &gt; 0.<\/li><li>Đánh giá mô hình có sẵn trên dữ liệu nó <strong>chưa thấy<\/strong>.<\/li><li>Artifact phải mang dấu vân tay của mọi thứ ảnh hưởng tới kết quả.<\/li><li>Kết quả ngược mong đợi vẫn phải báo cáo.<\/li><\/ul>", "g": "<ol><li>Đổi một từ trong <code>GERMAN_STOPWORDS<\/code> trên bản sao của bạn và chứng minh <code>load_or_build(strict=True)<\/code> từ chối chỉ mục cũ, chỉ ra phần nào của dấu vân tay đổi.<\/li><li>Viết một bản đăng ký trước (JSON) cho thí nghiệm \"kết hợp điểm reader và retrieval\" ở GĐ5: tập chọn, metric chính, metric phụ, quy tắc nhận (dùng <code>adopt_alternative<\/code>), số cấu hình tối đa.<\/li><li>Giải thích bằng số liệu của project vì sao dense thắng BM25 trên dev-unseen nhưng thua trên test. Nhóm <code>exposure<\/code> nào giải thích được hiện tượng này?<\/li><\/ol>"}, {"id": "s14", "num": 14, "title": "Dịch vụ FastAPI", "gd": "GĐ8/18 · triển khai backend", "files": [{"path": "src/germanqa/api/settings.py", "name": "settings.py", "kind": "orig", "lang": "python", "source": "\"\"\"Cấu hình API (GĐ8): đọc configs/api.yaml thành một dataclass bất biến.\"\"\"\nfrom dataclasses import dataclass, field, fields\nfrom pathlib import Path\nfrom typing import List, Optional\n\nfrom germanqa.config import ROOT\nfrom germanqa.experiment import load_config\n\n\n@dataclass(frozen=True)\nclass ApiSettings:\n    default_retriever: str = \"bm25\"\n    retrievers: List[str] = field(default_factory=lambda: [\"bm25\"])\n    checkpoint: Optional[str] = None\n    max_question_chars: int = 500\n    max_retrieval_top_k: int = 50\n    max_reader_top_k: int = 10\n    request_timeout_s: float = 30.0\n    max_inflight: int = 8\n    warmup_question: str = \"Wer war Konrad Adenauer?\"\n    cors_origins: List[str] = field(default_factory=list)\n    results_dir: str = \"results\"\n    baselines_dir: str = \"baselines\"\n    reranker: Optional[str] = None\n    reranker_models: dict = field(default_factory=dict)\n    max_rerank_pool: int = 20\n\n    def results_path(self):\n        p = Path(self.results_dir)\n        return p if p.is_absolute() else ROOT / p\n\n    def baselines_path(self):\n        p = Path(self.baselines_dir)\n        return p if p.is_absolute() else ROOT / p\n\n\ndef load_settings(**overrides):\n    \"\"\"Đọc configs/api.yaml; overrides (từ dòng lệnh hoặc test) ghi đè từng trường.\"\"\"\n    raw = load_config(\"api\")[\"api\"]\n    names = {f.name for f in fields(ApiSettings)}\n    unknown = set(raw) - names\n    if unknown:\n        raise ValueError(f\"api.yaml có khóa lạ: {sorted(unknown)}\")\n    s = ApiSettings(**{**raw, **{k: v for k, v in overrides.items() if v is not None}})\n    if s.default_retriever not in s.retrievers:\n        raise ValueError(\"default_retriever phải nằm trong retrievers\")\n    if s.reranker is not None and s.reranker not in s.reranker_models:\n        raise ValueError(f\"reranker '{s.reranker}' không có trong reranker_models: {sorted(s.reranker_models)}\")\n    if s.max_rerank_pool < 1:\n        raise ValueError(\"max_rerank_pool phải >= 1\")\n    if s.max_inflight < 1 or s.request_timeout_s <= 0:\n        raise ValueError(\"max_inflight phải >= 1 và request_timeout_s > 0\")\n    return s", "notes": [{"a": 10, "b": 26, "title": "ApiSettings: các trường", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Retriever mặc định và danh sách retriever, giới hạn độ dài câu hỏi (500 ký tự), giới hạn top-k, hạn chót 30 giây, tối đa 8 request đang xử lý, câu hỏi khởi động, CORS, thư mục kết quả, reranker tùy chọn.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Giá trị thật: <code>default_retriever: hybrid<\/code>, <code>reranker: null<\/code> (GĐ15: H0 tốt nhất về đáp án).<\/p><\/dd><\/dl>"}, {"a": 28, "b": 30, "title": "results_path", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đường dẫn tương đối → tính từ <code>ROOT<\/code>.<\/p><\/dd><\/dl>"}, {"a": 32, "b": 34, "title": "baselines_path", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 37, "b": 53, "title": "load_settings: kiểm khi khởi động", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Khóa lạ trong YAML → lỗi (bắt lỗi gõ nhầm); ghi đè từ dòng lệnh/test; retriever mặc định phải nằm trong danh sách; reranker phải được khai báo; các giới hạn phải dương.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Fail fast: cấu hình sai thì dịch vụ không khởi động, thay vì chạy với hành vi lạ.<\/p><\/dd><\/dl>"}], "intro": "<p>Đọc <code>configs/api.yaml<\/code> thành dataclass bất biến, kiểm tính hợp lệ ngay khi khởi động.<\/p>"}, {"path": "src/germanqa/api/errors.py", "name": "errors.py", "kind": "orig", "lang": "python", "source": "\"\"\"Lỗi của API (GĐ8): một dạng JSON duy nhất {\"error\": {code, message, request_id, details?}}.\"\"\"\n\n\nclass ApiError(Exception):\n    def __init__(self, status, code, message, details=None):\n        super().__init__(message)\n        self.status, self.code, self.message, self.details = status, code, message, details\n\n\ndef error_body(code, message, request_id=None, details=None):\n    body = {\"code\": code, \"message\": message, \"request_id\": request_id}\n    if details:\n        body[\"details\"] = details\n    return {\"error\": body}", "notes": [{"a": 4, "b": 7, "title": "ApiError", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>HTTP status + mã lỗi máy đọc được + thông báo cho người + chi tiết.<\/p><\/dd><\/dl>"}, {"a": 10, "b": 14, "title": "error_body", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>{\"error\": {code, message, request_id, details?}}<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Frontend chỉ cần <strong>một<\/strong> đường xử lý lỗi (xem <code>client.ts<\/code>, GĐ15).<\/p><\/dd><\/dl>"}], "intro": "<p>Một dạng lỗi JSON duy nhất cho mọi endpoint.<\/p>"}, {"path": "src/germanqa/api/runner.py", "name": "runner.py", "kind": "orig", "lang": "python", "source": "\"\"\"Chạy model một request tại một thời điểm (GĐ8).\n\nVì sao không để FastAPI chạy thẳng: pipeline đồng bộ (torch, FAISS) sẽ chặn event loop, và hai request cùng dùng GPU 4 GB\ncó thể tranh bộ nhớ. Nên: (1) mỗi lần gọi model chạy trong một luồng riêng, (2) một KHÓA luồng cho đúng một lần chạy\nmodel tại một thời điểm, (3) số request đang chờ + đang chạy bị chặn trên (quá thì 503), (4) có hạn chót tổng.\n\nVì sao khóa luồng mà không dùng anyio.CapacityLimiter(1): khi request hết hạn chót (abandon_on_cancel), anyio TRẢ chỗ\ntrong limiter ngay dù luồng vẫn đang chạy model, nên request kế tiếp chạy CHỒNG lên nó (đã gặp trong test). Khóa nằm\ntrong luồng thì giữ đến khi model thật sự xong. Request đã hết hạn mà còn đang chờ khóa thì bỏ qua, không chạy model\ncho một khách đã nhận 504.\"\"\"\nimport threading\nimport time\nfrom functools import partial\n\nimport anyio\nfrom anyio import to_thread\n\nfrom germanqa.api.errors import ApiError\n\n\nclass Runner:\n    def __init__(self, max_inflight, timeout_s):\n        self.max_inflight, self.timeout_s = max_inflight, timeout_s\n        self._model_lock = threading.Lock()         # giữ suốt lúc model chạy\n        self._lock = threading.Lock()               # bảo vệ hai bộ đếm\n        self._waiting = 0\n        self._running = 0\n\n    @property\n    def load(self):\n        with self._lock:\n            return {\"waiting\": self._waiting, \"running\": self._running}\n\n    async def run(self, fn, *args, **kwargs):\n        \"\"\"Chạy fn(*args, **kwargs) trong luồng model. Trả về (kết quả, số giây đã chờ đến lượt).\"\"\"\n        with self._lock:\n            if self._waiting + self._running >= self.max_inflight:\n                raise ApiError(503, \"busy\", \"Máy chủ đang bận, hãy thử lại sau.\")\n            self._waiting += 1\n        t_admit = time.perf_counter()\n        released = False\n        cancelled = threading.Event()\n\n        def release_wait():                      # idempotent: luồng giành được khóa và nhánh kết thúc đều có thể gọi\n            nonlocal released\n            with self._lock:\n                if not released:\n                    released = True\n                    self._waiting -= 1\n\n        def job():\n            with self._model_lock:\n                if cancelled.is_set():\n                    return None, 0.0\n                queued = time.perf_counter() - t_admit\n                release_wait()\n                with self._lock:\n                    self._running += 1\n                try:\n                    return partial(fn, *args, **kwargs)(), queued\n                finally:\n                    with self._lock:\n                        self._running -= 1\n\n        try:\n            with anyio.fail_after(self.timeout_s):\n                return await to_thread.run_sync(job, abandon_on_cancel=True)\n        except TimeoutError:\n            cancelled.set()\n            raise ApiError(504, \"timeout\", f\"Quá {self.timeout_s:g} giây, request bị hủy.\") from None\n        finally:\n            release_wait()", "notes": [{"a": 1, "b": 10, "title": "Vì sao cần Runner", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>(1) Pipeline đồng bộ (torch, FAISS) sẽ chặn event loop nếu chạy thẳng trong hàm async → chạy trong luồng riêng. (2) Hai request cùng dùng GPU 4 GB có thể tranh bộ nhớ → khóa cho đúng một lần chạy model. (3) Chặn số request đang chờ + chạy (quá → 503). (4) Hạn chót tổng (quá → 504).<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Docstring ghi lại một lỗi đã gặp khi dùng <code>anyio.CapacityLimiter(1)<\/code>: khi hết hạn, limiter trả chỗ ngay dù luồng vẫn đang chạy model, nên request sau chạy chồng. Khóa nằm <strong>trong<\/strong> luồng sửa được điều này.<\/p><\/dd><\/dl>"}, {"a": 21, "b": 27, "title": "Khởi tạo", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>_model_lock<\/code> giữ suốt lúc model chạy; <code>_lock<\/code> bảo vệ hai bộ đếm <code>_waiting<\/code>, <code>_running<\/code>.<\/p><\/dd><\/dl>"}, {"a": 29, "b": 32, "title": "load", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc hai bộ đếm một cách an toàn luồng.<\/p><\/dd><\/dl>"}, {"a": 34, "b": 42, "title": "run (1): nhận request", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đầy (<code>waiting + running ≥ max_inflight<\/code>) → 503 <code>busy<\/code>; không thì tăng <code>_waiting<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Từ chối sớm còn hơn để hàng đợi dài vô hạn rồi mọi người cùng hết hạn.<\/p><\/dd><\/dl>"}, {"a": 44, "b": 49, "title": "release_wait: idempotent", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Giảm <code>_waiting<\/code> đúng <strong>một<\/strong> lần dù được gọi từ hai nơi (luồng giành được khóa và khối <code>finally<\/code>).<\/p><\/dd><\/dl>"}, {"a": 51, "b": 63, "title": "job: phần chạy trong luồng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chờ khóa model; nếu request đã bị hủy (hết hạn) trong lúc chờ thì <strong>bỏ qua<\/strong>, không chạy model cho khách đã nhận 504; đo thời gian xếp hàng; chuyển từ đếm 'chờ' sang 'chạy'; chạy hàm.<\/p><\/dd><\/dl>"}, {"a": 65, "b": 72, "title": "run (2): hạn chót", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>anyio.fail_after(timeout)<\/code> + <code>to_thread.run_sync(job, abandon_on_cancel=True)<\/code>. Hết hạn → đánh dấu <code>cancelled<\/code>, trả 504.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Luồng Python không thể bị giết giữa chừng: request hết hạn thì model vẫn chạy nốt. Vì vậy kiểm <code>cancelled<\/code> <strong>trước<\/strong> khi bắt đầu chạy là điều có thể làm.<\/p><\/dd><\/dl>"}], "intro": "<p>Chạy model <strong>một request tại một thời điểm<\/strong>, trong luồng riêng, có giới hạn hàng đợi và hạn chót.<\/p>"}, {"path": "src/germanqa/api/loader.py", "name": "loader.py", "kind": "orig", "lang": "python", "source": "\"\"\"Nạp tài nguyên cho API (GĐ8, mở rộng GĐ18): reader MỘT lần, dùng chung cho mọi retriever.\n\nDựng bằng chính build_pipeline/build_retriever của CLI (GĐ5/GĐ6), nên API và CLI đi qua cùng một đường code và cùng\nconfigs/*.yaml. Retriever nào không nạp được (thiếu faiss, thiếu artifacts, corpus đã đổi) chỉ bị đánh dấu không khả\ndụng với một MÃ lý do; API vẫn chạy với các retriever còn lại.\n\nGĐ18: hybrid KHÔNG dựng lại BM25 và dense mà dùng chung hai bộ đã nạp (không tốn thêm bộ nhớ). Reranker là tùy chọn\n(settings.reranker): nạp MỘT lần rồi tạo thêm các pipeline phụ tên '<retriever>+rerank' dùng chung bộ truy hồi và reader,\nnên không đụng QAPipeline. Reranker không nạp được thì chỉ rerank_unavailable, các retriever vẫn chạy.\"\"\"\nimport logging\n\nfrom germanqa.config import PROCESSED_DIR\nfrom germanqa.data.io_utils import read_jsonl\nfrom germanqa.experiment import load_config, new_experiment_id\nfrom germanqa.pipeline import QAPipeline, build_pipeline, build_retriever\n\nlog = logging.getLogger(\"germanqa.api\")\nRERANK_SUFFIX = \"+rerank\"\nCOMPONENTS = (\"bm25\", \"dense\")\n\n\ndef reason_code(exc):\n    \"\"\"Mã lý do ngắn, an toàn để trả cho client (không chứa đường dẫn hay nội dung ngoại lệ).\"\"\"\n    if isinstance(exc, ImportError):\n        return \"faiss_not_installed\" if \"faiss\" in str(exc).lower() else \"dependency_missing\"\n    if isinstance(exc, FileNotFoundError):\n        return \"artifacts_missing\"\n    if isinstance(exc, ValueError) and \"corpus đã đổi\" in str(exc):\n        return \"corpus_changed\"\n    return \"load_failed\"\n\n\ndef build_reranker_from_settings(settings):\n    \"\"\"Dựng reranker theo settings.reranker và settings.reranker_models; lỗi được người gọi bắt và đổi thành mã lý do.\"\"\"\n    from germanqa.rerank.factory import build_reranker\n    spec = settings.reranker_models[settings.reranker]\n    if \"config\" in spec:                                   # dùng khối 'rerank' của configs/<tên>.yaml\n        return build_reranker(load_config(spec[\"config\"])[\"rerank\"])\n    return build_reranker({\"checkpoint\": spec[\"checkpoint\"], \"max_length\": spec.get(\"max_length\", 512), \"batch_size\": spec.get(\"batch_size\", 16),\n                           \"fp16\": spec.get(\"fp16\", True), \"relevant_label\": spec.get(\"relevant_label\"),\n                           \"overflow\": spec.get(\"overflow\", \"windows\"), \"stride\": spec.get(\"stride\", 128)})\n\n\ndef load_pipelines(settings, data_dir=PROCESSED_DIR):\n    \"\"\"Trả về ({tên: QAPipeline}, {tên: mã lý do không khả dụng}). Tên là retriever, hoặc '<retriever>+rerank'.\"\"\"\n    names = list(settings.retrievers)\n    want = [n for n in COMPONENTS if n in names or \"hybrid\" in names]      # hybrid cần cả hai thành phần dù không liệt kê\n    pipelines, unavailable, retrievers, base, corpus = {}, {}, {}, None, None\n    for name in want:\n        try:\n            if base is None:\n                base = build_pipeline(settings.checkpoint, data_dir, retriever=name)\n                retrievers[name] = base.retriever\n                if name in names:\n                    pipelines[name] = base\n            else:\n                corpus = corpus or read_jsonl(data_dir / \"corpus.jsonl\")\n                retrievers[name] = build_retriever(name, corpus, data_dir)\n                if name in names:\n                    eid = new_experiment_id(\"pipeline\", {\"checkpoint_name\": base.model_version, \"corpus\": base.corpus_version, \"retriever\": name})\n                    pipelines[name] = QAPipeline(retrievers[name], base.reader, base.passages, base.model_version,\n                                                 base.corpus_version, eid, base.retrieval_top_k, base.reader_top_k)\n        except Exception as exc:                       # noqa: BLE001 - mỗi retriever lỗi độc lập\n            log.warning(\"retriever %s không khả dụng: %s\", name, type(exc).__name__)\n            unavailable[name] = reason_code(exc)\n    if \"hybrid\" in names:\n        if all(c in retrievers for c in COMPONENTS):\n            from germanqa.retrieval.hybrid import HybridRetriever\n            cfg = load_config(\"hybrid\")[\"hybrid\"]\n            hybrid = HybridRetriever.from_config(retrievers[\"bm25\"], retrievers[\"dense\"], cfg)\n            eid = new_experiment_id(\"pipeline\", {\"checkpoint_name\": base.model_version, \"corpus\": base.corpus_version, \"retriever\": \"hybrid\", \"hybrid\": cfg})\n            pipelines[\"hybrid\"] = QAPipeline(hybrid, base.reader, base.passages, base.model_version, base.corpus_version, eid,\n                                             base.retrieval_top_k, base.reader_top_k)\n        else:\n            unavailable[\"hybrid\"] = \"dependency_unavailable\"\n    if settings.reranker and pipelines:\n        try:\n            rr = build_reranker_from_settings(settings)\n            for name in list(pipelines):\n                p = pipelines[name]\n                eid = new_experiment_id(\"pipeline\", {\"checkpoint_name\": p.model_version, \"corpus\": p.corpus_version, \"retriever\": name, \"rerank\": settings.reranker})\n                pipelines[name + RERANK_SUFFIX] = QAPipeline(p.retriever, p.reader, p.passages, p.model_version, p.corpus_version, eid,\n                                                             p.retrieval_top_k, p.reader_top_k, reranker=rr)\n        except Exception as exc:                       # noqa: BLE001 - reranker hỏng không được làm sập các retriever\n            log.warning(\"reranker %s không khả dụng: %s\", settings.reranker, type(exc).__name__)\n            unavailable[\"rerank\"] = reason_code(exc)\n    if not pipelines:\n        raise RuntimeError(\"không nạp được retriever nào: \" + \", \".join(f\"{k}={v}\" for k, v in unavailable.items()))\n    return pipelines, unavailable", "notes": [{"a": 1, "b": 9, "title": "Thiết kế", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dựng bằng chính <code>build_pipeline/build_retriever<\/code> của CLI → API và CLI đi qua <strong>cùng một đường code<\/strong> và cùng YAML. Hybrid dùng lại BM25 + dense đã nạp. Reranker tạo thêm pipeline <code>&lt;retriever&gt;+rerank<\/code>.<\/p><\/dd><\/dl>"}, {"a": 18, "b": 19, "title": "Hằng số", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 22, "b": 30, "title": "reason_code", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đổi ngoại lệ thành mã ngắn (<code>faiss_not_installed<\/code>, <code>artifacts_missing<\/code>, <code>corpus_changed<\/code>…).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Không lộ đường dẫn hay nội dung ngoại lệ ra client.<\/p><\/dd><\/dl>"}, {"a": 33, "b": 41, "title": "build_reranker_from_settings", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Hoặc dùng khối <code>rerank<\/code> của một YAML (<code>bge_m3: {config: rerank}<\/code>), hoặc thông số khai báo thẳng (<code>mmarco<\/code>).<\/p><\/dd><\/dl>"}, {"a": 44, "b": 48, "title": "load_pipelines (1): cần dựng gì", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Hybrid cần cả bm25 và dense dù không liệt kê.<\/p><\/dd><\/dl>"}, {"a": 49, "b": 65, "title": "load_pipelines (2): dựng từng retriever, lỗi độc lập", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Retriever đầu tiên dựng cả pipeline (có reader); các retriever sau chỉ dựng retriever và tạo <code>QAPipeline<\/code> dùng <strong>chung<\/strong> <code>base.reader<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Reader chiếm VRAM; nạp hai lần là phí và có thể hết bộ nhớ.<\/p><\/dd><\/dl>"}, {"a": 66, "b": 75, "title": "load_pipelines (3): hybrid", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Bọc hai retriever đã nạp bằng <code>HybridRetriever<\/code> với <code>configs/hybrid.yaml<\/code>.<\/p><\/dd><\/dl>"}, {"a": 76, "b": 86, "title": "load_pipelines (4): reranker tùy chọn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nạp reranker một lần, tạo thêm pipeline <code>+rerank<\/code> cho mỗi retriever. Lỗi reranker không được làm sập các retriever.<\/p><\/dd><\/dl>"}, {"a": 87, "b": 89, "title": "load_pipelines (5): kết quả", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Không nạp được gì → lỗi khởi động.<\/p><\/dd><\/dl>"}], "intro": "<p>Nạp tài nguyên một lần: reader <strong>dùng chung<\/strong> cho mọi retriever; retriever nào lỗi thì chỉ bị đánh dấu không khả dụng.<\/p>"}, {"path": "src/germanqa/api/app.py", "name": "app.py", "kind": "orig", "lang": "python", "source": "\"\"\"FastAPI backend (GĐ8). create_app(settings, loader) dựng ứng dụng; loader(settings) -> (pipelines, unavailable).\n\nTài nguyên nặng nạp MỘT lần trong lifespan, ở nền: /health/live trả lời ngay, /health/ready trả 503 cho đến khi\nnạp xong và chạy thử được một câu. Mọi lần gọi model đi qua Runner (một luồng model tại một thời điểm).\"\"\"\nimport asyncio\nimport contextlib\nimport hashlib\nimport json\nimport logging\nimport math\nimport re\nimport time\nimport uuid\nfrom contextlib import asynccontextmanager\n\nfrom anyio import to_thread\nfrom fastapi import FastAPI, Request\nfrom fastapi.exceptions import RequestValidationError\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom fastapi.responses import JSONResponse\nfrom starlette.exceptions import HTTPException as StarletteHTTPException\n\nfrom germanqa.api.errors import ApiError, error_body\nfrom germanqa.api.experiments import MATRIX_CAVEATS, list_experiments, list_matrix\nfrom germanqa.api.loader import RERANK_SUFFIX\nfrom germanqa.api.runner import Runner\nfrom germanqa.api.schemas import (ErrorResponse, ExperimentList, MatrixResponse, QARequest, QAResult, Ready, RetrieveRequest,\n                                  RetrieveResult)\nfrom germanqa.api.settings import ApiSettings, load_settings\nfrom germanqa.schemas import to_utf16_offset\n\nlog = logging.getLogger(\"germanqa.api\")\nREQUEST_ID_RE = re.compile(r\"^[A-Za-z0-9_.-]{1,64}$\")\nOK_STATUSES = (\"ok\", \"question_truncated\")\n\n\nclass Service:\n    \"\"\"Trạng thái dùng chung của một ứng dụng: tài nguyên đã nạp + bộ chạy model.\"\"\"\n\n    def __init__(self, settings):\n        self.settings = settings\n        self.runner = Runner(settings.max_inflight, settings.request_timeout_s)\n        self.status = \"loading\"                 # loading | ready | failed\n        self.pipelines, self.unavailable = {}, {}\n        self.load_seconds = self.detail = None\n\n    def ready_body(self):\n        s = self.settings\n        info = {n: {\"available\": n in self.pipelines, \"reason\": self.unavailable.get(n)} for n in s.retrievers}\n        p = self.pipelines.get(s.default_retriever) or next(iter(self.pipelines.values()), None)\n        rr_names = sorted(n[:-len(RERANK_SUFFIX)] for n in self.pipelines if n.endswith(RERANK_SUFFIX))\n        rerank = {\"configured\": s.reranker, \"available\": bool(rr_names), \"retrievers\": rr_names,\n                  \"reason\": None if rr_names else (self.unavailable.get(\"rerank\") or (\"not_configured\" if not s.reranker else \"load_failed\"))}\n        return {\"status\": self.status, \"default_retriever\": s.default_retriever, \"retrievers\": info, \"reranker\": rerank,\n                \"model\": p.model_version if p else None, \"corpus\": p.corpus_version if p else None,\n                \"load_seconds\": self.load_seconds, \"detail\": self.detail}\n\n\ndef _finite(obj):\n    \"\"\"JSON không có -inf/NaN (reader_score = -inf cho đoạn không có span hợp lệ): thay bằng None.\"\"\"\n    if isinstance(obj, float):\n        return obj if math.isfinite(obj) else None\n    if isinstance(obj, dict):\n        return {k: _finite(v) for k, v in obj.items()}\n    if isinstance(obj, (list, tuple)):\n        return [_finite(v) for v in obj]\n    return obj\n\n\ndef _ms(seconds):\n    return round(seconds * 1000, 3)\n\n\ndef check_question(question, s):\n    if not question.strip():\n        raise ApiError(422, \"empty_question\", \"Câu hỏi trống.\")\n    if len(question) > s.max_question_chars:\n        raise ApiError(422, \"question_too_long\", f\"Câu hỏi dài {len(question)} ký tự, tối đa {s.max_question_chars}.\")\n\n\ndef check_top_k(name, value, upper):\n    if value is not None and not 1 <= value <= upper:\n        raise ApiError(422, \"invalid_top_k\", f\"{name} phải trong khoảng 1..{upper}, nhận được {value}.\")\n\n\ndef create_app(settings=None, loader=None):\n    settings = settings or load_settings()\n    if loader is None:\n        from germanqa.api.loader import load_pipelines\n        loader = load_pipelines\n    svc = Service(settings)\n\n    async def load_in_background():\n        t0 = time.perf_counter()\n        try:\n            def work():\n                pipelines, unavailable = loader(settings)\n                for name in list(pipelines):                         # chạy thử một câu: nạp luôn phần nạp lười (encoder câu hỏi)\n                    try:\n                        r = pipelines[name].answer(settings.warmup_question)\n                        if r.status not in OK_STATUSES:\n                            raise RuntimeError(f\"warmup status={r.status}\")\n                    except Exception:                                # noqa: BLE001\n                        log.exception(\"warmup %s thất bại\", name)\n                        unavailable[name] = \"warmup_failed\"\n                        del pipelines[name]\n                return pipelines, unavailable\n            pipelines, unavailable = await to_thread.run_sync(work, abandon_on_cancel=True)\n            svc.pipelines, svc.unavailable = pipelines, unavailable\n            if settings.default_retriever not in pipelines:\n                raise RuntimeError(f\"retriever mặc định '{settings.default_retriever}' không khả dụng\")\n            svc.status = \"ready\"\n        except asyncio.CancelledError:\n            raise\n        except Exception as exc:                                     # noqa: BLE001\n            log.exception(\"nạp tài nguyên thất bại\")\n            svc.status, svc.detail = \"failed\", type(exc).__name__\n        finally:\n            svc.load_seconds = round(time.perf_counter() - t0, 2)\n            log.info(json.dumps({\"event\": \"startup\", \"status\": svc.status, \"load_seconds\": svc.load_seconds,\n                                 \"retrievers\": sorted(svc.pipelines), \"unavailable\": svc.unavailable}))\n\n    @asynccontextmanager\n    async def lifespan(app):\n        task = asyncio.create_task(load_in_background())\n        try:\n            yield\n        finally:\n            task.cancel()\n            with contextlib.suppress(asyncio.CancelledError):\n                await task\n\n    app = FastAPI(title=\"GermanQA\", version=\"1.0\", lifespan=lifespan,\n                  description=\"Hỏi đáp trích xuất tiếng Đức: truy hồi (BM25 / dense / hybrid RRF), tùy chọn xếp lại bằng cross-encoder, + reader GBERT.\")\n    app.state.svc = svc\n\n    # ---------- middleware: request_id + log mỗi request (đăng ký trước CORS để CORS nằm ngoài cùng) ----------\n    @app.middleware(\"http\")\n    async def request_context(request: Request, call_next):\n        rid = request.headers.get(\"x-request-id\", \"\")\n        rid = rid if REQUEST_ID_RE.match(rid) else uuid.uuid4().hex[:16]\n        request.state.request_id, request.state.log = rid, {}\n        t0 = time.perf_counter()\n        try:\n            response = await call_next(request)\n        except Exception:                                            # noqa: BLE001 - lỗi ngoài ý muốn: log đầy đủ, client chỉ thấy mã\n            log.exception(\"request %s lỗi nội bộ\", rid)\n            response = JSONResponse(error_body(\"internal_error\", \"Lỗi nội bộ.\", rid), status_code=500)\n        response.headers[\"X-Request-ID\"] = rid\n        log.info(json.dumps({\"event\": \"request\", \"request_id\": rid, \"method\": request.method,\n                             \"path\": request.url.path, \"status\": response.status_code,\n                             \"ms\": _ms(time.perf_counter() - t0), **request.state.log}))\n        return response\n\n    if settings.cors_origins:\n        app.add_middleware(CORSMiddleware, allow_origins=settings.cors_origins, allow_methods=[\"GET\", \"POST\"],\n                           allow_headers=[\"Content-Type\", \"X-Request-ID\"], expose_headers=[\"X-Request-ID\"])\n\n    # ---------- lỗi: một dạng JSON ----------\n    def rid_of(request):\n        return getattr(request.state, \"request_id\", None)\n\n    @app.exception_handler(ApiError)\n    async def on_api_error(request, exc):\n        return JSONResponse(error_body(exc.code, exc.message, rid_of(request), exc.details), status_code=exc.status)\n\n    @app.exception_handler(RequestValidationError)\n    async def on_validation(request, exc):\n        details = [{\"field\": \".\".join(str(x) for x in e[\"loc\"][1:]) or str(e[\"loc\"][0]), \"message\": e[\"msg\"]}\n                   for e in exc.errors()]\n        return JSONResponse(error_body(\"invalid_request\", \"Request không hợp lệ.\", rid_of(request), details),\n                            status_code=422)\n\n    @app.exception_handler(StarletteHTTPException)\n    async def on_http(request, exc):\n        code = {404: \"not_found\", 405: \"method_not_allowed\"}.get(exc.status_code, \"http_error\")\n        return JSONResponse(error_body(code, str(exc.detail), rid_of(request)), status_code=exc.status_code)\n\n    # ---------- helpers cho route ----------\n    def need_ready():\n        if svc.status != \"ready\":\n            raise ApiError(503, \"not_ready\" if svc.status == \"loading\" else \"load_failed\",\n                           \"Máy chủ đang nạp tài nguyên.\" if svc.status == \"loading\" else \"Nạp tài nguyên thất bại.\")\n\n    def pick(name, rerank=False):\n        name = name or settings.default_retriever\n        if name not in svc.pipelines:\n            raise ApiError(422, \"retriever_unavailable\", f\"Retriever '{name}' không khả dụng.\",\n                           [{\"retriever\": name, \"reason\": svc.unavailable.get(name, \"not_configured\")}])\n        if rerank:\n            key = name + RERANK_SUFFIX\n            if key not in svc.pipelines:\n                raise ApiError(422, \"rerank_unavailable\", \"Máy chủ không có reranker cho retriever này.\",\n                               [{\"retriever\": name, \"reason\": svc.unavailable.get(key) or svc.unavailable.get(\"rerank\") or (\"not_configured\" if not settings.reranker else \"load_failed\")}])\n            return name, svc.pipelines[key]\n        return name, svc.pipelines[name]\n\n    def note(request, **kv):\n        request.state.log.update(kv)\n\n    def note_question(request, question, retriever):\n        note(request, question_chars=len(question), question_sha=hashlib.sha1(question.encode(\"utf-8\")).hexdigest()[:8],\n             retriever=retriever)\n\n    # ---------- health ----------\n    @app.get(\"/health/live\", tags=[\"health\"])\n    async def live():\n        return {\"status\": \"alive\"}\n\n    @app.get(\"/health/ready\", response_model=Ready, tags=[\"health\"], responses={503: {\"model\": Ready}})\n    async def ready():\n        return JSONResponse(svc.ready_body(), status_code=200 if svc.status == \"ready\" else 503)\n\n    # ---------- hỏi đáp ----------\n    err = {422: {\"model\": ErrorResponse}, 503: {\"model\": ErrorResponse}, 504: {\"model\": ErrorResponse}}\n\n    @app.post(\"/api/v1/qa\", response_model=QAResult, tags=[\"qa\"], responses=err)\n    async def qa(req: QARequest, request: Request):\n        t0 = time.perf_counter()\n        need_ready()\n        check_question(req.question, settings)\n        check_top_k(\"retrieval_top_k\", req.retrieval_top_k, settings.max_retrieval_top_k)\n        check_top_k(\"reader_top_k\", req.reader_top_k, settings.max_reader_top_k)\n        name, pipe = pick(req.retriever, req.rerank)\n        k_ret = req.retrieval_top_k or pipe.retrieval_top_k\n        k_read = req.reader_top_k or pipe.reader_top_k\n        if req.rerank and k_ret > settings.max_rerank_pool:\n            raise ApiError(422, \"invalid_top_k\", f\"Khi rerank, retrieval_top_k ({k_ret}) không được lớn hơn {settings.max_rerank_pool} (max_rerank_pool).\")\n        if k_read > k_ret:\n            raise ApiError(422, \"invalid_top_k\", f\"reader_top_k ({k_read}) không được lớn hơn retrieval_top_k ({k_ret}).\")\n        note_question(request, req.question, name)\n        note(request, rerank=bool(req.rerank))\n        r, queued = await svc.runner.run(pipe.answer, req.question, k_ret, k_read, req.trace)\n        d = r.to_dict()\n        d.update(request_id=request.state.request_id, retriever=name, reranked=bool(req.rerank),\n                 answer_start_utf16=to_utf16_offset(r.passage_text, r.answer_start),\n                 answer_end_utf16=to_utf16_offset(r.passage_text, r.answer_end),\n                 timings={\"queue_ms\": _ms(queued), \"retrieval_ms\": _ms(r.retrieval_time), \"reader_ms\": _ms(r.reader_time),\n                          \"rerank_ms\": _ms(r.rerank_time), \"pipeline_ms\": _ms(r.total_time), \"total_ms\": _ms(time.perf_counter() - t0)},\n                 versions={\"model\": r.model_version, \"corpus\": r.corpus_version, \"experiment_id\": r.experiment_id})\n        for k in (\"retrieval_time\", \"reader_time\", \"rerank_time\", \"total_time\", \"model_version\", \"corpus_version\", \"experiment_id\"):\n            d.pop(k)\n        d[\"trace\"] = _finite(d[\"trace\"])\n        note(request, status_pipeline=r.status, **d[\"timings\"])\n        return d\n\n    @app.post(\"/api/v1/retrieve\", response_model=RetrieveResult, tags=[\"qa\"], responses=err)\n    async def retrieve(req: RetrieveRequest, request: Request):\n        t0 = time.perf_counter()\n        need_ready()\n        check_question(req.question, settings)\n        check_top_k(\"top_k\", req.top_k, settings.max_retrieval_top_k)\n        name, pipe = pick(req.retriever)\n        k = req.top_k or pipe.retrieval_top_k\n        question = req.question.strip()\n        note_question(request, req.question, name)\n        def timed():\n            t = time.perf_counter()\n            return pipe.retriever.retrieve(question, k), time.perf_counter() - t\n        (hits, retrieval), queued = await svc.runner.run(timed)\n        note(request, queue_ms=_ms(queued), retrieval_ms=_ms(retrieval))\n        return {\"request_id\": request.state.request_id, \"question\": question, \"retriever\": name, \"top_k\": k,\n                \"candidates\": [{\"passage_id\": h[\"passage_id\"], \"rank\": h[\"rank\"], \"score\": h[\"score\"],\n                                \"text\": pipe.passages[h[\"passage_id\"]],\n                                **{k: h[k] for k in (\"sources\", \"bm25_score\", \"dense_score\") if k in h}} for h in hits],\n                \"timings\": {\"queue_ms\": _ms(queued), \"retrieval_ms\": _ms(retrieval),\n                            \"total_ms\": _ms(time.perf_counter() - t0)},\n                \"versions\": {\"model\": pipe.model_version, \"corpus\": pipe.corpus_version,\n                             \"experiment_id\": pipe.experiment_id}}\n\n    # ---------- thí nghiệm đã lưu (chỉ đọc) ----------\n    @app.get(\"/api/v1/experiments\", response_model=ExperimentList, tags=[\"experiments\"])\n    async def experiments(kind: str = None):\n        items, skipped = await to_thread.run_sync(list_experiments, settings.results_path(), kind, settings.baselines_path())\n        return {\"count\": len(items), \"skipped\": skipped, \"items\": items}\n\n    @app.get(\"/api/v1/matrix\", response_model=MatrixResponse, tags=[\"experiments\"])\n    async def matrix():\n        rows = await to_thread.run_sync(list_matrix, settings.baselines_path(), settings.results_path())\n        return {\"count\": len(rows), \"caveats\": MATRIX_CAVEATS, \"rows\": rows}\n\n    return app", "notes": [{"a": 37, "b": 56, "title": "Service: trạng thái dùng chung", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>status<\/code> loading/ready/failed, các pipeline, lý do không khả dụng; <code>ready_body<\/code> mô tả retriever nào khả dụng, reranker, phiên bản mô hình và corpus.<\/p><\/dd><\/dl>"}, {"a": 59, "b": 67, "title": "_finite", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Thay <code>-inf<\/code>/<code>NaN<\/code> (reader_score của đoạn không có span) bằng <code>None<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>JSON chuẩn không có <code>-inf<\/code>; trình duyệt sẽ không parse được.<\/p><\/dd><\/dl>"}, {"a": 70, "b": 71, "title": "_ms", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 74, "b": 78, "title": "check_question", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Rỗng → 422 <code>empty_question<\/code>; quá 500 ký tự → 422 <code>question_too_long<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Chặn ở cửa rẻ, trước khi đụng model.<\/p><\/dd><\/dl>"}, {"a": 81, "b": 83, "title": "check_top_k", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 86, "b": 91, "title": "create_app: tiêm loader", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>loader<\/code> truyền vào được → test dùng loader giả, không cần GPU.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>tests/GD8<\/code>, <code>tests/GD18<\/code>.<\/p><\/dd><\/dl>"}, {"a": 93, "b": 121, "title": "Nạp nền và khởi động", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Trong luồng: gọi loader, chạy câu khởi động cho <strong>từng<\/strong> pipeline (nạp luôn phần nạp lười như question encoder); pipeline khởi động lỗi bị loại. Retriever mặc định phải khả dụng. Ghi log JSON sự kiện <code>startup<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p><code>/health/live<\/code> trả lời ngay khi tiến trình sống; <code>/health/ready<\/code> chỉ 200 khi đã nạp và chạy thử được: hợp với cơ chế kiểm tra sức khỏe của Docker/Kubernetes.<\/p><\/dd><\/dl>"}, {"a": 123, "b": 131, "title": "lifespan", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tạo task nạp nền khi khởi động; hủy khi tắt.<\/p><\/dd><\/dl>"}, {"a": 133, "b": 135, "title": "Tạo ứng dụng", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 138, "b": 153, "title": "Middleware: request id và log", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nhận <code>X-Request-ID<\/code> hợp lệ hoặc tạo mới; bắt mọi lỗi ngoài ý muốn thành 500 <code>internal_error<\/code> (log đầy đủ, client chỉ thấy mã); ghi một dòng log JSON mỗi request (path, status, ms, kèm thông tin route ghi thêm).<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Log ghi <code>question_sha<\/code> (8 ký tự băm) và độ dài thay vì câu hỏi thật: không lưu nội dung người dùng vào log.<\/p><\/dd><\/dl>"}, {"a": 155, "b": 157, "title": "CORS", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Cho phép React dev server (cổng 5173) gọi API.<\/p><\/dd><\/dl>"}, {"a": 160, "b": 177, "title": "Bộ xử lý lỗi", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>ApiError<\/code>, lỗi kiểm tra Pydantic (422 <code>invalid_request<\/code> kèm danh sách trường), lỗi HTTP (404/405) đều về <strong>một<\/strong> dạng JSON.<\/p><\/dd><\/dl>"}, {"a": 180, "b": 196, "title": "need_ready và pick", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chưa sẵn sàng → 503. <code>pick<\/code> chọn pipeline theo tên retriever (mặc định từ cấu hình) và cờ <code>rerank<\/code>; không có → 422 kèm lý do.<\/p><\/dd><\/dl>"}, {"a": 198, "b": 203, "title": "Ghi thêm vào log request", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 206, "b": 212, "title": "Health check", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 215, "b": 245, "title": "POST /api/v1/qa", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Kiểm sẵn sàng, câu hỏi, top-k; khi rerank thì <code>retrieval_top_k ≤ max_rerank_pool (20)<\/code>; <code>reader_top_k ≤ retrieval_top_k<\/code>. Chạy <code>pipe.answer<\/code> qua <code>Runner<\/code>. Bổ sung <code>request_id<\/code>, <code>retriever<\/code>, offset <strong>UTF-16<\/strong>, khối <code>timings<\/code> (queue/retrieval/reader/rerank/pipeline/total ms) và <code>versions<\/code>; bỏ các trường thời gian dạng giây; làm sạch <code>trace<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: <code>{question, retriever?, rerank?, retrieval_top_k?, reader_top_k?, trace?}<\/code>. Ra: <code>QAResult<\/code>.<\/p><\/dd><\/dl>"}, {"a": 247, "b": 269, "title": "POST /api/v1/retrieve", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chỉ truy hồi, trả ứng viên kèm văn bản, <code>sources<\/code>, điểm nhánh (nếu hybrid).<\/p><\/dd><\/dl>"}, {"a": 272, "b": 282, "title": "Đọc thí nghiệm đã lưu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>/experiments<\/code> và <code>/matrix<\/code> chỉ <strong>đọc<\/strong> <code>results/<\/code> và <code>baselines/<\/code> (trong luồng riêng để không chặn event loop); matrix kèm các lưu ý diễn giải.<\/p><\/dd><\/dl>"}], "intro": "<p>Ứng dụng FastAPI: nạp nền khi khởi động, health check, <code>/api/v1/qa<\/code>, <code>/api/v1/retrieve<\/code>, đọc thí nghiệm đã lưu, middleware request id + log, lỗi một dạng.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Bọc pipeline thành dịch vụ HTTP ổn định: nạp một lần, phục vụ nhiều request, lỗi rõ ràng, có health check, có log, chịu tải có giới hạn.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Một mô hình trong notebook chưa phải sản phẩm. Dịch vụ phải xử lý được: khởi động chậm, request đồng thời, request quá dài, GPU nhỏ, thành phần hỏng một phần.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>build_pipeline<\/code>/<code>build_retriever<\/code> (GĐ5), <code>QAResponse<\/code> + <code>to_utf16_offset<\/code> (GĐ0), mọi cấu hình YAML.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>Frontend React (GĐ15 trong hướng dẫn này, GĐ9 trong kế hoạch) gọi <code>/api/v1/qa<\/code>, <code>/health/ready<\/code>, <code>/api/v1/matrix<\/code>. Docker (GĐ10) chưa làm.<\/p>", "b": "<h4>Mô hình đồng thời của FastAPI<\/h4>\n<p>FastAPI chạy trên một <strong>event loop<\/strong> (asyncio). Hàm <code>async<\/code> không được làm việc nặng đồng bộ (chạy BERT 100 ms) vì sẽ chặn mọi request khác. Giải pháp chuẩn: đẩy việc nặng vào <strong>thread pool<\/strong> (<code>anyio.to_thread.run_sync<\/code>).<\/p>\n<h4>Vì sao chỉ một luồng model tại một thời điểm?<\/h4>\n<p>Trên GPU 4 GB, hai lần chạy cùng lúc có thể hết VRAM. Và với một GPU, chạy song song cũng không nhanh hơn nhiều. Khóa + hàng đợi có giới hạn (8) + hạn chót (30 giây) cho hành vi dự đoán được dưới tải:<\/p>\n<div class=\"math\">request mới:  waiting + running ≥ 8 → 503;   chờ + chạy &gt; 30 s → 504<\/div>\n<h4>Health check hai tầng<\/h4>\n<ul><li><strong>liveness<\/strong> (<code>/health/live<\/code>): tiến trình còn sống không.<\/li><li><strong>readiness<\/strong> (<code>/health/ready<\/code>): đã nạp xong và chạy thử được chưa. Load balancer chỉ gửi request khi ready.<\/li><\/ul>\n<h4>Suy giảm có kiểm soát (graceful degradation)<\/h4>\n<p>Thiếu FAISS → dense và hybrid không khả dụng, BM25 vẫn chạy. Reranker hỏng → các retriever vẫn chạy. Client nhận mã lý do rõ ràng.<\/p>\n<h4>Thay thế<\/h4>\n<p>Chạy model trong tiến trình riêng (Celery, Ray Serve, Triton) để mở rộng nhiều GPU; gom lô động (dynamic batching) để tăng thông lượng.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>khởi động: create_app ─ lifespan ─ task nền: load_pipelines ─ warmup từng pipeline ─ status=ready\n                       (trong lúc đó /health/live = 200, /health/ready = 503)\n\nPOST /api/v1/qa {question, retriever?, rerank?, retrieval_top_k?, reader_top_k?, trace?}\n middleware: request_id\n ├─ need_ready ─ check_question ─ check_top_k ─ pick(retriever, rerank)\n ├─ Runner.run(pipe.answer, …)   [503 busy | 504 timeout]\n │     luồng: khóa model ─ QAPipeline.answer ─▶ QAResponse\n ├─ to_dict + utf16 offsets + timings + versions; _finite(trace)\n └─ JSON QAResult  (+ header X-Request-ID; log 1 dòng JSON)\nlỗi bất kỳ ─▶ {\"error\": {code, message, request_id, details?}}<\/code><\/pre>", "e": "<h4>Chạy dịch vụ (script của project: <code>scripts/GD8/08_serve.py<\/code>)<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/GD8/08_serve.py                      # 127.0.0.1:8000, retriever theo configs/api.yaml (mặc định hybrid)\npython scripts/GD8/08_serve.py --retrievers bm25    # nhẹ hơn: chỉ BM25 + reader\ncurl http://localhost:8000/health/ready\ncurl -X POST http://localhost:8000/api/v1/qa -H \"Content-Type: application/json\" \\\n     -d \"{\\\"question\\\": \\\"Wer war Konrad Adenauer?\\\", \\\"trace\\\": true}\"<\/code><\/pre>\n<p>Hỏi qua API bằng script có sẵn: <code>python scripts/GD8/08c_ask_api.py \"câu hỏi\"<\/code>. Tài liệu tương tác của FastAPI: <code>http://localhost:8000/docs<\/code>.<\/p>\n<h4>Test không cần GPU (loader giả)<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>pytest tests/GD8 tests/GD18 -q<\/code><\/pre>\n<p>Ý tưởng: <code>create_app(settings, loader=lambda s: ({\"bm25\": FakePipeline()}, {}))<\/code> rồi dùng <code>httpx<\/code>/<code>TestClient<\/code> gọi API.<\/p>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li><code>503 not_ready<\/code> ngay sau khởi động: bình thường, đợi <code>/health/ready<\/code> = 200.<\/li><li>JSON lỗi vì <code>-inf<\/code>: quên <code>_finite<\/code>.<\/li><li>Tô sáng lệch trên frontend: dùng offset Python thay vì <code>answer_start_utf16<\/code>.<\/li><\/ul>", "f": "<ul><li>Việc nặng đồng bộ → thread pool; một khóa model; hàng đợi có giới hạn; hạn chót.<\/li><li>Nạp một lần, nền, health check live/ready.<\/li><li>API và CLI dùng <strong>chung<\/strong> code dựng pipeline và YAML.<\/li><li>Lỗi một dạng JSON, có <code>request_id<\/code>; log không chứa câu hỏi thật.<\/li><li>Thành phần hỏng một phần → suy giảm có kiểm soát.<\/li><\/ul>", "g": "<ol><li>Viết test: gửi 10 request đồng thời tới app với pipeline giả ngủ 1 giây, <code>max_inflight = 3<\/code>. Có bao nhiêu 503? Giải thích theo code <code>Runner.run<\/code>.<\/li><li>Thêm endpoint <code>GET /api/v1/version<\/code> trả phiên bản mô hình và corpus, có test. Bạn phải sửa những chỗ nào?<\/li><li>Vẽ sơ đồ thời gian khi request A hết hạn trong lúc đang chạy model và request B đang chờ. Vì sao B không chạy chồng lên A?<\/li><\/ol>"}, {"id": "s15", "num": 15, "title": "Frontend React: gọi API và tô sáng đáp án", "gd": "GĐ9 · giao diện", "files": [{"path": "frontend/src/lib/highlight.ts", "name": "highlight.ts", "kind": "orig", "lang": "ts", "source": "export interface Parts {\n  before: string;\n  answer: string;\n  after: string;\n  highlighted: boolean;\n}\n\n/**\n * Tách văn bản đoạn thành trước / đáp án / sau bằng offset UTF-16 (API trả answer_start_utf16/answer_end_utf16).\n * String.slice của JavaScript đếm theo đơn vị UTF-16, nên emoji hay ký tự ngoài BMP đứng trước đáp án không làm lệch.\n * Offset không hợp lệ hoặc cắt giữa một cặp surrogate thì KHÔNG highlight (hiện cả đoạn), thay vì highlight sai chỗ.\n */\nexport function splitByUtf16(text: string, start: number, end: number): Parts {\n  const whole: Parts = { before: text, answer: \"\", after: \"\", highlighted: false };\n  if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end <= start || end > text.length) return whole;\n  if (isLowSurrogate(text, start) || isLowSurrogate(text, end)) return whole;\n  return { before: text.slice(0, start), answer: text.slice(start, end), after: text.slice(end), highlighted: true };\n}\n\nfunction isLowSurrogate(text: string, i: number): boolean {\n  if (i <= 0 || i >= text.length) return false;\n  const c = text.charCodeAt(i);\n  return c >= 0xdc00 && c <= 0xdfff;\n}\n\n/**\n * Đổi vị trí theo MÃ UNICODE (offset kiểu Python) sang đơn vị UTF-16. Cần cho các ứng viên trong `trace`:\n * API chỉ đổi sẵn UTF-16 cho đáp án được chọn, còn start/end của các ứng viên khác vẫn là offset Python.\n * Vượt quá độ dài thì trả -1.\n */\nexport function utf16FromCodePoint(text: string, codePointIndex: number): number {\n  if (!Number.isInteger(codePointIndex) || codePointIndex < 0) return -1;\n  let units = 0;\n  let seen = 0;\n  for (const ch of text) {\n    if (seen === codePointIndex) return units;\n    units += ch.length;\n    seen++;\n  }\n  return seen === codePointIndex ? units : -1;\n}", "notes": [{"a": 1, "b": 6, "title": "Parts", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Kết quả: ba phần văn bản và cờ <code>highlighted<\/code>.<\/p><\/dd><\/dl>"}, {"a": 13, "b": 17, "title": "splitByUtf16", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Kiểm offset là số nguyên, trong phạm vi, <code>end &gt; start<\/code>, và <strong>không<\/strong> cắt giữa cặp surrogate; hợp lệ thì <code>slice<\/code> ba phần.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Offset sai → hiển thị cả đoạn không tô, thay vì tô sai chỗ (lỗi im lặng khó phát hiện hơn).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dùng <code>answer_start_utf16/answer_end_utf16<\/code> do API tính bằng <code>to_utf16_offset<\/code> (GĐ0).<\/p><\/dd><\/dl>"}, {"a": 20, "b": 23, "title": "isLowSurrogate", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mã 0xDC00–0xDFFF là nửa sau của một ký tự ngoài BMP; cắt tại đó sẽ làm vỡ ký tự.<\/p><\/dd><\/dl>"}, {"a": 31, "b": 40, "title": "utf16FromCodePoint", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đổi offset kiểu Python (code point) sang UTF-16 bằng cách duyệt <code>for … of<\/code> (duyệt theo code point) và cộng <code>ch.length<\/code> (1 hoặc 2).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>API chỉ đổi sẵn offset cho đáp án được chọn; các ứng viên trong <code>trace<\/code> vẫn là offset Python.<\/p><\/dd><\/dl>"}], "intro": "<p>Tách đoạn văn thành trước / đáp án / sau bằng offset UTF-16, an toàn với emoji.<\/p>"}, {"path": "frontend/src/api/client.ts", "name": "client.ts", "kind": "orig", "lang": "ts", "source": "import type { Api, ExperimentList, MatrixResponse, QAResult, Ready, RetrieveResult } from \"./types\";\n\n/** Mọi lỗi từ API hoặc từ mạng đều thành một kiểu này, để UI chỉ có một đường xử lý lỗi. */\nexport class ApiError extends Error {\n  constructor(\n    public code: string,\n    message: string,\n    public status: number | null = null,\n    public requestId: string | null = null,\n    public details: unknown = null,\n  ) {\n    super(message);\n    this.name = \"ApiError\";\n  }\n}\n\nexport const isAbort = (e: unknown): boolean => e instanceof DOMException && e.name === \"AbortError\";\n\nasync function parseError(res: Response): Promise<ApiError> {\n  try {\n    const body = await res.json();\n    const e = body?.error;\n    if (e && typeof e.code === \"string\") {\n      return new ApiError(e.code, String(e.message ?? \"\"), res.status, e.request_id ?? null, e.details ?? null);\n    }\n  } catch {\n    /* thân không phải JSON: rơi xuống lỗi chung */\n  }\n  return new ApiError(\"http_error\", `HTTP ${res.status}`, res.status);\n}\n\nasync function call(base: string, path: string, init?: RequestInit): Promise<Response> {\n  try {\n    return await fetch(base + path, init);\n  } catch (e) {\n    if (isAbort(e)) throw e; // hủy chủ động không phải lỗi mạng\n    throw new ApiError(\"network\", \"Không kết nối được tới máy chủ.\");\n  }\n}\n\nasync function json<T>(base: string, path: string, init?: RequestInit): Promise<T> {\n  const res = await call(base, path, init);\n  if (!res.ok) throw await parseError(res);\n  return (await res.json()) as T;\n}\n\nconst post = (body: unknown, signal?: AbortSignal): RequestInit => ({\n  method: \"POST\",\n  headers: { \"Content-Type\": \"application/json\" },\n  body: JSON.stringify(body),\n  signal,\n});\n\nexport function createApi(base = \"\"): Api {\n  return {\n    ask: (params, signal) => json<QAResult>(base, \"/api/v1/qa\", post(params, signal)),\n    retrieve: (params, signal) => json<RetrieveResult>(base, \"/api/v1/retrieve\", post(params, signal)),\n    getExperiments: (signal) => json<ExperimentList>(base, \"/api/v1/experiments\", { signal }),\n    getMatrix: (signal) => json<MatrixResponse>(base, \"/api/v1/matrix\", { signal }),\n    // /health/ready trả 503 KÈM thân hợp lệ khi đang nạp hoặc thất bại: đó là dữ liệu, không phải lỗi.\n    async getReady(signal) {\n      const res = await call(base, \"/health/ready\", { signal });\n      if (res.ok || res.status === 503) {\n        const body = (await res.json()) as Ready;\n        if (body && typeof body.status === \"string\") return body;\n      }\n      throw await parseError(res);\n    },\n  };\n}\n\nexport const api: Api = createApi();", "notes": [{"a": 4, "b": 15, "title": "ApiError (phía client)", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>code<\/code>, <code>message<\/code>, <code>status<\/code>, <code>requestId<\/code>, <code>details<\/code>: khớp dạng lỗi của backend.<\/p><\/dd><\/dl>"}, {"a": 17, "b": 17, "title": "isAbort", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Phân biệt hủy chủ động (<code>AbortError<\/code>) với lỗi thật.<\/p><\/dd><\/dl>"}, {"a": 19, "b": 29, "title": "parseError", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Thân JSON có <code>error.code<\/code> → dựng <code>ApiError<\/code> đầy đủ; không thì lỗi chung <code>HTTP &lt;status&gt;<\/code>.<\/p><\/dd><\/dl>"}, {"a": 32, "b": 37, "title": "call", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>fetch<\/code>; lỗi mạng → <code>network<\/code>; hủy chủ động thì ném lại nguyên trạng.<\/p><\/dd><\/dl>"}, {"a": 41, "b": 44, "title": "json<T>", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Không <code>ok<\/code> → <code>parseError<\/code>; ngược lại parse JSON.<\/p><\/dd><\/dl>"}, {"a": 47, "b": 52, "title": "post", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tạo <code>RequestInit<\/code> POST JSON, kèm <code>signal<\/code> để hủy.<\/p><\/dd><\/dl>"}, {"a": 54, "b": 59, "title": "createApi", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Bốn hàm <code>ask<\/code>, <code>retrieve<\/code>, <code>getExperiments<\/code>, <code>getMatrix<\/code>; <code>base<\/code> thay được (test dùng base giả).<\/p><\/dd><\/dl>"}, {"a": 61, "b": 67, "title": "getReady", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>/health/ready<\/code> trả <strong>503 kèm thân hợp lệ<\/strong> khi đang nạp: đó là dữ liệu (trạng thái), không phải lỗi.<\/p><\/dd><\/dl>"}], "intro": "<p>Client API có kiểu: mọi lỗi mạng/HTTP thành một kiểu <code>ApiError<\/code> duy nhất.<\/p>"}, {"path": "frontend/src/hooks/useAsk.ts", "name": "useAsk.ts", "kind": "orig", "lang": "ts", "source": "import { useCallback, useEffect, useRef, useState } from \"react\";\nimport { ApiError, api as defaultApi, isAbort } from \"../api/client\";\nimport type { Api, AskParams, QAResult } from \"../api/types\";\nimport { toApiError } from \"../lib/messages\";\n\nexport type AskState =\n  | { phase: \"idle\" }\n  | { phase: \"loading\"; question: string }\n  | { phase: \"done\"; result: QAResult }\n  | { phase: \"error\"; error: ApiError; question: string };\n\n/**\n * Hỏi đáp với hai lớp chống \"response cũ ghi đè response mới\":\n * 1) AbortController hủy yêu cầu đang bay khi có yêu cầu mới (tiết kiệm mạng, nhưng máy chủ vẫn chạy nốt);\n * 2) số thứ tự yêu cầu: dù response cũ vẫn tới được (hủy không kịp, hoặc fetch giả không tôn trọng signal),\n *    chỉ response của yêu cầu MỚI NHẤT mới được ghi vào state.\n */\nexport function useAsk(api: Api = defaultApi) {\n  const [state, setState] = useState<AskState>({ phase: \"idle\" });\n  const seq = useRef(0);\n  const ctrl = useRef<AbortController | null>(null);\n\n  const ask = useCallback(\n    async (params: AskParams) => {\n      ctrl.current?.abort();\n      const mine = ++seq.current;\n      const c = new AbortController();\n      ctrl.current = c;\n      setState({ phase: \"loading\", question: params.question });\n      try {\n        const result = await api.ask({ ...params, trace: true }, c.signal);\n        if (mine === seq.current) setState({ phase: \"done\", result });\n      } catch (e) {\n        if (mine !== seq.current || isAbort(e)) return;\n        setState({ phase: \"error\", error: toApiError(e), question: params.question });\n      }\n    },\n    [api],\n  );\n\n  const reset = useCallback(() => {\n    ctrl.current?.abort();\n    seq.current++;\n    setState({ phase: \"idle\" });\n  }, []);\n\n  useEffect(() => () => ctrl.current?.abort(), []);\n  return { state, ask, reset };\n}", "notes": [{"a": 6, "b": 10, "title": "AskState: máy trạng thái", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>idle<\/code> → <code>loading<\/code> → <code>done<\/code> | <code>error<\/code>. Kiểu union phân biệt (discriminated union) buộc UI xử lý đủ trường hợp.<\/p><\/dd><\/dl>"}, {"a": 18, "b": 21, "title": "Trạng thái và tham chiếu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>seq<\/code>: số thứ tự yêu cầu; <code>ctrl<\/code>: <code>AbortController<\/code> của yêu cầu đang bay.<\/p><\/dd><\/dl>"}, {"a": 23, "b": 38, "title": "ask: hai lớp chống ghi đè", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Hủy yêu cầu cũ; tăng <code>seq<\/code>; chỉ ghi kết quả nếu <code>mine === seq.current<\/code>. Luôn gửi <code>trace: true<\/code> để hiện bảng ứng viên.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Người dùng hỏi câu A rồi nhanh chóng hỏi câu B; nếu A về sau B mà không kiểm <code>seq<\/code>, màn hình sẽ hiện đáp án của A cho câu B (race condition).<\/p><\/dd><\/dl>"}, {"a": 41, "b": 45, "title": "reset", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Hủy, tăng <code>seq<\/code> (vô hiệu hóa mọi response đang bay), về <code>idle<\/code>.<\/p><\/dd><\/dl>"}, {"a": 47, "b": 48, "title": "Dọn dẹp khi gỡ component", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Hủy yêu cầu đang bay khi component bị gỡ.<\/p><\/dd><\/dl>"}], "intro": "<p>Hook React gửi câu hỏi, chống 'response cũ ghi đè response mới'.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Giao diện web: hỏi, xem đáp án tô sáng trong đoạn nguồn, xem ứng viên và thời gian, xem bảng số đo B0/B1/H0/H1.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Người dùng cần thấy <strong>bằng chứng<\/strong> (đoạn nguồn, vị trí đáp án), không chỉ một chuỗi đáp án. Frontend cũng là nơi lộ ra các lỗi offset/Unicode.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p>API GĐ8/18: <code>/api/v1/qa<\/code> (offset UTF-16, trace, timings), <code>/health/ready<\/code>, <code>/api/v1/matrix<\/code>.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>Docker (GĐ10, chưa làm) sẽ đóng gói backend + <code>frontend/dist<\/code>.<\/p>", "b": "<h4>Offset qua ranh giới ngôn ngữ<\/h4>\n<p>Python: <code>len(\"😀\") == 1<\/code>. JavaScript: <code>\"😀\".length == 2<\/code>. Backend trả cả hai loại offset; frontend dùng UTF-16 và <strong>từ chối<\/strong> offset cắt giữa cặp surrogate.<\/p>\n<h4>Race condition trong UI bất đồng bộ<\/h4>\n<p>Hai yêu cầu bay song song, kết quả về theo thứ tự bất kỳ. Giải pháp hai lớp: hủy yêu cầu cũ (<code>AbortController<\/code>, tiết kiệm mạng) + số thứ tự (đúng đắn kể cả khi hủy không kịp).<\/p>\n<h4>Máy trạng thái thay cho nhiều cờ boolean<\/h4>\n<p><code>{phase: \"loading\"}<\/code> thay vì <code>isLoading<\/code>, <code>hasError<\/code>, <code>data<\/code> riêng rẽ: không thể rơi vào trạng thái vô lý như \"đang tải và đã có lỗi\".<\/p>\n<h4>Phạm vi trong hướng dẫn này<\/h4>\n<p>Hướng dẫn trình bày ba file cốt lõi về dữ liệu/logic. Các component giao diện (<code>AskPage.tsx<\/code>, <code>BenchmarkPage.tsx<\/code>, <code>CandidatesPanel.tsx<\/code>, <code>HighlightedPassage.tsx<\/code>) và test vitest nằm trong <code>frontend/src/<\/code>; đọc chúng sau khi đã nắm ba file này.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>AskPage ─ useAsk.ask({question, retriever, rerank}) ─ api.ask ─ POST /api/v1/qa\n   ◀── QAResult {answer, passage_text, answer_start_utf16, answer_end_utf16, trace, timings, versions}\nHighlightedPassage ─ splitByUtf16(passage_text, start16, end16) ─▶ before | &lt;mark&gt;answer&lt;/mark&gt; | after\nCandidatesPanel ─ trace.candidates[*].start (code point) ─ utf16FromCodePoint ─▶ tô từng ứng viên\nuseReady ─ api.getReady ─ /health/ready (200 | 503 có thân) ─▶ hiện trạng thái nạp, retriever khả dụng<\/code><\/pre>", "e": "<h4>Chạy<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>cd frontend\nnpm install\nnpm run dev          # http://localhost:5173 (backend chạy ở cổng 8000, CORS đã cho phép)\nnpm test             # = vitest run: highlight.test.ts, client.test.ts, App.test.tsx\nnpm run build        # = tsc --noEmit &amp;&amp; vite build, ra frontend/dist<\/code><\/pre>\n<h4>Test tô sáng<\/h4>\n<pre class=\"blk\" data-lang=\"ts\"><code>import { splitByUtf16, utf16FromCodePoint } from \"./highlight\";\nconst t = \"😀 Bonn ist schön\";\nconst s = utf16FromCodePoint(t, 2);                 // code point 2 → UTF-16 3\nconsole.assert(splitByUtf16(t, s, s + 4).answer === \"Bonn\");\nconsole.assert(splitByUtf16(t, 1, 3).highlighted === false);   // cắt giữa emoji → không tô<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Dùng <code>answer_start<\/code> (code point) với <code>String.slice<\/code> → lệch sau emoji.<\/li><li>Coi 503 của <code>/health/ready<\/code> là lỗi → UI báo \"mất kết nối\" trong lúc server chỉ đang nạp.<\/li><\/ul>", "f": "<ul><li>Offset UTF-16 cho JavaScript; từ chối offset cắt surrogate.<\/li><li>Một kiểu lỗi duy nhất ở client, khớp dạng lỗi backend.<\/li><li>Chống race: hủy + số thứ tự.<\/li><li>503 có thân của readiness là <strong>dữ liệu<\/strong>.<\/li><\/ul>", "g": "<ol><li>Viết <code>splitByUtf16<\/code> và <code>utf16FromCodePoint<\/code> từ đầu, chạy <code>npx vitest run src/lib/highlight.test.ts<\/code> với bản của bạn.<\/li><li>Tạo một ca kiểm thử end-to-end: đoạn văn có emoji trước đáp án, gọi API thật, xá
