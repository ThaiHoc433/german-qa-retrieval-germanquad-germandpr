r Konrad Adenauer?<\/code> chạy trước để khởi tạo CUDA và bộ nhớ đệm.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Lần chạy đầu luôn chậm; đo thời gian trên lần đầu sẽ phóng đại độ trễ.<\/p><\/dd><\/dl>"}, {"a": 12, "b": 23, "title": "In kết quả", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>In đáp án, trạng thái, vị trí; ngữ cảnh ±80 ký tự với đáp án trong <code>[[…]]<\/code>; điểm, thời gian từng bước, phiên bản, và (với <code>--trace<\/code>) danh sách ứng viên.<\/p><\/dd><\/dl>"}, {"a": 26, "b": 32, "title": "CLI", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>python scripts/GD5/05_ask.py \"câu hỏi\" [--trace] [--checkpoint …]<\/code>.<\/p><\/dd><\/dl>"}], "intro": "<p>CLI hỏi một câu: in đáp án, đoạn chứa nó, điểm và thời gian từng bước.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Có hàm <code>answer(question)<\/code> end-to-end: truy hồi 20 đoạn → (xếp lại) → reader đọc 5 đoạn → một đáp án kèm bằng chứng, điểm, thời gian, phiên bản.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Từng thành phần tốt riêng lẻ chưa đủ: phải đo <strong>cả hệ thống<\/strong> vì lỗi có thể nằm ở chỗ nối (đoạn đúng có trong top-5 nhưng reader chọn đoạn khác).<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>BM25Retriever<\/code> (GĐ3), <code>Reader<\/code> (GĐ4c), <code>QAResponse<\/code> (GĐ0), các file <code>configs/*.yaml<\/code>.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ6/13/14 thay retriever hoặc thêm reranker mà không sửa pipeline; GĐ7 đánh giá end-to-end; GĐ8 bọc pipeline thành API.<\/p>", "b": "<h4>Retrieve-then-read<\/h4>\n<p>Kiến trúc kinh điển của QA miền mở: một retriever rẻ thu hẹp từ 26.864 đoạn xuống vài đoạn, rồi reader đắt đọc kỹ. Chất lượng cuối bị chặn bởi cả hai:<\/p>\n<div class=\"math\">P(đúng) ≈ P(đoạn đúng ∈ top-5) × P(reader chọn đúng đoạn và đúng span | đoạn đúng ∈ top-5)<\/div>\n<h4>Phân rã lỗi (số liệu dev-unseen 234 câu, <code>results/15_dev_matrix.json<\/code>)<\/h4>\n<table><thead><tr><th>Hệ thống<\/th><th>Hit@5<\/th><th>đoạn đúng trong top-5<\/th><th>reader chọn đúng đoạn<\/th><th>EM<\/th><\/tr><\/thead><tbody><tr><td>B0 (BM25)<\/td><td>0,645<\/td><td>151 câu<\/td><td>68,2%<\/td><td>0,171<\/td><\/tr><tr><td>H0 (hybrid)<\/td><td>0,889<\/td><td>208 câu<\/td><td>65,4%<\/td><td>0,209<\/td><\/tr><tr><td>H1 (hybrid + rerank)<\/td><td>0,962<\/td><td>225 câu<\/td><td>60,4%<\/td><td>0,205<\/td><\/tr><\/tbody><\/table>\n<p>Truy hồi tốt hơn đưa nhiều đoạn đúng vào top-5 hơn, nhưng <strong>khâu reader chọn đoạn<\/strong> trở thành nút thắt. Đây là kết luận chính của project, và là lý do cải tiến tiếp theo nên nhắm vào reader.<\/p>\n<h4>Thiết kế phần mềm<\/h4>\n<ul><li><strong>Giao diện tối thiểu<\/strong>: <code>retrieve(question, top_k)<\/code> và <code>read(question, passages)<\/code>. Mọi retriever tuân theo, nên pipeline đóng băng được.<\/li><li><strong>Trạng thái thay vì ngoại lệ<\/strong> cho tình huống nghiệp vụ (<code>status<\/code>), ngoại lệ cho lỗi lập trình (vi phạm bất biến offset).<\/li><li><strong>Trace<\/strong> để giải thích và gỡ lỗi.<\/li><\/ul>\n<h4>Thay thế<\/h4>\n<p>Đọc cả 20 đoạn (Hit@20 cao hơn, chậm gấp 4); reader sinh (generative, như mô hình ngôn ngữ lớn) thay cho trích xuất: linh hoạt hơn nhưng có thể bịa và không có offset bằng chứng.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>question\n  │ strip, kiểm rỗng ─────────────────────────────▶ status=empty_question\n  ▼\nretriever.retrieve(question, 20) ─▶ hits[≤20] ─(rỗng)▶ status=no_passages\n  │ (reranker?) rerank(question, hits+text) ─▶ ranked (rank_before, rank, rerank_score)\n  ▼\nused = ranked[:5]; _cut_question(≤64 token)\nreader.read(q, [{passage_id, text}×5]) ─▶ spans[5] {text, start, end, score}\n  │ lọc start ≥ 0 ─(rỗng)▶ status=no_valid_span\n  ▼\nmax theo score ─▶ (span, hit) ─ kiểm passage_text[start:end] == text\n  ▼\nQAResponse {answer, passage_id, passage_text, answer_start/end, retrieval_score, reader_score,\n            retrieval_time, reader_time, rerank_time, total_time, model_version, corpus_version,\n            experiment_id, status, trace}<\/code><\/pre>", "e": "<h4>Hỏi một câu<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/GD5/05_ask.py \"Wer war der erste Bundeskanzler der Bundesrepublik?\" --trace<\/code><\/pre>\n<p>Kỳ vọng: in <code>Đáp án<\/code>, <code>Đoạn p_…[start:end]<\/code>, ngữ cảnh có <code>[[…]]<\/code>, thời gian từng bước, <code>experiment_id<\/code>.<\/p>\n<h4>Chạy trên dev và phân tích<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/GD5/05_run_dev.py          # ghi reports/pipeline_dev_predictions.jsonl\npython scripts/GD5/05b_dev_analysis.py\npytest tests/GD5 -q<\/code><\/pre>\n<h4>Test với thành phần giả (không cần GPU)<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>class FakeRetriever:\n    def retrieve(self, q, k): return [{\"passage_id\": \"p1\", \"score\": 1.0, \"rank\": 1}]\nclass FakeReader:\n    tokenizer = staticmethod(lambda q, **kw: {\"offset_mapping\": [(0, len(q))]})\n    def read(self, q, ps): return [{\"passage_id\": \"p1\", \"text\": \"Bonn\", \"start\": 0, \"end\": 4, \"score\": 2.0}]\npipe = QAPipeline(FakeRetriever(), FakeReader(), {\"p1\": \"Bonn war Hauptstadt\"}, \"m\", \"c\", \"e\")\nr = pipe.answer(\"Hauptstadt?\")\nassert r.answer == \"Bonn\" and r.status == \"ok\"\nassert pipe.answer(\"   \").status == \"empty_question\"<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li><code>ValueError: đáp án không khớp văn bản gốc tại offset<\/code>: reader dùng <code>retrieval_text<\/code> thay cho <code>original_text<\/code>.<\/li><li>Độ trễ lần đầu rất lớn: quên chạy khởi động.<\/li><li>Hai cấu hình khác nhau cùng <code>experiment_id<\/code>: tham số không nằm trong cấu hình được băm.<\/li><\/ul>", "f": "<ul><li>Retrieve-then-read: trần = Hit@5; nút thắt thực tế của project = reader chọn đoạn.<\/li><li>Pipeline phụ thuộc <strong>giao diện<\/strong>, không phụ thuộc lớp cụ thể.<\/li><li><code>status<\/code> cho tình huống nghiệp vụ; ngoại lệ cho vi phạm bất biến.<\/li><li>Đưa mọi tham số ảnh hưởng kết quả vào cấu hình được băm.<\/li><li>Đo thời gian sau khi khởi động.<\/li><\/ul>", "g": "<ol><li>Viết lại <code>QAPipeline.answer<\/code> từ sơ đồ luồng (không nhìn code), chạy test với thành phần giả ở tab \"Chạy &amp; kiểm thử\".<\/li><li>Thêm chế độ chọn đáp án <code>reader_score + λ · retrieval_score<\/code>. Dò λ trên <strong>dev<\/strong> (không dùng test), báo cáo EM với bootstrap CI so với λ = 0. Ghi rõ đây là thí nghiệm khám phá.<\/li><li>Với 20 câu dev mà đoạn đúng nằm trong top-5 nhưng đáp án sai, phân loại: reader chọn sai đoạn hay chọn đúng đoạn nhưng sai span?<\/li><\/ol>"}, {"id": "s10", "num": 10, "title": "Dense retriever: DPR + FAISS", "gd": "GĐ6/12 · truy hồi ngữ nghĩa", "files": [{"path": "src/germanqa/retrieval/dense.py", "name": "dense.py", "kind": "orig", "lang": "python", "source": "\"\"\"Dense retriever (GĐ6): cặp DPR (context encoder + question encoder) và FAISS flat inner-product.\n\nOffline: mọi đoạn -> context encoder -> vector 768 chiều -> lưu cùng danh sách passage_id và manifest.\nOnline : câu hỏi -> question encoder -> vector -> tích vô hướng với mọi vector đoạn -> top-k.\nGiao diện retrieve(question, top_k) -> [{passage_id, score, rank}] giống BM25Retriever, nên QAPipeline không đổi.\"\"\"\nimport time\nfrom pathlib import Path\n\nimport numpy as np\n\nfrom germanqa.data.io_utils import file_sha1, read_json, write_json\nfrom germanqa.tokenization import load_bert_tokenizer\n\nPASSAGE_INPUTS = (\"title_text\", \"text\")     # title_text: cặp (title, text); text: chỉ văn bản đoạn (đã chứa tiêu đề ở dòng đầu)\n\n\ndef snapshot_dir(repo_id):\n    \"\"\"Thư mục snapshot trong cache HuggingFace (tên thư mục chính là mã revision). Ưu tiên cache, không cần mạng.\"\"\"\n    from huggingface_hub import hf_hub_download\n    try:\n        return Path(hf_hub_download(repo_id, \"config.json\", local_files_only=True)).parent\n    except Exception:\n        return Path(hf_hub_download(repo_id, \"config.json\")).parent\n\n\nclass DPREncoder:\n    \"\"\"Hai encoder DPR. Mỗi encoder chỉ nạp khi dùng lần đầu: mã hóa corpus không cần question encoder và ngược lại,\n    nên GPU 4 GB không phải giữ cả hai.\"\"\"\n\n    def __init__(self, ctx_repo, question_repo, device=None, fp16=True):\n        import torch\n        self.torch = torch\n        self.ctx_repo, self.question_repo = ctx_repo, question_repo\n        self.device = torch.device(device or (\"cuda\" if torch.cuda.is_available() else \"cpu\"))\n        self.fp16 = bool(fp16) and self.device.type == \"cuda\"\n        self._ctx = self._question = None\n\n    # ---- nạp mô hình ----\n    def _load(self, cls_name, repo):\n        import transformers\n        d = snapshot_dir(repo)\n        model = getattr(transformers, cls_name).from_pretrained(d).to(self.device).eval()\n        return model, load_bert_tokenizer(d / \"vocab.txt\"), d.name\n\n    @property\n    def ctx(self):\n        if self._ctx is None:\n            self._ctx = self._load(\"DPRContextEncoder\", self.ctx_repo)\n        return self._ctx\n\n    @property\n    def question(self):\n        if self._question is None:\n            self._question = self._load(\"DPRQuestionEncoder\", self.question_repo)\n        return self._question\n\n    def revisions(self):\n        return {\"ctx_encoder\": {\"repo\": self.ctx_repo, \"revision\": snapshot_dir(self.ctx_repo).name},\n                \"question_encoder\": {\"repo\": self.question_repo, \"revision\": snapshot_dir(self.question_repo).name}}\n\n    # ---- mã hóa ----\n    def _embed(self, bundle, first, second, max_length, batch_size, log_every=0):\n        \"\"\"Vector [CLS] (pooler_output của DPR) của từng đầu vào. Trả về (mảng float32 [n, d], mảng độ dài token).\"\"\"\n        torch = self.torch\n        model, tok, _ = bundle\n        n = len(first)\n        if n == 0:\n            return np.zeros((0, model.config.hidden_size), dtype=np.float32), np.zeros(0, dtype=np.int64)\n        # độ dài THẬT (chưa cắt) để biết bao nhiêu đầu vào bị cắt, và để xếp lô theo độ dài cho ít padding\n        full = tok(first, second, add_special_tokens=True, truncation=False, verbose=False)[\"input_ids\"] \\\n            if second is not None else tok(first, add_special_tokens=True, truncation=False, verbose=False)[\"input_ids\"]\n        lengths = np.array([len(x) for x in full], dtype=np.int64)\n        order = np.argsort(-lengths, kind=\"stable\")\n        out = np.zeros((n, model.config.hidden_size), dtype=np.float32)\n        t0 = time.perf_counter()\n        for b, s in enumerate(range(0, n, batch_size)):\n            idx = order[s:s + batch_size]\n            args = ([first[i] for i in idx], [second[i] for i in idx]) if second is not None else ([first[i] for i in idx],)\n            enc = tok(*args, add_special_tokens=True, truncation=\"longest_first\", max_length=max_length,\n                      padding=True, return_tensors=\"pt\").to(self.device)\n            # Encoder này được huấn luyện với segment id TOÀN 0, kể cả khi đầu vào là cặp (title, text). Để token_type_ids\n            # 0/1 của tokenizer làm đoạn đúng chỉ đứng hạng 1 ở ~46% thay vì ~76% (đo trên 300 cặp GermanDPR train).\n            enc[\"token_type_ids\"] = torch.zeros_like(enc[\"token_type_ids\"])\n            with torch.no_grad(), torch.autocast(device_type=self.device.type, dtype=torch.float16, enabled=self.fp16):\n                vec = model(**enc).pooler_output\n            out[idx] = vec.float().cpu().numpy()\n            if log_every and (b + 1) % log_every == 0:\n                print(f\"  {min(s + batch_size, n)}/{n}  {time.perf_counter() - t0:.0f}s\", flush=True)\n        return out, lengths\n\n    def encode_questions(self, questions, max_length=64, batch_size=64):\n        vecs, _ = self._embed(self.question, list(questions), None, max_length, batch_size)\n        return vecs\n\n    def encode_passages(self, titles, texts, passage_input=\"title_text\", max_length=256, batch_size=32, log_every=100):\n        \"\"\"Trả về (vector [n, d], thống kê độ dài/cắt cụt).\"\"\"\n        if passage_input not in PASSAGE_INPUTS:\n            raise ValueError(f\"passage_input phải là một trong {PASSAGE_INPUTS}\")\n        first, second = ([t or \"\" for t in titles], list(texts)) if passage_input == \"title_text\" else (list(texts), None)\n        vecs, lengths = self._embed(self.ctx, first, second, max_length, batch_size, log_every)\n        stats = {\"max_length\": max_length, \"n_truncated\": int((lengths > max_length).sum()),\n                 \"frac_truncated\": float((lengths > max_length).mean()) if len(lengths) else 0.0,\n                 \"tokens_mean\": float(lengths.mean()) if len(lengths) else 0.0,\n                 \"tokens_p95\": float(np.percentile(lengths, 95)) if len(lengths) else 0.0,\n                 \"tokens_max\": int(lengths.max()) if len(lengths) else 0}\n        return vecs, stats\n\n\ndef check_embeddings(vectors, passage_ids):\n    \"\"\"Kiểm tra bắt buộc trước khi dùng/lưu: số vector = số ID, ID không trùng, không NaN/Inf.\"\"\"\n    if vectors.ndim != 2 or vectors.shape[0] != len(passage_ids):\n        raise ValueError(f\"số vector {vectors.shape} không khớp số passage_id {len(passage_ids)}\")\n    if len(set(passage_ids)) != len(passage_ids):\n        raise ValueError(\"passage_id bị trùng\")\n    if not np.isfinite(vectors).all():\n        raise ValueError(\"vector có NaN hoặc Inf\")\n\n\ndef save_artifacts(out_dir, vectors, passage_ids, manifest):\n    \"\"\"embeddings.npy + passage_ids.json + manifest.json. Thứ tự dòng của embeddings = thứ tự passage_ids.\"\"\"\n    import faiss\n    check_embeddings(vectors, passage_ids)\n    out_dir = Path(out_dir)\n    out_dir.mkdir(parents=True, exist_ok=True)\n    np.save(out_dir / \"embeddings.npy\", vectors)\n    write_json(out_dir / \"passage_ids.json\", list(passage_ids))\n    faiss.write_index(build_index(vectors), str(out_dir / \"index.faiss\"))\n    write_json(out_dir / \"manifest.json\", manifest)\n\n\ndef load_artifacts(out_dir, corpus_path=None):\n    \"\"\"Đọc lại artifacts và kiểm tra. Có corpus_path thì so SHA-1 corpus: index cũ so với corpus mới sẽ bị từ chối.\"\"\"\n    out_dir = Path(out_dir)\n    manifest = read_json(out_dir / \"manifest.json\")\n    ids = read_json(out_dir / \"passage_ids.json\")\n    vectors = np.load(out_dir / \"embeddings.npy\")\n    check_embeddings(vectors, ids)\n    if corpus_path is not None and file_sha1(corpus_path) != manifest[\"corpus_sha1\"]:\n        raise ValueError(\"corpus đã đổi so với lúc mã hóa: phải mã hóa lại (index cũ không còn đúng)\")\n    return vectors, ids, manifest\n\n\ndef check_manifest_compat(manifest, cfg, revisions=None):\n    \"\"\"GĐ12.1: chỉ mục được mã hóa bằng encoder/định dạng nào thì lúc chạy phải dùng đúng cái đó.\n    So manifest với cấu hình hiện tại: repo + revision của HAI encoder, passage_field, passage_input, similarity.\n    Lệch thì báo lỗi, không dùng chỉ mục một cách im lặng. (passage_max_length là thông tin lúc mã hóa, không so.)\"\"\"\n    problems = []\n    for key in (\"passage_field\", \"passage_input\", \"similarity\"):\n        if manifest.get(key) != cfg.get(key):\n            problems.append(f\"{key}: chỉ mục {manifest.get(key)!r} ≠ cấu hình {cfg.get(key)!r}\")\n    for role in (\"ctx_encoder\", \"question_encoder\"):\n        m = manifest.get(role) or {}\n        if m.get(\"repo\") != cfg.get(role):\n            problems.append(f\"{role}: chỉ mục {m.get('repo')!r} ≠ cấu hình {cfg.get(role)!r}\")\n        if revisions is not None and (revisions.get(role) or {}).get(\"revision\") != m.get(\"revision\"):\n            problems.append(f\"{role} revision: chỉ mục {m.get('revision')!r} ≠ đang dùng {(revisions.get(role) or {}).get('revision')!r}\")\n    if problems:\n        raise ValueError(\"chỉ mục dense không tương thích với cấu hình hiện tại, phải mã hóa lại: \" + \"; \".join(problems))\n\n\ndef build_index(vectors):\n    \"\"\"Flat inner-product: tìm CHÍNH XÁC, không xấp xỉ. DPR được huấn luyện bằng tích vô hướng nên không chuẩn hóa.\"\"\"\n    import faiss\n    index = faiss.IndexFlatIP(vectors.shape[1])\n    index.add(np.ascontiguousarray(vectors, dtype=np.float32))\n    return index\n\n\ndef exact_topk(query_vectors, vectors, k):\n    \"\"\"Mốc đối chiếu: tính thẳng Q @ P.T bằng numpy, không qua FAISS. Trả về (điểm, chỉ số) giảm dần.\"\"\"\n    scores = np.asarray(query_vectors, dtype=np.float32) @ np.asarray(vectors, dtype=np.float32).T\n    k = min(k, scores.shape[1])\n    idx = np.argsort(-scores, axis=1, kind=\"stable\")[:, :k]\n    return np.take_along_axis(scores, idx, axis=1), idx\n\n\nclass DenseRetriever:\n    def __init__(self, encoder, vectors, passage_ids, question_max_length=64):\n        check_embeddings(vectors, passage_ids)\n        self.encoder, self.passage_ids = encoder, list(passage_ids)\n        self.index = build_index(vectors)\n        self.question_max_length = question_max_length\n        self.last_timing = {\"encode\": 0.0, \"search\": 0.0}      # giây, của lần retrieve/retrieve_many gần nhất\n\n    @classmethod\n    def from_dir(cls, artifact_dir, encoder, corpus_path=None, question_max_length=64, expected_cfg=None):\n        vectors, ids, manifest = load_artifacts(artifact_dir, corpus_path)\n        if expected_cfg is not None:          # GĐ12.1: so manifest với cấu hình hiện tại\n            check_manifest_compat(manifest, expected_cfg, encoder.revisions() if hasattr(encoder, \"revisions\") else None)\n        return cls(encoder, vectors, ids, question_max_length)\n\n    def _rows(self, scores, idx):\n        return [{\"passage_id\": self.passage_ids[i], \"score\": float(s), \"rank\": r}\n                for r, (s, i) in enumerate(zip(scores, idx), start=1) if i >= 0]\n\n    def retrieve_many(self, questions, top_k=20, batch_size=64):\n        t = time.perf_counter()\n        q = self.encoder.encode_questions(questions, self.question_max_length, batch_size)\n        t_enc = time.perf_counter() - t\n        t = time.perf_counter()\n        scores, idx = self.index.search(q, min(top_k, self.index.ntotal))\n        self.last_timing = {\"encode\": t_enc, \"search\": time.perf_counter() - t}\n        return [self._rows(s, i) for s, i in zip(scores, idx)]\n\n    def retrieve(self, question, top_k=20):\n        return self.retrieve_many([question], top_k)[0]", "notes": [{"a": 1, "b": 5, "title": "Tóm tắt kiến trúc", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Offline: mọi đoạn → context encoder → vector → lưu kèm danh sách <code>passage_id<\/code> và manifest. Online: câu hỏi → question encoder → tích vô hướng với mọi vector đoạn → top-k.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Giao diện <code>retrieve(question, top_k)<\/code> giống <code>BM25Retriever<\/code>, nên <code>QAPipeline<\/code> không đổi.<\/p><\/dd><\/dl>"}, {"a": 14, "b": 14, "title": "Hai định dạng đầu vào cho đoạn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>title_text<\/code>: cặp (tiêu đề, văn bản); <code>text<\/code>: chỉ văn bản (dòng đầu đã là tiêu đề).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Cấu hình chốt: <code>passage_input: text<\/code> (chọn bằng phép thử 6.1, script <code>06f_format_probe.py<\/code>).<\/p><\/dd><\/dl>"}, {"a": 17, "b": 23, "title": "snapshot_dir: thư mục mô hình trong cache", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ưu tiên cache cục bộ (<code>local_files_only=True<\/code>); không có mới tải. Tên thư mục snapshot <strong>chính là mã revision<\/strong>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Chạy không cần mạng, và biết chính xác revision đang dùng (đưa vào manifest).<\/p><\/dd><\/dl>"}, {"a": 26, "b": 36, "title": "DPREncoder: nạp lười hai encoder", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Lưu tên repo, thiết bị, cờ fp16 (chỉ bật trên CUDA). Hai encoder đặt <code>None<\/code>: chỉ nạp khi dùng lần đầu.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Mã hóa corpus chỉ cần context encoder; trả lời câu hỏi chỉ cần question encoder. GPU 4 GB không phải giữ cả hai.<\/p><\/dd><\/dl>"}, {"a": 39, "b": 43, "title": "_load", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>DPRContextEncoder<\/code> / <code>DPRQuestionEncoder<\/code> từ <code>transformers<\/code>, chuyển sang thiết bị, <code>eval()<\/code>; tokenizer từ <code>vocab.txt<\/code> (GĐ4a); kèm tên revision.<\/p><\/dd><\/dl>"}, {"a": 45, "b": 55, "title": "Thuộc tính ctx / question", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Lần truy cập đầu thì nạp, lần sau trả bản đã nạp.<\/p><\/dd><\/dl>"}, {"a": 57, "b": 59, "title": "revisions", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Repo + revision của cả hai encoder.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>So với manifest trong <code>check_manifest_compat<\/code>.<\/p><\/dd><\/dl>"}, {"a": 62, "b": 73, "title": "_embed (1): độ dài thật và thứ tự lô", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tokenize <strong>không cắt<\/strong> để biết độ dài thật (đếm bao nhiêu đầu vào bị cắt), rồi sắp theo độ dài giảm dần để mỗi lô ít đệm.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>lengths<\/code>: <code>int64[n]<\/code>.<\/p><\/dd><\/dl>"}, {"a": 74, "b": 89, "title": "_embed (2): mã hóa theo lô", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi lô: tokenize có cắt <code>max_length<\/code>, **đặt <code>token_type_ids<\/code> toàn 0**, chạy mô hình dưới <code>no_grad<\/code> + autocast fp16, lấy <code>pooler_output<\/code> (vector <code>[CLS]<\/code> 768 chiều), ghi vào đúng hàng <code>out[idx]<\/code> (thứ tự gốc), lưu <code>float32<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Chú thích trong code ghi kết quả đo của project: encoder này được huấn luyện với segment id toàn 0; để 0/1 như tokenizer mặc định thì đoạn đúng chỉ đứng hạng 1 ở ~46% thay vì ~76% (300 cặp GermanDPR train).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: <code>float32[n, 768]<\/code>, <code>int64[n]<\/code>.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Ghi <code>out[idx] = …<\/code> chứ không nối dần: thứ tự lô đã bị sắp lại theo độ dài, nối dần sẽ lệch vector với <code>passage_id<\/code>.<\/p><\/dd><\/dl>"}, {"a": 91, "b": 93, "title": "encode_questions", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mã hóa câu hỏi với <code>max_length = 64<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>float32[q, 768]<\/code>.<\/p><\/dd><\/dl>"}, {"a": 95, "b": 106, "title": "encode_passages", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chọn định dạng đầu vào, mã hóa bằng context encoder, trả kèm thống kê cắt cụt: số/tỷ lệ đoạn dài hơn <code>max_length<\/code>, trung bình, p95, max số token.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Biết bao nhiêu đoạn bị cắt là cần để chọn <code>passage_max_length<\/code> (chốt 384 trên dev ở GĐ12.3).<\/p><\/dd><\/dl>"}, {"a": 109, "b": 116, "title": "check_embeddings: kiểm bắt buộc", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ma trận 2 chiều, số hàng = số ID, ID không trùng, không NaN/Inf.<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Lệch một hàng là <strong>mọi<\/strong> kết quả sau đó trỏ sai đoạn mà không lỗi nào báo.<\/p><\/dd><\/dl>"}, {"a": 119, "b": 128, "title": "save_artifacts", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>embeddings.npy<\/code> + <code>passage_ids.json<\/code> (cùng thứ tự) + <code>index.faiss<\/code> + <code>manifest.json<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thư mục thật: <code>artifacts/dense/text384/<\/code> (và <code>text256<\/code>, <code>text512<\/code> để so sánh).<\/p><\/dd><\/dl>"}, {"a": 131, "b": 140, "title": "load_artifacts", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc lại và kiểm; có <code>corpus_path<\/code> thì so SHA-1 corpus với manifest: corpus đã đổi → từ chối.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Chỉ mục cũ trên corpus mới là lỗi im lặng kinh điển (passage_id không còn khớp).<\/p><\/dd><\/dl>"}, {"a": 143, "b": 158, "title": "check_manifest_compat (GĐ12.1)", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>So manifest với cấu hình hiện tại: <code>passage_field<\/code>, <code>passage_input<\/code>, <code>similarity<\/code>, repo và revision của hai encoder. Lệch → báo lỗi, gom mọi khác biệt vào một thông báo.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Vector mã hóa bằng encoder A không so được với câu hỏi mã hóa bằng encoder B.<\/p><\/dd><\/dl>"}, {"a": 161, "b": 166, "title": "build_index: FAISS flat inner product", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>IndexFlatIP<\/code> = tìm <strong>chính xác<\/strong> bằng tích vô hướng, không xấp xỉ, không chuẩn hóa vector.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>DPR được huấn luyện bằng tích vô hướng. Với ~27 nghìn vector, tìm vét cạn chỉ vài mili-giây, không cần chỉ mục xấp xỉ (HNSW, IVF).<\/p><\/dd><dt>Cách khác<\/dt><dd><p>Chuẩn hóa vector rồi dùng cosine: <strong>đổi<\/strong> thứ hạng so với lúc huấn luyện, thường làm kết quả kém đi với DPR.<\/p><\/dd><\/dl>"}, {"a": 169, "b": 174, "title": "exact_topk: mốc đối chiếu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tính thẳng <code>Q @ P.T<\/code> bằng numpy rồi sắp.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Dùng trong test để chứng minh FAISS trả đúng kết quả (<code>scripts/GD6/06c_check_index.py<\/code>).<\/p><\/dd><\/dl>"}, {"a": 177, "b": 183, "title": "DenseRetriever", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Giữ encoder, danh sách ID, chỉ mục FAISS, độ dài câu hỏi tối đa, thời gian lần gần nhất.<\/p><\/dd><\/dl>"}, {"a": 185, "b": 190, "title": "from_dir", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nạp artifacts, (tùy chọn) kiểm tương thích manifest, dựng retriever.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>pipeline.build_retriever(\"dense\")<\/code> gọi hàm này với <code>expected_cfg = configs/dense.yaml<\/code>.<\/p><\/dd><\/dl>"}, {"a": 192, "b": 194, "title": "_rows", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đổi (điểm, chỉ số) của FAISS thành <code>[{passage_id, score, rank}]<\/code>; bỏ chỉ số <code>-1<\/code> (FAISS trả -1 khi thiếu kết quả).<\/p><\/dd><\/dl>"}, {"a": 196, "b": 203, "title": "retrieve_many", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mã hóa một lô câu hỏi, <code>index.search<\/code>, đo riêng thời gian mã hóa và tìm.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>q: float32[Q, 768]<\/code> → <code>scores, idx: [Q, k]<\/code>.<\/p><\/dd><\/dl>"}, {"a": 205, "b": 206, "title": "retrieve", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Một câu hỏi = lô cỡ 1.<\/p><\/dd><\/dl>"}], "intro": "<p>Dense Passage Retrieval: hai encoder BERT biến câu hỏi và đoạn văn thành vector 768 chiều; đoạn liên quan là đoạn có <strong>tích vô hướng<\/strong> lớn nhất. Mã hóa corpus một lần (offline), lúc hỏi chỉ mã hóa câu hỏi.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Có retriever ngữ nghĩa dùng DPR tiếng Đức (<code>deepset/gbert-base-germandpr-*<\/code>) + FAISS, cùng giao diện với BM25, với kiểm tra tương thích chỉ mục và đo trên tập <strong>chưa thấy<\/strong>.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>BM25 chỉ khớp từ. Câu hỏi diễn đạt khác đoạn văn (đồng nghĩa, từ ghép, biến cách) thì BM25 trượt. Dense khớp <strong>nghĩa<\/strong>.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>corpus.jsonl<\/code> (<code>original_text<\/code>), <code>DATASETS<\/code> (GĐ0), tokenizer WordPiece (GĐ4a), giao diện retriever (GĐ3), metric (GĐ3).<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ13 hợp nhất dense với BM25; GĐ5 có thể dùng <code>retriever=\"dense\"<\/code> (B1); GĐ12 chọn <code>passage_max_length<\/code> và tập đánh giá chưa thấy.<\/p>", "b": "<h4>Dual encoder (Karpukhin et al., 2020)<\/h4>\n<div class=\"math\">sim(q, p) = E_Q(q)ᵀ · E_P(p),   E_Q, E_P: BERT → vector [CLS] ∈ ℝ^768<\/div>\n<p>Hai encoder <strong>tách rời<\/strong> nên mọi đoạn mã hóa trước được; lúc hỏi chỉ cần một lần chạy BERT cho câu hỏi và một phép nhân ma trận <code>1×768 · 768×26.864<\/code>.<\/p>\n<p>Huấn luyện (đã làm sẵn bởi deepset trên GermanDPR train): với mỗi câu hỏi, softmax trên đoạn dương, hard negative và các đoạn của câu khác trong lô (in-batch negatives):<\/p>\n<div class=\"math\">L = −log  exp(sim(q,p⁺)) / Σ_{p ∈ {p⁺, p⁻…}} exp(sim(q,p))<\/div>\n<h4>Những lựa chọn đã được đo trong project<\/h4>\n<table><thead><tr><th>Lựa chọn<\/th><th>Kết quả<\/th><th>Nguồn<\/th><\/tr><\/thead><tbody><tr><td><code>original_text<\/code> thay vì chữ thường<\/td><td>top-1 phép thử 0,84 thay vì 0,52<\/td><td><code>configs/dense.yaml<\/code><\/td><\/tr><tr><td><code>token_type_ids<\/code> toàn 0<\/td><td>đoạn đúng hạng 1 ~76% thay vì ~46%<\/td><td>chú thích trong <code>dense.py<\/code><\/td><\/tr><tr><td><code>passage_max_length<\/code> 384 vs 256<\/td><td>Hit@5 +0,0148 [+0,0058; +0,0242]<\/td><td><code>configs/dense.yaml<\/code><\/td><\/tr><tr><td>tích vô hướng, không chuẩn hóa<\/td><td>đúng cách huấn luyện của DPR<\/td><td><code>build_index<\/code><\/td><\/tr><\/tbody><\/table>\n<h4>Rò rỉ do encoder đã thấy dữ liệu<\/h4>\n<p>Encoder DPR được deepset huấn luyện trên GermanDPR <strong>train<\/strong>, mà GermanDPR được dựng từ cùng nguồn với GermanQuAD. Nhiều câu hỏi/đoạn của train và dev của project có thể encoder đã thấy. Vì vậy project dựng <strong>tập chọn chưa thấy<\/strong> (<code>select_set.py<\/code>, GĐ11): 1.989 câu train + 234 câu dev mà câu hỏi không có trong GermanDPR train.<\/p>\n<p>Bằng chứng thật: trên dev-unseen, dense <strong>thắng<\/strong> BM25 (Hit@5 0,765 so với 0,645); trên <strong>test<\/strong> (n = 2.203, không có đoạn đúng nào từng là đoạn dương của DPR train), dense <strong>thua<\/strong> BM25 (Hit@5 0,709 so với 0,793; chênh −8,4 điểm, CI [−10,8; −5,9]). Đây là ví dụ thực tế cho việc đánh giá trên dữ liệu mô hình đã thấy làm phóng đại kết quả.<\/p>\n<h4>Thay thế<\/h4>\n<p>Encoder đa ngôn ngữ (multilingual-e5, BGE-M3); fine-tune DPR trên GermanQuAD train (kế hoạch GĐ16); chỉ mục xấp xỉ (HNSW) khi corpus lên hàng triệu đoạn.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>OFFLINE (một lần, scripts/GD6/06b_encode_corpus.py)\ncorpus.original_text ─ tokenize(max 384, token_type=0) ─ DPRContextEncoder ─ pooler_output\n   ─▶ embeddings float32[26864, 768] + passage_ids.json + index.faiss + manifest.json\n\nONLINE (mỗi câu hỏi)\nquestion ─ tokenize(max 64) ─ DPRQuestionEncoder ─▶ q float32[1, 768]\n   ─ IndexFlatIP.search(q, k) ─▶ scores[1,k], idx[1,k] ─ _rows ─▶ [{passage_id, score, rank}]\n\nKHI NẠP: load_artifacts (SHA-1 corpus) → check_embeddings → check_manifest_compat (encoder, revision, định dạng)<\/code><\/pre>", "e": "<h4>Chạy<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/GD6/06a_leakage_check.py      # đo trùng lặp câu hỏi với GermanDPR train\npython scripts/GD6/06b_encode_corpus.py      # mã hóa corpus (GPU, vài phút)\npython scripts/GD6/06c_check_index.py        # FAISS khớp exact_topk\npython scripts/GD6/06d_eval_retrieval.py     # Hit/MRR trên dev\npytest tests/GD6 tests/GD12 -q<\/code><\/pre>\n<h4>Kiểm tra shape và tính đúng<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>import numpy as np\nfrom germanqa.retrieval.dense import load_artifacts, build_index, exact_topk\nV, ids, man = load_artifacts(\"artifacts/dense/text384\", \"data/processed/corpus.jsonl\")\nprint(V.shape, V.dtype, len(ids))                 # (26864, 768) float32 26864\nq = V[:3]                                         # dùng chính vector đoạn làm truy vấn thử\ns1, i1 = build_index(V).search(q, 5); s2, i2 = exact_topk(q, V, 5)\nassert (i1 == i2).all()<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Chỉ mục cũ, corpus mới → <code>ValueError: corpus đã đổi…<\/code>: chạy lại mã hóa.<\/li><li>Vector đoạn được mã hóa bằng chữ thường hoặc segment 0/1 → Hit tụt mạnh mà không có lỗi.<\/li><li>Đánh giá dense trên câu hỏi encoder đã thấy → kết quả đẹp giả.<\/li><\/ul>", "f": "<ul><li>Dual encoder: mã hóa đoạn offline, câu hỏi online, điểm = tích vô hướng.<\/li><li>Đầu vào lúc dùng phải <strong>giống lúc huấn luyện<\/strong> (chữ hoa, segment 0, tích vô hướng).<\/li><li>Manifest + SHA-1 corpus + revision encoder = chỉ mục không bị dùng nhầm.<\/li><li>Kiểm tra rò rỉ: mô hình có sẵn có thể đã thấy dữ liệu đánh giá của bạn.<\/li><li>Trên test của project, dense thua BM25; dense hữu ích nhất khi <strong>kết hợp<\/strong> (GĐ13).<\/li><\/ul>", "g": "<ol><li>Tự viết <code>_embed<\/code> đơn giản (không sắp theo độ dài) và chứng minh vector giống bản gốc (sai số fp16 ≤ 1e-2) trên 100 đoạn.<\/li><li>Đo lại hiệu ứng <code>token_type_ids<\/code>: mã hóa 300 cặp với segment 0/1 so với toàn 0, tính tỷ lệ đoạn đúng đứng hạng 1.<\/li><li>Với 50 câu dev-unseen mà dense đúng còn BM25 trượt, phân loại vì sao BM25 trượt. Ngược lại với 50 câu BM25 đúng còn dense trượt.<\/li><\/ol>"}, {"id": "s11", "num": 11, "title": "Hybrid retrieval với Reciprocal Rank Fusion", "gd": "GĐ13 · hợp nhất", "files": [{"path": "src/germanqa/retrieval/rrf.py", "name": "rrf.py", "kind": "orig", "lang": "python", "source": "\"\"\"Reciprocal Rank Fusion (GĐ13.1): hợp nhất danh sách theo HẠNG, không cộng điểm thô.\n\n    RRF(d) = tổng trên các danh sách r của  w_r / (c + rank_r(d)),   rank bắt đầu từ 1, vắng khỏi danh sách -> 0.\n\nc là hằng số làm trơn, KHÔNG phải top-k. w_r là trọng số của nhánh r (mặc định 1: RRF thường).\"\"\"\n\n\ndef rrf(ranked_lists, c=60, top_k=None, weights=None):\n    \"\"\"ranked_lists: {tên_nhánh: [passage_id theo thứ tự giảm dần]} (hạng = vị trí + 1).\n    weights: {tên_nhánh: w >= 0}; nhánh không có trong weights mang trọng số 1. None = RRF thường.\n    Trả về [{'passage_id', 'score', 'rank', 'sources': {tên: hạng}}] giảm dần theo điểm RRF.\n    Đồng điểm: hạng tốt nhất ở bất kỳ nhánh nào (nhỏ hơn đứng trước), rồi passage_id; kết quả tất định.\n    Một passage_id lặp trong cùng một danh sách chỉ tính lần đầu (hạng tốt nhất).\"\"\"\n    if c < 0:\n        raise ValueError(\"c phải >= 0\")\n    weights = dict(weights or {})\n    unknown = set(weights) - set(ranked_lists)\n    if unknown:\n        raise ValueError(f\"trọng số cho nhánh không tồn tại: {sorted(unknown)}\")\n    if any(w < 0 for w in weights.values()):\n        raise ValueError(\"trọng số phải >= 0\")\n    score, sources = {}, {}\n    for name, ids in ranked_lists.items():          # thứ tự nhánh cố định -> tổng float tất định\n        w = float(weights.get(name, 1.0))\n        seen = set()\n        for pos, pid in enumerate(ids, start=1):\n            if pid in seen:\n                continue\n            seen.add(pid)\n            score[pid] = score.get(pid, 0.0) + w / (c + pos)\n            sources.setdefault(pid, {})[name] = pos\n    order = sorted(score, key=lambda p: (-score[p], min(sources[p].values()), p))\n    if top_k is not None:\n        order = order[:max(top_k, 0)]\n    return [{\"passage_id\": p, \"score\": score[p], \"rank\": r, \"sources\": sources[p]} for r, p in enumerate(order, start=1)]", "notes": [{"a": 1, "b": 5, "title": "Công thức", "html": "<div class=\"math\">RRF(d) = Σ_r  w_r / (c + rank_r(d))      rank từ 1; d vắng khỏi danh sách r → đóng góp 0<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>c<\/code> là hằng số làm trơn (không phải top-k); <code>w_r<\/code> là trọng số nhánh (1 = RRF thường).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Chỉ dùng <strong>thứ hạng<\/strong> nên không cần chuẩn hóa điểm giữa BM25 (0…40) và dense (tích vô hướng ~60…90).<\/p><\/dd><\/dl>"}, {"a": 8, "b": 13, "title": "Hợp đồng của hàm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Vào: <code>{tên_nhánh: [passage_id theo thứ tự]}<\/code>. Ra: <code>[{passage_id, score, rank, sources: {tên: hạng}}]<\/code> giảm dần. Đồng điểm: hạng tốt nhất ở nhánh nào nhỏ hơn đứng trước, rồi theo <code>passage_id<\/code>.<\/p><\/dd><\/dl>"}, {"a": 14, "b": 21, "title": "Kiểm tra tham số", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>c ≥ 0<\/code>; trọng số chỉ được đặt cho nhánh có thật; trọng số ≥ 0.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Gõ nhầm tên nhánh (<code>\"Dense\"<\/code>) sẽ âm thầm bị bỏ qua nếu không kiểm.<\/p><\/dd><\/dl>"}, {"a": 22, "b": 31, "title": "Cộng dồn điểm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Duyệt từng nhánh theo thứ tự cố định (tổng số thực tất định), mỗi đoạn chỉ tính <strong>lần đầu<\/strong> trong một nhánh, cộng <code>w/(c+pos)<\/code> và ghi hạng của nhánh vào <code>sources<\/code>.<\/p><\/dd><\/dl>"}, {"a": 32, "b": 35, "title": "Sắp xếp tất định và cắt top_k", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Khóa sắp: <code>(-điểm, hạng tốt nhất, passage_id)<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ví dụ (c=1): <code>bm25=[a,b,d]<\/code>, <code>dense=[c,x,a]<\/code> → <code>a: 1/2+1/4<\/code>, <code>c: 1/2<\/code>, <code>b, x: 1/3<\/code>, <code>d: 1/4<\/code> → thứ tự <code>a, c, b, x, d<\/code> (trích <code>tests/GD13/test_rrf.py<\/code>).<\/p><\/dd><\/dl>"}], "intro": "<p>RRF hợp nhất các danh sách xếp hạng theo <strong>hạng<\/strong>, không cộng điểm thô (điểm BM25 và điểm dense có thang đo hoàn toàn khác nhau).<\/p>"}, {"path": "src/germanqa/retrieval/hybrid.py", "name": "hybrid.py", "kind": "orig", "lang": "python", "source": "\"\"\"Hybrid retriever (GĐ13): BM25 + dense hợp nhất bằng RRF.\n\nGiao diện giống BM25Retriever và DenseRetriever: retrieve(question, top_k) -> [{passage_id, score, rank}], nên\nQAPipeline không đổi. Mỗi dòng có thêm:\n  sources      {'bm25': hạng, 'dense': hạng}  (nhánh vắng thì KHÔNG có khóa)\n  bm25_score   điểm BM25 gốc, None nếu đoạn không nằm trong top bm25_top_k của BM25\n  dense_score  tích vô hướng dense gốc, None nếu đoạn không nằm trong top dense_top_k của dense\n`score` là điểm RRF: KHÔNG so được với bm25_score hay dense_score và KHÔNG phải xác suất.\"\"\"\nimport time\n\nfrom germanqa.retrieval.rrf import rrf\n\nBRANCHES = (\"bm25\", \"dense\")\n\n\nclass HybridRetriever:\n    def __init__(self, bm25, dense, bm25_top_k=50, dense_top_k=50, fusion_top_k=20, rrf_c=60, w_dense=1.0):\n        if min(bm25_top_k, dense_top_k, fusion_top_k) < 1:\n            raise ValueError(\"bm25_top_k, dense_top_k, fusion_top_k phải >= 1\")\n        if rrf_c < 0 or w_dense < 0:\n            raise ValueError(\"rrf_c và w_dense phải >= 0\")\n        self.bm25, self.dense = bm25, dense                 # đối tượng ĐÃ dựng sẵn: không nạp encoder lần nữa\n        self.bm25_top_k, self.dense_top_k, self.fusion_top_k = bm25_top_k, dense_top_k, fusion_top_k\n        self.rrf_c, self.w_dense = rrf_c, w_dense\n        self.last_timing = {\"bm25\": 0.0, \"dense\": 0.0, \"fusion\": 0.0}\n\n    @classmethod\n    def from_config(cls, bm25, dense, cfg):\n        keys = (\"bm25_top_k\", \"dense_top_k\", \"fusion_top_k\", \"rrf_c\", \"w_dense\")\n        return cls(bm25, dense, **{k: cfg[k] for k in keys if k in cfg})\n\n    def config(self):\n        return {\"bm25_top_k\": self.bm25_top_k, \"dense_top_k\": self.dense_top_k, \"fusion_top_k\": self.fusion_top_k,\n                \"rrf_c\": self.rrf_c, \"w_dense\": self.w_dense}\n\n    def retrieve(self, question, top_k=None):\n        k = self.fusion_top_k if top_k is None else top_k\n        t = time.perf_counter()\n        b_rows = self.bm25.retrieve(question, self.bm25_top_k)\n        t_b = time.perf_counter() - t\n        t = time.perf_counter()\n        d_rows = self.dense.retrieve(question, self.dense_top_k)\n        t_d = time.perf_counter() - t\n        t = time.perf_counter()\n        fused = rrf({\"bm25\": [r[\"passage_id\"] for r in b_rows], \"dense\": [r[\"passage_id\"] for r in d_rows]},\n                    c=self.rrf_c, top_k=k, weights={\"dense\": self.w_dense})\n        b_score = {r[\"passage_id\"]: r[\"score\"] for r in b_rows}\n        d_score = {r[\"passage_id\"]: r[\"score\"] for r in d_rows}\n        out = [{\"passage_id\": f[\"passage_id\"], \"score\": f[\"score\"], \"rank\": f[\"rank\"], \"sources\": f[\"sources\"],\n                \"bm25_score\": b_score.get(f[\"passage_id\"]), \"dense_score\": d_score.get(f[\"passage_id\"])} for f in fused]\n        self.last_timing = {\"bm25\": t_b, \"dense\": t_d, \"fusion\": time.perf_counter() - t}\n        return out", "notes": [{"a": 1, "b": 8, "title": "Hợp đồng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi dòng có thêm <code>sources<\/code> (hạng ở từng nhánh), <code>bm25_score<\/code>, <code>dense_score<\/code> (None nếu đoạn không có trong top của nhánh đó). <code>score<\/code> là điểm RRF, <strong>không<\/strong> so được với điểm nhánh và <strong>không<\/strong> phải xác suất.<\/p><\/dd><\/dl>"}, {"a": 16, "b": 25, "title": "Khởi tạo", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nhận hai retriever <strong>đã dựng sẵn<\/strong> (không nạp encoder lần nữa) và các tham số: độ sâu mỗi nhánh, số kết quả sau hợp nhất, <code>rrf_c<\/code>, <code>w_dense<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Cấu hình chốt: <code>bm25_top_k = 100<\/code>, <code>dense_top_k = 100<\/code>, <code>fusion_top_k = 20<\/code>, <code>rrf_c = 10<\/code>, <code>w_dense = 1.0<\/code>.<\/p><\/dd><\/dl>"}, {"a": 27, "b": 30, "title": "from_config", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dựng từ khối <code>hybrid<\/code> của YAML, chỉ lấy các khóa đã biết.<\/p><\/dd><\/dl>"}, {"a": 32, "b": 34, "title": "config", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Trả lại cấu hình (để ghi vào kết quả và băm).<\/p><\/dd><\/dl>"}, {"a": 36, "b": 43, "title": "retrieve (1): chạy hai nhánh", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>BM25 top-100 và dense top-100, đo thời gian riêng.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Độ sâu 100 &gt; 20: đoạn đứng hạng 60 ở một nhánh nhưng hạng 3 ở nhánh kia vẫn được RRF đưa lên.<\/p><\/dd><\/dl>"}, {"a": 45, "b": 52, "title": "retrieve (2): hợp nhất và bổ sung điểm gốc", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Gọi <code>rrf<\/code> với hai danh sách ID, trọng số dense; tra điểm gốc của từng nhánh; ghi thời gian.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: <code>[{passage_id, score, rank, sources, bm25_score, dense_score}]<\/code> (20 dòng).<\/p><\/dd><\/dl>"}], "intro": "<p>Bọc BM25 + dense + RRF thành một retriever có cùng giao diện; mỗi kết quả kèm hạng và điểm gốc của từng nhánh để giải thích.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Kết hợp BM25 và dense bằng RRF thành hệ thống <strong>H0<\/strong>; chọn tham số theo quy tắc đăng ký trước.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>BM25 và dense mạnh ở những câu khác nhau. Hợp nhất lấy được phần tốt của cả hai mà không cần huấn luyện thêm.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>BM25Retriever<\/code> (GĐ3), <code>DenseRetriever<\/code> (GĐ6), metric + bootstrap (GĐ3), tập chọn chưa thấy (GĐ11).<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ14 xếp lại đúng 20 đoạn của H0; GĐ15 so B0/B1/H0/H1; API mặc định dùng hybrid (GĐ18).<\/p>", "b": "<h4>Vì sao hợp nhất theo hạng?<\/h4>\n<p>Điểm BM25 không giới hạn và phụ thuộc độ dài câu hỏi; điểm dense là tích vô hướng. Cộng thẳng thì nhánh có thang lớn hơn áp đảo. Chuẩn hóa min-max thì nhạy với ngoại lệ. RRF (Cormack, Clarke, Büttcher, 2009) chỉ dùng hạng, gần như không có tham số, và thường rất khó vượt qua.<\/p>\n<h4>Ý nghĩa của <code>c<\/code><\/h4>\n<p>Với <code>c<\/code> nhỏ, chênh lệch giữa hạng 1 và hạng 2 lớn (1/11 so với 1/12 khi c = 10); với <code>c<\/code> lớn (60, giá trị trong bài báo gốc), mọi hạng đầu gần như ngang nhau và <strong>sự đồng thuận<\/strong> giữa các nhánh quyết định. Project chọn <code>c = 10<\/code> trên 1.989 câu train-select theo quy tắc ghi trước (<code>results/13_prereg.json<\/code>, <code>results/rrf_sweep.json<\/code>).<\/p>\n<h4>Bổ sung giữa hai nhánh (dev-unseen 234 câu, Hit@5, <code>results/15_dev_matrix.json<\/code>)<\/h4>\n<table><thead><tr><th><\/th><th>số câu<\/th><\/tr><\/thead><tbody><tr><td>cả BM25 và dense đúng<\/td><td>122<\/td><\/tr><tr><td>chỉ dense đúng<\/td><td>57<\/td><\/tr><tr><td>chỉ BM25 đúng<\/td><td>29<\/td><\/tr><tr><td>cả hai trượt<\/td><td>26<\/td><\/tr><\/tbody><\/table>\n<p>Trần của hợp (union) = 208 câu, và H0 đạt <strong>đúng 208<\/strong>: RRF nâng 8 câu mà cả hai nhánh đều trượt top-5 riêng lẻ, và hạ 8 câu.<\/p>\n<h4>Kết quả trên test (n = 2.203, mở một lần, <code>results/final_test_matrix.json<\/code>)<\/h4>\n<table><thead><tr><th><\/th><th>Hit@5<\/th><th>EM (đáp án đầu)<\/th><th>EM (mọi đáp án)<\/th><\/tr><\/thead><tbody><tr><td>B0 BM25<\/td><td>0,793<\/td><td>0,222<\/td><td>0,330<\/td><\/tr><tr><td>B1 dense<\/td><td>0,709<\/td><td>0,220<\/td><td>0,316<\/td><\/tr><tr><td><strong>H0 hybrid<\/strong><\/td><td><strong>0,919<\/strong><\/td><td><strong>0,261<\/strong><\/td><td><strong>0,383<\/strong><\/td><\/tr><\/tbody><\/table>\n<h4>Thay thế<\/h4>\n<p>Cộng điểm có chuẩn hóa (CombSUM/CombMNZ); học trọng số kết hợp (learning to rank); RRF có trọng số (<code>w_dense<\/code>, project đã thử 1/1,5/2 như nhóm khám phá và giữ 1).<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>question ─┬─ BM25.retrieve(100)  ─▶ b_rows [{pid, score, rank}]\n          └─ Dense.retrieve(100) ─▶ d_rows\nrrf({\"bm25\": [pid…], \"dense\": [pid…]}, c=10, top_k=20, weights={\"dense\": 1.0})\n   score[pid] = Σ w/(c+rank) ; sources[pid] = {bm25: hạng?, dense: hạng?}\n   sort (-score, min hạng, pid) ─▶ 20 dòng\n+ bm25_score, dense_score (None nếu vắng)\n─▶ [{passage_id, score(RRF), rank, sources, bm25_score, dense_score}]<\/code><\/pre>", "e": "<h4>Test sẵn có<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>pytest tests/GD13 -q<\/code><\/pre>\n<h4>Tính tay<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.retrieval.rrf import rrf\nout = rrf({\"bm25\": [\"a\", \"b\", \"d\"], \"dense\": [\"c\", \"x\", \"a\"]}, c=1)\nprint([(r[\"passage_id\"], round(r[\"score\"], 4), r[\"sources\"]) for r in out])\n# a 0.75 {bm25:1, dense:3} ; c 0.5 ; b 0.3333 ; x 0.3333 ; d 0.25\nassert rrf({\"bm25\": [\"a\"]}, top_k=0) == []<\/code><\/pre>\n<h4>Chạy hybrid end-to-end<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/GD5/05_ask.py \"Wann wurde die Berliner Mauer gebaut?\"     # mặc định bm25\npython -c \"from germanqa.pipeline import build_pipeline; p=build_pipeline(retriever='hybrid'); print(p.answer('Wann wurde die Berliner Mauer gebaut?', trace=True).trace['retrieved'][:3])\"<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Nhầm <code>c<\/code> với top-k.<\/li><li>Hợp nhất <strong>điểm<\/strong> thay vì hạng → một nhánh lấn át.<\/li><li>Không đưa <code>rrf_c<\/code> vào cấu hình được băm → hai cấu hình chung mã thí nghiệm (đã xử lý trong <code>build_pipeline<\/code>).<\/li><\/ul>", "f": "<ul><li>RRF = Σ w/(c + hạng): không cần chuẩn hóa điểm.<\/li><li>Độ sâu mỗi nhánh (100) lớn hơn số kết quả (20).<\/li><li>Hợp nhất <strong>tất định<\/strong> (thứ tự nhánh cố định, phá hòa rõ ràng).<\/li><li>Chọn tham số trên tập chưa thấy theo quy tắc ghi trước; test chỉ để báo cáo.<\/li><li>H0 là hệ thống tốt nhất về đáp án trên test của project.<\/li><\/ul>", "g": "<ol><li>Tự viết <code>rrf<\/code> và chạy toàn bộ <code>tests/GD13/test_rrf.py<\/code> với bản của bạn.<\/li><li>Vẽ đường Hit@5 theo <code>c ∈ {1, 5, 10, 30, 60, 100}<\/code> trên 1.989 câu train-select (dùng <code>results/B0_select_top100.jsonl<\/code>, <code>B1_select_top100_384.jsonl<\/code>, không cần GPU). <code>c<\/code> nào ổn định nhất?<\/li><li>Cài CombSUM với chuẩn hóa min-max và so với RRF bằng paired bootstrap trên <strong>cùng<\/strong> tập. Kết luận chỉ là khám phá, không đổi cấu hình chính.<\/li><\/ol>"}, {"id": "s12", "num": 12, "title": "Cross-encoder reranker", "gd": "GĐ14 · xếp lại", "files": [{"path": "src/germanqa/rerank/cross_encoder.py", "name": "cross_encoder.py", "kind": "orig", "lang": "python", "source": "\"\"\"Cross-encoder reranker (GĐ14): chấm lại từng cặp (câu hỏi, đoạn) rồi xếp lại danh sách ứng viên.\n\nQuy ước (ghi sẵn để không hiểu sai điểm):\n  * Điểm = LOGIT liên quan của model, KHÔNG phải xác suất và KHÔNG so được với điểm BM25/dense/RRF.\n      - model một đầu ra (num_labels = 1): điểm = logit đó.\n      - model nhiều nhãn: điểm = logit(nhãn liên quan) - logsumexp(các nhãn còn lại)  (log-odds). Hai nhãn thì\n        bằng logit[liên quan] - logit[không]. Nhãn liên quan do người gọi chỉ định (relevant_label), không đoán.\n  * Sắp xếp giảm dần theo điểm; hòa điểm thì giữ thứ tự cũ (hạng RRF nhỏ hơn đứng trước). Không trộn với điểm khác.\n  * Đoạn dài hơn max_length: overflow = 'truncate' (cắt cuối đoạn) hoặc 'windows' (chia cửa sổ chồng lấn, điểm của\n    đoạn = điểm lớn nhất trong các cửa sổ). Số cửa sổ được trả về để tính chi phí.\nReranker không thêm đoạn nào ngoài danh sách đưa vào, nên không thể cứu đoạn đúng vắng khỏi tập ứng viên.\"\"\"\nimport hashlib\nimport json\nimport time\nfrom pathlib import Path\n\nMAX_QUERY_TOKENS = 64        # khớp MAX_QUESTION_TOKENS của pipeline: câu hỏi dài hơn thì cắt, chừa chỗ cho đoạn\nCODE_VERSION = \"rerank-1\"    # đổi khi đổi cách tính điểm, để dấu vân tay (và bộ nhớ đệm điểm) không dùng nhầm\n\n\ndef combine_logits(logits, relevant_label):\n    \"\"\"logits: tensor [n, num_labels] -> điểm [n] theo quy ước ở đầu file.\"\"\"\n    import torch\n    if logits.shape[1] == 1:\n        return logits[:, 0]\n    if relevant_label is None:\n        raise ValueError(\"model có nhiều nhãn: phải chỉ định relevant_label (chỉ số nhãn 'liên quan')\")\n    if not 0 <= relevant_label < logits.shape[1]:\n        raise ValueError(\"relevant_label ngoài phạm vi nhãn\")\n    others = torch.cat([logits[:, :relevant_label], logits[:, relevant_label + 1:]], dim=1)\n    return logits[:, relevant_label] - torch.logsumexp(others, dim=1)\n\n\ndef stable_rank(rows, scores):\n    \"\"\"rows: danh sách ứng viên theo thứ tự cũ; scores: điểm tương ứng. Trả về danh sách mới sắp giảm dần theo điểm,\n    hòa điểm giữ thứ tự cũ. Mỗi phần tử có thêm rank_before, rank (hạng mới, từ 1), rerank_score.\"\"\"\n    order = sorted(range(len(rows)), key=lambda i: (-scores[i], i))\n    out = []\n    for new_rank, i in enumerate(order, 1):\n        r = dict(rows[i])\n        r.update(rank_before=i + 1, rank=new_rank, rerank_score=float(scores[i]))\n        out.append(r)\n    return out\n\n\nclass CrossEncoderReranker:\n    def __init__(self, checkpoint, max_length=512, batch_size=16, fp16=True, relevant_label=None,\n                 overflow=\"truncate\", stride=128, device=None):\n        import torch\n        from transformers import AutoModelForSequenceClassification, AutoTokenizer\n        if overflow not in (\"truncate\", \"windows\"):\n            raise ValueError(\"overflow phải là 'truncate' hoặc 'windows'\")\n        self.checkpoint = Path(checkpoint)\n        self.max_length, self.batch_size, self.overflow, self.stride = max_length, batch_size, overflow, stride\n        self.device = device or (\"cuda\" if torch.cuda.is_available() else \"cpu\")\n        self.fp16 = bool(fp16) and self.device == \"cuda\"\n        self.tokenizer = AutoTokenizer.from_pretrained(self.checkpoint, use_fast=True)\n        if not getattr(self.tokenizer, \"is_fast\", False):\n            raise ValueError(\"cần tokenizer nhanh (để ánh xạ cửa sổ về đoạn)\")\n        self.model = AutoModelForSequenceClassification.from_pretrained(self.checkpoint)\n        self.model.eval().to(self.device)\n        if self.fp16:\n            self.model.half()\n        self.num_labels = self.model.config.num_labels\n        if self.num_labels > 1 and relevant_label is None:\n            raise ValueError(f\"model có {self.num_labels} nhãn: phải chỉ định relevant_label\")\n        self.relevant_label = relevant_label\n        self.last_stats = {\"pairs\": 0, \"windows\": 0, \"seconds\": 0.0}\n\n    # ---- chuẩn bị đầu vào ----\n    def _cut_query(self, query):\n        enc = self.tokenizer(query, add_special_tokens=False, return_offsets_mapping=True)\n        offs = enc[\"offset_mapping\"]\n        return query if len(offs) <= MAX_QUERY_TOKENS else query[:offs[MAX_QUERY_TOKENS - 1][1]]\n\n    def encode_pairs(self, query, texts):\n        \"\"\"Trả về (encoding, owner): owner[j] = chỉ số đoạn mà cửa sổ j thuộc về.\"\"\"\n        q = self._cut_query(query)\n        kw = dict(truncation=\"only_second\", max_length=self.max_length, padding=False)\n        if self.overflow == \"windows\":\n            enc = self.tokenizer([q] * len(texts), texts, return_overflowing_tokens=True, stride=self.stride, **kw)\n            owner = list(enc[\"overflow_to_sample_mapping\"])\n        else:\n            enc = self.tokenizer([q] * len(texts), texts, **kw)\n            owner = list(range(len(texts)))\n        return enc, owner\n\n    def token_lengths(self, query, texts):\n        \"\"\"Độ dài (token) của cặp (câu hỏi đã cắt, đoạn) nếu KHÔNG cắt gì; dùng để kiểm cắt token (GĐ14.3).\"\"\"\n        q = self._cut_query(query)\n        enc = self.tokenizer([q] * len(texts), texts, add_special_tokens=True, truncation=False, padding=False)\n        return [len(x) for x in enc[\"input_ids\"]]\n\n    # ---- chấm điểm ----\n    def score_detail(self, query, texts):\n        \"\"\"Chấm từng đoạn. Trả về {'score': điểm theo overflow đã chọn, 'first': điểm cửa sổ ĐẦU (= điểm khi chỉ cắt cuối\n        đoạn), 'windows': số cửa sổ của từng đoạn}. Chế độ 'truncate' thì score == first, windows == 1.\"\"\"\n        import torch\n        t0 = time.perf_counter()\n        if not texts:\n            self.last_stats = {\"pairs\": 0, \"windows\": 0, \"seconds\": 0.0}\n            return {\"score\": [], \"first\": [], \"windows\": []}\n        enc, owner = self.encode_pairs(query, texts)\n        ids = enc[\"input_ids\"]\n        n_win = len(ids)\n        order = sorted(range(n_win), key=lambda j: len(ids[j]))         # gom cặp cùng độ dài: ít đệm hơn\n        win_scores = [0.0] * n_win\n        keys = (\"input_ids\", \"attention_mask\") + ((\"token_type_ids\",) if \"token_type_ids\" in enc else ())\n        with torch.inference_mode():\n            for s in range(0, n_win, self.batch_size):\n                idx = order[s:s + self.batch_size]\n                batch = self.tokenizer.pad({k: [enc[k][j] for j in idx] for k in keys}, return_tensors=\"pt\")\n                batch = {k: v.to(self.device) for k, v in batch.items()}\n                logits = self.model(**batch).logits.float()\n                for j, v in zip(idx, combine_logits(logits, self.relevant_label).cpu().tolist()):\n                    win_scores[j] = v\n        best = [float(\"-inf\")] * len(texts)\n        first = [None] * len(texts)\n        count = [0] * len(texts)\n        for j, o in enumerate(owner):                                       # các cửa sổ của một đoạn liền nhau, cửa sổ đầu trước\n            best[o] = max(best[o], win_scores[j])\n            count[o] += 1\n            if first[o] is None:\n                first[o] = win_scores[j]\n        self.last_stats = {\"pairs\": len(texts), \"windows\": n_win, \"seconds\": time.perf_counter() - t0}\n        return {\"score\": best, \"first\": first, \"windows\": count}\n\n    def score_texts(self, query, texts):\n        \"\"\"Điểm (float) của từng đoạn theo thứ tự đầu vào. Cửa sổ của cùng một đoạn lấy điểm lớn nhất.\"\"\"\n        return self.score_detail(query, texts)[\"score\"]\n\n    def rerank(self, query, candidates, top_n=None):\n        \"\"\"candidates: [{'passage_id', 'text', ...}] theo thứ tự cũ. Trả về danh sách đã xếp lại (có rank_before,\n        rank, rerank_score), cắt còn top_n nếu có. Không đổi/loại bớt ứng viên nào ngoài việc cắt top_n.\"\"\"\n        scores = self.score_texts(query, [c[\"text\"] for c in candidates])\n        ranked = stable_rank(candidates, scores)\n        return ranked if top_n is None else ranked[:top_n]\n\n    # ---- định danh ----\n    def fingerprint(self):\n        \"\"\"SHA-1 của cấu hình chấm điểm + nội dung trọng số/tokenizer; đổi bất kỳ thứ gì thì điểm đệm không dùng lại.\"\"\"\n        from germanqa.data.io_utils import file_sha1\n        files = {p.name: file_sha1(p) for p in sorted(self.checkpoint.iterdir()) if p.is_file()\n                 and (p.suffix in (\".safetensors\", \".bin\", \".model\") or p.name in (\"config.json\", \"tokenizer.json\", \"vocab.txt\",\n                                                                                   \"tokenizer_config.json\"))}\n        cfg = {\"files\": files, \"max_length\": self.max_length, \"overflow\": self.overflow,\n               \"stride\": self.stride if self.overflow == \"windows\" else None, \"fp16\": self.fp16,\n               \"relevant_label\": self.relevant_label, \"max_query_tokens\": MAX_QUERY_TOKENS, \"code\": CODE_VERSION}\n        return {\"sha1\": hashlib.sha1(json.dumps(cfg, sort_keys=True).encode()).hexdigest(), **cfg}", "notes": [{"a": 1, "b": 11, "title": "Quy ước điểm", "html": "<div class=\"math\">num_labels = 1:  score = logit\nnum_labels > 1:  score = logit[rel] − logsumexp(logit[khác])   (log-odds)<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Điểm là <strong>logit<\/strong>, không phải xác suất, không so được với điểm BM25/dense/RRF. Xếp giảm dần, hòa giữ thứ tự cũ. Đoạn dài: <code>truncate<\/code> (cắt) hoặc <code>windows<\/code> (chia cửa sổ, lấy điểm lớn nhất).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Ghi quy ước ngay đầu file để không ai diễn giải sai điểm.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Reranker <strong>không thêm<\/strong> đoạn nào: đoạn đúng không có trong 20 ứng viên thì không cứu được.<\/p><\/dd><\/dl>"}, {"a": 17, "b": 18, "title": "Hằng số", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Cắt câu hỏi ở 64 token (khớp pipeline). <code>CODE_VERSION<\/code> đổi khi đổi cách tính điểm để dấu vân tay và bộ đệm điểm không bị dùng nhầm.<\/p><\/dd><\/dl>"}, {"a": 21, "b": 31, "title": "combine_logits", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Một đầu ra → lấy thẳng. Nhiều nhãn → bắt buộc chỉ định nhãn 'liên quan' (không đoán), tính log-odds.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>[n, num_labels]<\/code> → <code>[n]<\/code>.<\/p><\/dd><\/dl>"}, {"a": 34, "b": 43, "title": "stable_rank: xếp lại ổn định", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Sắp chỉ số theo <code>(-điểm, vị trí cũ)<\/code>; mỗi phần tử thêm <code>rank_before<\/code>, <code>rank<\/code>, <code>rerank_score<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Hòa điểm giữ thứ tự RRF: kết quả tất định và không tệ hơn H0 khi reranker không phân biệt được.<\/p><\/dd><\/dl>"}, {"a": 46, "b": 68, "title": "Khởi tạo", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nạp tokenizer <strong>fast<\/strong> (bắt buộc để ánh xạ cửa sổ về đoạn), <code>AutoModelForSequenceClassification<\/code>, chuyển <code>half()<\/code> khi fp16 trên CUDA; kiểm <code>relevant_label<\/code> nếu nhiều nhãn.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Mô hình chốt: <code>BAAI/bge-reranker-v2-m3<\/code> (một đầu ra), commit ghim trong <code>configs/rerank.yaml<\/code>, bản sao cục bộ <code>models/rerank_bge_m3_976fb4ad<\/code>.<\/p><\/dd><\/dl>"}, {"a": 71, "b": 74, "title": "_cut_query", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Cắt câu hỏi theo ranh giới token thứ 64.<\/p><\/dd><\/dl>"}, {"a": 76, "b": 86, "title": "encode_pairs: tạo cặp và cửa sổ", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>truncation=\"only_second\"<\/code> (chỉ cắt đoạn). Chế độ <code>windows<\/code>: trả cửa sổ tràn với <code>stride<\/code>, <code>owner[j]<\/code> = đoạn mà cửa sổ j thuộc về (<code>overflow_to_sample_mapping<\/code>).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: encoding (chưa đệm) và <code>owner<\/code>.<\/p><\/dd><\/dl>"}, {"a": 88, "b": 92, "title": "token_lengths", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Độ dài cặp nếu không cắt; dùng để đo tỷ lệ bị cắt (GĐ14.3, <code>results/14b_truncation.json<\/code>).<\/p><\/dd><\/dl>"}, {"a": 95, "b": 105, "title": "score_detail (1): chuẩn bị", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Danh sách rỗng → trả rỗng; mã hóa cặp, đếm số cửa sổ.<\/p><\/dd><\/dl>"}, {"a": 106, "b": 116, "title": "score_detail (2): chạy mô hình theo lô", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Sắp cửa sổ theo độ dài, mỗi lô <code>tokenizer.pad<\/code> → tensor → mô hình (<code>inference_mode<\/code>) → <code>combine_logits<\/code> → ghi điểm vào đúng vị trí cửa sổ.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Logits <code>[B, num_labels]<\/code> → điểm <code>[B]<\/code>.<\/p><\/dd><\/dl>"}, {"a": 117, "b": 126, "title": "score_detail (3): gộp cửa sổ về đoạn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Điểm đoạn = <strong>max<\/strong> điểm các cửa sổ; <code>first<\/code> = điểm cửa sổ đầu (tương đương chế độ cắt); đếm số cửa sổ để tính chi phí; ghi <code>last_stats<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Max: chỉ cần một phần của đoạn chứa câu trả lời là đoạn liên quan.<\/p><\/dd><\/dl>"}, {"a": 128, "b": 130, "title": "score_texts", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chỉ lấy danh sách điểm.<\/p><\/dd><\/dl>"}, {"a": 132, "b": 137, "title": "rerank", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chấm điểm, <code>stable_rank<\/code>, cắt <code>top_n<\/code> nếu có.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>QAPipeline.answer<\/code> gọi <code>rerank<\/code> rồi lấy 5 đoạn đầu cho reader (GĐ5).<\/p><\/dd><\/dl>"}, {"a": 140, "b": 149, "title": "fingerprint", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>SHA-1 của nội dung trọng số/tokenizer + mọi tham số chấm điểm.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Điểm đã tính được lưu đệm (<code>results/14c_scores_*.jsonl<\/code>); đổi bất cứ gì thì không dùng lại điểm cũ.<\/p><\/dd><\/dl>"}], "intro": "<p>Chấm lại từng cặp (câu hỏi, đoạn) bằng một Transformer đọc <strong>cả hai cùng lúc<\/strong>, rồi xếp lại 20 ứng viên của H0. Hệ thống có reranker gọi là <strong>H1<\/strong>.<\/p>"}, {"path": "src/germanqa/rerank/factory.py", "name": "factory.py", "kind": "orig", "lang": "python", "source": "\"\"\"Dựng reranker từ khối 'rerank' của configs/rerank.yaml (GĐ14). Tách khỏi cross_encoder.py vì file đó đã bị khóa SHA-1 trong prereg.\"\"\"\nfrom pathlib import Path\n\n\ndef build_reranker(cfg):\n    \"\"\"cfg: khối 'rerank' (checkpoint tương đối so với gốc dự án).\"\"\"\n    from germanqa.config import ROOT\n    from germanqa.rerank.cross_encoder import CrossEncoderReranker\n    ck = Path(cfg[\"checkpoint\"])\n    return CrossEncoderReranker(ck if ck.is_absolute() else ROOT / ck, max_length=cfg[\"max_length\"], batch_size=cfg[\"batch_size\"],\n                                fp16=cfg[\"fp16\"], relevant_label=cfg.get(\"relevant_label\"), overflow=cfg[\"overflow\"],\n                                stride=cfg.get(\"stride\", 128))", "notes": [{"a": 5, "b": 12, "title": "build_reranker", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đường dẫn checkpoint tương đối → tính từ <code>ROOT<\/code>; truyền <code>max_length<\/code>, <code>batch_size<\/code>, <code>fp16<\/code>, <code>relevant_label<\/code>, <code>overflow<\/code>, <code>stride<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>pipeline.build_pipeline(reranker=True)<\/code> và <code>api/loader.build_reranker_from_settings<\/code> đều đi qua đây.<\/p><\/dd><\/dl>"}], "intro": "<p>Dựng reranker từ khối <code>rerank<\/code> của YAML. Tách khỏi <code>cross_encoder.py<\/code> vì file đó đã bị khóa SHA-1 trong bản đăng ký trước (<code>results/14_prereg.json<\/code>).<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Xếp lại 20 đoạn của H0 bằng cross-encoder và đo cả truy hồi lẫn đáp án cuối (H1).<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Bi-encoder (DPR) và BM25 nhanh nhưng 'nhìn' câu hỏi và đoạn riêng rẽ. Cross-encoder cho attention chạy qua lại giữa hai bên nên phân biệt chính xác hơn, nhưng đắt: chỉ dùng cho vài chục ứng viên.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p>Pool 20 đoạn của H0 (GĐ13), pipeline có móc <code>reranker<\/code> (GĐ5), tập chọn + bootstrap (GĐ3, GĐ11).<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ15 so H1 với H0; API cho bật reranker tùy chọn (GĐ18).<\/p>", "b": "<h4>Bi-encoder vs cross-encoder<\/h4>\n<table><thead><tr><th><\/th><th>Bi-encoder (DPR)<\/th><th>Cross-encoder<\/th><\/tr><\/thead><tbody><tr><td>Đầu vào<\/td><td>câu hỏi và đoạn <strong>riêng<\/strong><\/td><td><code>[CLS] câu hỏi [SEP] đoạn [SEP]<\/code> <strong>chung<\/strong><\/td><\/tr><tr><td>Mã hóa trước được<\/td><td>có (đoạn)<\/td><td>không<\/td><\/tr><tr><td>Chi phí mỗi câu hỏi<\/td><td>1 lần BERT + nhân ma trận<\/td><td>1 lần Transformer <strong>mỗi đoạn<\/strong><\/td><\/tr><tr><td>Độ chính xác xếp hạng<\/td><td>thấp hơn<\/td><td>cao hơn<\/td><\/tr><\/tbody><\/table>\n<p>Vì vậy kiến trúc chuẩn là: truy hồi rộng, rẻ → xếp lại hẹp, đắt.<\/p>\n<h4>Kết quả của project<\/h4>\n<p>Trên dev-unseen (234 câu): Hit@5 0,889 → 0,962; reranker cứu 22 câu, làm hỏng 5 câu, 4 câu không cứu được vì đoạn đúng không có trong pool. Nhưng EM 0,209 → 0,205.<\/p>\n<p>Trên test (n = 2.203): Hit@5 0,919 → <strong>0,969<\/strong>, nhưng EM (đáp án đầu) 0,261 → <strong>0,250<\/strong>; chênh −1,1 điểm, CI [−2,2; −0,1] không chứa 0. Độ trễ trung vị cao hơn nhiều (đo ở <code>results/15_stage_timing.json<\/code>, <code>final_test_matrix.json<\/code>).<\/p>\n<p><strong>Bài học<\/strong>: cải thiện một thành phần không đảm bảo cải thiện hệ thống. Khi có nhiều đoạn đúng hơn trong top-5, reader vẫn phải chọn giữa chúng bằng điểm không hiệu chỉnh (GĐ5), và tỷ lệ chọn đúng đoạn giảm (65,4% → 60,4% trên dev-unseen). Vì vậy API <strong>mặc định tắt<\/strong> reranker (<code>configs/api.yaml: reranker: null<\/code>).<\/p>\n<h4>Chia cửa sổ cho đoạn dài<\/h4>\n<p>Cắt cuối đoạn có thể bỏ mất câu trả lời. <code>windows<\/code>: chia đoạn thành các cửa sổ chồng lấn (stride 128), điểm đoạn = max điểm cửa sổ.<\/p>\n<h4>Thay thế<\/h4>\n<p>monoT5; reranker đa ngôn ngữ nhỏ hơn (project đã thử <code>mmarco-mMiniLM<\/code>, nhanh hơn); fine-tune reranker trên GermanQuAD train (để sau phần B); ColBERT (tương tác muộn, giữa bi- và cross-encoder).<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>H0.retrieve ─▶ 20 hits ─ gắn text ─▶ candidates[20]\nrerank(question, candidates):\n  _cut_query(≤64 token)\n  encode_pairs ─▶ cửa sổ W ≥ 20 (đoạn dài → nhiều cửa sổ), owner[W]\n  lô 16: pad ─ model ─ logits[B,1] ─ combine_logits ─▶ win_scores[W]\n  điểm đoạn = max theo owner ─▶ scores[20]\n  stable_rank ─▶ [{…, rank_before, rank, rerank_score}] (20)\npipeline lấy 5 đầu ─▶ Reader<\/code><\/pre>", "e": "<h4>Chạy<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>pytest tests/GD14 -q\npython -c \"from germanqa.pipeline import build_pipeline; p=build_pipeline(retriever='hybrid', reranker=True); r=p.answer('Wer erfand den Buchdruck?', trace=True); print(r.answer, r.rerank_time, r.trace['reranked'][:3])\"<\/code><\/pre>\n<h4>Kiểm tra quan trọng<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.rerank.cross_encoder import stable_rank\nrows = [{\"passage_id\": \"a\"}, {\"passage_id\": \"b\"}, {\"passage_id\": \"c\"}]\nout = stable_rank(rows, [1.0, 2.0, 1.0])\nassert [r[\"passage_id\"] for r in out] == [\"b\", \"a\", \"c\"]     # hòa: a trước c như cũ\nassert [r[\"rank_before\"] for r in out] == [2, 1, 3]<\/code><\/pre>\n<p>Bất biến cần test: tập <code>passage_id<\/code> trước và sau rerank <strong>giống hệt nhau<\/strong>.<\/p>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Dùng tokenizer chậm → không có <code>overflow_to_sample_mapping<\/code>.<\/li><li>Diễn giải logit như xác suất.<\/li><li>Hết VRAM khi giữ reader + dense + reranker trên GPU 4 GB: giảm <code>batch_size<\/code> hoặc tắt reranker.<\/li><\/ul>", "f": "<ul><li>Cross-encoder chính xác hơn nhưng phải chạy cho <strong>từng cặp<\/strong>: chỉ dùng trên pool nhỏ.<\/li><li>Reranker không thêm ứng viên; trần là Hit@20 của pool.<\/li><li>Đoạn dài → cửa sổ + max.<\/li><li>Điểm là logit, không phải xác suất.<\/li><li>Hit@5 tăng không đồng nghĩa EM tăng: đo <strong>đầu ra cuối cùng<\/strong>.<\/li><\/ul>", "g": "<ol><li>Viết lại <code>score_detail<\/code> ở chế độ <code>truncate<\/code> (đơn giản hơn) và chứng minh <code>score == first<\/code> trên 20 đoạn.<\/li><li>Với 22 câu reranker \"cứu\" trên dev-unseen, reader trả lời đúng bao nhiêu? Điều đó giải thích kết quả EM thế nào?<\/li><li>Đề xuất một thí nghiệm (chỉ trên dev) để reranker có ích cho EM, ví dụ đưa <code>rerank_score<\/code> vào cách chọn đáp án của pipeline. Ghi rõ giả thuyết, metric chính, quy tắc chấp nhận trước khi chạy.<\/li><\/ol>"}, {"id": "s13", "num": 13, "title": "Kỷ luật thí nghiệm và tái lập", "gd": "GĐ11–12 · quy trình", "files": [{"path": "src/germanqa/experiment_rules.py", "name": "experiment_rules.py", "kind": "orig", "lang": "python", "source": "\"\"\"GĐ11.1: quy tắc thí nghiệm bằng MÃ, không chỉ bằng lời.\n\n1. Sổ phơi bày test (results/test_exposure_ledger.jsonl): chỉ THÊM dòng, không sửa. Mỗi lần một script mở dữ liệu\n   hay kết quả của test là một dòng: script nào, loại truy cập, để làm gì, tệp nào, lúc nào.\n2. Rào chắn `require_test_access`: script chạy trên test phải được truyền cờ --confirm-test, nếu không thì dừng\n   TRƯỚC khi mở bất cứ thứ gì. Đi qua rào chắn thì tự ghi sổ.\n3. Mã thí nghiệm B0/B1/H0/H1 cộng băm cấu hình, và ghi tệp mốc KHÔNG ghi đè.\"\"\"\nimport hashlib\nimport json\nimport time\nfrom pathlib import Path\n\nfrom germanqa.config import RESULTS_DIR\n\nLEDGER_PATH = RESULTS_DIR / \"test_exposure_ledger.jsonl\"\nCODES = (\"B0\", \"B1\", \"H0\", \"H1\")\nKINDS = (\"metric_run\", \"error_analysis\", \"metadata_only\")\n\n\nclass TestAccessError(RuntimeError):\n    \"\"\"Gọi vào test mà không có xác nhận. (Đặt tên Test... nhưng không phải lớp test: pytest bỏ qua nhờ __test__.)\"\"\"\n    __test__ = False\n\n\ndef _now():\n    return time.strftime(\"%Y-%m-%dT%H:%M:%S%z\")\n\n\ndef read_ledger(path=None):\n    p = Path(path or LEDGER_PATH)\n    if not p.exists():\n        return []\n    with open(p, encoding=\"utf-8-sig\") as f:\n        return [json.loads(line) for line in f if line.strip()]\n\n\ndef append_ledger(entry, path=None):\n    \"\"\"Chỉ thêm dòng. Không có hàm sửa hay xóa dòng nào trong module này, và đó là chủ ý.\"\"\"\n    p = Path(path or LEDGER_PATH)\n    p.parent.mkdir(parents=True, exist_ok=True)\n    entry = {\"ts\": _now(), \"source\": \"live\", **entry}\n    if entry.get(\"kind\") not in KINDS:\n        raise ValueError(f\"kind phải thuộc {KINDS}\")\n    for k in (\"script\", \"purpose\"):\n        if not entry.get(k):\n            raise ValueError(f\"thiếu trường bắt buộc: {k}\")\n    with open(p, \"a\", encoding=\"utf-8\", newline=\"\\n\") as f:\n        f.write(json.dumps(entry, ensure_ascii=False, sort_keys=True) + \"\\n\")\n    return entry\n\n\ndef require_test_access(script, purpose, confirm, kind=\"metric_run\", files=(), codes=(), ledger_path=None):\n    \"\"\"Rào chắn. Không có `confirm` thì ném TestAccessError và KHÔNG ghi sổ (chưa phơi bày gì).\n    Có `confirm` thì ghi một dòng vào sổ rồi cho đi tiếp.\"\"\"\n    if kind == \"metadata_only\":\n        raise ValueError(\"truy cập chỉ đọc siêu dữ liệu dùng log_test_metadata, không cần cờ\")\n    if not confirm:\n        raise TestAccessError(f\"{script}: chạm test cần cờ --confirm-test. Test chỉ chạy MỘT lần sau khi đã chốt cấu hình \"\n                              f\"trên dev; mỗi lần mở đều ghi vào {LEDGER_PATH.name}.\")\n    bad = [c for c in codes if c not in CODES]\n    if bad:\n        raise ValueError(f\"mã thí nghiệm lạ {bad}; hợp lệ: {CODES}\")\n    return append_ledger({\"script\": script, \"purpose\": purpose, \"kind\": kind, \"files\": list(files),\n                          \"codes\": list(codes), \"confirmed\": True}, ledger_path)\n\n\ndef guard_or_exit(*args, **kwargs):\n    \"\"\"Dùng trong script: thiếu cờ thì thoát với thông báo, không in traceback.\"\"\"\n    try:\n        return require_test_access(*args, **kwargs)\n    except TestAccessError as exc:\n        raise SystemExit(str(exc)) from None\n\n\ndef log_test_metadata(script, purpose, files=(), ledger_path=None):\n    \"\"\"Script chỉ đọc câu hỏi/nhãn của test để kiểm tra rò rỉ, không tính chỉ số chất lượng. Vẫn ghi sổ.\"\"\"\n    return append_ledger({\"script\": script, \"purpose\": purpose, \"kind\": \"metadata_only\", \"files\": list(files),\n                          \"codes\": [], \"confirmed\": False}, ledger_path)\n\n\ndef exposure_summary(path=None):\n    rows = read_ledger(path)\n    by_kind = {}\n    for r in rows:\n        by_kind[r[\"kind\"]] = by_kind.get(r[\"kind\"], 0) + 1\n    return {\"entries\": len(rows), \"by_kind\": by_kind,\n            \"metric_runs\": [r for r in rows if r[\"kind\"] == \"metric_run\"],\n            \"reconstructed\": sum(1 for r in rows if r.get(\"source\") == \"reconstructed\")}\n\n\ndef disclosure_text(path=None):\n    \"\"\"Đoạn công khai cho báo cáo cuối, sinh thẳng từ sổ để không viết tay sai.\"\"\"\n    s = exposure_summary(path)\n    if not s[\"entries\"]:\n        return \"Dữ liệu test chưa bị mở.\"\n    runs = \"; \".join(f\"{r['ts'][:10]} {r['script']} ({r['purpose']})\" for r in s[\"metric_runs\"])\n    return (f\"Sổ phơi bày test ghi {s['entries']} lần truy cập ({', '.join(f'{k}: {v}' for k, v in s['by_kind'].items())}); \"\n            f\"{s['reconstructed']} dòng được dựng lại từ thời gian sửa tệp vì xảy ra trước khi có sổ. \"\n            f\"Các lần tính chỉ số trên test: {runs or 'chưa có'}.\")\n\n\ndef config_sha1(cfg):\n    return hashlib.sha1(json.dumps(cfg, sort_keys=True, default=str).encode(\"utf-8\")).hexdigest()\n\n\ndef baseline_id(code, cfg):\n    \"\"\"B0_3f2a91bc: mã + 8 ký tự băm của cấu hình hiệu lực. Đổi cấu hình thì đuôi đổi.\"\"\"\n    if code not in CODES:\n        raise ValueError(f\"mã phải thuộc {CODES}\")\n    return f\"{code}_{config_sha1(cfg)[:8]}\"\n\n\ndef write_once(path, obj):\n    \"\"\"Ghi tệp mốc. Đã tồn tại thì từ chối: muốn đổi mốc phải tạo mã mới, không sửa mốc cũ.\"\"\"\n    p = Path(path)\n    if p.exists():\n        raise FileExistsError(f\"{p.name} đã tồn tại: mốc không bị ghi đè. Đổi mốc = tạo mã mới và ghi lý do.\")\n    p.parent.mkdir(parents=True, exist_ok=True)\n    with open(p, \"w\", encoding=\"utf-8\", newline=\"\\n\") as f:\n        json.dump(obj, f, ensure_ascii=False, indent=2, sort_keys=True)\n    return p", "notes": [{"a": 1, "b": 7, "title": "Ba quy tắc", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>(1) Sổ phơi bày test <code>results/test_exposure_ledger.jsonl<\/code>, chỉ thêm dòng. (2) Script chạm test phải có cờ xác nhận, nếu không thì dừng <strong>trước khi<\/strong> mở gì. (3) Mã thí nghiệm + băm cấu hình; tệp mốc không ghi đè.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Quy tắc chỉ viết bằng lời rất dễ bị vi phạm vô tình. Đưa vào code thì vi phạm phải có chủ đích và để lại dấu vết.<\/p><\/dd><\/dl>"}, {"a": 15, "b": 17, "title": "Hằng số", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đường dẫn sổ; bốn mã hệ thống <code>B0<\/code> (BM25), <code>B1<\/code> (dense), <code>H0<\/code> (hybrid), <code>H1<\/code> (hybrid + rerank); ba loại truy cập.<\/p><\/dd><\/dl>"}, {"a": 20, "b": 22, "title": "TestAccessError", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ngoại lệ riêng; <code>__test__ = False<\/code> để pytest không coi lớp có tên <code>Test…<\/code> là lớp test.<\/p><\/dd><\/dl>"}, {"a": 29, "b": 34, "title": "read_ledger", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc sổ (<code>utf-8-sig<\/code> để chịu được BOM nếu sổ từng được sửa bằng công cụ Windows).<\/p><\/dd><\/dl>"}, {"a": 37, "b": 49, "title": "append_ledger: chỉ thêm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Gắn thời điểm, kiểm <code>kind<\/code>, bắt buộc có <code>script<\/code> và <code>purpose<\/code>, mở file chế độ <code>\"a\"<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Module <strong>cố ý<\/strong> không có hàm sửa/xóa dòng.<\/p><\/dd><\/dl>"}, {"a": 52, "b": 64, "title": "require_test_access: rào chắn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Không có <code>confirm<\/code> → ném lỗi và <strong>không<\/strong> ghi sổ. Có → kiểm mã hệ thống hợp lệ, ghi một dòng, cho đi tiếp.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>03_bm25_eval.py --test<\/code> gọi qua <code>guard_or_exit<\/code>; GĐ15 mở test <strong>một lần<\/strong> cho B1/H0/H1 (<code>15f_run_test.py --confirm-test<\/code>).<\/p><\/dd><\/dl>"}, {"a": 67, "b": 72, "title": "guard_or_exit", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dùng trong script: thiếu xác nhận thì thoát với thông báo gọn, không in traceback.<\/p><\/dd><\/dl>"}, {"a": 75, "b": 78, "title": "log_test_metadata", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đọc câu hỏi/nhãn test chỉ để kiểm rò rỉ (không tính chất lượng) vẫn phải ghi sổ.<\/p><\/dd><\/dl>"}, {"a": 81, "b": 88, "title": "exposure_summary", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tổng hợp sổ: số dòng, theo loại, các lần tính chỉ số, số dòng dựng lại (những lần mở test trước khi có sổ).<\/p><\/dd><\/dl>"}, {"a": 91, "b": 99, "title": "disclosure_text", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Sinh đoạn công khai cho báo cáo cuối <strong>thẳng từ sổ<\/strong>, để không viết tay sai.<\/p><\/dd><\/dl>"}, {"a": 102, "b": 103, "title": "config_sha1", "html": "<dl class=\"kv\"><\/dl>"}, {"a": 106, "b": 110, "title": "baseline_id", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ví dụ <code>B0_3f2a91bc<\/code>: đổi cấu hình là đổi đuôi.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Tệp mốc <code>baselines/B0.json<\/code>, <code>B1.json<\/code>, <code>H0.json<\/code>, <code>H1.json<\/code>.<\/p><\/dd><\/dl>"}, {"a": 113, "b": 121, "title": "write_once", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tệp đã tồn tại → từ chối. Muốn đổi mốc phải tạo mã mới và ghi lý do (ví dụ <code>baselines/B1.v2.json<\/code> cạnh <code>B1.json<\/code>).<\/p><\/dd><\/dl>"}], "intro": "<p>Quy tắc thí nghiệm <strong>bằng code<\/strong>: sổ ghi mọi lần mở test (chỉ thêm), rào chắn cần cờ xác nhận, mã B0/B1/H0/H1 + băm cấu hình, tệp mốc không ghi đè.<\/p>"}, {"path": "src/germanqa/retrieval/bm25_store.py", "name": "bm25_store.py", "kind": "orig", "lang": "python", "source": "\"\"\"GĐ11.2 (sửa D4): dấu vân tay BM25 và chỉ mục lưu ra tệp.\n\nVấn đề: BM25 dựng lại từ corpus mỗi lần khởi động (khoảng 16-24 s), và không có gì chứng minh chỉ mục đang dùng\nứng với corpus, tham số và tokenizer của lần đo B0. Sửa hai lớp:\n  1. DẤU VÂN TAY = SHA-1 của mọi thứ làm đổi kết quả BM25: nội dung corpus, k1, b, use_stopwords, NỘI DUNG danh sách\n     stopword, kết quả tách từ của bộ câu mẫu cố định, và điểm BM25 của một corpus nhỏ cố định (bắt được sửa công thức).\n  2. Chỉ mục lưu ở artifacts/bm25/ (index.npz không dùng pickle + meta.json). Nạp thì so dấu vân tay và SHA-1 của\n     tệp: lệch -> báo lỗi (strict) hoặc dựng lại và ghi đè (mặc định).\"\"\"\nimport hashlib\nimport json\nimport logging\nimport time\nfrom pathlib import Path\n\nimport numpy as np\n\nfrom germanqa.config import ROOT\nfrom germanqa.data.io_utils import file_sha1\nfrom germanqa.retrieval.bm25 import BM25, BM25Retriever\nfrom germanqa.retrieval.tokenizer import GERMAN_STOPWORDS, tokenize\n\nlog = logging.getLogger(\"germanqa.bm25_store\")\n\nFORMAT_VERSION = 1\nDEFAULT_DIR = ROOT / \"artifacts\" / \"bm25\"\n\n# Bộ câu mẫu cố định: có umlaut, ß, chữ hoa, số, dấu câu, từ dừng. Đổi chuỗi này = đổi dấu vân tay, nên đừng sửa.\nPROBE_TEXTS = (\n    \"Wer war der erste Bundeskanzler der Bundesrepublik Deutschland?\",\n    \"Größe, Straße & Fußball: 3,5 km² in Österreich!\",\n    \"Die Änderungen der Verfassung (1990) betrafen §§ 23 und 146.\",\n    \"ÜBER den Wolken muß die Freiheit wohl grenzenlos sein\",\n)\n# Corpus nhỏ cố định để đo điểm: bắt được thay đổi công thức idf/tf/độ dài trong BM25.fit\nPROBE_DOCS = (\n    (\"p1\", \"der Rhein fließt durch Köln und Bonn\"),\n    (\"p2\", \"Bonn war die Hauptstadt der Bundesrepublik\"),\n    (\"p3\", \"Köln hat einen Dom und viele Kirchen\"),\n    (\"p4\", \"die Hauptstadt von Österreich ist Wien\"),\n)\nPROBE_QUERY = \"Hauptstadt Bonn Köln Dom\"\n\n\nclass FingerprintMismatch(RuntimeError):\n    pass\n\n\ndef _sha1_json(obj):\n    return hashlib.sha1(json.dumps(obj, sort_keys=True, ensure_ascii=False).encode(\"utf-8\")).hexdigest()\n\n\ndef stopwords_sha1():\n    return _sha1_json(sorted(GERMAN_STOPWORDS))\n\n\ndef tokenization_probe_sha1(use_stopwords):\n    sw = GERMAN_STOPWORDS if use_stopwords else None\n    return _sha1_json([tokenize(t, sw) for t in PROBE_TEXTS])\n\n\ndef scoring_probe_sha1(k1, b, use_stopwords):\n    sw = GERMAN_STOPWORDS if use_stopwords else None\n    bm = BM25(k1, b).fit([d for d, _ in PROBE_DOCS], [tokenize
