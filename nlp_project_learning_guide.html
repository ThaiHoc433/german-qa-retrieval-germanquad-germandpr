dedup_key(text)\n    rec = corpus.get(key)\n    if rec is None:\n        rec = {\n            \"passage_id\": passage_id_from_key(key),\n            \"original_text\": text,\n            \"retrieval_text\": make_retrieval_text(text),\n            \"title\": title or None,\n            \"document_id\": make_document_id(title, key),\n            \"source\": [],\n        }\n        corpus[key] = rec\n    elif title and not rec[\"title\"]:          # lần đầu chưa có tiêu đề, lần này có\n        rec[\"title\"] = title\n        rec[\"document_id\"] = make_document_id(title, key)\n    rec[\"source\"].append(dict(source, title=title or None))\n\n\ndef build_corpus(raw):\n    \"\"\"raw = {\"germanquad\": DatasetDict, \"germandpr\": DatasetDict}\"\"\"\n    corpus, n_input = {}, 0\n\n    for split, ds in raw[\"germanquad\"].items():\n        for row in ds:\n            n_input += 1\n            _add(corpus, row[\"context\"], extract_title(row[\"context\"]),\n                 {\"dataset\": \"germanquad\", \"split\": split,\n                  \"source_id\": str(row[\"id\"]), \"role\": \"context\"})\n\n    for split, ds in raw[\"germandpr\"].items():\n        for i, row in enumerate(ds):\n            for role, field in ((\"positive\", \"positive_ctxs\"),\n                                (\"hard_negative\", \"hard_negative_ctxs\")):\n                c = row[field]\n                for title, text in zip(c[\"title\"], c[\"text\"]):\n                    n_input += 1\n                    _add(corpus, text, clean_title(title),\n                         {\"dataset\": \"germandpr\", \"split\": split,\n                          \"source_id\": f\"row{i}\", \"role\": role})\n\n    records = sorted(corpus.values(), key=lambda r: r[\"passage_id\"])\n    ids = [r[\"passage_id\"] for r in records]\n    assert len(set(ids)) == len(ids), \"passage_id bị trùng\"\n    stats = {\n        \"passages_before_dedup\": n_input,\n        \"passages_after_dedup\": len(records),\n        \"passages_multi_provenance\": sum(1 for r in records if len(r[\"source\"]) > 1),\n        \"passages_with_title\": sum(1 for r in records if r[\"title\"]),\n        \"documents\": len({r[\"document_id\"] for r in records}),\n    }\n    return records, stats", "notes": [{"a": 6, "b": 23, "title": "_add: thêm một đoạn, có khử trùng lặp", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tính khóa băm của đoạn. Chưa có → tạo bản ghi mới (<code>passage_id<\/code>, <code>original_text<\/code>, <code>retrieval_text<\/code>, <code>title<\/code>, <code>document_id<\/code>, <code>source=[]<\/code>). Đã có (cùng nội dung) → <strong>không tạo bản mới<\/strong>, chỉ thêm nguồn; nếu bản cũ chưa có tiêu đề mà lần này có thì bổ sung. Cuối cùng ghi xuất xứ (<code>dataset<\/code>, <code>split<\/code>, <code>source_id<\/code>, <code>role<\/code>, <code>title<\/code>).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cùng một đoạn xuất hiện nhiều lần (làm <code>context<\/code> của nhiều câu hỏi, làm hard negative của câu khác). Corpus phải có đúng một bản, nhưng <strong>không được mất<\/strong> thông tin 'đoạn này từng đóng vai gì ở đâu': thông tin đó dùng để đo rò rỉ (GĐ12, GĐ14).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: dict corpus, văn bản, tiêu đề, dict nguồn. Ra: cập nhật tại chỗ.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Trường <code>source[*].role<\/code> (<code>context<\/code>/<code>positive<\/code>/<code>hard_negative<\/code>) được <code>rerank/exposure.py<\/code> đọc (GĐ12–13).<\/p><\/dd><dt>Nếu bỏ đi<\/dt><dd><p>Không khử trùng lặp: corpus phình gấp đôi (54.908 → 26.864 đoạn), BM25 nhìn thấy trùng lặp, thống kê sai.<\/p><\/dd><\/dl>"}, {"a": 26, "b": 32, "title": "build_corpus: duyệt GermanQuAD", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi dòng QuAD cho một đoạn (<code>context<\/code>) với tiêu đề lấy bằng <code>extract_title<\/code>, vai <code>context<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>n_input<\/code> đếm tổng số đoạn đã duyệt (để báo cáo trước/sau khử trùng lặp).<\/p><\/dd><\/dl>"}, {"a": 37, "b": 46, "title": "build_corpus: duyệt GermanDPR", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi dòng DPR cho nhiều đoạn: các <code>positive_ctxs<\/code> (vai <code>positive<\/code>) và <code>hard_negative_ctxs<\/code> (vai <code>hard_negative<\/code>). <code>zip(c[\"title\"], c[\"text\"])<\/code> ghép hai list song song.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Hard negative đưa thêm nhiều đoạn 'gây nhiễu' vào corpus, làm bài toán tìm kiếm <strong>khó như thực tế<\/strong>.<\/p><\/dd><\/dl>"}, {"a": 48, "b": 50, "title": "Sắp xếp và kiểm tra ID", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Sắp bản ghi theo <code>passage_id<\/code> (thứ tự xác định) rồi <code>assert<\/code> không trùng ID.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Thứ tự cố định giúp file <code>corpus.jsonl<\/code> luôn cùng byte, SHA-1 ổn định. <code>assert<\/code> bắt va chạm băm nếu có.<\/p><\/dd><\/dl>"}, {"a": 51, "b": 58, "title": "Thống kê", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Số đoạn trước/sau khử trùng lặp, số đoạn có nhiều nguồn, số đoạn có tiêu đề, số bài viết.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Số thật của project: <strong>54.908 → 26.864 đoạn<\/strong> (6.424 đoạn có ≥ 2 nguồn), 21.591 bài viết, 26.844 đoạn có tiêu đề.<\/p><\/dd><\/dl>"}], "intro": "<p>Gom mọi đoạn văn từ cả hai dataset vào <strong>một corpus<\/strong> đã khử trùng lặp, mỗi đoạn kèm lịch sử xuất xứ.<\/p>"}, {"path": "src/germanqa/data/build_qa.py", "name": "build_qa.py", "kind": "orig", "lang": "python", "source": "from germanqa.data.text_utils import (make_dedup_key, make_question_id, normalize_text,\n                                 passage_id_from_key)\nfrom germanqa.data.validate_spans import validate\n\n\ndef _pid(text):\n    \"\"\"Đường tắt: văn bản -> khóa băm -> passage_id (để biết context ứng với đoạn nào).\"\"\"\n    return passage_id_from_key(make_dedup_key(text))\n\n\ndef _merge_answers(prev, new):\n    \"\"\"Gộp đáp án mới vào bản ghi cũ, bỏ đáp án đã có (so theo chữ).\"\"\"\n    have = {a[\"text\"] for a in prev[\"answers\"]}\n    for a in new:\n        if a[\"text\"] not in have:\n            prev[\"answers\"].append(a)\n            have.add(a[\"text\"])\n\n\ndef _add_row(pool, qrels, row, pids, stats):\n    \"\"\"Thêm một câu hỏi vào pool; xử lý trường hợp trùng question_id (R8).\"\"\"\n    qid = row[\"question_id\"]\n    if qid not in pool:                                   # chưa có: thêm mới\n        pool[qid] = row\n        qrels[qid] = set(pids)\n        return\n    prev = pool[qid]\n    if prev[\"passage_id\"] == row[\"passage_id\"]:           # trùng, cùng đoạn: gộp đáp án\n        _merge_answers(prev, row[\"answers\"])\n        stats[\"duplicate_same_passage_merged\"] += 1\n    else:                                                 # trùng, khác đoạn: chỉ ghi qrels\n        stats[\"duplicate_other_passage_to_qrels_only\"] += 1\n    qrels[qid] |= set(pids)\n\n\ndef build_qa(raw, include_dpr_qa=False):\n    \"\"\"Trả về pools, qrels, hardneg, quarantine, fixlog, stats.\n\n    pools[split]  = {question_id: dòng QA}\n    qrels[split]  = {question_id: {passage_id, ...}}\n    hardneg       = {question_id: [passage_id, ...]}   lấy từ GermanDPR\n    include_dpr_qa=False: GermanDPR không tạo dòng QA (chỉ cho hard negative)\n    \"\"\"\n    pools = {\"train\": {}, \"test\": {}}\n    qrels = {\"train\": {}, \"test\": {}}\n    hardneg = {}\n    quarantine, fixlog = [], []\n    stats = {\"duplicate_same_passage_merged\": 0,\n             \"duplicate_other_passage_to_qrels_only\": 0,\n             \"span_status\": {}, \"input\": {}, \"kept\": {}}\n\n    def count(status):\n        stats[\"span_status\"][status] = stats[\"span_status\"].get(status, 0) + 1\n\n    # ---- GermanQuAD trước (offset đáng tin hơn) ----\n    for split, ds in raw[\"germanquad\"].items():\n        stats[\"input\"][f\"germanquad/{split}\"] = len(ds)\n        for row in ds:\n            ctx = row[\"context\"]\n            question = normalize_text(row[\"question\"])\n            qid = make_question_id(question)\n            pid = _pid(ctx)\n            good, seen = [], set()\n            for t, s in zip(row[\"answers\"][\"text\"], row[\"answers\"][\"answer_start\"]):\n                status, new = validate(ctx, t, s)\n                count(status)\n                if status == \"OK\":\n                    a = (t, s)\n                elif status == \"FIXED\":\n                    fixlog.append({\"question_id\": qid, \"dataset\": \"germanquad\",\n                                   \"split\": split, \"text\": t,\n                                   \"old_start\": s, \"new_start\": new})\n                    a = (t, new)\n                else:\n                    quarantine.append({\"question_id\": qid, \"dataset\": \"germanquad\",\n                                       \"split\": split, \"scope\": \"answer\",\n                                       \"reason\": status, \"text\": t, \"start\": s})\n                    continue\n                if a not in seen:\n                    seen.add(a)\n                    good.append({\"text\": a[0], \"start\": a[1]})\n            if not good:\n                quarantine.append({\"question_id\": qid, \"dataset\": \"germanquad\",\n                                   \"split\": split, \"scope\": \"question\",\n                                   \"reason\": \"NO_VALID_ANSWER\"})\n                continue\n            _add_row(pools[split], qrels[split],\n                     {\"question_id\": qid, \"question\": question, \"passage_id\": pid,\n                      \"answers\": good, \"origin\": \"germanquad\"}, [pid], stats)\n\n    # ---- GermanDPR: hard negative; dòng QA chỉ khi include_dpr_qa ----\n    for split, ds in raw[\"germandpr\"].items():\n        stats[\"input\"][f\"germandpr/{split}\"] = len(ds)\n        for row in ds:\n            question = normalize_text(row[\"question\"])\n            qid = make_question_id(question)\n            pos = row[\"positive_ctxs\"][\"text\"]\n            if not pos:\n                quarantine.append({\"question_id\": qid, \"dataset\": \"germandpr\",\n                                   \"split\": split, \"scope\": \"question\",\n                                   \"reason\": \"NO_POSITIVE\"})\n                continue\n            pids = [_pid(t) for t in pos]\n\n            if include_dpr_qa:\n                answers, seen = [], set()\n                for t in row[\"answers\"]:\n                    status, new = validate(pos[0], t, None)\n                    count(\"DPR_\" + status)\n                    start = new if status == \"LOCATED\" else None   # R9: mơ hồ thì start=None\n                    if (t, start) not in seen:\n                        seen.add((t, start))\n                        answers.append({\"text\": t, \"start\": start})\n                _add_row(pools[split], qrels[split],\n                         {\"question_id\": qid, \"question\": question, \"passage_id\": pids[0],\n                          \"answers\": answers, \"origin\": \"germandpr\"}, pids, stats)\n\n            for t in row[\"hard_negative_ctxs\"][\"text\"]:\n                p = _pid(t)\n                if p in pids:                      # đoạn đúng thì không thể là negative\n                    continue\n                lst = hardneg.setdefault(qid, [])\n                if p not in lst:\n                    lst.append(p)\n\n    for split in pools:\n        stats[\"kept\"][split] = len(pools[split])\n    return pools, qrels, hardneg, quarantine, fixlog, stats", "notes": [{"a": 6, "b": 8, "title": "_pid: từ văn bản ra passage_id", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Đường tắt: văn bản → khóa băm → <code>passage_id<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p><code>build_qa<\/code> cần biết <code>context<\/code> của một câu hỏi ứng với đoạn nào trong corpus, mà không cần tra cứu corpus.<\/p><\/dd><\/dl>"}, {"a": 11, "b": 17, "title": "_merge_answers: gộp đáp án", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Thêm đáp án mới vào bản ghi cũ nếu chưa có (so theo chữ).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Chỉ dùng khi cùng <code>question_id<\/code> và cùng đoạn xuất hiện hai lần (27 lần trong dữ liệu thật).<\/p><\/dd><\/dl>"}, {"a": 20, "b": 33, "title": "_add_row: xử lý trùng question_id (luật R8)", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Câu hỏi mới → thêm vào pool, <code>qrels[qid] = {đoạn đúng}<\/code>. Đã có và <strong>cùng đoạn<\/strong> → gộp đáp án. Đã có nhưng <strong>khác đoạn<\/strong> → giữ bản đầu, chỉ <strong>mở rộng qrels<\/strong> để đoạn thứ hai cũng được coi là đúng.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cùng một câu hỏi hỏi trên hai đoạn khác nhau thì cả hai đều là bằng chứng hợp lệ; nếu chỉ giữ một, retrieval đúng nhưng bị chấm sai.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: pool, qrels, dòng, danh sách đoạn đúng, thống kê. Ra: cập nhật tại chỗ.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Quyết định này tạo ra khác biệt giữa <code>passage_id<\/code> (một đoạn, dùng cho reader) và <code>qrels<\/code> (nhiều đoạn, dùng cho đánh giá retrieval).<\/p><\/dd><\/dl>"}, {"a": 36, "b": 53, "title": "build_qa: khởi tạo", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tạo <code>pools<\/code>, <code>qrels<\/code> cho <code>train<\/code>/<code>test<\/code>, <code>hardneg<\/code>, <code>quarantine<\/code>, <code>fixlog<\/code>, <code>stats<\/code>. Hàm con <code>count<\/code> đếm kết quả <code>validate<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra (cuối hàm): pools, qrels, hardneg, quarantine, fixlog, stats.<\/p><\/dd><\/dl>"}, {"a": 56, "b": 89, "title": "Nhánh GermanQuAD: nhãn đáng tin", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Với mỗi câu: chuẩn hóa câu hỏi, tính <code>qid<\/code>, <code>pid<\/code>; kiểm từng đáp án bằng <code>validate<\/code>. <code>OK<\/code> giữ nguyên; <code>FIXED<\/code> ghi vào <code>fixlog<\/code> rồi dùng vị trí mới; còn lại vào <code>quarantine<\/code> (scope <code>answer<\/code>). Không còn đáp án hợp lệ nào → cách ly cả câu hỏi (<code>NO_VALID_ANSWER<\/code>).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>QuAD có offset do người gán nên đáng tin hơn; xử lý trước. Dùng <code>seen<\/code> để bỏ đáp án lặp.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Thật: 18.054 đáp án đều <code>OK<\/code>; quarantine 0, span_fixed 0.<\/p><\/dd><\/dl>"}, {"a": 91, "b": 122, "title": "Nhánh GermanDPR: hard negative (và QA nếu bật)", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Với mỗi câu DPR: không có đoạn dương → cách ly. <code>include_dpr_qa=True<\/code> mới tạo dòng QA (đáp án định vị bằng <code>validate(pos[0], t, None)<\/code>, mơ hồ thì <code>start=None<\/code> theo luật R9). Phần luôn chạy: gom <code>hard_negative_ctxs<\/code> thành danh sách <code>hardneg[qid]<\/code>, <strong>bỏ đoạn đúng<\/strong> khỏi danh sách âm.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cấu hình mặc định <code>include_dpr_qa: false<\/code>: test = GermanQuAD test, GermanDPR chỉ đóng góp đoạn văn và hard negative. Như vậy không trộn hai loại nhãn khác chất lượng.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>hardneg_train.json<\/code> dùng ở huấn luyện dense (GĐ16, chưa làm).<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p><code>if p in pids: continue<\/code> quan trọng: một đoạn vừa là dương vừa là âm sẽ làm hỏng huấn luyện tương phản.<\/p><\/dd><\/dl>"}, {"a": 126, "b": 128, "title": "Đếm số câu giữ lại", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ghi số câu sau xử lý vào <code>stats[\"kept\"]<\/code> và trả kết quả.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thật: train 11.477, test 2.203 câu (trước khi chia dev).<\/p><\/dd><\/dl>"}], "intro": "<p>Dựng các câu hỏi có nhãn (<code>pools<\/code>), tập đoạn đúng cho từng câu (<code>qrels<\/code>), và hard negative. Mọi ca nghi ngờ đi vào quarantine.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Từ hai dataset thô tạo ra: <code>corpus.jsonl<\/code> (mọi đoạn, đã khử trùng lặp), các dòng QA (<code>pools<\/code>), <code>qrels<\/code> (đoạn đúng của từng câu), <code>hardneg<\/code> (đoạn nhiễu), <code>quarantine<\/code>, <code>span_fix_log<\/code>.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Hệ thống tìm trong <strong>corpus<\/strong> chứ không chỉ trong đoạn gốc của câu hỏi. Corpus càng giống thực tế (nhiều đoạn gây nhiễu) thì kết quả đo càng trung thực. <code>qrels<\/code> là 'đáp án' của bài toán tìm kiếm, cần để tính Hit@k, MRR.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>text_utils<\/code> (ID, retrieval_text, tiêu đề), <code>validate_spans.validate<\/code>, dữ liệu thô từ GĐ1.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ2c chia train/dev theo nhóm; GĐ3 dựng BM25 trên <code>corpus.jsonl<\/code> và chấm bằng <code>qrels<\/code>; GĐ4 huấn luyện reader từ <code>qa_*.jsonl<\/code> + <code>corpus.jsonl<\/code>.<\/p>", "b": "<h4>Hai bài toán, hai loại nhãn<\/h4>\n<ul><li><strong>Đọc hiểu (reader)<\/strong>: biết đoạn đúng, tìm span đáp án. Nhãn: <code>answers[*].start/text<\/code> trên <code>passage_id<\/code>.<\/li><li><strong>Truy hồi (retrieval)<\/strong>: tìm đoạn đúng trong 26.864 đoạn. Nhãn: <code>qrels[qid]<\/code> = tập đoạn đúng. Có thể <strong>nhiều hơn một<\/strong>: vì vậy dùng <code>Hit@k<\/code> (có ít nhất một đoạn đúng trong top-k) thay vì so một ID.<\/li><\/ul>\n<h4>Khử trùng lặp theo nội dung<\/h4>\n<p>Khóa = SHA-1 của <code>original_text<\/code>. Phép gộp này <strong>mất thứ tự duyệt<\/strong> nhưng <strong>giữ xuất xứ<\/strong> (<code>source<\/code>). Đây là kỹ thuật <em>provenance tracking<\/em>: bạn biết đoạn nào từng làm đáp án, đoạn nào chỉ làm nhiễu, của split nào.<\/p>\n<h4>Hard negative là gì?<\/h4>\n<p>Một đoạn <strong>gần giống<\/strong> đoạn đúng (thường lấy từ BM25 trong quá trình xây dataset) nhưng <strong>không<\/strong> chứa đáp án. Dạy mô hình phân biệt chúng khó hơn nhiều so với negative ngẫu nhiên. Ở đây hard negative cũng làm corpus khó hơn khi đánh giá.<\/p>\n<h4>Vì sao không đưa câu hỏi DPR vào QA mặc định?<\/h4>\n<p>GermanDPR chỉ có đáp án dạng chữ, <strong>không có offset<\/strong>, và đôi khi đáp án lặp trong đoạn (mơ hồ). Đưa vào sẽ trộn nhãn kém tin cậy với nhãn tốt. Tùy chọn <code>--dpr-qa<\/code> vẫn có, nhưng mặc định tắt.<\/p>\n<h4>Phương pháp thay thế<\/h4>\n<p>Giữ nhiều bản đoạn trùng và dùng <em>near-duplicate<\/em> (MinHash) để gom: bao phủ rộng hơn nhưng tốn công và khó giải thích. Project chọn trùng lặp <strong>chính xác<\/strong> cho rõ ràng.<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>raw[\"germanquad\"] ─ _add ─┐\nraw[\"germandpr\"]  ─ _add ─┴▶ corpus (dict theo khóa băm) ─▶ sorted ─▶ records ─▶ corpus.jsonl\n\nraw[\"germanquad\"] ─ validate từng đáp án ─▶ OK/FIXED → pools[split][qid]; qrels[split][qid]={pid}\n                                           └ còn lại → quarantine\nraw[\"germandpr\"]  ─ positive_ctxs  ─▶ pids (qrels khi include_dpr_qa)\n                  └ hard_negative_ctxs ─▶ hardneg[qid] (loại các pid đúng)<\/code><\/pre>\n<h4>Hình dạng dữ liệu ra (từ file thật)<\/h4>\n<ul><li><code>corpus.jsonl<\/code>: <code>{passage_id, original_text, retrieval_text, title, document_id, source:[{dataset, split, source_id, role, title}]}<\/code>.<\/li><li><code>qa_*.jsonl<\/code>: <code>{question_id, question, passage_id, answers:[{text,start}], origin}<\/code>.<\/li><li><code>qrels_*.json<\/code>: <code>{question_id: [passage_id, …]}<\/code>.<\/li><li><code>hardneg_train.json<\/code>: <code>{question_id: [passage_id, …]}<\/code>.<\/li><\/ul>", "e": "<h4>Chạy<\/h4>\n<p>Giai đoạn này được <code>scripts/02_preprocess.py<\/code> điều phối (xem giai đoạn kế tiếp), nên chạy ở đó. Để thử riêng:<\/p>\n<pre class=\"blk\" data-lang=\"python\"><code>from datasets import load_from_disk\nfrom germanqa.config import RAW_DIR, DATASETS\nfrom germanqa.data.build_corpus import build_corpus\nfrom germanqa.data.build_qa import build_qa\n\nraw = {n: load_from_disk(str(RAW_DIR / n)) for n in DATASETS}\ncorpus, cstats = build_corpus(raw)\nprint(cstats)       # passages_before_dedup 54908 → passages_after_dedup 26864\npools, qrels, hardneg, quarantine, fixlog, stats = build_qa(raw)\nprint(stats[\"kept\"], stats[\"span_status\"], len(quarantine))   # {'train': 11477, 'test': 2203} {'OK': 18054} 0<\/code><\/pre>\n<h4>Assertion/unit test nên có<\/h4>\n<ul><li><code>len({r[\"passage_id\"] for r in corpus}) == len(corpus)<\/code>.<\/li><li>Với mọi dòng QA: <code>corpus[passage_id].original_text[start:start+len(text)] == text<\/code>.<\/li><li>Với mọi <code>qid<\/code>: <code>passage_id<\/code> của dòng QA nằm trong <code>qrels[qid]<\/code>.<\/li><li><code>hardneg[qid]<\/code> không giao với <code>qrels[qid]<\/code>.<\/li><\/ul>\n<p>Project có <code>tests/test_build_qa.py<\/code> và <code>tests/test_phase2_acceptance.py<\/code> cho các bất biến này.<\/p>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Duyệt DPR mà quên rằng <code>positive_ctxs[\"text\"]<\/code> là <strong>list<\/strong>: phải <code>zip<\/code> hai list song song.<\/li><li>Dùng <code>retrieval_text<\/code> để tính <code>passage_id<\/code>: sẽ gộp nhầm những đoạn khác nhau chỉ ở hoa/thường.<\/li><\/ul>", "f": "<ul><li>Corpus = <strong>mọi<\/strong> đoạn của cả hai dataset, khử trùng lặp theo nội dung, giữ nguyên <code>source<\/code>.<\/li><li><code>qrels<\/code> có thể chứa <strong>nhiều đoạn đúng<\/strong> cho một câu; <code>passage_id<\/code> trong dòng QA chỉ là một.<\/li><li>Hard negative bị loại nếu cũng là đoạn đúng.<\/li><li>Cách ly thay vì đoán; ghi log mọi chỉnh sửa.<\/li><li>Số thật: 54.908 → 26.864 đoạn; quarantine 0.<\/li><\/ul>", "g": "<ol><li>Từ <code>corpus.jsonl<\/code>, đếm số đoạn có <code>role<\/code> bao gồm cả <code>positive<\/code> và <code>hard_negative<\/code>. Điều đó nói gì về việc dùng hard negative để huấn luyện?<\/li><li>Viết hàm kiểm <code>check_spans(qa_rows, corpus_by_id)<\/code> xác nhận bất biến offset cho toàn bộ <code>qa_dev.jsonl<\/code>.<\/li><li>Giải thích vì sao <code>_add_row<\/code> phải <strong>mở rộng qrels<\/strong> (mà không thêm dòng QA) khi gặp cùng câu hỏi ở đoạn khác. Nếu bỏ bước này, chỉ số Hit@k thay đổi theo chiều nào và vì sao?<\/li><\/ol>"}, {"id": "s4", "num": 4, "title": "Chia train/dev/test chống rò rỉ", "gd": "GĐ2c · chia dữ liệu", "files": [{"path": "src/germanqa/data/split.py", "name": "split.py", "kind": "orig", "lang": "python", "source": "import random\n\n\nclass UnionFind:\n    \"\"\"Gom các phần tử có liên hệ với nhau vào cùng một nhóm.\"\"\"\n\n    def __init__(self):\n        self.parent = {}\n\n    def find(self, x):\n        self.parent.setdefault(x, x)\n        while self.parent[x] != x:\n            self.parent[x] = self.parent[self.parent[x]]   # nén đường đi\n            x = self.parent[x]\n        return x                                            # thụt ra NGOÀI vòng while\n\n    def union(self, a, b):\n        self.parent[self.find(a)] = self.find(b)\n\n\ndef remove_conflicts_with_test(train_rows, test_rows, test_qrels):\n    \"\"\"R3: loại khỏi train mẫu trùng câu hỏi hoặc trùng đoạn gold với test.\n    Test KHÔNG bao giờ bị loại.\"\"\"\n    test_qids = {r[\"question_id\"] for r in test_rows}\n    test_pids = set()\n    for pids in test_qrels.values():\n        test_pids |= set(pids)\n    kept, removed = [], []\n    for r in train_rows:\n        if r[\"question_id\"] in test_qids:\n            removed.append({\"question_id\": r[\"question_id\"], \"reason\": \"QUESTION_IN_TEST\"})\n        elif r[\"passage_id\"] in test_pids:\n            removed.append({\"question_id\": r[\"question_id\"], \"reason\": \"PASSAGE_IN_TEST\"})\n        else:\n            kept.append(r)\n    return kept, removed\n\n\ndef make_groups(rows, qrels, doc_of):\n    \"\"\"Câu hỏi <-> đoạn <-> bài viết: cái nào nối với nhau thì cùng nhóm.\n    Trả về {question_id: group_key}.\"\"\"\n    uf = UnionFind()\n    for r in rows:\n        q = \"q:\" + r[\"question_id\"]\n        for pid in set(qrels[r[\"question_id\"]]) | {r[\"passage_id\"]}:\n            uf.union(q, \"p:\" + pid)\n            uf.union(\"p:\" + pid, \"d:\" + doc_of[pid])\n    return {r[\"question_id\"]: uf.find(\"q:\" + r[\"question_id\"]) for r in rows}\n\n\ndef split_train_dev(rows, groups, dev_ratio, seed):\n    \"\"\"Chia theo NHÓM (không chia từng dòng), cố định bằng seed.\"\"\"\n    members = {}\n    for r in rows:\n        members.setdefault(groups[r[\"question_id\"]], []).append(r)\n    # sắp theo khóa ổn định (qid nhỏ nhất của nhóm) rồi xáo bằng seed -> tái lập được\n    keys = sorted(members, key=lambda g: min(x[\"question_id\"] for x in members[g]))\n    random.Random(seed).shuffle(keys)\n    target = round(len(rows) * dev_ratio)\n    train, dev = [], []\n    for g in keys:\n        (dev if len(dev) < target else train).extend(members[g])\n    return train, dev", "notes": [{"a": 4, "b": 15, "title": "UnionFind: gom phần tử liên quan", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Cấu trúc 'tập rời nhau' (disjoint set). <code>find(x)<\/code> tìm đại diện của nhóm chứa <code>x<\/code> và <strong>nén đường đi<\/strong> (<code>parent[x] = parent[parent[x]]<\/code>, kỹ thuật path halving) để các lần tìm sau nhanh hơn.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Cần gom: câu hỏi ↔ đoạn ↔ bài viết thành các cụm liên thông, rồi chia theo cụm.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: phần tử bất kỳ (hashable). Ra: đại diện của nhóm.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p><code>return x<\/code> phải thụt ra <strong>ngoài<\/strong> vòng <code>while<\/code> (chú thích trong code nhắc điều này); đặt trong vòng <code>while<\/code> thì hàm trả về sớm và nén sai.<\/p><\/dd><\/dl>"}, {"a": 17, "b": 18, "title": "union: nối hai nhóm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Gắn đại diện của <code>a<\/code> vào đại diện của <code>b<\/code>.<\/p><\/dd><dt>Cách khác<\/dt><dd><p>Thêm 'union by rank/size' để giữ cây thấp. Với quy mô ở đây (~10⁴ phần tử) path halving là đủ.<\/p><\/dd><\/dl>"}, {"a": 21, "b": 36, "title": "remove_conflicts_with_test: luật R3", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tập <code>test_qids<\/code> (câu hỏi test) và <code>test_pids<\/code> (mọi đoạn đúng của test). Duyệt train: trùng câu hỏi với test → loại, lý do <code>QUESTION_IN_TEST<\/code>; trùng đoạn đúng với test → loại, <code>PASSAGE_IN_TEST<\/code>; còn lại giữ. <strong>Test không bao giờ bị loại.<\/strong><\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Nếu một câu hỏi (hoặc đoạn đáp án) có mặt ở cả train và test thì mô hình có thể <em>thuộc lòng<\/em> đáp án: điểm test bị thổi phồng (data leakage).<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: train_rows, test_rows, test_qrels. Ra: (giữ lại, bị loại).<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dữ liệu thật: <strong>0<\/strong> mẫu bị loại (<code>removed_from_train<\/code> = 0/0) nghĩa là hai tập vốn đã tách rời; hàm là chốt chặn.<\/p><\/dd><\/dl>"}, {"a": 39, "b": 48, "title": "make_groups: dựng nhóm liên thông", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Với mỗi câu hỏi <code>q<\/code>: nối <code>q<\/code> với mọi đoạn đúng <code>p<\/code>, và nối <code>p<\/code> với bài viết <code>d<\/code> chứa nó. Mọi thứ nối được với nhau thuộc cùng một nhóm. Trả về <code>{question_id: khóa nhóm}<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Hai câu hỏi cùng một bài viết rất giống nhau về chủ đề. Nếu đưa một câu vào train và một câu vào dev, dev 'dễ' một cách giả tạo. Chia theo nhóm đảm bảo dev là chủ đề <strong>mới<\/strong>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>doc_of<\/code> (passage_id → document_id) được dựng từ corpus (GĐ2b). Dữ liệu thật: 376 nhóm, nhóm lớn nhất 221 câu.<\/p><\/dd><\/dl>"}, {"a": 51, "b": 63, "title": "split_train_dev: chia theo nhóm, tất định", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Gom dòng theo nhóm; sắp khóa nhóm theo <code>question_id<\/code> nhỏ nhất (ổn định), xáo bằng <code>random.Random(seed)<\/code>; đưa nhóm vào <code>dev<\/code> cho đến khi đủ <code>target = round(n × dev_ratio)<\/code>, còn lại vào <code>train<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Xáo bằng seed cố định → cùng seed cùng phép chia. Sắp xếp trước khi xáo để kết quả không phụ thuộc thứ tự dict.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thật: 10.301 train / 1.176 dev. Dev hơi vượt mục tiêu 1.148 vì cả nhóm đi cùng nhau.<\/p><\/dd><dt>Cách khác<\/dt><dd><p><code>GroupShuffleSplit<\/code> của scikit-learn làm việc tương tự; tự viết ở đây để kiểm soát hoàn toàn thứ tự và seed.<\/p><\/dd><\/dl>"}], "intro": "<p>Loại mẫu trùng test khỏi train, rồi chia train → train/dev <strong>theo nhóm<\/strong> (không chia từng dòng) bằng Union-Find.<\/p>"}, {"path": "scripts/02_preprocess.py", "name": "02_preprocess.py", "kind": "orig", "lang": "python", "source": "\n\"\"\"GĐ2: dữ liệu thô -> corpus, qa_{train,dev,test}, qrels, báo cáo chất lượng.\"\"\"\nimport argparse\nfrom pathlib import Path\n\nfrom datasets import load_from_disk\n\nfrom germanqa.config import DATASETS, DEV_RATIO, PROCESSED_DIR, RAW_DIR, SEED\nfrom germanqa.data.build_corpus import build_corpus\nfrom germanqa.data.build_qa import build_qa\nfrom germanqa.data.io_utils import file_sha1, write_json, write_jsonl\nfrom germanqa.data.split import make_groups, remove_conflicts_with_test, split_train_dev\nfrom germanqa.experiment import load_config\n\n\ndef by_qid(rows):\n    return sorted(rows, key=lambda r: r[\"question_id\"])\n\n\ndef qrels_json(qrels, rows):\n    return {r[\"question_id\"]: sorted(qrels[r[\"question_id\"]]) for r in by_qid(rows)}\n\n\ndef main(out_dir, include_dpr_qa):\n    out = Path(out_dir)\n    raw = {name: load_from_disk(str(RAW_DIR / name)) for name in DATASETS}\n\n    # 1. corpus và dữ liệu QA\n    corpus, corpus_stats = build_corpus(raw)\n    pools, qrels, hardneg, quarantine, fixlog, qa_stats = build_qa(raw, include_dpr_qa)\n    doc_of = {r[\"passage_id\"]: r[\"document_id\"] for r in corpus}\n\n    # 2. R3: loại khỏi train mẫu trùng test\n    test_rows = list(pools[\"test\"].values())\n    train_all = list(pools[\"train\"].values())\n    train_kept, removed = remove_conflicts_with_test(train_all, test_rows, qrels[\"test\"])\n\n    # 3. R5: chia train/dev theo nhóm\n    groups = make_groups(train_kept, qrels[\"train\"], doc_of)\n    train_rows, dev_rows = split_train_dev(train_kept, groups, DEV_RATIO, SEED)\n    sizes = {}\n    for g in groups.values():\n        sizes[g] = sizes.get(g, 0) + 1\n\n    # 4. ghi kết quả\n    write_jsonl(out / \"corpus.jsonl\", corpus)\n    for name, rows in ((\"train\", train_rows), (\"dev\", dev_rows), (\"test\", test_rows)):\n        write_jsonl(out / f\"qa_{name}.jsonl\", by_qid(rows))\n        source = qrels[\"test\"] if name == \"test\" else qrels[\"train\"]   # dev lấy từ train\n        write_json(out / f\"qrels_{name}.json\", qrels_json(source, rows))\n    kept_ids = {r[\"question_id\"] for r in train_rows}\n    write_json(out / \"hardneg_train.json\",\n               {q: hardneg[q] for q in sorted(kept_ids) if q in hardneg})\n    write_jsonl(out / \"quarantine.jsonl\", quarantine)\n    write_jsonl(out / \"span_fix_log.jsonl\", fixlog)\n    write_jsonl(out / \"conflicts_removed.jsonl\", sorted(removed, key=lambda r: r[\"question_id\"]))\n\n    report = {\n        \"seed\": SEED, \"dev_ratio\": DEV_RATIO, \"include_dpr_qa\": include_dpr_qa,\n        \"corpus\": corpus_stats, \"qa\": qa_stats,\n        \"rows\": {\"train\": len(train_rows), \"dev\": len(dev_rows), \"test\": len(test_rows)},\n        \"removed_from_train\": {k: sum(1 for r in removed if r[\"reason\"] == k)\n                               for k in (\"QUESTION_IN_TEST\", \"PASSAGE_IN_TEST\")},\n        \"groups\": {\"count\": len(sizes), \"largest\": max(sizes.values())},\n        \"quarantine\": len(quarantine), \"span_fixed\": len(fixlog),\n        \"hardneg_questions_in_train\": sum(1 for q in kept_ids if q in hardneg),\n    }\n    write_json(out / \"data_quality_report.json\", report)\n\n    files = [\"corpus.jsonl\", \"qa_train.jsonl\", \"qa_dev.jsonl\", \"qa_test.jsonl\",\n             \"qrels_train.json\", \"qrels_dev.json\", \"qrels_test.json\", \"hardneg_train.json\"]\n    write_json(out / \"split_manifest.json\", {\n        \"seed\": SEED, \"dev_ratio\": DEV_RATIO,\n        \"question_ids\": {\"train\": sorted(kept_ids),\n                         \"dev\": sorted(r[\"question_id\"] for r in dev_rows),\n                         \"test\": sorted(r[\"question_id\"] for r in test_rows)},\n        \"file_sha1\": {f: file_sha1(out / f) for f in files},\n    })\n    print(\"rows\", report[\"rows\"], \"| corpus\", corpus_stats[\"passages_after_dedup\"])\n    print(\"removed\", report[\"removed_from_train\"], \"| groups\", report[\"groups\"])\n\n\nif __name__ == \"__main__\":\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--out\", default=str(PROCESSED_DIR))\n    ap.add_argument(\"--dpr-qa\", action=\"store_true\",\n                    help=\"đưa cả câu hỏi GermanDPR vào QA (mặc định: không)\")\n    a = ap.parse_args()\n    cfg = load_config(\"baseline\")\n    main(a.out, a.dpr_qa or cfg[\"preprocess\"][\"include_dpr_qa\"])", "notes": [{"a": 16, "b": 21, "title": "Hai hàm phụ", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>by_qid<\/code> sắp dòng theo <code>question_id<\/code>; <code>qrels_json<\/code> đổi <code>qrels<\/code> (tập) thành danh sách đã sắp.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Mọi thứ ghi ra đều có thứ tự cố định → file giống hệt từng byte giữa các lần chạy.<\/p><\/dd><\/dl>"}, {"a": 24, "b": 31, "title": "Bước 1: dựng corpus và dữ liệu QA", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Nạp dữ liệu thô từ đĩa, gọi <code>build_corpus<\/code> và <code>build_qa<\/code>, dựng <code>doc_of<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>GĐ2b.<\/p><\/dd><\/dl>"}, {"a": 33, "b": 36, "title": "Bước 2 (R3): loại xung đột với test", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Lấy các dòng test và train, gọi <code>remove_conflicts_with_test<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Luật R3 ở <code>docs/preprocessing_rules.md<\/code>.<\/p><\/dd><\/dl>"}, {"a": 38, "b": 43, "title": "Bước 3 (R5): chia nhóm", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>make_groups<\/code> → <code>split_train_dev<\/code> với <code>DEV_RATIO<\/code> và <code>SEED<\/code> lấy từ <code>config<\/code>; đếm kích thước nhóm để báo cáo.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Hằng số lấy đúng một nơi (GĐ0).<\/p><\/dd><\/dl>"}, {"a": 45, "b": 51, "title": "Bước 4a: ghi các tệp dữ liệu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ghi <code>corpus.jsonl<\/code>, <code>qa_{train,dev,test}.jsonl<\/code> và <code>qrels_*.json<\/code>. Dev lấy <code>qrels<\/code> từ train (<code>source = qrels[\"test\"] if name == \"test\" else qrels[\"train\"]<\/code>).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Dev được cắt ra từ train nên <code>qrels<\/code> của nó nằm trong <code>qrels<\/code> của train.<\/p><\/dd><\/dl>"}, {"a": 52, "b": 56, "title": "Bước 4b: hard negative và nhật ký", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Ghi <code>hardneg_train.json<\/code> (chỉ cho câu hỏi còn trong train), <code>quarantine.jsonl<\/code>, <code>span_fix_log.jsonl<\/code>, <code>conflicts_removed.jsonl<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>hardneg_train.json<\/code> dùng cho GĐ16 (dense fine-tune, chưa làm).<\/p><\/dd><\/dl>"}, {"a": 58, "b": 68, "title": "Bước 4c: báo cáo chất lượng dữ liệu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tóm tắt: seed, tỷ lệ dev, thống kê corpus/QA, số hàng mỗi tập, số mẫu bị loại, số nhóm, số quarantine.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thật: <code>rows = {train: 10301, dev: 1176, test: 2203}<\/code>.<\/p><\/dd><\/dl>"}, {"a": 70, "b": 77, "title": "Bước 4d: manifest chia dữ liệu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>split_manifest.json<\/code> chứa seed, danh sách <code>question_id<\/code> của từng tập và <strong>SHA-1 của mọi tệp dữ liệu<\/strong>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Về sau mọi giai đoạn có thể kiểm: 'tệp tôi đang đọc có đúng là tệp đã chia ra không?'. Nền cho dấu vân tay BM25 và manifest dense.<\/p><\/dd><\/dl>"}, {"a": 83, "b": 90, "title": "Giao diện dòng lệnh", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>--out<\/code> đổi thư mục ghi; <code>--dpr-qa<\/code> đưa câu hỏi DPR vào QA.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>python scripts/02_preprocess.py<\/code><\/p><\/dd><\/dl>"}], "intro": "<p>Script điều phối GĐ2: đọc dữ liệu thô → corpus + QA → loại xung đột → chia nhóm → ghi tệp + báo cáo + manifest.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Có ba tập tách bạch: <strong>train<\/strong> (học), <strong>dev<\/strong> (chọn cấu hình), <strong>test<\/strong> (đo cuối cùng), cùng báo cáo chất lượng và manifest SHA-1.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Mô hình chỉ đáng tin nếu được đo trên dữ liệu nó chưa thấy. Chia ngây thơ (từng dòng) làm hai câu hỏi cùng bài viết rơi vào hai tập: dev 'dễ' giả tạo, và các quyết định chọn cấu hình bị lệch.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>corpus.jsonl<\/code>, <code>qa_*<\/code>, <code>qrels<\/code> thô và <code>document_id<\/code> từ GĐ2b.<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ3 chọn <code>k1, b<\/code> của BM25 <strong>trên dev<\/strong>; GĐ4 huấn luyện reader trên train và chọn checkpoint trên dev; test chỉ mở một lần ở GĐ15.<\/p>", "b": "<h4>Rò rỉ dữ liệu (data leakage)<\/h4>\n<p>Thông tin từ tập đánh giá lọt vào quá trình học hoặc chọn cấu hình. Ba kiểu gặp trong project:<\/p>\n<ol><li><strong>Trùng câu hỏi<\/strong> giữa train và test (luật R3, <code>QUESTION_IN_TEST<\/code>).<\/li><li><strong>Trùng đoạn đáp án<\/strong> (luật R3, <code>PASSAGE_IN_TEST<\/code>).<\/li><li><strong>Rò rỉ gián tiếp qua nhóm<\/strong>: câu hỏi khác nhau nhưng cùng bài viết (luật R5, chia theo nhóm).<\/li><\/ol>\n<h4>Chia theo nhóm bằng Union-Find<\/h4>\n<p>Dựng đồ thị vô hướng với ba loại nút: <code>q:<\/code> (câu hỏi), <code>p:<\/code> (đoạn), <code>d:<\/code> (bài viết). Cạnh: <code>q–p<\/code> nếu <code>p<\/code> là đoạn đúng của <code>q<\/code>; <code>p–d<\/code> nếu <code>p<\/code> thuộc bài <code>d<\/code>. <strong>Thành phần liên thông<\/strong> của đồ thị là một nhóm. Union-Find tính các thành phần này gần như tuyến tính.<\/p>\n<div class=\"math\">Độ phức tạp: O(m · α(n)) ≈ O(m) với m là số phép union, α là hàm Ackermann ngược (≤ 4 trong thực tế)<\/div>\n<h4>Vì sao dev lớn hơn mục tiêu?<\/h4>\n<p><code>target = round(11.477 × 0.10) = 1.148<\/code>. Vòng lặp thêm <strong>cả nhóm<\/strong> vào dev cho tới khi <code>len(dev) ≥ target<\/code>, nên có thể vượt (thật: 1.176). Đây là hệ quả tự nhiên của việc không tách nhóm.<\/p>\n<h4>Phương pháp thay thế<\/h4>\n<ul><li>Chia ngẫu nhiên từng dòng: đơn giản nhưng rò rỉ chủ đề.<\/li><li>k-fold theo nhóm: dùng dữ liệu hiệu quả hơn, nhưng reader tốn giờ huấn luyện (≈ 53 phút mỗi lần trên máy của dự án).<\/li><li>Chia theo thời gian: không áp dụng được với dataset này.<\/li><\/ul>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>pools[\"train\"] ─┐\n                ├─ remove_conflicts_with_test(train, test, qrels_test) ─▶ train_kept (11.477), removed\npools[\"test\"] ──┘\n\ntrain_kept + qrels_train + doc_of ─ make_groups ─▶ {qid: group}\n                                    split_train_dev(rows, groups, 0.10, seed=42)\n                                                       ├─▶ train 10.301\n                                                       └─▶ dev    1.176\n\nghi: corpus.jsonl, qa_{train,dev,test}.jsonl, qrels_*.json, hardneg_train.json,\n     quarantine.jsonl, span_fix_log.jsonl, conflicts_removed.jsonl,\n     data_quality_report.json, split_manifest.json (SHA-1 từng tệp)<\/code><\/pre>", "e": "<h4>Chạy<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/02_preprocess.py<\/code><\/pre>\n<p>Kỳ vọng ở cuối: <code>rows {'train': 10301, 'dev': 1176, 'test': 2203} | corpus 26864<\/code> và <code>removed {'QUESTION_IN_TEST': 0, 'PASSAGE_IN_TEST': 0} | groups {'count': 376, 'largest': 221}<\/code>.<\/p>\n<h4>Test<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>pytest tests/test_split.py tests/test_phase2_acceptance.py -q<\/code><\/pre>\n<h4>Kiểm bằng tay: không rò rỉ<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>import json\nfrom germanqa.data.io_utils import read_jsonl\ntr = {r[\"question_id\"] for r in read_jsonl(\"data/processed/qa_train.jsonl\")}\ndv = {r[\"question_id\"] for r in read_jsonl(\"data/processed/qa_dev.jsonl\")}\nte = {r[\"question_id\"] for r in read_jsonl(\"data/processed/qa_test.jsonl\")}\nassert not (tr &amp; dv) and not (tr &amp; te) and not (dv &amp; te)<\/code><\/pre>\n<p>Kiểm nghiêm hơn (phải có trong test): <strong>không<\/strong> nhóm nào có câu hỏi ở cả train lẫn dev.<\/p>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Chạy lại mà SHA-1 trong manifest đổi: có chỗ ghi file không xác định (thiếu <code>sort_keys<\/code>, thiếu sắp xếp).<\/li><li>Quên rằng <code>split_train_dev<\/code> dùng <code>random.Random(seed)<\/code>, <strong>không<\/strong> dùng <code>random.seed<\/code> toàn cục.<\/li><\/ul>", "f": "<ul><li>Chia theo <strong>nhóm liên thông<\/strong> (câu hỏi–đoạn–bài viết), không chia theo dòng.<\/li><li>Test không bao giờ bị loại hay sửa; <strong>chỉ train bị lọc<\/strong>.<\/li><li>Seed cố định + sắp xếp trước khi xáo → chia tái lập.<\/li><li>Manifest SHA-1 là chốt kiểm: tệp nào đổi, mọi kết quả phía sau phải coi là cũ.<\/li><li>Dev dùng để <strong>chọn<\/strong>; test dùng <strong>một lần<\/strong> để báo cáo.<\/li><\/ul>", "g": "<ol><li>Tự viết <code>UnionFind<\/code> và <code>make_groups<\/code> từ đầu. Kiểm trên một ví dụ nhỏ có tay: 4 câu hỏi, 3 đoạn, 2 bài. Vẽ đồ thị và đoán số nhóm trước khi chạy.<\/li><li>Thay <code>split_train_dev<\/code> bằng chia ngẫu nhiên từng dòng, rồi đo: bao nhiêu câu dev có **cùng <code>document_id<\/code>** với ít nhất một câu train? So với phép chia theo nhóm. Con số này nói gì về mức độ rò rỉ?<\/li><li>Dev vượt mục tiêu 28 câu. Đề xuất cách giảm độ lệch mà vẫn không tách nhóm, và nêu cái giá phải trả.<\/li><\/ol>"}, {"id": "s5", "num": 5, "title": "BM25 và metric truy hồi", "gd": "GĐ3 · baseline truy hồi", "files": [{"path": "src/germanqa/retrieval/tokenizer.py", "name": "tokenizer.py", "kind": "orig", "lang": "python", "source": "\n\"\"\"Tách từ cho BM25 (GĐ3). Đây là tokenizer của BM25, khác tokenizer của reader (GĐ4).\"\"\"\nimport re\n\n# \\w trong chuỗi Unicode khớp chữ cái có dấu: ä ö ü ß é... nên không làm mất umlaut\n_TOKEN = re.compile(r\"\\w+\", re.UNICODE)\n\n# Danh sách stopword nhỏ, dùng cho biến thể \"use_stopwords\" (đo riêng trên dev)\nGERMAN_STOPWORDS = frozenset(\"\"\"\nder die das den dem des ein eine einen einem einer eines und oder aber\nist sind war waren wird werden wurde wurden hat haben hatte hatten\nim in an auf aus bei mit nach von vor zu zum zur über unter für durch\nals wie wo wer was wann warum welche welcher welches\nnicht auch sich es er sie wir ihr ich du man dass\n\"\"\".split())\n\n\ndef tokenize(text, stopwords=None):\n    \"\"\"Chữ thường, tách theo chữ-số; bỏ stopword nếu được yêu cầu.\"\"\"\n    tokens = _TOKEN.findall(text.lower())\n    if stopwords:\n        tokens = [t for t in tokens if t not in stopwords]\n    return tokens", "notes": [{"a": 6, "b": 6, "title": "Biểu thức tách từ", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>\\w+<\/code> với cờ Unicode khớp chuỗi chữ/số/gạch dưới, gồm cả <code>ä ö ü ß é<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Không làm mất umlaut: <code>\\w<\/code> của Python 3 trên <code>str<\/code> đã hiểu Unicode.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Từ ghép tiếng Đức (<code>Bundeskanzler<\/code>) được giữ nguyên là <strong>một<\/strong> token; truy vấn <code>Kanzler<\/code> sẽ không khớp. Đây là giới hạn của BM25 không tách từ ghép.<\/p><\/dd><\/dl>"}, {"a": 9, "b": 15, "title": "Danh sách stopword nhỏ", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Khoảng 80 từ chức năng: mạo từ (der, die, das…), giới từ, trợ động từ, từ để hỏi (wer, was, wann…).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Biến thể <code>use_stopwords<\/code> được <strong>đo riêng trên dev<\/strong> chứ không mặc định bật. Kết quả GĐ3: bật stopword thắng (cấu hình chốt <code>use_stopwords: true<\/code>).<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Danh sách chứa cả từ để hỏi <code>wer/was/wann<\/code>: chúng xuất hiện trong mọi câu hỏi nên gần như không phân biệt được đoạn nào; bỏ đi giúp điểm tập trung vào từ nội dung.<\/p><\/dd><\/dl>"}, {"a": 18, "b": 23, "title": "tokenize", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Chữ thường → tách theo <code>\\w+<\/code> → bỏ stopword nếu có.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>tokenize(\"Wer war Konrad Adenauer?\", GERMAN_STOPWORDS)<\/code> → <code>['konrad', 'adenauer']<\/code>.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dùng cho cả đoạn văn (khi dựng chỉ mục) và câu hỏi (khi tìm): <strong>phải cùng một hàm<\/strong>, nếu không từ không khớp.<\/p><\/dd><\/dl>"}], "intro": "<p>Tách từ cho BM25. Đây <strong>không<\/strong> phải tokenizer của reader (WordPiece ở GĐ4): BM25 cần từ nguyên vẹn để đếm tần suất.<\/p>"}, {"path": "src/germanqa/retrieval/bm25.py", "name": "bm25.py", "kind": "orig", "lang": "python", "source": "\n\"\"\"BM25 Okapi tự cài đặt (GĐ3).\"\"\"\nimport math\nfrom collections import Counter\n\nimport numpy as np\n\nfrom germanqa.retrieval.tokenizer import GERMAN_STOPWORDS, tokenize\n\n\nclass BM25:\n    \"\"\"Chỉ mục nghịch đảo: với mỗi từ, lưu danh sách (đoạn nào, điểm đóng góp).\n\n    Điểm của đoạn d với truy vấn q:\n        sum_{t in q}  idf(t) * tf(t,d) * (k1+1) / ( tf(t,d) + k1 * (1 - b + b * |d|/avgdl) )\n    \"\"\"\n\n    def __init__(self, k1=1.5, b=0.75):\n        self.k1, self.b = k1, b\n\n    @classmethod\n    def from_parts(cls, k1, b, doc_ids, weights):\n        \"\"\"Dựng lại từ phần đã lưu: weights = {từ: (mảng chỉ số đoạn, mảng điểm đóng góp)}.\"\"\"\n        self = cls(k1, b)\n        self.doc_ids, self.weights, self.n = list(doc_ids), weights, len(doc_ids)\n        return self\n\n    def fit(self, doc_ids, token_lists):\n        self.doc_ids = list(doc_ids)\n        n = len(self.doc_ids)\n        lengths = np.array([len(t) for t in token_lists], dtype=np.float64)\n        avgdl = lengths.mean() if n else 0.0\n\n        postings = {}                                   # từ -> ([chỉ số đoạn], [tf])\n        for i, tokens in enumerate(token_lists):\n            for term, tf in Counter(tokens).items():\n                idx, tfs = postings.setdefault(term, ([], []))\n                idx.append(i)\n                tfs.append(tf)\n\n        self.weights = {}                               # từ -> (mảng chỉ số, mảng điểm)\n        for term, (idx, tfs) in postings.items():\n            idx = np.asarray(idx, dtype=np.int64)\n            tf = np.asarray(tfs, dtype=np.float64)\n            df = len(idx)\n            idf = math.log(1.0 + (n - df + 0.5) / (df + 0.5))\n            norm = self.k1 * (1.0 - self.b + self.b * lengths[idx] / avgdl)\n            self.weights[term] = (idx, idf * tf * (self.k1 + 1.0) / (tf + norm))\n        self.n = n\n        return self\n\n    def scores(self, query_tokens):\n        \"\"\"Điểm BM25 của mọi đoạn (mảng độ dài n).\"\"\"\n        s = np.zeros(self.n, dtype=np.float64)\n        for term, qtf in Counter(query_tokens).items():\n            entry = self.weights.get(term)\n            if entry is not None:\n                s[entry[0]] += qtf * entry[1]\n        return s\n\n    def top_k(self, query_tokens, k):\n        \"\"\"Trả về [(doc_id, score)] giảm dần theo điểm; đồng điểm thì theo thứ tự doc_ids.\n        Chỉ trả đoạn có điểm > 0; truy vấn rỗng -> [].\"\"\"\n        s = self.scores(query_tokens)\n        order = np.lexsort((np.arange(self.n), -s))     # khóa chính: -điểm, khóa phụ: chỉ số\n        out = []\n        for i in order[:max(k, 0)]:\n            if s[i] <= 0:\n                break\n            out.append((self.doc_ids[i], float(s[i])))\n        return out\n\n\nclass BM25Retriever:\n    \"\"\"Bọc BM25 thành giao diện retrieve(question, top_k) dùng chung với dense ở GĐ12.\"\"\"\n\n    def __init__(self, corpus, k1=1.5, b=0.75, use_stopwords=False):\n        self.stopwords = GERMAN_STOPWORDS if use_stopwords else None\n        ids = [r[\"passage_id\"] for r in corpus]\n        tokens = [tokenize(r[\"retrieval_text\"], self.stopwords) for r in corpus]\n        self.index = BM25(k1, b).fit(ids, tokens)\n\n    @classmethod\n    def from_index(cls, index, use_stopwords=False):\n        \"\"\"Bọc một chỉ mục BM25 đã dựng/nạp sẵn (GĐ11.2), không tách từ lại cả corpus.\"\"\"\n        self = cls.__new__(cls)\n        self.stopwords = GERMAN_STOPWORDS if use_stopwords else None\n        self.index = index\n        return self\n\n    def retrieve(self, question, top_k=20):\n        q = tokenize(question, self.stopwords)\n        return [{\"passage_id\": pid, \"score\": sc, \"rank\": r}\n                for r, (pid, sc) in enumerate(self.index.top_k(q, top_k), start=1)]", "notes": [{"a": 11, "b": 19, "title": "Lớp BM25 và công thức", "html": "<div class=\"math\">score(d, q) = Σ_{t∈q} idf(t) · tf(t,d)·(k1+1) / ( tf(t,d) + k1·(1 − b + b·|d|/avgdl) )<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Docstring ghi công thức đầy đủ. <code>k1<\/code> điều khiển mức bão hòa của tần suất từ; <code>b<\/code> điều khiển mức phạt đoạn dài.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>BM25 là baseline mạnh, không cần huấn luyện, giải thích được: mỗi điểm là tổng đóng góp của từng từ trùng.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Giá trị dùng thật (chọn trên dev): <code>k1 = 0.7<\/code>, <code>b = 0.2<\/code>, <code>use_stopwords = true<\/code> (<code>configs/pipeline.yaml<\/code>).<\/p><\/dd><\/dl>"}, {"a": 22, "b": 26, "title": "from_parts: dựng lại từ chỉ mục đã lưu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tạo đối tượng BM25 từ <code>doc_ids<\/code> và bảng <code>weights<\/code> đã tính sẵn mà không cần <code>fit<\/code> lại.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dùng bởi <code>bm25_store.load_index<\/code> (GĐ11): nạp từ <code>artifacts/bm25/index.npz<\/code> thay vì dựng lại 16–24 giây.<\/p><\/dd><\/dl>"}, {"a": 28, "b": 32, "title": "fit (1): độ dài đoạn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>lengths[i]<\/code> = số token của đoạn i; <code>avgdl<\/code> = độ dài trung bình.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: <code>doc_ids<\/code> (n), <code>token_lists<\/code> (n danh sách token). Shape <code>lengths<\/code>: <code>(n,)<\/code>, <code>float64<\/code>.<\/p><\/dd><\/dl>"}, {"a": 34, "b": 39, "title": "fit (2): danh sách posting", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Với mỗi đoạn, đếm tần suất từ bằng <code>Counter<\/code>, rồi với mỗi từ ghi (chỉ số đoạn, tf) vào <code>postings[term]<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Đây là <strong>chỉ mục nghịch đảo<\/strong>: từ → các đoạn chứa nó. Khi tìm, chỉ những đoạn chứa từ của truy vấn mới được chạm tới.<\/p><\/dd><dt>Cách khác<\/dt><dd><p>Ma trận thưa <code>scipy.sparse<\/code> (từ × đoạn): nhanh hơn với truy vấn hàng loạt, nhưng khó đọc hơn.<\/p><\/dd><\/dl>"}, {"a": 41, "b": 50, "title": "fit (3): tính sẵn điểm đóng góp", "html": "<div class=\"math\">idf(t) = ln(1 + (N − df + 0.5) / (df + 0.5))        norm = k1·(1 − b + b·|d|/avgdl)\nweight(t,d) = idf · tf · (k1+1) / (tf + norm)<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Với mỗi từ: <code>df<\/code> = số đoạn chứa từ; <code>idf<\/code> theo dạng 'ln(1 + …)' (luôn dương, tránh idf âm của Okapi gốc khi từ quá phổ biến). <code>norm<\/code> dùng <code>lengths[idx]<\/code> (vector hóa trên mọi đoạn chứa từ). Lưu <code>(mảng chỉ số đoạn, mảng điểm)<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Tính một lần, dùng cho mọi truy vấn. Tìm kiếm chỉ còn là phép cộng có chỉ số.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p><code>weights[term] = (idx: int64[df], w: float64[df])<\/code>.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Công thức này phải <strong>giống hệt<\/strong> lúc lưu/nạp; <code>bm25_store<\/code> đo 'dấu vân tay chấm điểm' trên một corpus nhỏ cố định để bắt sửa công thức (GĐ11).<\/p><\/dd><\/dl>"}, {"a": 52, "b": 59, "title": "scores: điểm của mọi đoạn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mảng 0 dài n. Với mỗi từ truy vấn (đếm <code>qtf<\/code> lần xuất hiện), cộng <code>qtf × weight<\/code> vào các đoạn có từ đó.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: list token câu hỏi. Ra: <code>np.ndarray<\/code> shape <code>(n,)<\/code> = <code>(26864,)<\/code>.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Nhân <code>qtf<\/code>: câu hỏi lặp một từ hai lần thì từ đó nặng gấp đôi. Đây là một lựa chọn (BM25 gốc có thêm tham số <code>k3<\/code> cho tần suất trong truy vấn).<\/p><\/dd><\/dl>"}, {"a": 61, "b": 71, "title": "top_k: xếp hạng tất định", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>np.lexsort((arange(n), -s))<\/code>: khóa chính là <code>-điểm<\/code> (giảm dần), khóa phụ là chỉ số đoạn. Lấy tới k phần tử, <strong>dừng khi điểm ≤ 0<\/strong>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Đồng điểm thì thứ tự phải cố định, nếu không cùng câu hỏi chạy hai lần có thể ra hai danh sách khác nhau. Đoạn điểm 0 (không chung từ nào) không có ý nghĩa nên bỏ.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: <code>[(doc_id, score)]<\/code> giảm dần; có thể ít hơn k.<\/p><\/dd><dt>Phát hiện<\/dt><dd><p>Đề xuất cải tiến (không có trong project): <code>lexsort<\/code> sắp <strong>toàn bộ<\/strong> 26.864 đoạn cho mỗi truy vấn, O(n log n). Dùng <code>np.argpartition(-s, k)<\/code> để lấy k ứng viên rồi mới sắp k phần tử đó sẽ nhanh hơn. Hiện tại độ trễ đo được vẫn thấp (dev p50 ≈ 1,1 ms) nên không cấp thiết.<\/p><\/dd><\/dl>"}, {"a": 74, "b": 81, "title": "BM25Retriever: giao diện chung", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tách từ <code>retrieval_text<\/code> của mọi đoạn rồi <code>fit<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Bọc BM25 thành giao diện <code>retrieve(question, top_k) → [{passage_id, score, rank}]<\/code>. Dense (GĐ6) và hybrid (GĐ13) có <strong>đúng giao diện này<\/strong>, nên pipeline không phải đổi.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Đây là ví dụ của nguyên lý 'lập trình theo giao diện' (duck typing).<\/p><\/dd><\/dl>"}, {"a": 84, "b": 89, "title": "from_index: bọc chỉ mục có sẵn", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dùng <code>cls.__new__<\/code> để tạo đối tượng <strong>không<\/strong> chạy <code>__init__<\/code> (không tách từ lại 26 nghìn đoạn).<\/p><\/dd><dt>Liên kết<\/dt><dd><p><code>bm25_store.load_index<\/code> gọi hàm này.<\/p><\/dd><\/dl>"}, {"a": 91, "b": 94, "title": "retrieve", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tách từ câu hỏi với cùng stopword, gọi <code>top_k<\/code>, đánh số hạng từ 1.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: <code>[{\"passage_id\": \"p_…\", \"score\": 12.3, \"rank\": 1}, …]<\/code>.<\/p><\/dd><\/dl>"}], "intro": "<p>BM25 Okapi <strong>tự cài đặt<\/strong> bằng chỉ mục nghịch đảo. Điểm đóng góp của mỗi (từ, đoạn) được tính sẵn lúc <code>fit<\/code>, nên lúc tìm chỉ còn cộng.<\/p>"}, {"path": "src/germanqa/evaluation/retrieval_metrics.py", "name": "retrieval_metrics.py", "kind": "orig", "lang": "python", "source": "\"\"\"Metric truy hồi (GĐ3): Hit@k, Recall@k, MRR@k và latency.\"\"\"\nimport numpy as np\n\n\ndef hit_at_k(ranked, relevant, k):\n    \"\"\"1 nếu có ít nhất một đoạn đúng trong top-k, ngược lại 0.\"\"\"\n    return 1.0 if any(p in relevant for p in ranked[:k]) else 0.0\n\n\ndef recall_at_k(ranked, relevant, k):\n    \"\"\"Số đoạn đúng tìm được trong top-k / tổng số đoạn đúng đã biết.\"\"\"\n    if not relevant:\n        return 0.0\n    return len(set(ranked[:k]) & set(relevant)) / len(relevant)\n\n\ndef mrr_at_k(ranked, relevant, k):\n    \"\"\"1 / thứ hạng của đoạn đúng đầu tiên trong top-k; 0 nếu vắng.\"\"\"\n    for rank, p in enumerate(ranked[:k], start=1):\n        if p in relevant:\n            return 1.0 / rank\n    return 0.0\n\n\ndef evaluate_run(run, qrels, ks=(1, 5, 10, 20)):\n    \"\"\"run = {question_id: [passage_id đã xếp hạng]}, qrels = {question_id: [passage_id đúng]}.\n    Trung bình trên các câu hỏi CÓ trong qrels.\"\"\"\n    qids = sorted(qrels)\n    out = {\"queries\": len(qids)}\n    for k in ks:\n        rel = {q: set(qrels[q]) for q in qids}\n        out[f\"hit@{k}\"] = float(np.mean([hit_at_k(run.get(q, []), rel[q], k) for q in qids]))\n        out[f\"recall@{k}\"] = float(np.mean([recall_at_k(run.get(q, []), rel[q], k) for q in qids]))\n        out[f\"mrr@{k}\"] = float(np.mean([mrr_at_k(run.get(q, []), rel[q], k) for q in qids]))\n    return out\n\n\ndef latency_summary(seconds):\n    \"\"\"Trung bình, p50, p95 (mili-giây) của một dãy thời gian đo bằng giây.\"\"\"\n    a = np.asarray(seconds, dtype=float) * 1000.0\n    return {\"mean_ms\": float(a.mean()), \"p50_ms\": float(np.percentile(a, 50)),\n            \"p95_ms\": float(np.percentile(a, 95))}", "notes": [{"a": 5, "b": 7, "title": "Hit@k", "html": "<div class=\"math\">Hit@k(q) = 1 nếu ∃ p ∈ top-k(q) với p ∈ rel(q), ngược lại 0<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Có ít nhất một đoạn đúng trong k kết quả đầu không.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Metric quan trọng nhất cho QA: reader chỉ đọc top-5, nên <strong>Hit@5<\/strong> chính là trần của việc reader còn cơ hội trả lời đúng.<\/p><\/dd><\/dl>"}, {"a": 10, "b": 14, "title": "Recall@k", "html": "<div class=\"math\">Recall@k(q) = |top-k(q) ∩ rel(q)| / |rel(q)|<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Tỷ lệ đoạn đúng tìm được.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Khi mỗi câu chỉ có một đoạn đúng (hầu hết ở đây), Recall@k = Hit@k. Hai số chỉ khác khi <code>qrels<\/code> có nhiều đoạn.<\/p><\/dd><\/dl>"}, {"a": 17, "b": 22, "title": "MRR@k", "html": "<div class=\"math\">RR@k(q) = 1 / hạng của đoạn đúng đầu tiên (0 nếu không có trong top-k);   MRR = trung bình trên các câu<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Thưởng việc đưa đoạn đúng <strong>lên đầu<\/strong>: hạng 1 → 1, hạng 2 → 0,5, hạng 10 → 0,1.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>GĐ3 chọn cấu hình BM25 theo <code>mrr@10<\/code> (<code>configs/baseline.yaml: select_by<\/code>).<\/p><\/dd><\/dl>"}, {"a": 25, "b": 35, "title": "evaluate_run: trung bình trên mọi câu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>run = {qid: [pid…]}<\/code>, <code>qrels = {qid: [pid…]}<\/code>. Duyệt câu theo thứ tự đã sắp, tính ba metric cho mỗi k, lấy trung bình. Câu thiếu trong <code>run<\/code> được tính là 0.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Trung bình trên các câu <strong>có trong qrels<\/strong> (không phải trên <code>run<\/code>), nên một hệ thống bỏ sót câu hỏi sẽ bị phạt chứ không được lợi.<\/p><\/dd><\/dl>"}, {"a": 38, "b": 42, "title": "latency_summary", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Trung bình, p50 (trung vị), p95 theo mili-giây.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>p95 cho biết những câu chậm nhất; trung bình dễ bị một vài câu cực chậm làm sai lệch.<\/p><\/dd><\/dl>"}], "intro": "<p>Metric đo truy hồi. Mỗi hàm nhận danh sách đã xếp hạng của <strong>một<\/strong> câu hỏi và tập đoạn đúng.<\/p>"}, {"path": "src/germanqa/evaluation/bootstrap.py", "name": "bootstrap.py", "kind": "orig", "lang": "python", "source": "\"\"\"Khoảng tin cậy bằng bootstrap (GĐ7): resample CÂU HỎI có hoàn lại, tính lại trung bình.\n\nĐiểm EM/F1 của một câu là một số cố định; sự ngẫu nhiên nằm ở việc ta chỉ có 1.176 (dev) hoặc 2.203 (test) câu.\nResample câu hỏi cho biết con số trung bình sẽ dao động bao nhiêu nếu có một bộ câu hỏi khác cùng loại.\"\"\"\nimport numpy as np\n\n\ndef _rng(seed):\n    return np.random.default_rng(seed)\n\n\ndef bootstrap_ci(scores, n_boot=1000, confidence=0.95, seed=42):\n    \"\"\"Trả về (trung bình, thấp, cao) của khoảng tin cậy phân vị cho trung bình của `scores`.\"\"\"\n    x = np.asarray(scores, dtype=float)\n    idx = _rng(seed).integers(0, len(x), size=(n_boot, len(x)))\n    means = x[idx].mean(axis=1)\n    lo, hi = np.percentile(means, [50 * (1 - confidence), 100 - 50 * (1 - confidence)])\n    return float(x.mean()), float(lo), float(hi)\n\n\ndef paired_bootstrap(scores_a, scores_b, n_boot=1000, confidence=0.95, seed=42):\n    \"\"\"So hai cấu hình trên CÙNG các câu hỏi. Trả về (chênh a - b, thấp, cao).\n    Cùng một lần resample dùng cho cả hai, nên chênh lệch không bị nhiễu bởi việc câu nào được chọn.\n    Khoảng chứa 0 nghĩa là dữ liệu chưa đủ để nói cấu hình nào tốt hơn.\"\"\"\n    a, b = np.asarray(scores_a, dtype=float), np.asarray(scores_b, dtype=float)\n    if a.shape != b.shape:\n        raise ValueError(\"hai dãy điểm phải cùng độ dài (cùng các câu hỏi)\")\n    return bootstrap_ci(a - b, n_boot, confidence, seed)", "notes": [{"a": 8, "b": 9, "title": "_rng", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Bộ sinh ngẫu nhiên riêng, có seed, không đụng trạng thái ngẫu nhiên toàn cục.<\/p><\/dd><\/dl>"}, {"a": 12, "b": 18, "title": "bootstrap_ci: khoảng tin cậy phân vị", "html": "<div class=\"math\">Lặp B = 1000 lần: lấy n chỉ số ngẫu nhiên có hoàn lại → trung bình m_b\nCI 95% = [phân vị 2,5% ; phân vị 97,5%] của {m_1 … m_B}<\/div><dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>idx<\/code> shape <code>(n_boot, n)<\/code>: mỗi hàng là một 'bộ câu hỏi giả'. <code>x[idx].mean(axis=1)<\/code> → 1000 giá trị trung bình. Lấy hai phân vị.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Dev chỉ có 1.176 câu (dev-unseen: 234). Chênh 1 điểm có thể chỉ là may rủi. CI cho biết điều đó.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: điểm từng câu (0/1 với EM, Hit). Ra: (trung bình, thấp, cao).<\/p><\/dd><\/dl>"}, {"a": 21, "b": 28, "title": "paired_bootstrap: so hai hệ thống trên cùng câu", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Lấy hiệu từng câu <code>a - b<\/code> rồi bootstrap hiệu đó.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Dùng <strong>cùng<\/strong> lần lấy mẫu cho cả hai hệ thống nên loại được nhiễu 'câu nào được chọn'. Khoảng <strong>không chứa 0<\/strong> → có bằng chứng một bên tốt hơn.<\/p><\/dd><dt>Liên kết<\/dt><dd><p>Dùng ở GĐ7, GĐ12–15 (ví dụ H0 − B0 trên test: Hit@5 tăng, CI không chứa 0).<\/p><\/dd><\/dl>"}], "intro": "<p>Khoảng tin cậy bằng bootstrap: đo xem một con số (EM, Hit@5…) sẽ dao động bao nhiêu nếu có một bộ câu hỏi khác cùng loại.<\/p>"}, {"path": "scripts/03_bm25_eval.py", "name": "03_bm25_eval.py", "kind": "orig", "lang": "python", "source": "\"\"\"GĐ3: BM25 baseline. Chọn k1, b (và biến thể stopword) trên DEV; chỉ chạy test khi có --test.\"\"\"\nimport argparse\nimport itertools\nimport time\nfrom pathlib import Path\n\nfrom germanqa.config import PROCESSED_DIR, SEED\nfrom germanqa.data.io_utils import read_json, read_jsonl\nfrom germanqa.evaluation.retrieval_metrics import evaluate_run, latency_summary\nfrom germanqa.experiment import load_config, new_experiment_id, save_run, set_seed\nfrom germanqa.experiment_rules import guard_or_exit\nfrom germanqa.retrieval.bm25 import BM25Retriever\n\n\ndef run_split(retriever, rows, top_k):\n    \"\"\"Chạy truy hồi cho mọi câu hỏi; trả về (run, thời gian từng câu).\"\"\"\n    run, times = {}, []\n    for r in rows:\n        t0 = time.perf_counter()\n        hits = retriever.retrieve(r[\"question\"], top_k)\n        times.append(time.perf_counter() - t0)\n        run[r[\"question_id\"]] = [h[\"passage_id\"] for h in hits]\n    return run, times\n\n\ndef main(data_dir, do_test):\n    if do_test:\n        guard_or_exit(\"03_bm25_eval.py\", \"BM25 trên test với cấu hình đã chốt trên dev\", True, files=[\"qa_test.jsonl\", \"qrels_test.json\"], codes=[\"B0\"])\n    cfg = load_config(\"baseline\")\n    set_seed(SEED)\n    ks = cfg[\"evaluation\"][\"ks\"]\n    top_k = max(ks)\n    corpus = read_jsonl(Path(data_dir) / \"corpus.jsonl\")\n    dev_rows = read_jsonl(Path(data_dir) / \"qa_dev.jsonl\")\n    dev_qrels = read_json(Path(data_dir) / \"qrels_dev.json\")\n    select_by = cfg[\"evaluation\"][\"select_by\"]\n\n    # ---- chọn cấu hình trên DEV ----\n    trials = []\n    for stop, k1, b in itertools.product((False, True), cfg[\"bm25\"][\"grid\"][\"k1\"],\n                                         cfg[\"bm25\"][\"grid\"][\"b\"]):\n        retr = BM25Retriever(corpus, k1=k1, b=b, use_stopwords=stop)\n        run, _ = run_split(retr, dev_rows, top_k)\n        m = evaluate_run(run, dev_qrels, ks)\n        trials.append({\"use_stopwords\": stop, \"k1\": k1, \"b\": b, \"metrics\": m})\n        print(f\"stop={stop!s:5} k1={k1:<4} b={b:<4} {select_by}={m[select_by]:.4f} \"\n              f\"recall@20={m['recall@20']:.4f}\")\n    best = max(trials, key=lambda t: (t[\"metrics\"][select_by], t[\"metrics\"][\"recall@20\"]))\n    print(\"CHỌN:\", {k: best[k] for k in (\"use_stopwords\", \"k1\", \"b\")})\n\n    # ---- đo latency + (tùy chọn) test với cấu hình đã đóng băng ----\n    final = BM25Retriever(corpus, k1=best[\"k1\"], b=best[\"b\"], use_stopwords=best[\"use_stopwords\"])\n    run, times = run_split(final, dev_rows, top_k)\n    result = {\"dev\": {\"metrics\": evaluate_run(run, dev_qrels, ks), \"latency\": latency_summary(times)}}\n    if do_test:\n        test_rows = read_jsonl(Path(data_dir) / \"qa_test.jsonl\")\n        test_qrels = read_json(Path(data_dir) / \"qrels_test.json\")\n        run_t, times_t = run_split(final, test_rows, top_k)\n        result[\"test\"] = {\"metrics\": evaluate_run(run_t, test_qrels, ks),\n                          \"latency\": latency_summary(times_t)}\n    config = {\"bm25\": {k: best[k] for k in (\"use_stopwords\", \"k1\", \"b\")}, \"ks\": ks}\n    path = save_run(new_experiment_id(\"bm25\", config), config, result,\n                    extra={\"dev_trials\": trials})\n    print(\"đã ghi\", path)\n    for split, v in result.items():\n        print(split, {k: round(x, 4) for k, x in v[\"metrics\"].items()}, v[\"latency\"])\n\n\nif __name__ == \"__main__\":\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--data\", default=str(PROCESSED_DIR))\n    ap.add_argument(\"--test\", action=\"store_true\",\n                    help=\"chạy thêm test (chỉ sau khi đã chốt cấu hình trên dev)\")\n    a = ap.parse_args()\n    main(a.data, a.test)", "notes": [{"a": 15, "b": 23, "title": "run_split: chạy truy hồi cho một tập", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi câu: đo thời gian <code>retrieve<\/code>, lưu danh sách <code>passage_id<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Ra: <code>run = {qid: [pid…]}<\/code> và danh sách thời gian (giây).<\/p><\/dd><\/dl>"}, {"a": 26, "b": 28, "title": "Chốt chặn test", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Có <code>--test<\/code> thì gọi <code>guard_or_exit(..., True, files=[...], codes=[\"B0\"])<\/code>: ở script này chính cờ <code>--test<\/code> là xác nhận, và lần mở test được ghi một dòng vào sổ <code>results/test_exposure_ledger.jsonl<\/code> <strong>trước khi<\/strong> đọc tệp test.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Kỷ luật thí nghiệm của project (GĐ11, trình bày ở giai đoạn 13 của hướng dẫn này): test chỉ mở sau khi đã chốt cấu hình trên dev, và mọi lần mở đều để lại dấu vết.<\/p><\/dd><\/dl>"}, {"a": 29, "b": 36, "title": "Nạp dữ liệu và cấu hình", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Seed, danh sách k, corpus, dev và qrels dev; metric dùng để chọn là <code>mrr@10<\/code>.<\/p><\/dd><\/dl>"}, {"a": 39, "b": 49, "title": "Dò lưới trên dev", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>itertools.product((False, True), k1_grid, b_grid)<\/code>: 2 × 5 × 4 = 40 cấu hình. Mỗi cấu hình dựng BM25 mới, chạy dev, tính metric. Chọn bằng <code>mrr@10<\/code>, hòa thì xét <code>recall@20<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Tham số được chọn bằng dữ liệu <strong>dev<\/strong>, không đoán, không dùng test.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Thật: chọn <code>use_stopwords=True, k1=0.7, b=0.2<\/code>. Dev: Hit@1 0,322 · Hit@5 0,638 · Hit@20 0,814 · MRR@10 0,452.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p><code>b = 0.2<\/code> nhỏ hơn nhiều so với mặc định 0,75: đoạn dài <strong>ít bị phạt<\/strong>. Hợp lý vì đoạn Wikipedia dài thường chứa nhiều thông tin hơn chứ không phải 'nhồi từ'.<\/p><\/dd><\/dl>"}, {"a": 52, "b": 60, "title": "Đo lại cấu hình đã chốt (và test nếu được phép)", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Dựng lại BM25 với cấu hình thắng, chạy dev để đo metric + độ trễ; chỉ khi <code>--test<\/code> mới đọc <code>qa_test.jsonl<\/code>.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Độ trễ dev: p50 ≈ 1,09 ms, p95 ≈ 2,23 ms mỗi câu.<\/p><\/dd><\/dl>"}, {"a": 61, "b": 66, "title": "Lưu kết quả", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>save_run<\/code> ghi <code>results/bm25_&lt;thời điểm&gt;_&lt;băm&gt;.json<\/code> kèm toàn bộ 40 lần thử (<code>dev_trials<\/code>).<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Lưu mọi lần thử, không chỉ cái thắng: người đọc thấy được mức độ nhạy của tham số.<\/p><\/dd><\/dl>"}, {"a": 69, "b": 75, "title": "CLI", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>--data<\/code> đổi thư mục dữ liệu; <code>--test<\/code> mở test.<\/p><\/dd><\/dl>"}], "intro": "<p>Script GĐ3: dò lưới <code>k1 × b × stopword<\/code> trên <strong>dev<\/strong>, chọn cấu hình tốt nhất, đo độ trễ; chỉ chạy test khi có <code>--test<\/code>.<\/p>"}], "a": "<h4>Mục tiêu<\/h4>\n<p>Cài BM25 từ đầu, cài các metric truy hồi (Hit/Recall/MRR@k, độ trễ, bootstrap), chọn <code>k1, b, stopword<\/code> trên dev. Kết quả là <strong>baseline B0<\/strong>.<\/p>\n<h4>Vì sao cần giai đoạn này?<\/h4>\n<p>Không có baseline thì không biết dense/hybrid/rerank có thật sự tốt hơn không. BM25 rẻ, nhanh, không cần GPU, giải thích được, và thường là đối thủ khó với tiếng Đức nhiều tên riêng.<\/p>\n<h4>Giai đoạn trước cung cấp<\/h4>\n<p><code>corpus.jsonl<\/code> (<code>retrieval_text<\/code>), <code>qa_dev.jsonl<\/code>, <code>qrels_dev.json<\/code> (GĐ2); <code>experiment.save_run<\/code> (GĐ0).<\/p>\n<h4>Giai đoạn sau dùng kết quả nào?<\/h4>\n<p>GĐ5 dùng <code>BM25Retriever<\/code> trong pipeline; GĐ6 so dense với BM25 bằng cùng <code>evaluate_run<\/code>; GĐ13 hợp nhất BM25 + dense; GĐ11 lưu chỉ mục BM25 ra đĩa.<\/p>", "b": "<h4>BM25 từng thành phần<\/h4>\n<div class=\"math\">score(d,q) = Σ_{t∈q} IDF(t) · TF_sat(t,d)<\/div>\n<ul><li><strong>IDF<\/strong> – từ hiếm quan trọng hơn: <code>ln(1 + (N − df + 0,5)/(df + 0,5))<\/code>. N = 26.864 đoạn. Từ có trong 10 đoạn → idf ≈ 7,9; trong 10.000 đoạn → ≈ 0,99.<\/li><li><strong>TF bão hòa<\/strong> – <code>tf·(k1+1)/(tf + k1·norm)<\/code>. Khi <code>tf → ∞<\/code> thì giá trị tiến tới <code>k1+1<\/code>: xuất hiện 20 lần không gấp 20 lần xuất hiện 1 lần. <code>k1<\/code> nhỏ → bão hòa nhanh.<\/li><li><strong>Chuẩn hóa độ dài<\/strong> – <code>norm = 1 − b + b·|d|/avgdl<\/code>. <code>b = 1<\/code>: phạt độ dài đầy đủ; <code>b = 0<\/code>: bỏ qua độ dài.<\/li><\/ul>\n<h4>Ví dụ tính tay (k1 = 0,7; b = 0,2)<\/h4>\n<p>Từ <code>adenauer<\/code> có df = 12, N = 26.864 → idf = ln(1 + 26852,5/12,5) ≈ 7,67. Trong đoạn d có tf = 3, |d| = avgdl → norm = 1 → <code>3·1,7/(3 + 0,7) ≈ 1,38<\/code>. Đóng góp ≈ 7,67 × 1,38 ≈ 10,6.<\/p>\n<h4>Metric<\/h4>\n<table><thead><tr><th>Metric<\/th><th>Ý nghĩa<\/th><th>Khi nào dùng<\/th><\/tr><\/thead><tbody><tr><td>Hit@k<\/td><td>có đoạn đúng trong top-k<\/td><td>trần của reader (reader đọc top-5)<\/td><\/tr><tr><td>MRR@k<\/td><td>đoạn đúng đứng cao không<\/td><td>chọn cấu hình (project chọn theo MRR@10)<\/td><\/tr><tr><td>Recall@k<\/td><td>tìm được bao nhiêu đoạn đúng<\/td><td>khi có nhiều đoạn đúng<\/td><\/tr><tr><td>p50/p95<\/td><td>độ trễ<\/td><td>yêu cầu thời gian phản hồi<\/td><\/tr><\/tbody><\/table>\n<h4>Bootstrap<\/h4>\n<p>Điểm của từng câu là cố định; ngẫu nhiên nằm ở <strong>bộ câu hỏi<\/strong> ta tình cờ có. Bootstrap mô phỏng \"nếu có bộ câu hỏi khác\" bằng cách lấy lại mẫu có hoàn lại. <strong>Paired<\/strong> bootstrap so hai hệ thống trên cùng các câu → hẹp hơn nhiều so với so hai khoảng riêng lẻ.<\/p>\n<h4>Thay thế<\/h4>\n<p>TF-IDF cosine (yếu hơn BM25 với văn bản dài); BM25+ / BM25L (sửa phạt đoạn dài); thư viện <code>rank_bm25<\/code>, Pyserini/Lucene (nhanh hơn nhiều, nhưng project tự cài để hiểu và kiểm soát dấu vân tay).<\/p>", "c": "<pre class=\"blk\" data-lang=\"text\"><code>corpus.retrieval_text ─ tokenize(stopwords) ─▶ token_lists (26.864 danh sách)\n                          BM25.fit ─▶ weights{term: (idx[df], w[df])}\n\ncâu hỏi ─ tokenize ─▶ q_tokens ─ BM25.scores ─▶ s: float64[26864]\n                                 BM25.top_k(k) ─▶ [(pid, score)] giảm dần, bỏ điểm ≤ 0\n                       BM25Retriever.retrieve ─▶ [{passage_id, score, rank}]\n\nrun{qid:[pid]} + qrels ─ evaluate_run ─▶ {hit@k, recall@k, mrr@k, queries}\nđiểm từng câu ─ bootstrap_ci / paired_bootstrap ─▶ (mean, lo, hi)<\/code><\/pre>\n<p>Ai gọi ai: <code>03_bm25_eval.py<\/code> → <code>BM25Retriever<\/code> → <code>BM25<\/code> + <code>tokenize<\/code>; → <code>evaluate_run<\/code>, <code>latency_summary<\/code> → <code>save_run<\/code>.<\/p>", "e": "<h4>Chạy<\/h4>\n<pre class=\"blk\" data-lang=\"bash\"><code>python scripts/03_bm25_eval.py          # chỉ dev: 40 cấu hình, vài phút\npytest tests/GD3 -q                     # test_bm25.py, test_metrics.py<\/code><\/pre>\n<p>Kỳ vọng cuối: <code>CHỌN: {'use_stopwords': True, 'k1': 0.7, 'b': 0.2}<\/code> và dev Hit@5 ≈ 0,638, MRR@10 ≈ 0,452.<\/p>\n<h4>Thử nhanh<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>from germanqa.retrieval.bm25 import BM25\nfrom germanqa.retrieval.tokenizer import tokenize\ndocs = [\"der Rhein fließt durch Köln und Bonn\", \"Bonn war die Hauptstadt der Bundesrepublik\", \"Köln hat einen Dom\"]\nbm = BM25(0.7, 0.2).fit([\"p1\", \"p2\", \"p3\"], [tokenize(d) for d in docs])\nprint(bm.top_k(tokenize(\"Hauptstadt Bonn\"), 3))   # p2 đứng đầu (có cả hai từ)\nprint(bm.scores(tokenize(\"xyz\")).sum())           # 0.0<\/code><\/pre>\n<h4>Test tính tay (trích từ <code>tests/GD3/test_metrics.py<\/code> của project)<\/h4>\n<pre class=\"blk\" data-lang=\"python\"><code>RANKED = [\"a\", \"b\", \"c\", \"d\"]; REL = {\"c\", \"x\"}\nassert hit_at_k(RANKED, REL, 2) == 0.0 and hit_at_k(RANKED, REL, 3) == 1.0\nassert recall_at_k(RANKED, REL, 3) == 0.5\nassert abs(mrr_at_k(RANKED, REL, 3) - 1/3) &lt; 1e-12<\/code><\/pre>\n<h4>Lỗi thường gặp<\/h4>\n<ul><li>Tách từ câu hỏi <strong>khác<\/strong> cách tách đoạn (quên stopword, quên chữ thường) → điểm sai mà không báo lỗi.<\/li><li><code>avgdl = 0<\/code> khi corpus rỗng → chia cho 0 (code đã chặn bằng <code>if n<\/code>).<\/li><li>Chọn tham số bằng test: số đẹp nhưng không còn trung thực.<\/li><\/ul>", "f": "<ul><li>BM25 = IDF × TF bão hòa (k1) × chuẩn hóa độ dài (b).<\/li><li>Chỉ mục nghịch đảo + điểm tính sẵn → tìm kiếm chỉ là phép cộng.<\/li><li>Sắp xếp <strong>tất định<\/strong> khi đồng điểm.<\/li><li>Hit@5 là trần của reader; MRR@10 dùng để chọn cấu hình.<\/li><li>Bootstrap đo độ bất định; so hai hệ thống dùng <strong>paired<\/strong>.<\/li><li>Mọi retriever có chung giao diện <code>retrieve(question, top_k)<\/code>.<\/li><\/ul>", "g": "<ol><li>Viết lại <code>BM25.fit<\/code> và <code>scores<\/code> không nhìn code, chạy trên 4 đoạn mẫu của <code>bm25_store.PROBE_DOCS<\/code> và so điểm với bản gốc tới 12 chữ số.<\/li><li>Cài <code>top_k<\/code> bằng <code>np.argpartition<\/code>. Chứng minh kết quả <strong>giống hệt<\/strong> (kể cả thứ tự khi đồng điểm) trên 200 câu dev, rồi đo tốc độ.<\/li><li>Lấy 20 câu dev mà BM25 trượt Hit@20. Phân loại nguyên nhân (từ ghép, đồng nghĩa, diễn đạt lại, đáp án nằm ở đoạn khác…). Loại nào dense retriever (GĐ6) có thể giải quyết?<\/li><li>Tính bootstrap CI cho Hit@5 của BM25 trên dev. Khoảng rộng bao nhiêu điểm phần trăm?<\/li><\/ol>"}, {"id": "s6", "num": 6, "title": "Tokenizer WordPiece và cửa sổ trượt cho reader", "gd": "GĐ4a · đặc trưng reader", "files": [{"path": "src/germanqa/tokenization.py", "name": "tokenization.py", "kind": "orig", "lang": "python", "source": "\"\"\"Nạp tokenizer WordPiece của BERT từ vocab.txt, có kiểm tra từ vựng.\n\nLý do: ở transformers 5.17-5.22, BertTokenizerFast(vocab_file=...) bỏ qua từ vựng\nmà không báo lỗi (mọi từ thành [UNK]). Nên dựng trực tiếp từ `tokenizers` và\nkiểm tra kích thước từ vựng.\n\"\"\"\nfrom pathlib import Path\n\nfrom tokenizers import Tokenizer, decoders, models, normalizers, pre_tokenizers, processors\nfrom transformers import PreTrainedTokenizerFast\n\nSPECIALS = dict(unk_token=\"[UNK]\", sep_token=\"[SEP]\", pad_token=\"[PAD]\",\n                cls_token=\"[CLS]\", mask_token=\"[MASK]\")\n\n\ndef load_bert_tokenizer(vocab_path, do_lower_case=False):\n    \"\"\"Trả về tokenizer nhanh có offset_mapping. gbert-base là cased: do_lower_case=False.\"\"\"\n    vocab_path = Path(vocab_path)\n    lines = vocab_path.read_text(encoding=\"utf-8\").split(\"\\n\")\n    if lines and lines[-1] == \"\":\n        lines.pop()\n    vocab = {tok: i for i, tok in enumerate(lines)}\n    for name in SPECIALS.values():\n        if name not in vocab:\n            raise ValueError(f\"vocab.txt thiếu token đặc biệt {name}\")\n\n    tk = Tokenizer(models.WordPiece(vocab, unk_token=\"[UNK]\", max_input_chars_per_word=100))\n    tk.normalizer = normalizers.BertNormalizer(\n        clean_text=True, handle_chinese_chars=True,\n        strip_accents=False, lowercase=do_lower_case)   # giữ ä ö ü ß\n    tk.pre_tokenizer = pre_tokenizers.BertPreTokenizer()\n    tk.post_processor = processors.TemplateProcessing(\n        single=\"[CLS] $A [SEP]\",\n        pair=\"[CLS] $A [SEP] $B:1 [SEP]:1\",\n        special_tokens=[(\"[CLS]\", vocab[\"[CLS]\"]), (\"[SEP]\", vocab[\"[SEP]\"])])\n    tk.decoder = decoders.WordPiece(prefix=\"##\")\n\n    tok = PreTrainedTokenizerFast(tokenizer_object=tk, model_max_length=512,\n                                  padding_side=\"right\",\n                                  model_input_names=[\"input_ids\", \"token_type_ids\", \"attention_mask\"],\n                                  **SPECIALS)\n\n\n    if len(tok) != len(vocab):\n        raise RuntimeError(f\"Từ vựng nạp thiếu: tokenizer {len(tok)} != vocab.txt {len(vocab)}\")\n    return tok", "notes": [{"a": 1, "b": 5, "title": "Lý do tồn tại của file", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Docstring ghi lý do: theo ghi nhận của project, ở transformers 5.17–5.22 <code>BertTokenizerFast(vocab_file=...)<\/code> bỏ qua từ vựng mà <strong>không báo lỗi<\/strong> (mọi từ thành <code>[UNK]<\/code>). Vì vậy tokenizer được dựng thẳng bằng thư viện <code>tokenizers<\/code> và kiểm tra kích thước từ vựng.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p>Lỗi im lặng là lỗi nguy hiểm nhất: mô hình vẫn chạy, chỉ là cho kết quả rác.<\/p><\/dd><\/dl>"}, {"a": 12, "b": 13, "title": "Các token đặc biệt", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>[UNK]<\/code> (từ lạ), <code>[SEP]<\/code> (ngăn câu), <code>[PAD]<\/code> (đệm), <code>[CLS]<\/code> (đầu chuỗi), <code>[MASK]<\/code>.<\/p><\/dd><\/dl>"}, {"a": 16, "b": 25, "title": "Đọc vocab.txt", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Mỗi dòng của <code>vocab.txt<\/code> là một token, số thứ tự dòng là ID. Bỏ dòng trống cuối. Thiếu token đặc biệt → báo lỗi ngay.<\/p><\/dd><dt>Vào / ra<\/dt><dd><p>Vào: đường dẫn <code>vocab.txt<\/code>. <code>vocab<\/code>: dict token → id.<\/p><\/dd><\/dl>"}, {"a": 27, "b": 36, "title": "Ghép pipeline tokenizer", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p><code>WordPiece<\/code> (tách từ thành mảnh có trong từ vựng, mảnh nối có tiền tố <code>##<\/code>); <code>BertNormalizer<\/code> với <code>lowercase=False<\/code> và <code>strip_accents=False<\/code> (<strong>giữ hoa/thường và umlaut<\/strong>); <code>BertPreTokenizer<\/code> (tách theo khoảng trắng và dấu câu); <code>TemplateProcessing<\/code> thêm <code>[CLS] A [SEP] B [SEP]<\/code> và đặt segment 0/1; <code>decoder<\/code> gộp <code>##<\/code>.<\/p><\/dd><dt>Vì sao cần<\/dt><dd><p><code>gbert-base<\/code> là mô hình <strong>cased<\/strong> (phân biệt hoa/thường): danh từ tiếng Đức viết hoa, bỏ hoa là mất thông tin.<\/p><\/dd><dt>Lỗi thường gặp<\/dt><dd><p>Đặt nhầm <code>lowercase=True<\/code> với mô hình cased → phần lớn token thành <code>[UNK]<\/code> hoặc mảnh lạ, EM giảm mạnh.<\/p><\/dd><\/dl>"}, {"a": 38, "b": 41, "title": "Bọc thành tokenizer của transformers", "html": "<dl class=\"kv\"><dt>Làm gì<\/dt><dd><p>Bọc để dùng được API quen thuộc: <code>tokenizer(question, context, truncation=..., stride=..., return_offsets_mapping=True, return_overflowing_tokens=True)<\/cod
